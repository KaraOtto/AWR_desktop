 AWR_PRC.240.t:0 "当地游击队加入第一野战军"
 AWR_PRC.240.desc:0 "经过几个月的训练和征兵，山西的游击队已经在当地进行了整编，现在已经准备好加入我方野战部队。 请指挥官将他们分配到相应的位置。"
 AWR_PRC.240.a:0 "欢迎加入革命。"

 AWR_PRC.241.t:0 "当地游击队加入华北野战军"
 AWR_PRC.241.desc:0 "经过几个月的训练和征兵，华北的游击队已经在当地进行了整编，现在已经准备好加入我方野战部队。 请指挥官将他们分配到相应的位置。"
 AWR_PRC.241.a:0 "欢迎加入革命。"

 AWR_PRC.242.t:0 "新四军与华东地方游击队整编为野战军"
 AWR_PRC.242.desc:0 "经过长期的征募和训练，于华东地区进行敌后活动的新四军以及当地游击队已经完成了整编并改组为华东野战军。"
 AWR_PRC.242.a:0 "太好了！"

 AWR_PRC.243.t:0 "贵州解放"
 AWR_PRC.243.desc:0 "贵州领导与人民决定与我们合作，确保贵州的和平解放。 现在他们将成为我们的革命同志，加入我方阵营！ 我们的革命运动正兴起！"
 AWR_PRC.243.a:0 "欢迎！"

