 AWR_PRC.251.a:0 "太好了。"

 AWR_PRC.252.t:0 "共产党[From.From.Getinforupr] [From.From.GetName]！"

 AWR_PRC.253.t:0 "游击队遭到镇压！"
 AWR_PRC.253.d:0 "尽管我们付出了努力，我们在该地区同志组织的游击活动还是被国民党镇压下去。我们需要做点什么，否则我们可能会失去在该地区的影响力。"
 AWR_PRC.253.d_CHI:0 "我们军队今天成功地镇压了该地区的共产党武装。那些破坏者受到了很好的教训。从现在开始，该地区应该保持稳定。"
 AWR_PRC.253.a:0 "哦不！"
 AWR_PRC.253.b:0 "太好了！"

 AWR_PRC.254.t:0 "[amass_support_flag_temp.GetName]的共产党支持度上升了"
 AWR_PRC.254.d:0 "我们在[amass_support_flag_temp.GetName]的同志组织游击活动今天成功地凝聚了那里的人心。人民为我们的革命事业欢呼，为国民党和帝国主义者的残酷行径悲叹。如果我们在那里发动行动，现在人民就会支持我们的！"
 AWR_PRC.254.d_CHI:0 "由于最近在该地区的共产党游击队领导的运动，我们在[amass_support_flag_temp.GetName]的支持率已经大幅下降。我们需要集中力量打击这些土匪，以免他们的谎言蛊惑更多的中国人！"
 AWR_PRC.254.a:0 "该死的！"
 AWR_PRC.254.b:0 "太好了！"

 AWR_PRC.255.t:0 "[From.From.GetName]的破坏活动"
 AWR_PRC.255.d:0 "今天，我们在[From.From.GetName]的同志组织游击活动，在那里成功地进行了一次破坏运动。多个建筑物和结构被摧毁，对方的损失报告正在统计。这是一次成功的行动！"
 AWR_PRC.255.d_CHI:0 "我们在[From.From.GetName]的设施和建筑遭到了共产党游击队的袭击。我们现在需要集中力量打击这些土匪！让他们再也玩不了这些小把戏。"
 AWR_PRC.255.a:0 "该死的！"
 AWR_PRC.255.b:0 "太好了！"

 AWR_PRC.256.t:0 "[From.From.GetName]的共党攻击"
 AWR_PRC.256.d:0 "我们在 [From.From.GetName] 组织党派活动的同志们今天在那里成功地开展了一场运动。 多支敌军被摧毁，他们那边已传来损失报告。行动成功！"
 AWR_PRC.256.d_CHI:0 "我们在 [From.From.GetName] 的军队遭到共产党游击队的袭击。 我们现在需要集中力量打击这些土匪！ 他们将不能再搞这些小把戏了。"
 AWR_PRC.256.a:0 "该死的！"
 AWR_PRC.256.b:0 "很好！"

 RCM_communist_uprising.2.t:0 "[Prev.From.GetName]的共产党游击队遭到镇压"
 RCM_communist_uprising.2.d:0 "尽管我们付出了努力，我们在[Prev.From.GetName]同志组织的游击活动还是被国民党镇压下去。我们需要做点什么，否则我们可能会失去在该地区的影响力。"
