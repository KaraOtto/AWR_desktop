 AWR_PRC.258.t:0 "第二次国共合作结束"
 AWR_PRC.258.desc:0 "随着日本的无条件投降，抗日战争正式结束，抗日民族统一战线也随之解散。民族矛盾解决了，之后阶级矛盾再次成为了中国的主要矛盾。\n中共中央发出《关于土地问题的指示》（即《五四指示》），将政策从"减租减息"转变为通过清算、反奸等方式从地主手中获得土地，实现"耕者有其田"，土地改革重新全面展开。"
 AWR_PRC.258.a:0 "我们已不再有共同的敌人。"

 AWR_PRC.259.t:0 "走向新的国际关系"
 AWR_PRC.259.d:0 "经过漫长而艰苦的斗争，我们终于摆脱了外国统治。在民族解放运动最困难的时期，中国曾通过秘密渠道向我们提供政治和物质上的帮助。如今战争已经结束，我们或许应该正式向北京提出加入其阵营的申请，以保障来之不易的民族独立。"
 AWR_PRC.259.a:0 "向中国提出入盟申请"

 AWR_PRC.260.t:0 "[FROM.GetNameDefCap]申请加入我们的阵营"
 AWR_PRC.260.d:0 "[FROM.GetAdjective]人民已经成功赢得了民族独立。在他们的民族解放运动最困难的时期，我们曾向其提供秘密援助。如今，[FROM.GetNameDef]政府正式提出加入我国领导的阵营，希望在新的国际秩序中与中国并肩合作。"
 AWR_PRC.260.a:0 "欢迎我们的新朋友"
 AWR_PRC.260.b:0 "目前并不是合适的时候"

 AWR_PRC.261.t:0 "[FROM.GetNameDefCap]想与我们开展经济合作"
 AWR_PRC.261.desc:0 "[FROM.GetAdjective]在表示不会与冷战中的任意一方结盟，也不会参与超级大国的争霸后，提议与我们展开经济合作，作为一个新兴的区域强国，且极有可能成为第三个超级大国的国家向我们递出了橄榄枝，我们是否应该响应他们？"
 AWR_PRC.261.a:0 "我们需要科技援助。"
 AWR_PRC.261.b:0 "我们需要建设。"
 AWR_PRC.261.c:0 "我们需要经济援助."
 AWR_PRC.261.d:0 "我们对此不感兴趣。"

 AWR_PRC.262.t:0 "[FROM.GetNameDefCap]同意经济合作"
 AWR_PRC.262.desc:0 "[FROM.GetAdjective]对我们的合作提议积极响应，对于我们提出的合作内容给予了高度评价，并表示愿意积极推进双方的合作。"
 AWR_PRC.262.a:0 "明智的选择！"

 AWR_PRC.263.t:0 "[FROM.GetNameDefCap]拒绝经济合作"
 AWR_PRC.263.desc:0 "[FROM.GetAdjective]对我们的合作提议似乎并不感兴趣，经多次谈判后拒绝了我们的经济合作提议。"
 AWR_PRC.263.a:0 "这是他们的损失……"

 AWR_PRC.264.t:0 "王实味的命运"
 AWR_PRC.264.d:0 "反动派正在攻打我们。王实味被押着一起跟着社会部的人撤出了延安，后来就被关在了兴县的晋绥公安总局里。现在兴县被敌机给炸了，晋绥公安总局就向康生请求说要处决王实味，我们应该采取什么措施来处置他？"
 AWR_PRC.264.a:0 "将他秘密处决"
 AWR_PRC.264.b:0 "继续关押"
 AWR_PRC.264.c:0 "显然我们之前是搞错了"

 AWR_PRC.265.t:0 "白求恩同志抵达延安"
 AWR_PRC.265.desc:0 "经中华全国各界救国联合会领导人之一的陶行知先生介绍，一支由加拿大人和美国人组成的国际医疗队在诺尔曼·白求恩同志的带领下已经抵达了延安，他们将赶赴抗日前线以救护我们受伤的战士。"
 AWR_PRC.265.a:0 "热烈欢迎！"

 AWR_PRC.266.t:0 "白求恩同志因病逝世"
 AWR_PRC.266.desc:0 "亨利·诺尔曼·白求恩（1890年3月4日—1939年11月12日），加拿大共产党员，国际主义战士，著名胸外科医师。1890年出生于加拿大安大略省格雷文赫斯特镇，1935年加入加拿大共产党，1938年3月率领一支由加拿大人和美国人组成的医疗队来到中国延安参与抗日战争。1939年10月下旬，在河北涞源县摩天岭战斗中抢救伤员时左手中指被手术刀割破感染，同年11月12日凌晨，因手术中被细菌感染转为败血症，医治无效在河北省唐县黄石口村逝世。他在中国工作的一年半时间里为中国抗日革命呕心沥血，他的牺牲精神、工作热忱、责任心均称模范，直至以身殉职。他的事迹受到中国人民的广泛赞扬。毛泽东在《学习白求恩》一文中指出：一个外国人，毫无利己的动机，把中国人民的解放事业当作他自己的事业，这是什么精神？这是国际主义的精神，这是共产主义的精神，每一个中国共产党员都要学习这种精神。"
 AWR_PRC.266.a:0 "一个高尚的人，一个纯粹的人，一个有道德的人，一个脱离了低级趣味的人，一个有益于人民的人"

 AWR_PRC.267.t:0 "白求恩同志转危为安"
 AWR_PRC.267.desc:0 "白求恩同志在河北涞源县摩天岭战斗中抢救伤员时左手中指被手术刀割破感染，好在我们的野战医院较为先进，装备充足，及时为白求恩同志进行了抗菌治疗，目前白求恩同志称自己的病情基本稳定，并向我们提交了重回前线救治伤员的申请。"
 AWR_PRC.267.a:0 "万幸！"

 AWR_PRC.268.t:0 "白求恩同志回国"
 AWR_PRC.268.desc:0 "抗日战争结束了，白求恩同志将随国际纵队回国。他于1935年加入加拿大共产党，1938年3月率领一支由加拿大人和美国人组成的医疗队来到中国延安参与抗日战争。他在中国工作时为中国抗日革命呕心沥血，他的牺牲精神、工作热忱、责任心均称模范，直至抗日战争胜利。他的事迹受到中国人民的广泛赞扬。毛泽东在《学习白求恩》一文中指出：一个外国人，毫无利己的动机，把中国人民的解放事业当作他自己的事业，这是什么精神？这是国际主义的精神，这是共产主义的精神，每一个中国共产党员都要学习这种精神。"
 AWR_PRC.268.a:0 "一路顺风，同志，中国人永远不会忘记您的！"

 AWR_PRC.269.t:0 "华北派遣军遭到共产党军队突袭"
 AWR_PRC.269.d:0 "共产党领导的八路军以大约一百个团的兵力突袭了我军在华北的占领区，大量交通设施和军事据点都遭到破坏和摧毁。"
 AWR_PRC.269.a:0 "八嘎，立即开始部署大规模扫荡！"

 AWR_PRC.270.t:0 "八路军在华北取得重大胜利"
 AWR_PRC.270.d:0 "共产党领导的八路军以大约一百个团的兵力突袭了日军在华北的占领区，大量交通设施和敌军据点都遭到破坏和摧毁。"
 AWR_PRC.270.a:0 "致电嘉奖！只不过......他们居然都发展到一百个团了！？"

 AWR_PRC.271.t:0 "百团大战胜利结束"
 AWR_PRC.271.d:0 "历时一百多天的百团大战取得了重大胜利，我们成功摧毁了华北敌占区的大量交通要道和军事据点，打破了日军对抗日根据地的“囚笼封锁”。"
 AWR_PRC.271.a:0 "谁敢横刀立马？唯我彭大将军！"

 AWR_PRC.272.t:0 "《中央人民政府和西藏地方政府关于和平解放西藏办法的协议》"
 AWR_PRC.272.desc:0 "在达成停火协议后，西藏地方政府代表团成员先后来到[Root.Capital.GetName]，参加和平解放西藏的谈判。4月28日，周恩来等中央领导会见了参加谈判的代表，并宣布了双方全权代表名单:中央人民政府方面指派李维汉、张经武、张国华、孙志远为全权代表，并以李维汉为首席代表;西藏地方政府方面指派阿沛·阿旺晋美、凯墨·索安旺堆、土丹旦达、土登列门、桑颇·登增顿珠为全权代表，并以阿沛·阿旺晋美为首席代表。\n4月29日，和平解决西藏问题第一次谈判举行。此次会谈没有涉及实质问题，仅是就谈判的程序、步骤进行协商。随后的6次正式谈判中，中央政府代表依据 "十条公约"提出了10个条款，西藏地方政府代表提出了9项条件。\n双方代表经过25天的认真细致谈判，最终达成一致。1951年5月23日，关于和平解决西藏办法的协议在[Root.Capital.GetName]签订。协议中规定  :西藏人民团结起来，驱逐帝国主义侵略势力出西藏;西藏地方政府积极协助人民解放军进入西藏，巩固国防;西藏实行民族区域自治;西藏现行政治制度和达赖喇嘛、班禅额尔德尼的固有地位及职权，中央不予变更，各级官员照常供职;实行宗教信仰自由的政策，尊重西藏人民的宗教信仰和风俗习惯;逐步发展西藏民族的语言、文字和学校教育，以及农牧工商业，改善人民生活;西藏地区的涉外事宜，由中央统一管理。协议还明确规定，有关西藏的各项改革事宜，中央不加强迫，西藏地方政府自动进行改革。"
 AWR_PRC.272.a:0 "西藏终于回到了祖国的怀抱"

 AWR_PRC.273.t:0 "迪克西使团派赴延安"
 AWR_PRC.273.d:0 "全面抗战爆发后，国府表现不尽人意，致使大片国土被占，此事引起了国际社会的关注和不满，美国担心中国正面战场的危机会影响其在太平洋作战的胜利。因此美国更加坚信，仅靠国民政府是无法对抗日本的，要想战胜日本，需要联合中国更多的抗日力量，于是开始了派观察团前往延安准备工作，期间关于使团定名一事还费了不少周折，最后经国、共、美三方协商，使团的名称定为“美军中缅印战区驻延安观察组”，绰号“迪克西使团”。"
 AWR_PRC.273.a:0 "这是向国际社会展示延安的好机会"

 AWR_PRC.274.t:0 "银元之战"
 AWR_PRC.274.desc:0 "上海解放后，国民党统治时期恶性通货膨胀的影响仍在延续，一大批不法投机商趁机兴风作浪，致使黄金、银元、外币充斥市场，导致物价猛烈上涨，经济秩序混乱。一些处在观望状态的人认为共产党能够“马上得天下”，不能“马上治天下”。投机分子甚至狂妄叫嚣：“解放军进得了上海，人民币进不了上海。”"
 AWR_PRC.274.a:0 "那就让他们看看，人民币能不能进上海！"

 AWR_PRC.275.t:0 "银元之战的胜利"
 AWR_PRC.275.desc:0 "上海解放。但经济战线仍硝烟弥漫，人民币挤不进上海市场，银元投机猖獗的电报不断送到陈云案头。陈云在北平筹建中财委的同时，参与指导了上海市军管会同上海旧经济势力之间的“银元之战”。第二天，上海市军管会就发布《关于使用人民币及限期禁用金圆券的规定》：以人民币1元收兑金圆券十万元；此后严禁金圆券在市场上流通。由于金圆券的信用已接近于零，收兑工作十分顺利，规定发布仅7天，就收兑金圆券35.9万亿元，约占国民党政府全部金圆券发行额的53%。然而，上海旧经济势力利用人们长期以来形成的担心钞票贬值的心理，掀起了银元投机风潮。在认识清楚银元问题的症结后，陈云主持起草了《中共中央关于打击银元使人民币占领阵地的指示》分析了南京政府完全垮台后解放区金融问题的新情况后指出，对待银元的斗争，除政治手段外，还须陆续采取许多经济步骤：明令铁路交通事业及市政公用事业，一律收人民币；税收一律征收人民币；以地方为单位，首先是上海酌发实物公债等。得到毛泽东赞同并接到陈云主持起草的《指示》后，上海市军管会派出军警到证券交易所，把银元投机的大本营端掉了，同时在全市范围内执行中央《指示》。上海的这次行动抄没黄金三千多两、银元三万多块，处理投机商人200多名。消息传开，市场上银元价格暴跌。由于政治手段、经济手段、宣传攻势三管齐下，上海市军管会在同旧经济势力的“银元之战”中取得了胜利！"
 AWR_PRC.275.a:0 "其意义不亚于淮海战役！"

 AWR_PRC.276.t:0 "黄金荣的命运"
 AWR_PRC.276.desc:0 "黄金荣与张啸林、杜月笙并称“上海三大亨”，早年在萃华堂裱画店当学徒，1892年在法租界巡捕房做巡捕，直至升为唯一的华人督察长。后勾结帝国主义、官僚、政客发展封建帮会势力，成为上海青帮最大的头目，门徒达1000余人，操纵赌博等罪恶勾当。1927年4月组织中华共进会，与杜月笙、张啸林积极支持并参与“四一二反革命政变”，指使其帮会成员疯狂屠杀共产党人和革命群众。1928年被蒋介石任命为国民政府少将参议、行政院参议。抗日战争时，拒绝日本当局要他当维持会会长，抗日战争胜利后成立“荣社”，势力遍及全国工商、农矿、文化各界。现在张啸林被保镖林怀部射杀，杜月笙逃亡上海，解放初期百废待举，人民政府要处理的事千头万绪。黄金荣也过了一段安逸日子。还允许他照常经营产业，如大世界、黄金大戏院等，每月都有不菲的收入。（1951年，镇压反革命运动开始后，黄金荣的日子开始难过起来，市民自发涌到黄宅门口，要求他接受批斗。一封封检举信，如雪片般飞进市政府和公安机关，恳请政府作主，为民报仇雪恨。上海市人民政府出面召见黄金荣说明既往不变，但希望他能写悔过书公开登报，进一步向人民交代，认罪，以求得人民在某种程度上的谅解。黄金荣在“自白书”中，自称“自首改过”、“将功赎罪”、“请求政府和人民饶恕”。上海滩第一大亨的忏悔，在当时轰动一时。黄金荣响应政府的改造号召，开始扫大街。旧上海另一大亨杜月笙在香港得知这一消息，庆幸自己没有留在上海，躲过一劫。考虑到国内外的反响，对黄金荣的这项“改造”措施只是象征性的并没有持续下去，毕竟他已是风烛残年。两年后，黄金荣因发热病倒，昏迷了几天后去世，时年86岁。）"
 AWR_PRC.276.a:0 "任何黑恶终将绳之以法！"

 AWR_PRC.277.t:0 "米棉之战"
 AWR_PRC.277.desc:0 "银元之战之后，部分资本投机者并不死心，这次他们想利用米、棉、煤（俗称“两白一黑”）哄台物价，来破坏解放区经济。上海有些资本家说：“共产党是军事一百分，政治八十分，财经打零分。”他们要看我们的笑话。物价的飞涨尽管在预料之中，但波动之大、范围之广，不能不令人深深担忧。人民政权有没有能力制止恶性的通货膨胀和物价上涨，把经济形势稳定下来，把生产恢复起来，从而在政治上站稳脚跟，这是广大人民群众所殷切期待的，也是在考验我们的执政能力。"
 AWR_PRC.277.a:0 "我们必须将物价稳定住！"

 AWR_PRC.278.t:0 "米棉之战的胜利"
 AWR_PRC.278.desc:0 "经过了银元之战和米棉之战，不仅沉重打击了投机势力，而且充分显示了人民政府在经济领域的治理能力。长期以来民众深恶痛绝、国民党政府一筹莫展的恶性通货膨胀的状况，终于根本改变。"
 AWR_PRC.278.a:0 "意义不下于淮海战役！"

 AWR_PRC.279.t:0 "投机者恶意炒作"
 AWR_PRC.279.desc:0 "由于国民政府滥发金元劵，造成了严重的通货膨胀，百姓们已经不再信任纸币。部分资本投机商利用民众这种心理大肆散布谣言，导致了人民币的严重贬值。" 
 AWR_PRC.279.a:0 "我们必须想办法应对！"

 AWR_PRC.280.t:0 "资本外逃"
 AWR_PRC.280.desc:0 "由于我们过于激进的处理方式，不少民族资产阶级和小资产阶级正在策划移民，并且正在将自己的资产转移海外，这将会对我们经济造成严重破坏。"
 AWR_PRC.280.a:0 "让他们走吧。"
 AWR_PRC.280.b:0 "他们以为他们逃得掉吗？"

 AWR_PRC.281.t:0 "上海爆发粮荒"
 AWR_PRC.281.desc:0 "由于投机者的大量收购囤积大米，现在市场上大米严重短缺，以至于爆发了粮荒。上海百姓饱受饥饿之苦，甚至流传出应该反对解放军进上海的言论……"
 AWR_PRC.281.a:0 "赶紧想办法缓解危机！"

 AWR_PRC.282.t:0 "上海棉布短缺"
 AWR_PRC.282.desc:0 "由于投机者的大量收购囤积棉布，现在市场上棉布严重短缺，纺织厂生产停摆，甚至出现了纺织工人下岗潮……"
 AWR_PRC.282.a:0 "迅速上报中央，申请调动棉布。"

 AWR_PRC.283.t:0 "上海煤炭短缺"
 AWR_PRC.283.desc:0 "由于投机者的大量收购囤积煤炭，现在市场上煤炭严重短缺，上海工厂减产，上海居民供热问题难以解决……"
 AWR_PRC.283.a:0 "这种情况不能再继续下去了……"

 AWR_PRC.284.t:0 "发行银币被投机商尽数吸纳"
 AWR_PRC.284.desc:0 "由于投机者的大量收购囤积煤炭，现在市场上煤炭严重短缺，上海工厂减产，上海居民供热问题难以解决……"
 AWR_PRC.284.a:0 "看来我们得换一种方法了……"

 AWR_PRC.285.t:0 "党内危机：王明要求召开会议"
 AWR_PRC.285.desc:0 "我们党内正在发生持续的党内危机。 王明要求召开会议当前的主导派系不如以前那么受欢迎，其他敌对派系正在取得进展。 应采取措施解决该问题，否则领导层可能即将发生变化。"
 AWR_PRC.285.a:0 "哦不！"

 AWR_PRC.286.t:0 "党内危机：少数派统治"
 AWR_PRC.286.desc:0 "我们党内正在发生一场持续的党内危机。 当前的主要派系已不像以前那样受欢迎，其他敌对派系正占据上风。 应该采取措施解决这个问题，否则领导层的变动可能迫在眉睫。"
 AWR_PRC.286.a:0 "哦不！"

 AWR_PRC.287.t:0 "张国焘组织召开紧急政治局会议"
 AWR_PRC.287.desc:0 "中共中央政治局紧急会议由张国焘和他的支持者代表他们自己组织，并认为现任党的领导层是非法的。 由于他们在党内的派系支持，现任党的领导层现在随时可能被推翻。"
 AWR_PRC.287.a:0 "哦不！"

 AWR_PRC.288.t:0 "毛泽东支持者组织紧急政治局会议"
 AWR_PRC.288.desc:0 "毛泽东及其盟友代表他们自己组织了一场紧急的中共中央政治局会议，并认为当前的党的领导层是非法的。 由于他们在党内的派系支持，现任党的领导层现在随时可能被推翻。"
 AWR_PRC.288.a:0 "哦不！"

 AWR_PRC.289.t:0 "28个半布尔什维克组织紧急政治局会议"
 AWR_PRC.289.desc:0 "博古、王明和他们的拥护者代表他们自己组织了一场紧急的中共中央政治局会议，并认为现任党的领导层是非法的。 由于他们在党内的派系支持，现任党的领导层现在随时可能被推翻。"
 AWR_PRC.289.a:0 "哦不！"

 AWR_PRC.290.t:0 "托派组织紧急政治局会议"
 AWR_PRC.290.desc:0 "托洛茨基主义者及其支持者代表他们自己组织了中国共产党中央政治局会议，并认为当前的党领导层是非法的。 由于他们在党内的派系支持，现任党的领导层现在随时可能被推翻。"
 AWR_PRC.290.a:0 "哦不！"

 AWR_PRC.291.t:0 "惩前毖后，治病救人"
 AWR_PRC.291.desc:0 "康生同志提出，每一个发表过反动言论的党员，都要承认他们的错误并积极坦白招供。只有通过自我改造并确保您身边的其他人也这样做，您才能成为真正的优秀共产党员！\n但毛泽东同志在《整顿党的作风》的报告中首次提出了惩前毖后、治病救人的方针。党内党外都要分清是非。如何对待犯了错误的人，正确的态度应当是，对于犯错误的同志，采取“惩前毖后，治病救人”的方针，帮助他们改正错误，允许他们继续革命。"
 AWR_PRC.291.a:0 "你们每一个人！ 马上坦白！ 并告诉其他人也这样做！"
 AWR_PRC.291.b:0 "我们应当稳步推进审查。"
 AWR_PRC.291.c:0 "立刻叫停抢救运动。"

 AWR_PRC.292.t:0 "新成员的问题"
 AWR_PRC.292.desc:0 "许多来自国民党控制区的新成员在康生领导的抢救运动中被指控有间谍嫌疑。 他们中的许多人都“主动承认”自己是敌方间谍，并因此遭到了逮捕。"
 AWR_PRC.292.a:0 "务必肃清所有敌特分子！"
 AWR_PRC.292.b:0 "仔细审查他们，但要确保他们得到公平的审判。"
 AWR_PRC.292.c:0 "一个不杀，大部不抓。"

 AWR_PRC.293.t:0 "王实味的命运"
 AWR_PRC.293.desc:0 "自整风运动开始以来，王实味就一直在批评党的各项工作。 他发表文章谴责边区的特权制度、官僚主义和资源分配不均现象，很长一段时间以来一直站在党中央的对立面。 在最近的一次以“党的民主与纪律”为主题的座谈会中，康生指控王实味是潜伏在党内的托派阴谋分子。 经过长达 16 天的抗争后，王实味现在正在等待他的命运。"
 AWR_PRC.293.a:0 "开除这个托洛茨基主义者的党籍并逮捕他！"
 AWR_PRC.293.b:0 "他将得到改造"
 AWR_PRC.293.c:0 "他尚有挽救的余地"

 AWR_PRC.294.t:0 "王明称病"
 AWR_PRC.294.desc:0 "王明分别犯了“左”倾冒险主义和右倾投降主义的错误。土地革命战争中，他打着“反对立三路线”的旗号，实际上推行了比李立三更“左”的路线，夸大‌了中国革命反资产阶级、反富农斗争的意义，否定中间营垒的存在，急于夺取中心城市，宣称党内的主要危险是右倾机会主义，这些主张实际上是“左”倾冒险主义的政治纲领。由于共产国际的干预和他的教条主义，这些错误在党中央占据了长达四年的统治地位，对中国革命造成了严重危害。抗日战争中，他又提出了右倾投降主义的错误主张，强调“一切经过统一战线”、“一切服从统一战线”，完全放弃无产阶级在统一战线中的领导权。\n作为党内教条主义和宗派主义的代表人物，他从整风运动开始就一直受到党内的批判，并且始终拒绝承认自己的一系列历史错误。不久前，他突然宣称自己患病，不能再参加政治局会议，并住进了延安中央医院。"
 AWR_PRC.294.a:0 "对他的批判仍要继续进行"
 AWR_PRC.294.b:0 "我们仍然有需要他专业知识的地方"
 AWR_PRC.294.c:0 "随他去吧"

 AWR_PRC.295.t:0 "周恩来的自我批判"
 AWR_PRC.295.desc:0 "周恩来进行深刻自我解剖,并写下了《我的修养要则》和5万字的笔记。他在整风学习会上接连作了5天报告，深刻地总结了过去的工作失误和不足，表示在今后“必须从专而精入手。宁可做一件事，不要包揽许多。宁可做完一件事，再做其他，不要浅尝即止。宁有所舍，才能有所取。宁务其大，不务其小。这样，做出一点成绩，才能从头到尾，懂得实际，取得经验”。\n还严格剖析自己“由于母教的过分仁慈礼让”，“故对于党内错误路线的斗争，往往走向调和主义”。他还认为，领导干部应在自我批评方面起示范作用，“一个人或一个政党，如果不愿做反省功夫而自满自傲，不承认自己有任何错误和缺点，或者不善于看出自己力量之所在而害怕批评和自我批评，不敢正视错误和改正错误，那么，这个人和这个政党就一定不免于失败”。"
 AWR_PRC.295.a:0 "实际上我们与周关系非常好"
 AWR_PRC.295.b:0 "点到为止即可"
 AWR_PRC.295.c:0 "尽管我们与周并无根本上的矛盾，但他仍应继续就此做一份详细的检讨"

 AWR_PRC.296.t:0 "季米特洛夫的来信"
 AWR_PRC.296.desc:0 "毛泽东（亲启）\n\n一、关于令郎。我已安排他在军政学院学习，他毕业后当能在马克思列宁主义和现代军事方面获得扎实的学识。这个小伙子很能干，我相信您会把他培养成一个可靠的好帮手。他向您致以热烈的敬意。\n\n二、关于政治问题。不言而喻，在共产国际解散之后，它过去的任何领导人都不得干预各国共产党的内部事务。但是从私人友情考虑，我又不能不告诉您我对中国共产党党内状况的担忧。您知道，从1935年起，我就不得不经常密切过问中国的事务。我认为，从反抗外国侵略者的斗争中退缩的方针，以及明显偏离民族统一战线的政策，在政治上都是错误的，在中国人民进行民族战争期问，采取这样的方针，有把党孤立于人民群众之外的危险，有导致内战加剧的危险。这只能有利外国侵略者及其在国民党内的代理人。\n\n我认为，发动反对周恩来和王明的运动，指控他们执行了共产国际推荐的民族统一战线，说他们把党引向分裂，这在政治上是错误的。不应该把周恩来和王明这样的人排除在党之外，而应该把他们保留在党内，千方百计利用他们为党工作。\n\n另外一件使我担心的事是，一部分党的干部对苏联抱有不健康的情绪。我对康生所起的作用也心存疑虑。清除党内敌对分子和把党团结起来的党内正确措施，被康生及其机构扭曲得面目全非，这样做只能散布互相猜疑的情绪，引起普通党员群众的无比愤怒，帮助敌人瓦解党。早在1943年8月，我们就从重庆获得完全可靠的消息说，国民党决定派遣奸细混入延安挑动您同王明和党内其它活动家争吵，挑起敌对情绪以反对所有在莫斯科居留和学习过的人。关于国民党的这一诡计，我已及时预先通知了您。国民党秘而不宣的打算是，从内部瓦解共产党，从而轻易把它摧毁。我毫不怀疑，康生的所作所为正在为这些奸细助长声势。请原谅我这种同志式的坦率。\n\n我对您怀有深深的敬意，坚信您作为全党公认的领袖，定能洞察事物的真相。仅仅由于这一点，我才如此坦率地同您谈问题。请按我给您发送这封信的方式给我一封回信。紧紧与您握手。\n\n季米特洛夫"
 AWR_PRC.296.a:0 "我们与周恩来并无矛盾。"
 AWR_PRC.296.b:0 "这是我们自己的事情！"

 AWR_PRC.297.t:0 "博古的自我检讨"
 AWR_PRC.297.desc:0 "博古在土地政策上的错误主要体现在他强调“彻底进行老苏区的查田运动与新发展区域中的没收地主阶级土地，即将其平均分配给雇农贫农中农，必须使土地革命的利益完全落在雇农贫农中农身上”，并提出了“地主不分田，富农分坏田”的政策。这种政策违背了实际情况，受到了苏区干部群众的反对和抵制，没有得到有效实施‌。在军事指挥上，他和李德在第五次反“围剿”中的错误是强调与敌人打正规战、阵地战及消耗战，犯了“左”倾冒险主义的错误。提出了与敌人死打硬拼，导致第五次反“围剿”失败，红军被迫开始长征。此外，他还忠实地执行王明的“左倾”主义路线错误，给红军造成了重大损失。他现在被指责为模范的“教条主义者”和左倾路线实践者。\n在最近的一次会议中，博古作了发言，承认了1932年至1935年的错误自己是主要负责人，并肯定了遵义会议纠正错误、挽救革命的重要意义。自己过去只学了一些理论，拿了一些公式教条来反对人家，是“洋教条反对土教条”。还提到当时他们完全没有实际经验，在苏联学的是德波林主义的哲学教条，又搬运了一些苏联社会主义建设的教条西欧党的经验到中国来，过去党的许多决议是照抄国际的。表示在教条宗派中除王明外，自己是第一名；在内战时期，自己在国内是第一名；抗战时期的投降主义，以王明为首，自己是执行者和赞助者；然后，他检讨了教条宗派形成的历史和个人的错误。"
 AWR_PRC.297.a:0 "对他的批判仍要继续进行"
 AWR_PRC.297.b:0 "干的好，一次优秀的自我批判。"
 AWR_PRC.297.c:0 "我们仍然有需要他专业知识的地方"

 AWR_PRC.298.t:0 "[PRC.GetName]索取东北"
 AWR_PRC.298.desc:0 "入侵满洲后，我军已成功占领了满洲大部分地区。现在我们的延安同志们：由[PRC.GetLeader]领导的[PRC.GetRulingParty]已提出要求，希望我们将该地区的所有权转让给他们。我们应该如何应对？"
 AWR_PRC.298.a:0 "在那之前我们得先拿走点“好东西”"
 AWR_PRC.298.b:0 "还是给中国同志们留下完整的东北吧"
 
 AWR_PRC.299.t:0 "[SOV.GetName]接受了"
 AWR_PRC.299.t_CHI:0 "[SOV.GetName]将土地移交给[PRC.GetName]"
 AWR_PRC.299.d:0 "在苏联入侵满洲之后，苏联军队已经成功占领了满洲的大部分地区。现在我们，由[PRC.GetLeader]领导的[PRC.GetRulingParty]已提出要求，要求苏联将该地区的该地区的所有权转让给我们。莫斯科欣然接受了我们的请求。今天对中国来说是个好日子！"
 AWR_PRC.299.d_CHI:0 "在苏联入侵满洲之后，苏联军队已经成功占领了满洲的大部分地区。现在由[PRC.GetLeader]领导的[PRC.GetRulingParty]已提出要求，要求苏联将该地区的该地区的所有权转让他们。莫斯科居然接受了！这太离谱了！"
 AWR_PRC.299.a:0 "太好了！"
 AWR_PRC.299.b:0 "该死的！"

 PRC_unit_leader_event:0 "人物事件"
 PRC_liu_zhidan.1.t:0 "刘志丹同志壮烈牺牲"
 PRC_liu_zhidan.1.desc:0 "刘志丹（1903年10月4日一1936年4月14日），名景桂，字子丹、志丹。中国工农红军高级将领，忠诚的共产主义战士，杰出的无产阶级革命家、军事家，西北红军和西北革命根据地的主要创建人之一。1936年3月，率红28军参加东征战役，由罗峪口附近东渡黄河，挺进晋西北，迭克敌军。4月14日在山西中阳县三交镇（现柳林县三交镇）战斗中牺牲，年仅33岁。刘志丹烈士一生热爱党、热爱祖国、热爱人民，追求真理，英勇善战，百折不挠，艰苦奋斗，忠心赤胆，为创建红军和革命根据地，为中国人民的解放事业建立了不可磨灭的功勋，被毛泽东同志誉为“群众领袖，民族英雄”。"
 PRC_liu_zhidan.1.a:0 "上下五千年，英雄万万千；人民的英雄，要数刘志丹"
 PRC_liu_zhidan.2.t:0 "刘志丹同志转危为安"
 PRC_liu_zhidan.2.desc:0 "刘志丹同志在东征期间的山西中阳县三交镇战斗中不幸被敌军炮弹炸中负伤。幸运的是，炮弹并未伤及要害，经过全力抢救，刘志丹同志已经脱离了生命危险。"
 PRC_liu_zhidan.2.a:0 "万幸！"

 PRC_dong_zhentang.1.t:0 "董振堂同志壮烈牺牲"
 PRC_dong_zhentang.1.desc:0 "董振堂（1895年12月21日-1937年1月20日），字绍仲，河北省邢台市新河县人。1920年入保定陆军军官学校学习，毕业后投身于冯玉祥的西北军，曾参加推翻贿选总统曹锟的北京政变和北伐战争。1931年12月14日，率兵举行宁都起义。1932年4月加入中国共产党。1934年10月，董振堂率部参加长征，红5军团担任最艰苦的后卫任务，多次完成阻击国民党军的任务，为保障中央红军主力北上立下了赫赫战功，红5军团因此荣膺“铁流后卫”的光荣称号。1936年10月所部编入红军西路军，渡黄河西征，指挥所部参加攻占山丹、临泽、高台等县城的战斗。1937年1月12日率部在甘肃高台县城与近十倍于己的敌人浴血苦战，战至最后一人一弹，于20日壮烈牺牲。"
 PRC_dong_zhentang.1.a:0 "路遥知马力，董振堂是“坚决革命的同志”"

 PRC_dong_zhentang.2.t:0 "董振堂同志壮烈牺牲"
 PRC_dong_zhentang.2.desc:0 "董振堂（1895年12月21日-1937年1月20日），字绍仲，河北省邢台市新河县人。1920年入保定陆军军官学校学习，毕业后投身于冯玉祥的西北军，曾参加推翻贿选总统曹锟的北京政变和北伐战争。1931年12月14日，率兵举行宁都起义。1932年4月加入中国共产党。1934年10月，董振堂率部参加长征，红5军团担任最艰苦的后卫任务，多次完成阻击国民党军的任务，为保障中央红军主力北上立下了赫赫战功，红5军团因此荣膺“铁流后卫”的光荣称号。1936年10月所部编入红军西路军，渡黄河西征，指挥所部参加攻占灵武、银川、磴口等县城的战斗。1937年1月12日率部在宁夏银川县城与近十倍于己的敌人浴血苦战，战至最后一人一弹，于20日壮烈牺牲。"
 PRC_dong_zhentang.2.a:0 "路遥知马力，董振堂是“坚决革命的同志”"

 PRC_lu_dongsheng.1.t:0 "卢冬生赴苏学习" 
 PRC_lu_dongsheng.1.desc:0 "经党组织决定，将卢冬生同志派往苏联学习"
 PRC_lu_dongsheng.1.a:0 "早去早回，同志！"

 PRC_lu_dongsheng.2.t:0 "卢冬生回国" 
 PRC_lu_dongsheng.2.desc:0 "自苏德战争爆发后，卢冬生同志便一直被迫滞留苏联，现在苏联正式对日宣战，卢冬生同志也正好随苏联军队回到我国东北地区。"
 PRC_lu_dongsheng.2.a:0 "欢迎回来，同志！"

 PRC_lu_dongsheng.3.t:0 "卢冬生遇害" 
 PRC_lu_dongsheng.3.desc:0 "卢冬生，湖南湘潭人。1927年参加“八一”南昌起义；同年12月加入中国共产党。1929年，赴湘鄂西革命根据地工作。历任中国工农红军排、连、营、团长，独立师师长，红三军第八师师长兼政委，第七师师长，红二军团第四师师长等职。抗日战争初期，任国民革命军第八路军第一二〇师三五八旅旅长。\n抗战中期，卢冬生被派到苏联入伏龙芝军事学院学习。学习结束后到驻苏联远东地区东北抗日联军教导旅工作。刚刚得到消息，他在哈尔滨被两名拦路抢劫的苏联红军士兵枪杀，时年37岁。"
 PRC_lu_dongsheng.3.a:0 "他为了党和人民的事业，从来不避艰险，不怕困难，坚韧不拔，出色地完成了党交给他的每一件光荣任务。"
 ludongshengshishi_tt:0 "§R卢冬生逝世§!" 

 PRC_zhang_guotao.1.t:0 "中央政治局扩大会议——\n张国焘批判大会"
 PRC_zhang_guotao.1.desc:0 "作为宗派主义危害的代表，张国焘在中央政治局扩大会议期间受到了党中央的严厉批评。张被认为犯了宗派主义和分裂主义、军阀主义的错误，他在1935年6月懋功会师后，反对中央北上的决定，10月率部南下川康，在卓木碉宣布另立“第二中央”。他的这些行为无疑引起了党内的巨大分裂。"
 PRC_zhang_guotao.1.a:0 "同志，你的错误给党造成了很大的伤害！" 

 PRC_xu_guangda.1.t:0 "关于机械化部队建设工作的报告"
 PRC_xu_guangda.1.desc:0 "致首长：\n\n解放军机械化部队现已初步建成。经过前一阶段的整编、训练与装备补充，我军已经初步掌握了坦克、装甲车辆与机械化步兵协同作战的方法，部队的机动能力、突破能力与纵深作战能力均较过去有了显著提高。\n\n从目前的训练与演习情况来看，机械化部队完全有能力成为我军的中坚力量，只要能够保证充足的燃料、弹药、车辆和维修力量，我们便可以依靠装甲部队迅速撕开敌军防线，并以机械化步兵跟进，将突破转化为更大范围的战果。\n\n但在建设过程中，我们也发现了一些必须重视的问题。机械化部队对于燃料、运输、维修和补给的依赖远远超过传统步兵。部队推进得越快、作战强度越高，后勤方面所承受的压力也就越大。如果只重视前线车辆和火力，而忽视维修、运输和补给体系，机械化部队即使一时能够快速推进，也难以长期保持战斗力。\n\n因此，对于下一阶段的建设方向，我认为目前有两种可行方案。\n\n其一，是在现有基础上进一步发掘机械化部队的作战能力，进一步提高训练强度和装备标准，将火力与韧性放在首位。进一步提升部队的作战能力，但相应的燃料与补给消耗也将明显增加。\n\n其二，是着重改善机械化部队的补给问题与供应链，以保证机械化部队更适应大纵深及持续作战能力。\n\n机械化建设的第一步已经迈出。今后究竟是集中力量全速推进，还是在加强后勤基础的同时稳步发展，请中央决定。\n\n此致\n敬礼！\n\n许光达"
 PRC_xu_guangda.1.a:0 "全速前进！"
 PRC_xu_guangda.1.b:0 "稳步推进。"

 PRC_lin_yuying.1.t:0 "林育英同志因病逝世"
 PRC_lin_yuying.1.desc_mao:0 "1940年4月30日，林育英与毛泽东、朱德等中央领导人应邀到延安青年文化沟出席庆祝五一国际劳动节大会。会议开始后，突发脑溢血，因抢救及时，林育英无生命危险，但却无法站立起来，更无法再为党工作。\n1941年8月，日军战机飞到延安上空，轰炸中共中央机关和中共领导人住处，林育英病情急剧恶化。经过中央医院全力抢救，病稍有好转。1942年2月14日，接到林育英口信的林彪回到延安，看望林育英。\n1942年2月下旬，林育英的病情日益恶化。3月5日，林育英用微弱的声音将警卫员、秘书及妻子等人叫到身边说：“我不行了，革命20年如一日，未能看到革命胜利，深以为憾。我死后，请组织上将我葬在杨家岭对面的桃花岭上，使我能天天望着党中央、毛主席！”3月6日凌晨1时45分，林育英在延安中央医院逝世。下午，中央成立了林育英治丧委员会，由李富春、林彪、邓发等人组成。遗体移入中央大礼堂。3月7日，延安《解放日报》头版刊登了《中共中央委员张浩同志积劳成疾病逝》的消息。中共中央领导人毛泽东、朱德、任弼时、陈云、叶剑英等轮流为林育英守灵。3月8日上午4时至9时，延安各界人士万余人参加了林育英的遗体告别仪式。3月9日上午9时，公祭仪式在延安中央党校门前的广场上举行。中共中央书记处书记任弼时主祭，李克农念祭文。仪式结束，万余人参加出殡。毛泽东、朱德、任弼时、杨尚昆、徐特立等中央领导人亲自将棺材抬到桃花岭上安葬。这是毛泽东一生中惟一一次执绋抬棺。安葬林育英当天，《新华日报》发表了《悼张浩（林育英）同志》的社论，对林育英一生的贡献和功绩，作了很高的评价，毛泽东还为他的墓碑题写“张浩同志之墓”。"
 PRC_lin_yuying.1.desc_other:0 "林育英同志日前因脑溢血病情急剧恶化而不幸与世长辞，[PRC.GetLeader]等中央领导同志为他举行了简短的葬礼和追悼仪式。"
 PRC_lin_yuying.1.a:0 "林育英同志是职工运动领袖，是中国共产党的中央委员。他的一生，是革命的战斗的一生。……他在艰苦奋斗的一生中，学习和掌握了革命理论，领导了职工运动，成为中华民族解放运动中最优秀的战士。"
 PRC_lin_yuying.1.b:0 "我们必须做出严正的抗议！"
 PRC_lin_yuying.1.c:0 "他们好大的胆子！"
 
 PRC_lin_biao.1.t:0 "林彪同志不幸负伤" 
 PRC_lin_biao.1.desc:0 "今日林彪同志率领115师直属队途经隰县以北千家庄时，因身穿缴获来的日军大衣并骑着洋马，被当地驻军阎锡山部第19军警戒部队的哨兵开枪误伤。子弹从右腋经左侧背穿出，伤及肺和脊椎骨，目前他的身体情况十分不容乐观。显然林彪同志已经不能再继续待在前线指挥作战了，党中央决定尽快安排他前往苏联接受治疗。" 
 PRC_lin_biao.1.a:0 "希望他早日康复归来！"
 PRC_lin_biao.1.b:0 "前线离不开他……"

 PRC_lin_biao.2.t:0 "林彪同志回国" 
 PRC_lin_biao.2.desc:0 "经过四年在苏联的治疗后，林彪同志的枪伤已经大体痊愈，但仍不幸留下了严重的植物神经紊乱后遗症。现在他已经启程返回延安。" 
 PRC_lin_biao.2.a:0 "欢迎回家！" 

