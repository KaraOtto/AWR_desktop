 AWR_PRC.147.a:0 "明智的选择！"

 AWR_PRC.148.t:0 "中国要求归还远东地区"
 AWR_PRC.148.desc:0 "中国政府表示我们控制下的外东北地区是中国的固有领土，要求我们归还，对此我们应该怎么应对？"
 AWR_PRC.148.a:0 "让他们做梦去吧。"
 AWR_PRC.148.b:0 "保不住的领土不如送出去。"
 AWR_PRC.148.c:0 "我们也许保不住这些领土，但我们可以用这些领土同他们做笔交易。"

 AWR_PRC.149.t:0 "[FROM.GetNameDef]拒绝"
 AWR_PRC.149.desc:0 "[FROM.GetNameDef]拒绝了我们对外东北的主张！"
 AWR_PRC.149.a:0 "那还是算了吧……"
 AWR_PRC.149.b:0 "那就让他们面对解放军吧。"

 AWR_PRC.150.t:0 "[FROM.GetNameDef]同意归还"
 AWR_PRC.150.desc:0 "[FROM.GetNameDef]表示愿意归还外东北地区。"
 AWR_PRC.150.a:0 "明智的选择！"

 AWR_PRC.151.t:0 "苏联同意我们以购买的方式移交领土"
 AWR_PRC.151.desc:0 "苏联拒绝直接归还外东北领土，但他们拟定了《中苏远东边境与合作总协定》，如果我们同意，他们就可以归还争议领土，具体内容如下：\n 1.允许苏联转移远东内所有工厂和船坞；\n2.签定中苏互不侵犯条约；\n中国与苏签定为期一年的《中苏远东边境与工业合作总协定》内容包括中国对苏联的农业援助、工业支持和科研合作；\n条约期间如果苏联遭到他国侵略，中国有义务出兵援助，且不允许加入与苏联有敌对关系的阵营和组织。\n移交的领土需设为非军事区作为缓冲区域，满一年后方可恢复正常状态。"
 AWR_PRC.151.a:0 "我们接受。"
 AWR_PRC.151.b:0 "主权问题不是可以谈的问题，他们必须归还。"
 AWR_PRC.151.c:0 "还是算了吧……"

 AWR_PRC.152.t:0 "[FROM.GetNameDef]接受了我们的方案"
 AWR_PRC.152.desc:0 "[FROM.GetNameDef]接受了我们提出的《中苏远东边境与合作总协定》，对于远东地区的争议领土的问题已取得实质性的解决方案。\n对于这一方案的通过，联盟内部不少人在质疑联盟的软弱，但内部高层多数同意这一举措。"
 AWR_PRC.152.a:0 "减少了损失，但希望这是他们最后一次对领土的要求了。"

 AWR_PRC.153.t:0 "[FROM.GetNameDef]拒绝了我们的方案"
 AWR_PRC.153.desc:0 "[FROM.GetNameDef]表示主权问题不是可以谈的问题，态度强硬地表示我们必须归还俄属远东这一历史领土。随着此次谈判的失败，和平解决历史领土的问题的可能彻底破裂。"
 AWR_PRC.153.a:0 "那就战场上见吧。"

 AWR_PRC.154.t:0 "[FROM.GetNameDef]拒绝了我们的方案"
 AWR_PRC.154.desc:0 "[FROM.GetNameDef]拒绝了我们的方案，表示这一历史问题非常复杂，需要之后再进行多次谈判，此问题暂时搁置。"
 AWR_PRC.154.a:0 "看来俄属远东暂时保住了……"

 AWR_PRC.155.t:0 "中国要求归还萨哈林岛"
