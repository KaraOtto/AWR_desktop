 AWR_PRC.143.desc:0 "[FROM.GetNameDef]拒绝了我们对外蒙古的主张！"
 AWR_PRC.143.a:0 "那还是算了吧……"
 AWR_PRC.143.b:0 "那就让他们面对解放军吧。"

