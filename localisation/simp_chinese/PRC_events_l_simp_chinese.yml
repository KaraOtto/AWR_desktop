 AWR_PRC_news:0 "新闻事件"
 AWR_PRC_news.1.t:0 "《红星照耀中国》今日出版"
 AWR_PRC_news.1.desc:0 "[This.GetNewsIcon]《红星照耀中国》，曾易名为《西行漫记》，是美国记者埃德加·斯诺所著的纪实文学作品，于1937年10月首次出版，于1938年2月首次出版中文版，在中外进步读者中引起极大轰动。该作品真实记录了埃德加·斯诺自1936年6月至1936年10月在中国西北革命根据地进行实地采访的所见所闻，报道了中国和中国工农红军以及许多红军领袖、红军将领的情况。从多个方面展示中国共产党为民族解放而艰苦奋斗和牺牲奉献的精神，瓦解了种种歪曲、丑化共产党的谣言。斯诺通过对领导人和普通民众的观察和描述，把枯燥的红区党组织、各种文件、会议等内容转变为让读者读起来感到亲切生动的文字。在陕北，斯诺采访了众多共产党领袖和红军将领，如毛泽东、周恩来、彭德怀、林伯渠、邓发、徐海东等。斯诺描述他们的言谈举止，追溯他们的家庭环境和青少年时代，试图从其出身和成长经历中，找寻他们成为共产党人的原因。此外，斯诺还深入红军战士和根据地老百姓之中，对共产党的基本政策、军事策略，红军战士的生活，以及陕北根据地的社会制度、货币政策、工业和教育等情况做了广泛的调查。"
 AWR_PRC_news.1.a:0 "红星照耀中国！"
 AWR_PRC_news.1.b:0 "简直是一派胡言！"
 AWR_PRC_news.1.c:0 "有意思的一本书"
 AWR_PRC_news.1.desc:0 "令人作呕的布尔什维克童话！"
 AWR_PRC_news.2.t:0 "百团大战"
 AWR_PRC_news.2.desc:0 "[This.GetNewsIcon]为了打破日军对中共华北地区抗日根据地的“囚笼封锁”，在中国共产党八路军副总指挥彭德怀的部署下，八路军以大约一百个团的兵力向华北沦陷区的各大交通干线发起了大规模的破袭战。由于此前对共产党敌后力量的轻视，日军对这次突袭几乎毫无防范，致使华北地区大量交通要道和基础设施被八路军摧毁，日军在该地区的机动能力几近瘫痪，大量此前布置的要塞和据点也被拔除。这场重大的胜利无疑将使中国人民抗战到底的决心更加坚定。"
 AWR_PRC_news.2.a:0 "让小鬼子尝尝我们的厉害！"
 AWR_PRC_news.2.b:0 "他们会后悔的！"
 AWR_PRC_news.2.c:0 "有趣的游击战术"

 AWR_PRC_news.3.t:0 "中苏签订同盟条约" 
 AWR_PRC_news.3.desc:0 "[This.GetNewsIcon]在结束了对苏联为期两个月的访问后，[PRC.GetNameDef]最高领导人[PRC.GetLeader]主席于近日宣布了两国签署友好互助条约并缔结同盟关系的消息。这不仅意味着中国共产党政府将废除国民党与苏联签订的旧约并收回旅顺港和中长铁路的主权，也说明中国已经彻底倒向了以苏联为首的共产主义阵营。尽管这并非是西方资本主义阵营所乐意看见的，但这无疑将对东亚地区的政治格局产生巨大的冲击，一些前西方国家殖民地的革命风暴已是呼之欲出。" 
 AWR_PRC_news.3.a:0 "中苏友谊万岁！" 
 AWR_PRC_news.3.b:0 "共产主义阵营正在壮大" 
 AWR_PRC_news.3.c:0 "形势不容乐观" 
 AWR_PRC_news.3.d:0 "为我们的友谊干杯！" 
 AWR_PRC_news.3.e:0 "他们不会高兴太久的！" 

 AWR_PRC_news.4.t:0 "中苏谈判破裂" 
 AWR_PRC_news.4.desc:0 "[This.GetNewsIcon]据莫斯科最新传出的消息显示，中苏两国领导人关于修订中苏条约的谈判以失败告终。[PRC.GetAdjective]最高领导人[PRC.GetLeader]主席发表声明称苏联完全背离了共产主义的正确道路，已然成为了新的法西斯沙皇俄国，并号召世界各民主国家联合起来打倒苏联帝国主义。据悉英美等国已经派出特使前往北京与中国共产党方面接洽。" 
 AWR_PRC_news.4.a:0 "苏联人会为自己的傲慢付出代价" 
 AWR_PRC_news.4.b:0 "苏联人到底在想什么？" 
 AWR_PRC_news.4.c:0 "我们不介意多一位新朋友" 
 AWR_PRC_news.4.d:0 "我们的要求合情合理" 

 AWR_PRC_news.5.t:0 "中苏签订同盟条约" 
 AWR_PRC_news.5.desc:0 "[This.GetNewsIcon]在结束了对苏联为期两个月的访问后，[PRC.GetAdjective]最高领导人[PRC.GetLeader]主席于近日宣布了两国签署友好互助条约并缔结同盟关系的消息。只不过中苏签订的新约中仍然承认了国民党政府旧约中允许苏联在旅顺港和中长铁路长期驻军的条款，显然中国政府认为自身尚不具备与苏联讨价还价的实力。尽管这并非是西方资本主义阵营所乐意看见的，但这无疑将对东亚地区的政治格局产生巨大的冲击，一些前西方国家殖民地的革命风暴已是呼之欲出。" 
 AWR_PRC_news.5.a:0 "唯[SOV.GetLeader]同志马首是瞻！" 
 AWR_PRC_news.5.b:0 "共产主义阵营正在壮大" 
 AWR_PRC_news.5.c:0 "形势不容乐观" 
 AWR_PRC_news.5.d:0 "我们不会亏待中国朋友的" 

 AWR_PRC_news.6.t:0 "中美签订共同防御条约" 
 AWR_PRC_news.6.desc:0 "[This.GetNewsIcon]在结束了对美国的访问后，[PRC.GetAdjective]最高领导人[PRC.GetLeader]主席于近日宣布了两国缔结共同防御条约的消息。尽管北约中会加入这样一个社会主义庞然大物令所有人感到意外，不可否认的是，至少在反苏这一点上，以美国为首的西方阵营与中国达成了一致。" 
 AWR_PRC_news.6.a:0 "至少我们不是一个人了。" 
 AWR_PRC_news.6.b:0 "苏联的生存空间被进一步挤压了。" 
 AWR_PRC_news.6.c:0 "这下欧洲不会那么危险了……" 
 AWR_PRC_news.6.d:0 "他们会后悔的！" 

 AWR_PRC_news.7.t:0 "“迪克西使团”访问延安"
 AWR_PRC_news.7.d:0 "[This.GetNewsIcon]全面抗战爆发后，国府表现不尽人意，致使大片国土被占，此事引起了国际社会的关注和不满，美国担心中国正面战场的危机会影响其在太平洋作战的胜利。因此美国更加坚信，仅靠国民政府是无法对抗日本的，要想战胜日本，需要联合中国更多的抗日力量，于是开始了派观察团前往延安准备工作，期间关于使团定名一事还费了不少周折，最后经国、共、美三方协商，使团的名称定为“美军中缅印战区驻延安观察组”，绰号“迪克西使团”。"
 AWR_PRC_news.7.a:0 "延安正在与国际接轨。"
 AWR_PRC_news.7.b:0 "美国人这是不信任我们！"  
 AWR_PRC_news.7.c:0 "必须团结一切参与抗日的力量。"  

