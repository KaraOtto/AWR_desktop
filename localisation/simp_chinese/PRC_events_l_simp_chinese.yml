 AWR_PRC.166.t:0 "[FROM.GetNameDef]接受了我们的方案"
 AWR_PRC.166.desc:0 "[FROM.GetNameDef]接受了我们提出的《中苏中亚边境与合作总协定》，对于俄属中亚的争议领土的问题已取得实质性的解决方案。\n对于这一方案的通过，联盟内部不少人在质疑联盟的软弱，但内部高层多数同意这一举措。"
 AWR_PRC.166.a:0 "减少了损失，但希望这是他们最后一次对领土的要求了。"

 AWR_PRC.167.t:0 "[FROM.GetNameDef]拒绝了我们的方案"
 AWR_PRC.167.desc:0 "[FROM.GetNameDef]表示主权问题不是可以谈的问题，态度强硬地表示我们必须归还外西北地区这一历史领土。随着此次谈判的失败，和平解决历史领土的问题的可能彻底破裂。"
 AWR_PRC.167.a:0 "那就战场上见吧。"

 AWR_PRC.168.t:0 "[FROM.GetNameDef]拒绝了我们的方案"
 AWR_PRC.168.desc:0 "[FROM.GetNameDef]拒绝了我们的方案，表示这一历史问题非常复杂，需要之后再进行多次谈判，此问题暂时搁置。"
 AWR_PRC.168.a:0 "看来俄属中亚暂时保住了……"


 AWR_PRC.169.t:0 "[From.GetName]拒绝了我们的提议"
 AWR_PRC.169.desc:0 "[From.GetName]拒绝签署协议并退出谈判。我们对此无能为力。"
 AWR_PRC.169.a:0 "那就战场上见吧。"

 AWR_PRC.170.t:0 "访问团启程" 
 AWR_PRC.170.desc:0 "应苏联此前的邀请，一支由[PRC.GetLeader]主席率领的访问团已经登上火车启程前往莫斯科，他们将在问候苏联领导人[SOV.GetLeader]同志后与其展开相关事项的谈判。" 
 AWR_PRC.170.a:0 "祝他们一切顺利" 

 AWR_PRC.171.t:0 "中国访问团启程" 
 AWR_PRC.171.desc:0 "在胜利推翻国民党集团在中国大陆的统治后，应我们的邀请，一支由中国领导人[PRC.GetLeader]主席率领的访问团已经登上火车启程前往莫斯科，准备与我们就两国开展全面合作以及修订与国民党集团签订的旧约等事项进行商讨。" 
 AWR_PRC.171.a:0 "我们可得好好想办法应对" 

 AWR_PRC.172.t:0 "中国要求修订旧约" 
 AWR_PRC.172.desc:0 "在结束了冗长的问候招待活动后，双方终于就相关事项开始了谈判。目前中国代表团向我们提出了修订不平等旧约、在一定期限内撤回旅顺港和中长铁路驻军并就两国全面合作进一步开展探讨等请求。" 
 AWR_PRC.172.a:0 "就当卖他们个人情吧" 
 AWR_PRC.172.b:0 "他们也不先掂量掂量自己？" 
 prc_tanpanpolie:0 "§Y§Y这将会把中国推向西方资本主义阵营！§!§!" 

 AWR_PRC.173.t:0 "苏联方面同意了我们的要求" 
 AWR_PRC.173.desc:0 "尽管过程中有些微小的曲折和诸如“[PRC.GetLeader]主席遭到软禁”等谣言的出现，苏联方面最终还是同意了我们绝大多数的要求，并承诺尽快撤离所有在华驻军。现在我们可以让周恩来同志再率领一支代表团前来与苏联方面完成新约的签订事项了。" 
 AWR_PRC.173.a:0 "明智的选择" 

 AWR_PRC.174.t:0 "苏联方面拒绝了我们的要求" 
 AWR_PRC.174.desc:0 "尽管我们在谈判中付出了最大的诚意并进行了许多让步，苏联方面仍坚称修改旧约和撤离驻军是完全不可接受的，这使得谈判已经无法再继续下去了。" 
 AWR_PRC.174.t:0 "他们一定会后悔的" 

 AWR_PRC.175.t:0 "谈判开始" 
 AWR_PRC.175.desc:0 "在结束了冗长的问候招待活动后，双方终于就相关事项开始了谈判。在关于旅顺港和中长铁路主权以及修订不平等旧约这一核心议题上，我们应向苏联方面作何表态？\n§Y§Y如果当前国家领导人不是“毛泽东”，苏联将不会同意我们任何有关收回旅顺港和中长铁路主权的要求§!§!" 
 AWR_PRC.175.a:0 "主权问题不是可以谈判的问题" 
 may_lead_to_war_with_SOV_tt:0 "§Y§Y这将可能导致与苏联的战争！§!§!" 
 AWR_PRC.175.b:0 "允许苏联驻军将能更好保障我们的国防安全" 

 AWR_PRC.176.t:0 "中国同意维持现状" 
 AWR_PRC.176.desc:0 "在结束了冗长的问候招待活动后，双方终于就相关事项开始了谈判。令人意外的是，中国方面并未就修订旧约和撤离驻军等事项提出任何要求，反而愿意就建设旅顺港基地提供帮助，并且希望我们今后能加大对他们的援助力度并保障他们的国防安全。" 
 AWR_PRC.176.a:0 "我们之前的援助可不是白给的" 

 AWR_PRC.177.t:0 "苏联方面与我们达成了共识" 
 AWR_PRC.177.desc:0 "考虑到双方悬殊的实力差距和[PRC.GetLeader]主席对[SOV.GetLeader]同志的无限崇拜之情，我们并未就修订旧约和撤离驻军等事项提出任何要求。苏联方面显然对此十分满意，承诺今后将大幅度增加对我们的援助力度并全力保障我们的国防安全。" 
 AWR_PRC.177.a:0 "我们不应要求太多" 

 AWR_PRC.178.t:0 "《中苏友好同盟互助条约》的签订" 
 AWR_PRC.178.desc:0 "在经过数轮“平静”的谈判后，双方代表团终于就中苏全面合作、东北中长铁路和旅顺港归属等事项达成了一致的认识。双方外长于今日在克里姆林宫签订了全新的《中苏友好同盟互助条约》，这意味着我们将与[PRC.GetNameDef]确立正式的同盟关系，并继续享有目前在中国东北地区的一切权利。" 
 AWR_PRC.178.a:0 "识时务者为俊杰"

 AWR_PRC.179.t:0 "《中苏友好同盟互助条约》的签订" 
 AWR_PRC.179.desc:0 "在经过数轮“平静”的谈判后，双方代表团终于就中苏全面合作、东北中长铁路和旅顺港归属等事项达成了一致的认识。双方外长于今日在克里姆林宫签订了全新的《中苏友好同盟互助条约》，这意味着我们将与[SOV.GetNameDef]确立正式的同盟关系，并承认苏联目前在东北地区的一切权利。" 
 AWR_PRC.179.a:0 "这已经是最好的结果了"

 AWR_PRC.180.t:0 "《中苏友好同盟互助条约》的签订" 
 AWR_PRC.180.desc:0 "在经过数轮“热烈”的谈判后，双方代表团终于就中苏全面合作、东北中长铁路和旅顺港归属等事项达成了一致的认识。双方外长于今日在克里姆林宫签订了全新的《中苏友好同盟互助条约》，这意味着我们与[PRC.GetNameDef]已经确立了正式的同盟关系，并将放弃目前在中国东北地区的所有权利。" 
 AWR_PRC.180.a:0 "这样的结果也不坏" 

 AWR_PRC.181.t:0 "《中苏友好同盟互助条约》的签订" 
 AWR_PRC.181.desc:0 "在经过数轮“热烈”的谈判后，双方代表团终于就中苏全面合作、东北中长铁路和旅顺港归属等事项达成了一致的认识。双方外长于今日在克里姆林宫签订了全新的《中苏友好同盟互助条约》，这意味着过去由国民党和苏联方面签订的不平等条约已经作废了，并且我们将与[SOV.GetNameDef]确立正式的同盟关系。" 
 AWR_PRC.181.a:0 "重大的外交胜利！" 

 AWR_PRC.182.t:0 "中苏谈判破裂" 
 AWR_PRC.182.desc:0 "在经过数轮“热烈”的谈判后，双方代表团仍未就中苏全面合作、东北中长铁路和旅顺港归属等事项达成任何共识。中国领导人[PRC.GetLeader]主席在向我们表达最严正的抗议后率领访问团离开了我们的国土。" 
 AWR_PRC.182.a:0 "我们接下来得准备好对付中国人了"

 AWR_PRC.183.t:0 "中苏谈判破裂" 
 AWR_PRC.183.desc:0 "在经过数轮“热烈”的谈判后，双方代表团仍未就中苏全面合作、东北中长铁路和旅顺港归属等事项达成任何共识，苏联人明显试图将整个东北地区都收入囊中。[PRC.GetLeader]主席在向苏联方面表达了最严正的抗议后率领访问团回到了国内，下一步我们应如何应对？" 
 AWR_PRC.183.a:0 "是可忍熟不可忍！"
 AWR_PRC.183.b:0 "君子报仇，十年不晚......"

 AWR_PRC.184.t:0 "中共请求陆军科研合作"
 AWR_PRC.184.desc:0 "中共正在发展他们的陆军，希望作为社会主义领袖的我们能传授一些陆军的坦克及火炮的科技。当然，他们表示只需要我们已经淘汰的科技。"
 AWR_PRC.184.a:0 "没有问题，同志。"
 AWR_PRC.184.b:0 "做出一些指导已经够了。"

 AWR_PRC.185.t:0 "苏联同意了"
 AWR_PRC.185.desc:0 "苏联同意了我们的请求，给予了我们他们已经迭代的陆军科技。"
 AWR_PRC.185.a:0 "这就是国际主义！"

 AWR_PRC.186.t:0 "苏联拒绝"
 AWR_PRC.186.desc:0 "苏联拒绝了我们的请求，但表示愿意给出一些指导。"
 AWR_PRC.186.a:0 "好吧……"

 AWR_PRC.187.t:0 "中共请求海军科研合作"
 AWR_PRC.187.desc:0 "中共正在发展他们的海军，希望作为社会主义领袖的我们能传授一些关于潜艇的科技。当然，他们表示只需要我们已经淘汰的科技。"
 AWR_PRC.187.a:0 "没有问题，同志。"
 AWR_PRC.187.b:0 "做出一些指导已经够了。"

 AWR_PRC.188.t:0 "苏联同意了"
 AWR_PRC.188.desc:0 "苏联同意了我们的请求，给予了我们他们已经迭代的潜艇科技。"
 AWR_PRC.188.a:0 "这就是国际主义！"

 AWR_PRC.189.t:0 "苏联拒绝"
 AWR_PRC.189.desc:0 "苏联拒绝了我们的请求，但表示愿意给出一些指导。"
 AWR_PRC.189.a:0 "好吧……"

 AWR_PRC.190.success.desc:0 "工程团队取得了超出预期的突破。经过最终验证，这一设计已经达到了可以直接投入实际运用的水平。"
 AWR_PRC.190.mostly_success.desc:0 "工程的主要技术障碍已经得到解决，但距离实用化仍有相当工作需要完成。\n\n对应特殊工程获得§G50%§!进度。"
 AWR_PRC.190.partial_success.desc:0 "实验虽然没有达到预期目标，但仍产生了若干有价值的数据和设计经验。\n\n对应特殊工程获得§Y25%§!进度。"
 AWR_PRC.190.failure.desc:0 "工程最终没有取得可以利用的技术成果。投入的资源和时间未能换来预期中的突破。"
 AWR_PRC.190.ok:0 "我们会记住这次经验。"

