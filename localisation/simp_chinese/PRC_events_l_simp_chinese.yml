 AWR_PRC.158.t:0 "苏联同意我们以购买的方式移交领土"
 AWR_PRC.158.desc:0 "苏联拒绝直接归还库页岛，但他们拟定了《中苏萨哈林归属与合作总协定》，如果我们同意，他们就可以归还争议领土，具体内容如下：\n 1.允许苏联转移库页岛内所有工厂和船坞；\n2.签定中苏互不侵犯条约；\n中国与苏签定为期一年的《中苏萨哈林归属与合作总协定》内容包括中国对苏联的农业援助、工业支持和科研合作；\n条约期间如果苏联遭到他国侵略，中国有义务出兵援助，且不允许加入与苏联有敌对关系的阵营和组织。\n移交的领土需设为非军事区作为缓冲区域，满一年后方可恢复正常状态。"
 AWR_PRC.158.a:0 "我们接受。"
 AWR_PRC.158.b:0 "主权问题不是可以谈的问题，他们必须归还。"
 AWR_PRC.158.c:0 "还是算了吧……"

