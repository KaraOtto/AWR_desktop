l_simp_chinese:
 PRC_shanghai_silver_intro: "让人民币进入上海市场，需要取得民众信任，稳定人民币与银元的兑换价格。"
 PRC_shanghai_currency_overview: "货币与市场"
 PRC_shanghai_RMB_credit: "人民币信任度"
 PRC_shanghai_RMB_credit_value: "[?RMB_belief|%0]"
 PRC_shanghai_RMB_credit_tt: "§Y人民币信任度§!\n当前：[?RMB_belief|%1]\n\n信任度过低会加剧银元投机；经济手段获胜需要至少55%的信任度。"
 PRC_shanghai_silver_reserve: "上海银币储备"
 PRC_shanghai_silver_reserve_value: "[?silver_dollar_reserves|0]"
 PRC_shanghai_silver_reserve_tt: "§Y上海银币储备§!\n当前：[?silver_dollar_reserves|1]\n\n可通过调运补充，并用于向市场抛售银元。"
 PRC_shanghai_exchange: "人民币／银元汇率"
 PRC_shanghai_exchange_value: "[?RMB_silver_dollar|0]"
 PRC_shanghai_exchange_tt: "§Y人民币／银元汇率§!\n当前：[?RMB_silver_dollar|1]\n\n汇率过高会打击人民币信用。经济手段获胜需要将该值稳定在800及以下。"
 PRC_shanghai_business_trust: "民族资产阶级信任度"
 PRC_shanghai_business_trust_value: "[?capitalist_belief|%0]"
 PRC_shanghai_business_trust_tt: "§Y民族资产阶级信任度§!\n当前：[?capitalist_belief|%1]\n\n反映工商界对人民政府经济政策的信任程度。"
 PRC_shanghai_silver_goal: "稳定目标：信用≥55%，汇率≤800 · 连续 [?PRC_silver_dollar_stable_days|0]/3 天"
 PRC_shanghai_silver_goal_tt: "人民币信任度达到55%、人民币／银元汇率不超过800，并连续保持3天，即可通过经济手段取得银元之战胜利。任一条件中断，连续稳定天数会重新计算。"
 PRC_shanghai_goods_intro: "调运米、棉、煤补充国营储备，向市场投放物资，以平抑价格、保障供应。"
