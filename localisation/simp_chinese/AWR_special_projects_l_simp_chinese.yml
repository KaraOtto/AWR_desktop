l_simp_chinese:
 # 日本国策解锁的特殊科研项目
 JAP_nf_sp_shusui: "三菱 J8M 秋水"
 JAP_nf_sp_shusui_desc: "依据德国送来的Me 163资料，陆海军联合试制火箭动力局地截击机，用于拦截高空来袭的重型轰炸机。"
 JAP_nf_sp_kikka: "中岛 橘花"
 JAP_nf_sp_kikka_desc: "以国产Ne-20轴流式涡轮喷气发动机为动力的双发喷气式攻击机，是帝国喷气航空的起点。"
 JAP_nf_sp_shinden: "九州 J7W 震电"
 JAP_nf_sp_shinden_desc: "采用前翼与推进式螺旋桨的新式截击机布局，追求在高空取得压倒性的速度与火力。"
 JAP_nf_sp_ohka: "横须贺 MXY7 樱花"
 JAP_nf_sp_ohka_desc: "由母机挂载、火箭推进、驾驶员操纵直至命中的特别攻击机。"

 JAP_nf_sp_shusui_fuel_reward: "高浓度过氧化氢燃料"
 JAP_nf_sp_shusui_fuel_reward_desc: "甲液与乙液一旦泄漏混合便会剧烈燃烧，试验场多次发生事故。我们应当……"
 JAP_nf_sp_shusui_fuel_safe: "先解决燃料安全问题"
 JAP_nf_sp_shusui_fuel_rush: "冒险加快试飞进度"
 JAP_nf_sp_kikka_engine_reward: "发动机的来源"
 JAP_nf_sp_kikka_engine_reward_desc: "国产发动机迟迟达不到推力要求，德国的BMW 003资料却只有寥寥几页图纸。"
 JAP_nf_sp_kikka_engine_ne20: "坚持自行仿制Ne-20"
 JAP_nf_sp_kikka_engine_german: "向德国求购更多资料"
 JAP_nf_sp_shinden_layout_reward: "鸭式布局的取舍"
 JAP_nf_sp_shinden_layout_reward_desc: "推进式布局带来了速度，却也让机头空出大片空间。设计组需要决定优先方向。"
 JAP_nf_sp_shinden_layout_speed: "继续压低阻力"
 JAP_nf_sp_shinden_layout_guns: "机头集中布置机炮"
 JAP_nf_sp_shinden_bonus: "震电式布局"
 JAP_nf_sp_shinden_speed: "震电——速度优先"
 JAP_nf_sp_shinden_guns: "震电——火力优先"
 JAP_nf_sp_yamato: "大和型战列舰"
 JAP_nf_sp_yamato_desc: "在绝对保密下研制搭载46厘米主炮的超级战列舰，以单舰质量压倒美国海军的数量优势。"
 JAP_nf_sp_yamato_secrecy_reward: "“一号舰”的保密"
 JAP_nf_sp_yamato_secrecy_reward_desc: "吴港船坞四周挂起了草帘，连舰炮口径都对外宣称为40厘米。严格的保密拖慢了工程进度……"
 JAP_nf_sp_yamato_secrecy_strict: "保密优先"
 JAP_nf_sp_yamato_secrecy_rush: "动用更多工厂加快进度"

