 JAP_pacific_emergency_fleet_supply_effect_tt: "§Y太平洋战争态势§!在§Y30日§!内获得：\n  海军燃油消耗：§G-30%§!\n  舰船修理速度：§G+30%§!\n  舰艇速度：§G+6%§!"
 JAP_pacific_force_landing_effect_tt: "§Y太平洋战争态势§!在§Y21日§!内获得：\n  登陆准备时间：§G-50%§!\n  两栖入侵：§G+30%§!\n  两栖登陆惩罚：§G-20%§!\n  陆军组织度恢复：§R-20%§!\n  补给消耗：§R+30%§!\n  船团护航效率：§R-20%§!"
 JAP_pacific_expand_landing_flotilla_effect_tt: "§Y太平洋战争态势§!永久获得：\n  海军入侵容量：§G+12§!\n  海军入侵准备速度：§G+20%§!"
 JAP_pacific_establish_forward_anchorage_effect_tt: "§Y太平洋战争态势§!永久获得：\n  海军最大航程：§G+10%§!\n  舰船修理速度：§G+10%§!"
