l_simp_chinese:
 JAP_cis_china_incident_category: "中国事变"
 JAP_cis_china_incident_category_desc: "中国战场已经从短期军事行动演变为一场关于后勤、占领与政治控制的长期战争。年份只代表最早实施时间；真正的前提仍是战况、控制区和抵抗形势。"
 JAP_cis_map_title: "中国战况图"
 JAP_cis_map_side_label: "旗帜归属：阵营领袖优先，无阵营则显示对日交战国"
 JAP_cis_map_legend: "同一阵营使用领袖旗帜　无阵营交战国使用本国旗帜　§g灰色§!：非交战第三方"

 JAP_cis_reinforce_china_expeditionary_army: "增派中国方面军"
 JAP_cis_reinforce_china_expeditionary_army_desc: "扩充派遣军司令部及其直属部队。更多兵力可以维持攻势，但也会加重中国战场的补给压力。"
 JAP_cis_requisition_local_transport: "征用当地运输资源"
 JAP_cis_requisition_local_transport_desc: "征用车辆、畜力和船只以补充军需运输。运输能力将有所改善，但粗暴征用会激化当地抵抗。"
 JAP_cis_expand_grain_requisition: "扩大占领区粮食征发"
 JAP_cis_expand_grain_requisition_desc: "从华北占领区扩大军粮征集，以换取短期战争经济收益。地方生活和顺从度将为此付出代价。"
 JAP_cis_impose_military_administration: "实施军事管制"
 JAP_cis_impose_military_administration_desc: "在主要占领区建立统一军事行政。驻军调度会更加有效，但军管将妨碍顺从增长并增加敌意。"
 JAP_cis_support_local_maintenance_associations: "扶植地方维持会"
 JAP_cis_support_local_maintenance_associations_desc: "利用地方士绅和既有行政网络恢复最低限度的秩序。"

 JAP_cis_reorganize_continental_transport: "整备大陆交通线"
 JAP_cis_reorganize_continental_transport_desc: "以七十日整修华北至长江下游的主要交通节点。必须实际控制北京、上海和南京。"
 JAP_cis_expand_yangtze_shipping: "扩大长江水运"
 JAP_cis_expand_yangtze_shipping_desc: "只有实际打通上海、苏州、南京和武汉的长江走廊，才可能组织大规模军需水运。"
 JAP_cis_repair_occupied_railways: "修复占领区铁路和基础设施"
 JAP_cis_repair_occupied_railways_desc: "修复山东、江苏和苏州一带受战争破坏的铁路网。"
 JAP_cis_develop_north_china_resources: "开发华北资源"
 JAP_cis_develop_north_china_resources_desc: "投入政治与工业资源，进行为期一百零五日的华北矿产和交通开发。该项目只能完成一次。"
 JAP_cis_develop_central_china_resources: "开发华中资源"
 JAP_cis_develop_central_china_resources_desc: "投入政治与工业资源，进行为期一百一十日的华中资源和交通开发。该项目只能完成一次。"
 JAP_cis_develop_south_china_resources: "开发华南资源"
 JAP_cis_develop_south_china_resources_desc: "投入政治与工业资源，进行为期一百二十日的华南资源和交通开发。该项目只能完成一次。"
 JAP_cis_establish_north_china_development_company: "设立华北开发株式会社"
 JAP_cis_establish_north_china_development_company_desc: "以半官半商的机构统筹华北矿业、盐业和交通投资。"
 JAP_cis_establish_central_china_promotion_company: "设立华中振兴株式会社"
 JAP_cis_establish_central_china_promotion_company_desc: "建立负责华中占领区工商业与交通投资的综合机构。"

 JAP_cis_establish_federal_reserve_bank: "设立中国联合准备银行"
 JAP_cis_establish_federal_reserve_bank_desc: "以北京为中心建立受日方控制的华北发行银行。"
 JAP_cis_exclude_fabi_circulation: "排除法币流通"
 JAP_cis_exclude_fabi_circulation_desc: "强制压缩国民政府法币的流通范围。这会加强金融控制，也会进一步扰乱民生。"
 JAP_cis_strengthen_north_china_financial_control: "强化华北金融控制"
 JAP_cis_strengthen_north_china_financial_control_desc: "将占领区税收、外汇与物资结算纳入联合准备银行体系。"
 JAP_cis_establish_central_reserve_bank: "设立中央储备银行"
 JAP_cis_establish_central_reserve_bank_desc: "为南京国民政府建立新的发行与结算机构。"
 JAP_cis_integrate_central_china_finance: "整合华中占领区金融"
 JAP_cis_integrate_central_china_finance_desc: "把华中税收、货币和企业结算纳入南京的金融网络。"

 JAP_cis_form_provisional_government: "成立中华民国临时政府"
 JAP_cis_form_provisional_government_desc: "在实际控制北京并建立地方维持组织后，扶植华北临时政权。"
 JAP_cis_form_reformed_government: "成立中华民国维新政府"
 JAP_cis_form_reformed_government_desc: "在控制上海与南京后组织华中合作政权。"
 JAP_cis_support_wang_jingwei_activities: "支持汪精卫政治活动"
 JAP_cis_support_wang_jingwei_activities_desc: "为汪精卫集团的分裂活动和新政权筹备提供长期政治支持。"
 JAP_cis_establish_nanjing_national_government: "成立南京国民政府"
 JAP_cis_establish_nanjing_national_government_desc: "最早于1940年3月，在实际控制南京并完成汪精卫相关活动后，整合既有合作机构。"
 JAP_cis_expand_nanjing_government_authority: "扩大南京政府行政权限"
 JAP_cis_expand_nanjing_government_authority_desc: "把更多地方行政交给合作政府。日本的直接资源和工厂收益会下降，但抵抗、驻军需求与占领成本也将缓和。"
 JAP_cis_expand_collaboration_army: "扩大合作军"
 JAP_cis_expand_collaboration_army_desc: "扩充合作政权军队与警察。它们能提供兵员，却不能替代日本对整个占领体系的责任。"
 JAP_cis_delegate_security_to_collaborators: "让合作政府承担更多治安职责"
 JAP_cis_delegate_security_to_collaborators_desc: "把基层治安和部分驻防任务交给合作政府，以降低日本驻军负担。"

 JAP_cis_expand_war_supporting_war: "扩大以战养战"
 JAP_cis_expand_war_supporting_war_desc: "从占领区直接抽取更多资源和生产能力。短期收益将伴随更高抵抗、更慢顺从增长和更多驻军需求。"
 JAP_cis_strengthen_continental_transport_protection: "强化大陆交通保护"
 JAP_cis_strengthen_continental_transport_protection_desc: "调集宪兵和铁路守备队保护漫长的大陆交通线。"
 JAP_cis_strengthen_occupation_economic_control: "强化占领区经济统制"
 JAP_cis_strengthen_occupation_economic_control_desc: "将关键企业、仓储和流通纳入军事经济体系。"
 JAP_cis_strengthen_grain_requisition: "强化粮食征发"
 JAP_cis_strengthen_grain_requisition_desc: "在战争长期化后进一步提高粮食征集指标。短期军需收益将造成严重的抵抗、顺从损失与地方经济破坏。"
 JAP_cis_expand_material_requisition: "扩大物资征发"
 JAP_cis_expand_material_requisition_desc: "以行政命令取得占领区物资。日本会获得一次性工业收益，当地抵抗与破坏也会加深。"
 JAP_cis_expand_labor_requisition: "扩大劳务征用"
 JAP_cis_expand_labor_requisition_desc: "从1938年起扩大占领区劳务动员。工业与建设收益以顺从下降、抵抗和驻军负担为代价。"
 JAP_cis_security_rectification: "治安肃正"
 JAP_cis_security_rectification_desc: "把占领政策提升为强化治安肃正。镇压能力改善，但抵抗目标和长期占领代价上升。"
 JAP_cis_expand_security_warfare: "扩大治安战"
 JAP_cis_expand_security_warfare_desc: "把更多部队投入华北治安战与交通线守备。短期指挥能力有所改善，报复性行动也会进一步破坏占领区。"
 JAP_cis_clear_countryside: "清乡"
 JAP_cis_clear_countryside_desc: "在持续抵抗下扩大封锁、清查和强制迁移。驻军效率提高，而地方经济、顺从和社会秩序遭到更严重破坏。"
 JAP_cis_total_security_war: "全面治安战"
 JAP_cis_total_security_war_desc: "将占领区置于全面治安战之下。短期镇压能力最强，但抵抗、顺从损失、地区破坏和长期占领成本也最为严重。"

 JAP_cis_expand_forced_labor_recruitment: "扩大强制劳工征集"
 JAP_cis_expand_forced_labor_recruitment_desc: "从1942年起扩大强制劳工征集，为军需生产提供短期收益，并造成严重的抵抗和地方破坏。"
 JAP_cis_transport_chinese_labor_to_home_islands: "向日本本土输送中国劳工"
 JAP_cis_transport_chinese_labor_to_home_islands_desc: "经由上海把强征劳工输送至日本本土。由此产生的工业收益伴随显著的人道与占领后果。"
 JAP_cis_wartime_emergency_requisition: "战时紧急征发"
 JAP_cis_wartime_emergency_requisition_desc: "1944年以后，以紧急名义掠取最后一批可用人力与物资。它无法解决战争长期化的结构性危机。"
 JAP_cis_seek_political_settlement: "寻求对华政治解决"
 JAP_cis_seek_political_settlement_desc: "在实际控制南京、武汉、广州且战争持续足够久后派出谈判代表。这只会开启事件链；中国方面仍可拒绝，日本不会通过点击决议使其直接投降。"

 JAP_cis_nanjing_devastation: "南京长期创伤"
 JAP_cis_nanjing_devastation_desc: "大规模屠杀和破坏给南京的社会、经济与政治秩序留下了长期创伤。"
 JAP_cis_severe_local_destruction: "严重地方破坏"
 JAP_cis_severe_local_destruction_desc: "高压治安与报复性行动摧毁了当地生产、基础设施与合作可能。"
 JAP_cis_nanjing_massacre_opinion: "南京大屠杀"
 JAP_cis_brutal_occupation_opinion: "残酷的中国占领政策"
 JAP_cis_nanjing_massacre_threat: "南京大屠杀"

 JAP_china_incident.1.t: "南京陷落"
 JAP_china_incident.1.d: "日军已经进入南京。中国政府撤离后，城市陷入秩序崩溃，军纪失控与针对俘虏、平民的暴力正在迅速扩大。"
 JAP_china_incident.1.a: "南京已经落入我军之手。"
 JAP_china_incident.2.t: "南京大屠杀"
 JAP_china_incident.2.d: "在南京及周边地区，日军实施了大规模屠杀、强奸、抢掠与纵火。无数平民和已经放下武器的战俘遇害。这场暴行将成为城市与战争不可磨灭的创伤，并激起中国更强烈的抵抗和国际谴责。"
 JAP_china_incident.2.a: "这场暴行不会被遗忘。"
 JAP_china_incident.3.t: "南京暴行震惊世界"
 JAP_china_incident.3.d: "来自南京的报告描述了日军占领后的大规模屠杀、强奸和抢掠。幸存者、外国记者与国际机构的记录迅速传遍世界，各国舆论对日本的谴责不断上升。"
 JAP_china_incident.3.a: "世界正在见证这一切。"

 JAP_china_incident.10.t: "汪精卫集团的活动"
 JAP_china_incident.10.d: "汪精卫及其追随者正在脱离重庆政府的政治轨道。他们提出以结束战争为名组建新的合作政权，但其合法性与实际行政基础仍极其有限。"
 JAP_china_incident.10.a: "继续接触。"
 JAP_china_incident.11.t: "南京国民政府成立"
 JAP_china_incident.11.d: "既有华北、华中合作机构被名义上整合进南京的新政府。日本可以借此转移部分行政与治安责任，却也必须让渡一部分直接控制所得。"
 JAP_china_incident.11.a: "让它承担更多责任。"

 JAP_china_incident.21.t: "铁路沿线游击活动"
 JAP_china_incident.21.d: "游击队袭击铁路设施并破坏运输节点。守备队被迫分散在越来越漫长的交通线上。"
 JAP_china_incident.21.a: "调集铁路守备队。"
 JAP_china_incident.22.t: "征粮引发地方抵抗"
 JAP_china_incident.22.d: "新的粮食征集超过了地方所能承受的限度。藏粮、逃亡和袭击征粮队的事件迅速增加。"
 JAP_china_incident.22.a: "占领成本继续上升。"
 JAP_china_incident.23.t: "劳工征集引发反抗"
 JAP_china_incident.23.d: "强制劳工征集在乡村和城镇引发逃亡与反抗。合作机构也警告说，继续扩大征集将使基层行政难以维持。"
 JAP_china_incident.23.a: "镇压无法消除怨恨。"
 JAP_china_incident.24.t: "合作政府要求降低征发"
 JAP_china_incident.24.d: "合作政府官员要求减少粮食、物资和劳工征发。他们声称基层秩序已接近极限，否则将无法继续替日本承担治安责任。"
 JAP_china_incident.24.a: "重新分配治安责任。"

 JAP_china_incident.30.t: "华北报复性扫荡"
 JAP_china_incident.30.d: "在长期游击战和高压占领政策下，华北多地出现以“烧光、杀光、抢光”为特征的报复性扫荡。短期内游击活动受到打击，但村庄、生产和任何合作基础都遭到严重破坏。"
 JAP_china_incident.30.a: "暴力只会制造新的抵抗。"
 JAP_china_incident.31.t: "华北“三光”暴行"
 JAP_china_incident.31.d: "来自华北的消息显示，日军在反游击行动中实施大范围焚毁、杀戮和掠夺。地方社会遭到严重破坏，国际社会再次谴责日本在中国的战争行为。"
 JAP_china_incident.31.a: "又一场灾难。"

 JAP_china_incident.40.t: "寻求对华政治解决"
 JAP_china_incident.40.d: "在控制南京、武汉和广州之后，政府决定试探中国主要交战方是否愿意谈判。军事优势提供了筹码，却不能保证对方接受日本条件。"
 JAP_china_incident.40.a: "派出谈判代表。"
 JAP_china_incident.41.t: "日本提出和谈"
 JAP_china_incident.41.d: "日本代表提出以停战和撤回部分要求为基础展开谈判。接受将结束当前战争，却意味着在重大领土与政治问题尚未解决时承认战场现实。"
 JAP_china_incident.41.a: "为保存国家接受停战。"
 JAP_china_incident.41.b: "抗战到底。"
 JAP_china_incident.42.t: "中国方面接受谈判"
 JAP_china_incident.42.d: "中国代表接受了停战框架。枪声暂时平息，但占领区、合作政权和未来边界仍将成为长期争议。"
 JAP_china_incident.42.a: "战争终于停止。"
 JAP_china_incident.43.t: "中国方面拒绝谈判"
 JAP_china_incident.43.d: "中国方面拒绝了日本提出的条件，并宣布将继续抵抗。军事优势仍未转化为政治解决。"
 JAP_china_incident.43.a: "战争还将继续。"

 # 决议分类与战略地图
 JAP_pacific_war_category: "太平洋战争"
 JAP_pacific_war_category_desc: "日本与美国实际进入战争后，本分类才会显示。太平洋战争的胜负取决于岛链、前进基地、登陆能力与漫长海上交通线。战略地图根据实际控制动态更新；年份和既定国策不会替玩家夺取任何基地。"
 JAP_pacific_map_title: "太平洋战略态势图"
 JAP_pacific_map_subtitle: "大本营海军作战室——战略区域控制与当前进攻方向"
 JAP_pacific_map_legend: "§R旭日军旗纹理§!：日本本土　§C美国国旗纹理§!：美国本土　§g灰色§!：第三方　立体军旗：直接控制海外关键基地"
 JAP_pacific_map_isolated_marker: "§g孤立§!"
