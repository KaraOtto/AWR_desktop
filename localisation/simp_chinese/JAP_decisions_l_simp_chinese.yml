 # 太平洋战争态势与占领措施
 JAP_pacific_war_situation: "太平洋战争态势：$JAP_pacific_GetSituationName$"
 JAP_pacific_war_situation_desc: "太平洋战略区域的实际控制决定基础等级；联合舰队、登陆准备、海军航空、船团护航及南方运输等军事决议的效果也统一叠加于此。失去岛链会降低基础态势，临时行动到期后则由每周低频更新移除对应修正。"
 JAP_pacific_situation_name_1: "I 战略防御"
 JAP_pacific_situation_name_2: "II 西太平洋防卫圈"
 JAP_pacific_situation_name_3: "III 太平洋战略均势"
 JAP_pacific_situation_name_4: "IV 太平洋制海优势"
 JAP_pacific_situation_name_5: "V 太平洋霸权"
 JAP_pacific_occupation_policy: "太平洋占领措施：$JAP_pacific_GetOccupationName$"
 JAP_pacific_occupation_policy_desc: "南方占领区的统一政策。直接征发能换取较高的短期资源与工厂收益，但会提高抵抗和驻军负担并压低顺从；合作统治牺牲部分即时收益，以换取稳定和长期利用。"
 JAP_pacific_occupation_name_collaboration_2: "地方合作统治"
 JAP_pacific_occupation_name_collaboration_1: "有限合作行政"
 JAP_pacific_occupation_name_balanced: "军政并行"
 JAP_pacific_occupation_name_extraction_1: "扩大直接征发"
 JAP_pacific_occupation_name_extraction_2: "全面资源统制"

 # 岛屿和航路状态
 JAP_pacific_island_isolated: "海上孤立"
 JAP_pacific_island_isolated_desc: "该岛与主要海上交通线失去稳定联系。补给和组织恢复下降，并出现适度损耗。恢复联系并维持两周后，孤立状态才会解除。"
 JAP_pacific_island_blockaded: "完全封锁"
 JAP_pacific_island_blockaded_desc: "长期孤立已经演变为完全封锁。当地补给、组织恢复、资源和生产受到严重打击。"
 JAP_pacific_airlift_relief: "紧急空运补给"
 JAP_pacific_airlift_relief_desc: "运输机只能暂时缓和补给与组织恢复困难，不能解除海上封锁。"
 JAP_pacific_risky_sea_supply: "冒险海上输送"
 JAP_pacific_risky_sea_supply_desc: "付出大量运输船损失后，少量补给和增援突破封锁。"
 JAP_pacific_island_stockpiles: "岛屿物资储备"
 JAP_pacific_island_stockpiles_desc: "预先储备的弹药、燃料和粮食能在交通受阻时维持一段时间。"
 JAP_pacific_southern_route_strained_modifier: "南方航路吃紧"
 JAP_pacific_southern_route_strained_modifier_desc: "运输船和中转基地不足，南方资源无法充分运回。"
 JAP_pacific_southern_route_disrupted_modifier: "南方航路中断"
 JAP_pacific_southern_route_disrupted_modifier_desc: "即使油田仍在日本控制下，严重受阻的海上航线也使大部分资源无法利用。"

 # 联合舰队
 JAP_pacific_concentrate_combined_fleet: "集中联合舰队"
 JAP_pacific_concentrate_combined_fleet_desc: "集中主力舰队、统一通信和作战编组，在三十日内提高舰队组织、航速与战位能力。"
 JAP_pacific_prelanding_bombardment: "实施登陆前舰炮准备"
 JAP_pacific_prelanding_bombardment_desc: "消耗指挥点、燃油和少量海军经验，进行二十一日舰炮与登陆协同准备。通常提供约§G+50%§!岸轰强化；战争态势达到IV或V时提高至约§G+100%§!。"
 JAP_pacific_naval_air_recon: "强化海军航空侦察"
 JAP_pacific_naval_air_recon_desc: "扩大远程巡逻和舰载侦察，在三十日内提高海上探测、索敌与空军任务效率。"
 JAP_pacific_carrier_pilot_training: "强化舰载机飞行员训练"
 JAP_pacific_carrier_pilot_training_desc: "通过密集训练改善舰载机攻击与飞行员保存，但需要燃油和空军经验。"
 JAP_pacific_emergency_fleet_supply_decision: "紧急舰队补给"
 JAP_pacific_emergency_fleet_supply_decision_desc: "拆用运输船和后方储备，为舰队提供三十日紧急维修和节油保障。"
 JAP_pacific_force_landing: "强行实施登陆作战"
 JAP_pacific_force_landing_desc: "以高昂的政治、指挥、燃油和运输船代价，在二十一日内加速登陆并缓解两栖惩罚。§R引擎没有能够无视制海权门槛的合法修正；本决议不能在制海权不足时绕过登陆限制。§!登陆后组织恢复和补给状况也会恶化。"

 # 太平洋军事决议的可见效果提示
 JAP_pacific_concentrate_combined_fleet_effect_tt: "§Y太平洋战争态势§!在§Y30日§!内获得：\n  海军组织度：§G+10%§!\n  战位：§G+10%§!\n  舰艇速度：§G+10%§!"
 JAP_pacific_prelanding_bombardment_effect_tt: "§Y太平洋战争态势§!在§Y21日§!内获得：\n  岸轰加成：§G+50%§!\n  登陆准备时间：§G-30%§!\n  两栖入侵：§G+10%§!"
 JAP_pacific_prelanding_bombardment_superior_effect_tt: "由于当前太平洋战争态势达到IV或V，该民族精神在§Y21日§!内获得强化效果：\n  岸轰加成：§G+100%§!\n  登陆准备时间：§G-40%§!\n  两栖入侵：§G+16%§!"
