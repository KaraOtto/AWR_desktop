 JAP_pacific_strengthen_asw_watch_effect_tt: "§Y太平洋战争态势§!在§Y45日§!内获得：\n  海军探测：§G+16%§!\n  船团护航效率：§G+12%§!"
 JAP_pacific_disperse_convoys_effect_tt: "§Y太平洋战争态势§!在§Y45日§!内获得：\n  船团护航效率：§G+16%§!\n  舰艇速度：§R-4%§!"
 JAP_pacific_expand_oil_tanker_fleet_effect_tt: "§Y太平洋战争态势§!永久获得：\n  燃油获取：§G+12%§!"
 JAP_pacific_expand_southern_oil_transport_effect_tt: "§Y太平洋战争态势§!永久获得：\n  燃油获取：§G+20%§!\n  当地资源：§G+10%§!\n  船团护航效率：§G+10%§!"
 JAP_pacific_recall_combined_fleet_effect_tt: "§Y太平洋战争态势§!在§Y21日§!内获得：\n  海军撤退速度：§G+40%§!\n  初次交战后撤退几率：§G+30%§!\n  舰艇速度：§G+10%§!\n  战位：§R-16%§!"
 JAP_pacific_selected_state_effect_tt: "以下效果将施加于§Y[FROM.GetName]§!："
 JAP_pacific_risky_sea_transport_effect_tt: "§Y[FROM.GetName]§!获得§Y30日§!冒险海上输送，暂时改善当地补给与组织恢复。"
 JAP_pacific_prepare_malacca_route_effect_tt: "改善南方资源运输线，并计入§Y南方航路§!状态判定。\n整备后，维持航路安全或吃紧状态所需的运输船数量降低。"
 JAP_pacific_repair_dei_oilfields_route_effect_tt: "新增当地资源的实际利用受§Y南方航路§!状态影响。"
 JAP_pacific_evacuate_island_garrison_effect_tt: "撤离以保存人员为主；§Y[FROM.GetName]§!的日本部队将撤回本土，大量重装备将被遗弃。"
 JAP_pacific_airlift_island_supplies_effect_tt: "§Y[FROM.GetName]§!获得§Y30日§!紧急空运补给，暂时改善当地补给与组织恢复，但不会解除海上封锁。"
 JAP_pacific_establish_southern_military_administration_effect_tt: "启用§Y太平洋占领措施§!，并解锁后续占领政策。"
 JAP_pacific_occupation_direct_effect_tt: "§Y太平洋占领措施§!向【直接征发】方向移动一级。\n提高资源与工业利用，但增加抵抗和驻军负担。"
 JAP_pacific_occupation_cooperative_effect_tt: "§Y太平洋占领措施§!向【合作统治】方向移动一级。\n降低抵抗与驻军负担、改善统治，但减少直接征发收益。"

 # 联合舰队民族精神

 # 登陆与基地
 JAP_pacific_expand_landing_flotilla: "扩大登陆船团"
 JAP_pacific_expand_landing_flotilla_desc: "投入九十日和两座民用工厂改装运输、登陆与护航船只，永久提高登陆容量和准备速度。"
 JAP_pacific_establish_forward_anchorage: "建立前进舰队锚地"
 JAP_pacific_establish_forward_anchorage_desc: "在实际控制的马里亚纳、菲律宾或新几内亚建立前进维修和补给节点。"
 JAP_pacific_rapid_repair_captured_port: "快速修复占领港口"
 JAP_pacific_rapid_repair_captured_port_desc: "优先抢修新加坡、菲律宾或荷属东印度的重要港口设施。"
 JAP_pacific_repair_captured_airfield: "抢修占领机场"
 JAP_pacific_repair_captured_airfield_desc: "恢复占领区跑道、油库与地勤设施，为下一阶段进攻建立航空支点。"
 JAP_pacific_fortify_island: "强化岛屿守备"
 JAP_pacific_fortify_island_desc: "在当前可用的关键岛屿修筑一层海岸防御。"
 JAP_pacific_build_underground_works: "建设地下工事"
 JAP_pacific_build_underground_works_desc: "在硫磺岛、冲绳或马里亚纳修筑地下阵地。工程只能进行一次。"
 JAP_pacific_stockpile_island_supplies: "储备岛屿物资"
 JAP_pacific_stockpile_island_supplies_desc: "消耗运输船，把弹药、燃料和粮食提前送往一个关键岛屿，获得一百二十日后勤缓冲。"

 # 海上交通
 JAP_pacific_expand_convoy_transport: "扩大船团运输"
 JAP_pacific_expand_convoy_transport_desc: "投入工业资源扩建二十艘运输船并改进远洋补给组织。"
 JAP_pacific_southern_convoy_escort_decision: "强化南方船团护航"
 JAP_pacific_southern_convoy_escort_decision_desc: "为南方资源航线临时调集护航与反潜兵力。"
 JAP_pacific_strengthen_asw_watch: "加强反潜警戒"
 JAP_pacific_strengthen_asw_watch_desc: "强化声呐搜索、航线巡逻和护航协同。"
 JAP_pacific_disperse_convoys: "分散运输船团"
 JAP_pacific_disperse_convoys_desc: "缩小船团并分散航期，以牺牲少量航速换取更好的护航效率。"
 JAP_pacific_expand_oil_tanker_fleet: "扩大油轮船团"
 JAP_pacific_expand_oil_tanker_fleet_desc: "在完全控制荷属东印度后投入一百零五日建设油轮和装卸设施。"
 JAP_pacific_emergency_convoy_replacement: "紧急补充运输船"
 JAP_pacific_emergency_convoy_replacement_desc: "调动三座民用工厂，在四十五日内紧急补充三十艘运输船。"
 JAP_pacific_risky_sea_transport: "冒险实施海上输送"
 JAP_pacific_risky_sea_transport_desc: "选择一个被孤立或封锁的岛屿，以损失二十五艘运输船为代价暂时缓和补给。效果有限，且不会解除封锁。"

 # 南方资源
 JAP_pacific_develop_malaya_resources: "开发马来亚资源"
 JAP_pacific_develop_malaya_resources_desc: "实际控制相关地区后投入一百零五日开发橡胶、钨和交通。资源留在当地，并继续受到海上航路状态影响。"
 JAP_pacific_take_over_singapore_base: "接管新加坡海军基地"
 JAP_pacific_take_over_singapore_base_desc: "只有实际控制新加坡后，才能用九十日恢复海军基地和地方交通。"
 JAP_pacific_prepare_malacca_route: "整备马六甲航路"
 JAP_pacific_prepare_malacca_route_desc: "以新加坡为枢纽整理航路、港口和船团调度。"
 JAP_pacific_repair_dei_oilfields: "修复荷属东印度油田"
 JAP_pacific_repair_dei_oilfields_desc: "投入一百二十日修复苏门答腊、加里曼丹等地油田。§Y石油不会无条件传送至日本；航路吃紧或中断会大幅削减实际收益。§!"
 JAP_pacific_prepare_philippine_transfer_base: "整备菲律宾中转基地"
 JAP_pacific_prepare_philippine_transfer_base_desc: "在完全控制菲律宾后扩建港口与交通，使其成为南方航线和东进作战的中继。"
 JAP_pacific_expand_philippine_airbase: "扩建菲律宾航空基地"
 JAP_pacific_expand_philippine_airbase_desc: "扩建吕宋和中部菲律宾机场，为南方与新几内亚方向提供航空支援。"
 JAP_pacific_expand_southern_oil_transport: "扩大南方石油运输"
 JAP_pacific_expand_southern_oil_transport_desc: "要求同时控制荷属东印度、新加坡和菲律宾，并拥有充足运输船。南线养战争，东线赢战争。"

 # 战略应急
 JAP_pacific_evacuate_island_garrison: "紧急撤出孤岛守军"
 JAP_pacific_evacuate_island_garrison_desc: "从所选孤立岛屿撤回日本部队。§Y撤离行动的首要目标是保存人员。火炮、车辆及其他重装备将被大量遗弃。§!脚本会将守军送回本国，并以扣除国家装备库存近似10%—30%的装备保存率；完全封锁时无法精确逐师按装备类型结算。"
 JAP_pacific_airlift_island_supplies: "向孤岛紧急空运补给"
 JAP_pacific_airlift_island_supplies_desc: "要求运输机和附近可用机场。三十日内缓和补给与组织恢复惩罚，但不能解除海上孤立或完全封锁。"
 JAP_pacific_recall_combined_fleet: "紧急撤回联合舰队"
 JAP_pacific_recall_combined_fleet_desc: "在岛链崩溃或处于战略防御时，命令主力舰优先脱离战斗保存舰队。"

 # 太平洋占领措施
 JAP_pacific_establish_southern_military_administration: "建立南方军政机构"
 JAP_pacific_establish_southern_military_administration_desc: "在南方占领区建立统一军政行政，这是调整占领措施的基础。"
 JAP_pacific_expand_resource_collection: "扩大资源征集"
 JAP_pacific_expand_resource_collection_desc: "向直接征发方向推进一级：提高短期资源与工厂收益，同时增加抵抗和驻军成本并降低顺从增长。"
 JAP_pacific_requisition_local_transport: "征用当地运输工具"
 JAP_pacific_requisition_local_transport_desc: "征用船只和车辆，获得少量运输船，并把占领政策向直接征发方向推进一级。"
 JAP_pacific_support_local_collaborators: "扶植地方合作机构"
 JAP_pacific_support_local_collaborators_desc: "把占领政策向合作统治方向推进一级：短期收益下降，但抵抗、驻军需求和长期稳定改善。"
 JAP_pacific_expand_labour_requisition: "扩大劳务征用"
 JAP_pacific_expand_labour_requisition_desc: "从1941年后扩大强制劳务征集。它把政策推向直接征发，并造成稳定度损失。"
 JAP_pacific_restore_local_economy: "恢复地方经济活动"
 JAP_pacific_restore_local_economy_desc: "投入九十日和两座民用工厂恢复地方经济，把政策向合作统治方向推进一级。"
 JAP_pacific_moderate_occupation_policy: "缓和占领政策"
 JAP_pacific_moderate_occupation_policy_desc: "减少征发和军政干预，把高压政策向中间状态回调一级。"
