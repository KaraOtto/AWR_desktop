 CHI_corruption_system_tt: "§Y廉政制度化程度§!：[?Institutional_Integrity|0]/100\n三条进度条分别对应三集团的腐败存量，范围0%至100%；越高越容易发生腐败案件。\n\n人物在案件中遭到严厉处置、撤职，或在反腐国策中被清退时，自动登记真实头像与姓名。档案保存于人物被移除之前，改革结束后仍可查看。"
 CHI_corruption_army_tt: "§Y军队腐败§!\n当前存量：[?CHI_army_corruption|%1]\n月度增减：[?CHI_army_corruption_coefficient|%+1]\n严重程度：[GetCHIArmyCorruptionRisk]\n\n案件可能涉及军械走私、吃空饷、贪污军饷及海空军采购。"
 CHI_corruption_capital_tt: "§Y官僚资本腐败§!\n当前存量：[?CHI_capital_corruption|%1]\n月度增减：[?CHI_capital_corruption_coefficient|%+1]\n严重程度：[GetCHICapitalCorruptionRisk]\n\n反垄断改革完成后，本集团腐败存量与月度增长保持为零。"
 CHI_corruption_technocrat_tt: "§Y技术官僚腐败§!\n当前存量：[?CHI_technocrat_corruption|%1]\n月度增减：[?CHI_technocrat_corruption_coefficient|%+1]\n严重程度：[GetCHITechnocratCorruptionRisk]\n\n监察、审计与人员再教育可压低腐败存量。"
