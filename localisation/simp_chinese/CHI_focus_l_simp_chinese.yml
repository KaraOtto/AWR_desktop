#核心圈
  CHI_PEO: "党国核心集团"
  CHI_PEO_desc:0 "核心集团是一个国家的政治中心，负责领导和管理整个国家的运作。核心集团包括国家元首、政府、立法机构以及司法机构等核心部门。这些机构共同协作，行使国家的立法、行政和司法权力。" 
  CHI_chen_cheng1: "全国领导陈诚"
  CHI_chen_cheng1_desc:0 "‌陈诚的土木系在中央军中号称不吃空缺和适度接受下属意见，我们应该支持他们的发展。"
  CHI_chen_cheng2: "改良火炮" 
  CHI_chen_cheng2_desc:0 "‌陈诚是炮兵出身，对火炮十分了解，他将进行对旧式火炮的改进。"     
  CHI_chen_cheng3: "建立德式新军"
  CHI_chen_cheng3_desc:0 "‌德国军队的训练方式值得我们学习，陈诚将推进德式新军的建立。"
  CHI_jiang_jingguo1: "全国领导蒋经国"
  CHI_jiang_jingguo1_desc:0 "‌蒋委员长之子蒋经国从苏联留学归来，似乎其父有意培养他，使他逐渐进入权力中心。"      
  CHI_jiang_jingguo2: "减租减息"
  CHI_jiang_jingguo2_desc:0 "‌蒋经国提出要实行减租减息以减轻农民的负担，当然党内很多反对这一激进的改革。"    
  CHI_jiang_jingguo3: "实行新政"
  CHI_jiang_jingguo3_desc:0 "‌蒋经国主政赣南，他在此地大刀阔斧查禁烟赌娼，修明吏治，发展经济，兴办教育。"  
  CHI_chen_guofu1: "全国领导陈果夫"
  CHI_chen_guofu1_desc:0 "陈果夫为蒋委员长所倚重，负责国民党内组织及党务，有“二陈”、“CC系”之称。"     
  CHI_chen_guofu2: "委员长至上"
  CHI_chen_guofu2_desc:0 "‌‌陈果夫对蒋委员长无比忠诚，对他的一切命令都解决执行。"   
  CHI_chen_guofu3: "忠于领袖"
  CHI_chen_guofu3_desc:0 "‌‌陈果夫提出在国民党内必须忠于领袖。"
  CHI_dai_li1: "全国领导戴笠"
  CHI_dai_li1_desc:0 "‌‌戴笠因得到蒋委员长的信任，长期从事特工与间谍工作。"    
  CHI_dai_li2: "隐蔽战线"
  CHI_dai_li2_desc:0 "‌戴笠的军统是国民党的一条隐蔽战线，在战争中将会发挥巨大作用。"     
  CHI_dai_li3: "捍卫党国"
  CHI_dai_li3_desc:0 "‌戴笠将会消灭一切危害党国安全的敌人。"
  CHI_he_yingqin1: "全国领导何应钦"
  CHI_he_yingqin1_desc:0 "何应钦在蒋委员长的领导下，从一名留日学生逐步成长为国军总司令，并在国民党内部具有极高的地位和影响力‌。"
  CHI_he_yingqin2: "国民革命军司令"
  CHI_he_yingqin2_desc:0 "‌我们将任命何应钦为国民革命军总司令，这将加强他在军队中的影响力。"     
  CHI_he_yingqin3: "党国之军"
  CHI_he_yingqin3_desc:0 "‌一支坚决服从蒋委员长命令党国之军将在何应钦的领导下壮大起来。"
  CHI_song_ziwen1: "全国领导宋子文"
  CHI_song_ziwen1_desc:0 "宋子文，国民政府财政部长，蒋委员长的大舅哥‌，为其筹集经费，因此进入核心集团。"    
  CHI_song_ziwen2: "扩大外交部"
  CHI_song_ziwen2_desc:0 "宋子文将同时担任我们在国际上的外交代表。"    
  CHI_song_ziwen3: "现代化外交"
  CHI_song_ziwen3_desc:0 "宋子文将代表国民政府实现中国的现代化外交。"
  CHI_kong_xiangxi1: "全国领导孔祥熙"
  CHI_kong_xiangxi1_desc: "‌孔祥熙，国民政府行政院长兼财政部长，孔子的第七十五世孙，蒋委员长的姐夫‌，并深受其信任。"
  CHI_kong_xiangxi2: "经济改革" 
  CHI_kong_xiangxi2_desc:0 "我们的经济体制已经落后于时代，现在是进行经济改革的时候了。"
  CHI_kong_xiangxi3: "促进市场"
  CHI_kong_xiangxi3_desc: "促进市场这种经济上的事交给孔祥熙去办，蒋委员长需要把精力放在军事上面。"
  CHI_PEO2:0 "亲爱精诚"  
  CHI_PEO2_desc:0 "孙总理核定“亲爱精诚”为黄埔军校校训，这是团结国民内共同革命的写照。蒋委员长曾对黄埔军校学生训话中阐述：“亲爱”是要所有的革命同志能“相亲相爱”，本校的宗旨“精”是“精益求精”，“诚”是“诚心诚意”。"  