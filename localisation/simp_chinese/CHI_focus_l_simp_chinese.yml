  CHI_introduction_of_aviation_design_desc: ""
  CHI_first_aircraft_factory_of_the_aviation_commission: "航委第一飞机制造厂"
  CHI_first_aircraft_factory_of_the_aviation_commission_desc: "为了研发新的飞行器，例如朱家仁少将构想的研驱-0战斗机，我们必须建设能够支撑并生产轻型战斗机和俯冲轰炸机的设施。理想的选址是昆明，但只要能造出能在空中与敌军抗衡的飞机，任何地方都行。"
  CHI_unified_aviation_industry_standards: "统一航空工业标准"
  CHI_unified_aviation_industry_standards_desc: ""
  CHI_improve_torpedoes: "改进鱼雷"
  CHI_improve_torpedoes_desc: ""
  CHI_central_aviation_academy_expansion: "扩建中央航空学校"
  CHI_central_aviation_academy_expansion_desc: ""
  CHI_master_the_sky: "掌控天空"
  CHI_master_the_sky_desc: "为了在空中与敌军抗衡，我们必须掌握空中作战的主动权。通过改进我们的战术和技术，我们可以确保我们的空军在未来的冲突中占据优势。"
  CHI_coordinate_with_the_army: "协同陆军"
  CHI_coordinate_with_the_army_desc: "空军和陆军之间的协同作战是现代战争中至关重要的一环。通过建立有效的沟通和协调机制，我们可以确保空军为陆军提供及时的支援，从而提高整体作战效率。"
  CHI_ranged_projectile_capability: "远程投射能力"
  CHI_ranged_projectile_capability_desc: "通过将空中力量投射至前线之外，我们已做好随时抓住机遇发起打击的准备。空中力量的远程投射，已不再是单纯的野心，而是战略上的必然要求。"
  CHI_establish_independent_air_force_command_system: "建立独立空军指挥系统"
  CHI_establish_independent_air_force_command_system_desc: ""
  CHI_value_the_locational_advantage: "重视方位优势"
  CHI_value_the_locational_advantage_desc: ""
  CHI_evade_the_solid_attack_the_hollow: "避实击虚"
  CHI_evade_the_solid_attack_the_hollow_desc: ""
  CHI_tianlong_project: "天龙计划"
  CHI_tianlong_project_desc: ""
  CHI_tiankong_project: "天空计划"
  CHI_tiankong_project_desc: ""
  CHI_yunnan_airborne_troops: "云南空降部队"
  CHI_yunnan_airborne_troops_desc: "通过与我们在航空领域的盟友和同僚合作，我们已经成功建立了国内军事伞降作战的训练体系。"
  CHI_air_modernization: "自铸长空"
  CHI_air_modernization_desc: ""
  CHI_nra_navy: "国民革命军海军"
  CHI_nra_navy_desc: "中央海军过去历经坎坷，资金匮乏与海防不稳致使舰船状况不佳。随着危机临近，我们必须把克服这些挑战提上日程。"
  CHI_expand_jiangnan_shipyard: "扩建江南造船厂"
  CHI_expand_jiangnan_shipyard_desc: ""
  CHI_mobile_operating_base: "机动作战基地"
  CHI_mobile_operating_base_desc: "正如世界其他国家所证明的，天空代表着战争的未来。然而我们的远程打击能力受限于地理条件。仿效列强的做法，我们必须把精力集中在机动打击平台上。"
  CHI_naval_area_defense_plan: "海军分防计划"
  CHI_naval_area_defense_plan_desc: "陈绍宽提出的《海军分防计划》，定下了在未来30年内建造至少十二艘航空母舰的目标。若要保卫我国海疆，我们就应采纳此议，并尽快开始打造航母舰队！"
  CHI_carrier_strike_group: "航母打击群"
  CHI_carrier_strike_group_desc: ""
  CHI_naval_preparation: "海军整备"
  CHI_naval_preparation_desc: ""
