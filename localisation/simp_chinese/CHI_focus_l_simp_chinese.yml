l_simp_chinese:
#训政线和军政线
  CHI_one_party_tutelage:0 "继续训政"
  CHI_one_party_tutelage_desc:0 "按照孙中山的原话，重建国家有三个阶段：第一阶段是军政，在北伐战争后结束；第二阶段是训政，只有在中国政治稳定之后才会结束；然后是最后一个阶段：宪政。中国目前的政治形势还远未稳定下来，应该继续实行训政。"

#科研线
  CHI_academia_sinica: "中央研究院"
  CHI_academia_sinica_desc: "中央研究院是中国的国家研究机构，成立于1928年。它的主要任务是促进科学研究和技术发展，为国家的经济和社会发展提供支持。"
  CHI_public_school_program:0 "公共教育计划"
  CHI_public_school_program_desc:0 "教育我们的学生是当务之急。由于识字率如此之低，我们必须让这个国家的儿童拥有更美好的未来。"
  CHI_higher_education_reorganization:0 "高等教育整顿"
  CHI_higher_education_reorganization_desc:0 "我们必须对我们的大学进行整顿，以确保它们能够为国家培养出最优秀的人才。"
  CHI_academy_rf:0 "改革中央研究院"
  CHI_academy_rf_desc:0 "与其他西方国家相比，我们的国家研究中心——中央研究院的效率仍然相当低。迫切需要进行大刀阔斧的改革。"
  CHI_wartime_scientific_mobilization:0 "战时科研动员"
  CHI_wartime_scientific_mobilization_desc:0 "为了应对即将到来的战争，我们必须动员我们的科学家和研究人员，集中他们的智慧和资源，以加快军事技术的发展。"
  CHI_joint_military_industrial_research_institute:0 "联合军工研究所"
  CHI_joint_military_industrial_research_institute_desc:0 "为了提高我们的军事技术，我们将建立一个联合军工研究所，汇集国内外的顶尖科学家和工程师，共同研发先进的武器和装备。"
  CHI_wartime_radio_research:0 "战时无线电研究"
  CHI_wartime_radio_research_desc:0 "无线电技术在现代战争中扮演着至关重要的角色。我们将专注于战时无线电研究，以确保我们的通信系统在战场上具有优势。"
  CHI_chemical_warfare_defense_research:0 "化学战防御研究"
  CHI_chemical_warfare_defense_research_desc:0 "化学武器的威胁日益增加，我们必须开展化学战防御研究，以保护我们的军队和民众免受化学攻击的伤害。"
  CHI_academy_ex:0 "扩大中央研究院"
  CHI_academy_ex_desc:0 "尽管进行了改革，我们实验室的规模仍然有限。扩大实验室可以提高我们的研究能力。"
  CHI_academy_ex_tt: "没有民族精神：§Y$iliterate_population_1$§!"
  CHI_postwar_research_planning:0 "战后科研规划"
  CHI_postwar_research_planning_desc:0 "为了确保我们在战后的科技优势，我们必须制定长期的科研规划，确保我们的研究成果能够持续推动国家的发展。"
#工业线
  CHI_the_end_of_the_golden_decade: "黄金十年的尾声"
  CHI_the_end_of_the_golden_decade_desc: "黄金十年即将结束，我们必须为未来的挑战做好准备。"
  CHI_government_bailout_focus:0 "政府救助"
  CHI_government_bailout_focus_desc:0 "[Root.GetName]的经济不稳定是一个系统性问题，如果我们卷入战争，它将受到更大的打击。我们将让专家们解决这些问题。"
  CHI_monetary_reform:0 "放弃银本位制"
  CHI_monetary_reform_desc:0 "由于1934年美国《白银收购法》的颁布，银本位制经济逐渐成为中国经济的负担。1935年底通过了一项币制改革，现在是实施改革的时候了。"
  CHI_local_tax_system_reorganization:0 "税制改革"
  CHI_local_tax_system_reorganization_desc:0 "为了确保我们在战争中具备足够的财政能力，我们必须对地方税制进行改革，优化税收结构，提高税收效率。"
  CHI_local_tax_system_reorganization_tt: "接下来将触发一系列有关§Y税制改革§!的事件"
  CHI_industrial_department: "实业部"
  CHI_industrial_department_desc: ""
  CHI_national_economi_construction_movement:0 "国家经济建设运动"
  CHI_national_economi_construction_movement_desc:0 "为了应对即将到来的战争，我们必须加强国家的经济建设，确保我们的工业和基础设施能够支持战争需求。"
  CHI_mineral_resource_control:0 "矿产资源统制"
  CHI_mineral_resource_control_desc:0 "为了确保我们在战争中拥有足够的资源，我们必须对矿产资源进行统制和管理，以防止资源浪费和流失。"
  CHI_industrial_concentration:0 "工业集中化"
  CHI_industrial_concentration_desc:0 "我们必须集中资源和力量，以提高工业生产效率，确保我们在战争中具备足够的工业能力。"
  CHI_central_geological_survey:0 "中央地质调查所"
  CHI_central_geological_survey_desc:0 "为了确保我们在战争中拥有足够的资源，我们必须建立中央地质调查所，负责勘探和评估全国的矿产资源储备。"
  CHI_professional_mining_administration:0 "矿政专业化"
  CHI_professional_mining_administration_desc:0 "为了确保我们在战争中拥有足够的资源，我们必须专业化矿政管理，建立专业的矿政机构，负责矿产资源的开发、管理和保护。"
  CHI_highway_administration:0 "公路总局"
  CHI_highway_administration_desc:0 "为了确保我们在战争中具备足够的运输能力，我们必须建立高效的公路管理系统，保障物资和人员的快速调动。"
  CHI_transport_control:0 "运输统制"
  CHI_transport_control_desc:0 "为了确保我们在战争中具备足够的运输能力，我们必须对运输资源进行统制和管理，确保物资和人员能够及时到达前线。"
  CHI_revitalization_of_light_industry:0 "振兴轻工业"
  CHI_revitalization_of_light_industry_desc:0 "为了确保我们在战争中具备足够的工业能力，我们必须振兴轻工业，发展纺织、食品加工等关键行业，以满足军民需求。"
  CHI_unified_purchase_and_sale:0 "统购统销"
  CHI_unified_purchase_and_sale_desc:0 "为了确保我们在战争中具备足够的工业能力，我们必须建立统一的采购和销售系统，优化资源分配，提高生产效率。"
  CHI_national_resources_commission:0 "资源委员会"
  CHI_national_resources_commission_desc:0 "迫在眉睫的战争意味着和平发展时代的即将终结。现在，时间就是一切。如果没有适当的准备，我们无法应对这场战争，我们将建立资源委员会来管理我们的工业发展。"
  CHI_heavy_industry_construction_plan:0 "重工业建设计划"
  CHI_heavy_industry_construction_plan_desc:0 "为了确保我们在战争中具备足够的工业能力，我们将制定并实施重工业建设计划，重点发展钢铁、机械、化工等关键行业。"
  CHI_ordnance_department:0 "军政部兵工署"
  CHI_ordnance_department_desc:0 "军政部兵工署负责管理中国的军事工业，包括武器和装备的生产。"
  CHI_ordnance_preparedness_layout:0 "兵工战备布局"
  CHI_ordnance_preparedness_layout_desc:0 "为了确保我们在战争中具备足够的军事工业能力，我们将制定兵工署的战备布局，优化生产线和资源分配。"
  CHI_production_control:0 "生产统制"
  CHI_production_control_desc:0 "为了确保我们在战争中具备足够的工业能力，我们必须对生产资源进行统制和管理，确保关键物资的优先生产和供应。"
  CHI_national_reconstruction_commission:0 "技官建委"
  CHI_national_reconstruction_commission_desc:0 "为了确保我们在战争中具备足够的工业能力，我们必须建立技官建委，负责管理国家的建设工作。"
  CHI_urban_planning:0 "城市规划"
  CHI_urban_planning_desc:0 "为了确保我们在战争中具备足够的工业能力，我们必须进行城市规划，优化城市布局，提高基础设施建设水平。"
  CHI_central_steel_works:0 "中央钢铁厂"
  CHI_central_steel_works_desc:0 "为了确保我们在战争中具备足够的工业能力，我们将建立中央钢铁厂，集中生产钢铁资源，满足军民需求。"
  CHI_machine_tool_self_sufficiency:0 "机床自给"
  CHI_machine_tool_self_sufficiency_desc:0 "为了确保我们在战争中具备足够的工业能力，我们必须实现机床自给，减少对外国技术和设备的依赖。"
  CHI_supply_chain_improvement:0 "完善供应链"
  CHI_supply_chain_improvement_desc:0 "为了确保我们在战争中具备足够的工业能力，我们必须完善供应链管理，优化原材料采购、生产和物流环节，提高整体效率。"
  CHI_arsenal_expansion:0 "兵工厂扩建"
  CHI_arsenal_expansion_desc:0 "为了确保我们在战争中具备足够的工业能力，我们将扩建兵工厂，提高武器和装备的生产能力。"
  CHI_completion_of_major_industrial_equipment:0 "重器初成"
  CHI_completion_of_major_industrial_equipment_desc:0 ""
  CHI_reconstruction_and_development:0 "重建与发展"
  CHI_reconstruction_and_development_desc:0 ""
  CHI_the_second_golden_decade:0 "再续黄金十年"
  CHI_the_second_golden_decade_desc:0 "我们必须抓住机会，迎接第二个黄金十年的到来，为国家的繁荣和发展奠定坚实的基础。"
#军事线
  CHI_reorganize_nra:0 "改组国民革命军"
  CHI_reorganize_nra_desc:0 "国民革命军曾经是中国军事实力的标竿，现在却既无能又可笑。我们必须努力使它恢复昔日的辉煌！"
