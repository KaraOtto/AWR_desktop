l_simp_chinese:
 AWR_SOV.1.t:0 "中方对东北的接管完成"
 AWR_SOV.1.desc:0 "经过与中国当局几个月的合作，我们在中国东北的占领当局终于回报称已基本达成，并将很快结束。 至少，中国终于可以从法西斯势力手中恢复其领土完整了。"
 AWR_SOV.1.a:0 "我们在那里的工作确实完结了。"

 AWR_SOV.2.t:0 "[From.GetName]请求东北贸易"
 AWR_SOV.2.d:0 "为了确保中国东北地区免受[WTT_current_china_leader.GetName]侵害，[From.GetName]相信[Root.GetName]与他们间的贸易将会有所帮助，因此[From.GetLeader]询问我们是否可以批准该计划。"
 AWR_SOV.2.a:0 "我们将帮助中国同志！"
 AWR_SOV.2.b:0 "别激怒[WTT_current_china_leader.GetName]。"

 AWR_SOV.3.t:0 "[From.GetName]同意东北贸易"
 AWR_SOV.3.d:0 "[From.GetName]已批准我们在东北地区进行贸易的请求，这应该有助于我们的战争准备。"
 AWR_SOV.3.a:0 "太好了！"

 AWR_SOV.4.t:0 "[From.GetName]拒绝"
 AWR_SOV.4.d:0 "[From.GetName]拒绝我方要求。"
 AWR_SOV.4.a:0 "明白了。"

 AWR_SOV.5.t:0 "中方开始接管中国东北"
 AWR_SOV.5.d:0 "现在，法西斯在东北的影响已被消除，我们在东北的使命终于完成了。 然而，中国两大政治势力都认为自己是接管该地区的唯一合法统治者。 也许我们唯一能做的就是帮助先来的一方。"
 AWR_SOV.5.a:0 "我想，就让他们自便吧。"

 AWR_SOV.6.t:0 "中共请求加入华约"
 AWR_SOV.6.desc:0 "现在，法西斯在东北的影响已被消除，我们在东北的使命终于完成了。 然而，中国两大政治势力都认为自己是接管该地区的唯一合法统治者。 也许我们唯一能做的就是帮助先来的一方。"
 AWR_SOV.6.a:0 "欢迎他们！"
 AWR_SOV.6.b:0 "我们还是和他们保持距离为妙……"

 AWR_SOV.7.t:0 "[FROM.GetNameDef]要求我们归还大连"
 AWR_SOV.7.desc:0 ""
 AWR_SOV.7.a:0 "当然没问题！"
 AWR_SOV.7.b:0 "想得美！"