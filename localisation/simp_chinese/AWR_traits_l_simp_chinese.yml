 CHI_veteran_of_central_plains_war: "中原大战老兵"
 CHI_veteran_of_central_plains_war_desc: "§L[ROOT.GetLeader]是中原大战的参战者之一。§!"

 shaoshuai: "少帅"
 shaoshuai_desc: "§L被称为“少帅”的张学良的处境颇为奇特。被日本人逐出满洲后，张和他的军队被降级到扫荡西北的中共叛乱分子，然而随着蒋介石的绥靖政策日益不受欢迎。自己的手下也日益不满...§!"
 shaoshuai_more: "少帅"
 shaoshuai_more_desc: "§L年轻的少帅做出了他一生中最重要的一次抉择......§!"
 budikang: "不抵抗将军"
 budikang_desc: "§L由于在1931年的九一八事变中对日本侵略者采取不抵抗政策导致东北四省迅速沦陷，张学良被冠以“不抵抗将军”的骂名。§!"
 XIC_hates_chiang: "对蒋不满"
 XIC_son_of_zhang_zuolin: "最后的东北军"
 XIC_son_of_zhang_zuolin_desc: "§L1928年奉系领袖张作霖在皇姑屯被谋杀，留下长子张学良作为东北军的唯一继承人。§!"
 jinshan_zongsiling: "晋陕绥边区总司令"
 jinshan_zongsiling_desc: "§L邓宝珊任晋陕绥边区总司令，多次到延安与共产党领导人会晤，赞同抗日民族统一战线政策。§!"

 YUN_king_of_yunnan: "云南王"
 YUN_king_of_yunnan_desc: "§L龙云在担任云南省主席期间，被誉为“云南王”。§!"
 YUN_king_of_yunnan2: "云南省主席"
 YUN_king_of_yunnan2_desc: "§L龙云被蒋介石解除军政大权后，卢汉任云南省主席兼保安司令。§!" 
 YUN_great_reformer: "伟大的改革家"
 YUN_great_reformer_desc: "§L龙云在云南的改革被证明是非常有效的，使他的省成为所有军阀中较为富裕的省份。§!"
 YUN_excavation_priorities: "开采矿业"
 YUN_excavation_priorities_desc: "§L龙云执政期间，云南锡矿、钨、锑、铜、盐、煤炭和许多其他资源的生产不断扩大。§!"
 YUN_infrastructure_builder: "建造公路"
 YUN_infrastructure_builder_desc: "§L他统治期间修建了许多公路，其中包括滇康路、川滇西路、云桂公路等。§!"
 YUN_cares_for_agriculture: "关爱农业"
 YUN_cares_for_agriculture_desc: "§L农村和农业部门看到云南省粮食充足，这得益于龙云实施的农业改革。§!"

 GXC_Acting_President: "中华民国代总统"
 GXC_Acting_President_desc: "§L由于前总统指挥不当，导致精锐主力部队大部被歼，中华民国面临覆灭命运，他被迫宣布下野。[ROOT.GetLeader]就任中华民国代总统。§!" 
 GXC_fuzongtong: "中华民国副总统"
 GXC_fuzongtong_desc: "§L行宪国民大会在南京举行，会议中宣布取消宪法中对总统权力的限制。大会选举[ROOT.GetLeader]为中华民国副总统。§!"  
 GXC_new_guangxi_clique: "钢铁军阀"
 GXC_new_guangxi_clique_desc: "§L1924年李宗仁控制广西后一直执政，他的统治似乎日益巩固。§!"
 GXC_guangxi_administrator: "高效管理者"
 GXC_guangxi_administrator_desc: "§L返回广西后，李宗仁将大部分时间用于管理广西内部政治，并取得了一定的成绩。§!"
 CHI_dislikes_chiang: "与蒋不和"
 CHI_dislikes_chiang_desc: "§L中原大战和蒋介石闹翻后，李宗仁、白崇禧在许多有关中国和政治的问题上与蒋介石发生了冲突。§!"
 GXC_nra_general: "才华横溢的将军"
 GXC_nra_general_desc: "§L北伐期间，新桂系的军队战胜吴佩孚、孙传芳，被称为“钢铁军”。§!"
 junzhengzhuanjia: "军政奇才"
 social_philosopher: "社会哲学家"

 sichuan_sheng: "四川省主席"
 sichuan_sheng_desc: "§L刘湘把刘文辉赶到西康后，成为了事实上的“四川王”。§!"
 chongqing_daxue: "重庆大学首任校长"
 chongqing_daxue_desc: "§L重庆大学为我们培养了很多人才。§!" 
 SIC_liu_xiang_rivalry: "刘湘-刘文辉之争"
 SIC_liu_xiang_rivalry_desc: "§L1935年刘文辉被刘湘驱逐出成都。家族斡旋达成和解后，刘湘控制了四川大部分地区。§!"
 bing_wei: "病危"
 bing_wei_desc: "§L刘湘的胃溃疡和糖尿病产生了并发症，现在情况不容乐观。§!"
 SIC_zongsiling: "第二十二集团军总司令"
 SIC_zongsiling_desc: "§L邓锡侯任第二十二集团军总司令，率部出川抗战。§!"  

 SND_questionable_allegiances: "可疑的效忠"
 SND_questionable_allegiances_desc: "§L1935年韩复榘成为日本人“以华治华”拉拢的目标之一。虽然他还没有倒向日本，但仍不知道他效忠于谁。§!"
 
 NXM_diabetes: "患有糖尿病"
 NXM_diabetes_desc: "§L马鸿逵尽管患有糖尿病，但非常喜欢吃冰淇淋。尽管这对他的健康毫无帮助，但他还是这么做了。§!"
 NXM_brutal_general: "宁夏王"
 NXM_brutal_general_desc: "§L马鸿逵的领导能力以对宁夏省的强势统治和统治过程中的残暴而著称。§!"

 XSM_king_of_qinghai: "青海王"
 XSM_king_of_qinghai_desc: "§L被誉为“青海王”的马步芳，在他的治理下，使青海省繁荣昌盛。§!"
 XSM_good_humored_and_jovial: "凶狠暴虐"
 XSM_good_humored_and_jovial_desc: "§L与马鸿逵相反，马步芳被认为是一个凶狠暴虐的人。§!"
 XSM_industrializer: "工业开发者"
 XSM_industrializer_desc: "§L马步芳所领导的工业化运动被美国学者评价为高效。§!"
 XSM_environment_protecter: "土地保护支持者"
 XSM_environment_protecter_desc: "§L马步芳为了通过出售木材获取资金，给各级政府机关、学校、农民下达了植树任务，甚至对擅自砍伐树木者进行了处决。§!"
 XSM_education_promoter: "推广教育"
 XSM_education_promoter_desc: "§L在他的统治下，教育比以往受到重视并且部分免费。§!"
 XSM_destroyer_of_tibetans: "西藏人的毁灭者"
 XSM_destroyer_of_tibetans_desc: "§L保卫青海抵御藏军入侵，使马步芳在军队中享有盛誉。§!"
 XSM_likeable_governor: "受人爱戴的总督"
 XSM_likeable_governor_desc: "§L1931年马麒去世后，一直担任总督。他的统治受到人民的普遍欢迎和拥护。§!"
 XSM_bufang_lin_conflict: "马麟-马步芳冲突"
 XSM_bufang_lin_conflict_desc: "§L马麟和侄子马步芳经常不和，互相看不顺眼。这导致了青海领导层的掣肘。§!"

 qi_bing: "骑兵第五师师长" 
 qi_bing_desc: "§L马步青1936年1月被授陆军中将，改任骑兵第五师师长。§!"

 shi_zhang: "国民革命军第三十五师师长"
 shi_zhang_desc: "§L马鸿宾任第三十五师师长，奉命率部堵击红军。§!" 
 EGM_renzheng: "施行仁政"

 GDC_heavenly_king_of_the_south: "南天王"
 GDC_heavenly_king_of_the_south_desc: "§L陈济棠及其在该地区的政策非常出色，因此他获得了“南天王”的绰号§!"
 GDC_promoted_public_education: "推广公共教育"
 GDC_promoted_public_education_desc: "§L陈济棠监督建立了许多机构并形成了公共教育体系。§!"
 GDC_liked_by_the_people: "深受广东人民喜爱"
 GDC_liked_by_the_people_desc: "§L陈的改革和统治令人满意，受到广东人民的普遍欢迎。§!"
 GDC_good_modernizer: "卓越的现代化者"
 GDC_good_modernizer_desc: "§L从1929年到1936年，陈为我省的发展壮大和现代化建设做出了巨大贡献。§!"
 GDC_xingyuan: "广州行辕主任"
 GDC_xingyuan_desc: "§L张发奎担任行辕主任，总揽华南军政大权。§!"
 GDC_xingyuan2: "战略顾问委员会委员"
 GDC_xingyuan2_desc: "§L张发奎调任战略顾问委员会委员，广州行辕改组为广州绥靖公署。（宋子文担任绥署主任兼广东省主席）§!"
 GDC_shangshanhu: "上山虎"
 GDC_shangshanhu_desc: "§L张发奎的作战风格和性格特点而来，他在战场上如上山的猛虎一般勇猛无畏。§!"
 suijing_gongshu: "广东绥靖公署主任"
 suijing_gongshu_desc: "§L1936年余汉谋被授陆军中将，任中央军校校务委员会委员，授陆军中将加上将衔任四路军总司令、广东绥靖公署主任。因此广东进入了余汉谋时代。§!"

 XIK_xikang_proponent: "西康倡导者"
 XIK_xikang_proponent_desc: "§L刘文辉被赶到西康后，成为西康省组建中的佼佼者。§!"
 XIK_independent_stance: "独立立场"
 XIK_independent_stance_desc: "§L由于刘文辉的独立立场，刘文辉与蒋介石的关系显着恶化。§!"
 XIK_liu_xiang_rivalry: "刘文辉-刘湘之争"
 XIK_liu_xiang_rivalry_desc: "§L1935年刘文辉被刘湘驱逐出成都。家族斡旋达成和解后，刘文辉控制了西康。§!"

 hebei_sheng: "河北省政府主席"
 hebei_sheng_desc: "§L宋哲元是河北省政府的主席，镇守着华北这一战略要地。§!"
 weiyuan_zhang: "冀察政务委员会委员长"
 weiyuan_zhang_desc: "§L冀察政务委员会，是国民政府向日本妥协而在华北建立的行政机构，宋哲元任委员长。§!"
 huo_guangong: "“活关公”"
 huo_guangong_desc: "§L在与日军的历次交锋中，张自忠英勇善战，使日本人又怕又敬，尊称为“活关公”。§!"
 chou_ri: "仇日情绪"
 chou_ri_desc: "§L该指挥官对日本侵略者带有极强的仇恨情绪。§!"

 cunzaizhuyi: "存在主义哲学家"
 cunzaizhuyi_desc: "§L我常说：存在就是一切，一切为了存在，联共是为了存在，剿共也是为了存在，存在即是真理！§!"

 fu_zuoyi_doctrine: "布衣将军"

 qin_gong: "亲近共产主义" 
 qin_gong_desc: "§L这位将军与共产主义者建立了友好关系。§!"

