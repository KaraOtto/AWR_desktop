l_simp_chinese:
 AWR_CHI.1000.t:0 "中共高层领导人张国焘前来投奔"
 AWR_CHI.1000.desc:0 "近日中共高层领导人张国焘趁国共两党共祭黄帝陵之机逃出了陕甘宁边区，并向我党代表蒋鼎文表达了脱离共党投奔我方的意愿。"
 AWR_CHI.1000.a:0 "弃暗投明，为时不晚！"
 AWR_CHI.1000.b:0 "这种叛徒无论到哪里都不会受到欢迎！"
 AWR_CHI.1001.t:0 "据称张学良与共产党停战"
 AWR_CHI.1001.desc:0 "据称，由于中央政府尚未证实的原因，张学良的东北军已与共产党军队达成了默许的停战协议。[CHI.GetLeader]已经决定访问西安，并与那里的官员会面，以澄清事情。"
 AWR_CHI.1001.a:0 "祝我们领袖好运！"
 AWR_CHI.1002.t:0 "[From.GetName]加入统一战线"
 AWR_CHI.1002.desc:0 "[From.GetName]已经选择加入[Root.GetFactionName]来对抗日本人。这对我们的战争工作有很大的帮助。分裂的我们什么也做不了，只有团结起来我们才能把侵略者赶出去！"
 AWR_CHI.1002.a:0 "我们将把所有日本鬼子赶出中国！"
 AWR_CHI.1003.t:0 "击退共产党民兵"
 AWR_CHI.1003.desc:0 "我们和东北军、马家军联合发起突袭给共匪带来了更大的打击。现在他们都逃走了，今天对中华民国来说是个好日子。"
 AWR_CHI.1003.a:0 "太好了！" 
 AWR_CHI.1004.t:0 "击退共产党民兵"
 AWR_CHI.1004.desc:0 "我军队遭到共产党军队的袭击。但是，我们给他们带来了更大的打击。现在他们都逃走了。我们在该地区的主导地位已得到恢复。今天对我军来说是个好日子。"
 AWR_CHI.1004.a:0 "太好了！"
 AWR_CHI.1005.t:0 "贵州投敌"
 AWR_CHI.1005.desc:0 "贵州的部队已经宣布投匪，与匪合作，当地政府机构也纷纷效彷，开始抓捕仍忠于我们的人。 这是最为严重的叛国行为！"
 AWR_CHI.1005.a:0 "我们必须粉碎他们！"



 AWR_CHI_state.1.t:0 "报告显示共产党与苏联占领当局正在 [From.From.GetName] 进行活动"
 AWR_CHI_state.1.desc:0 "最近有许多秘密报告表明，共产党一直在与 [From.From.GetName] 的苏联当局合作，削弱我们接管该地区的合法性。 共产党在那里的力量亦与日俱增。 这绝不可接受，须尽快采取措施以免为时已晚。"
 AWR_CHI_state.1.a:0 "共产党人一起合作，还真是「令人惊讶」啊。"
 AWR_CHI_state.2.t:0 "共产党势力在 [From.From.GetName] 发展茁壮"
 AWR_CHI_state.2.desc:0 "稍早有报告称，由于[SOV.GetNameDef]的帮助，共产党在[From.From.GetName]的势力已经发展到了无法控制的规模。 这是一个明确的信号，表明我们对这个问题的重视不足，它可能会危及我们的国家威信。 需要立刻采取行动，否则事情只会更加恶华。"
 AWR_CHI_state.2.a:0 "不可接受！"
 AWR_CHI_state.3.t:0 "我们的势力于 [From.From.GetName]发展茁壮"
 AWR_CHI_state.3.desc:0 "稍早有报告称，由于 [SOV.GetNameDef] 的帮助，我们在 [From.From.GetName] 中的影响力比以往任何时候都更大。 这是一个明确的信号，表明我们正走在正确的轨道上。 这也进一步证明我们的政府是中国唯一的合法政府。 中国的统一已不远了！"
 AWR_CHI_state.3.a:0 "太好了！"
 AWR_CHI_state.4.t:0 "共产党完全接管 [From.From.GetName]"
 AWR_CHI_state.4.desc:0 "稍早有报告称，共产党在[SOV.GetNameDef]的帮助下完全接管了[From.From.GetName]。 他们接管了该地区的军事和民事机构。 以这种速度，我们已无能为力挽救我们在那里的势力。 最好赶紧预防其他地区陷入同样的结局。"
 AWR_CHI_state.4.a:0 "最终我们将用武力夺回！"
 AWR_CHI_state.5.t:0 "完全接管[From.From.GetName]"
 AWR_CHI_state.5.desc:0 "稍早有报告称，我方的人员在[SOV.GetNameDef]的帮助下完全接管了[From.From.GetName]。 我们成功地控制了该地区的军事和民事机构。 以这种速度，我们的敌人已经无能为力挽救他们在那里的势力。这是中国历史上的伟大新页！"
 AWR_CHI_state.5.a:0 "好消息！"
 

 

 
