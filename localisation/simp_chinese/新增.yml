 #CHI_ideas
 CHI_army_corruption_0:0 "派系林立的军队"
 CHI_army_corruption_0_desc:0 "我们的军队因为内部派系林立和一些颠复分子的影响，造成了很多问题。如果我们想要将其转变为一个强大、具有战斗力的军队，我们必须要开始一个漫长且消耗许多预算的军队改革。"
 CHI_army_corruption_3:0 "无特种部队经验"
 CHI_army_corruption_3_desc:0 "我们的军队因为内部派系林立和一些颠复分子的影响，造成了很多问题。如果我们想要将其转变为一个强大、具有战斗力的军队，我们必须要开始一个漫长且消耗许多预算的军队改革。"
 CHI_superior_to_the_wrl_0:0 "中原大战胜利者"
 CHI_superior_to_the_wrl_0_desc:0 "尽管与外国军队相比，中央军队可能有些落伍、无能，但中原大战证明，军阀根本不是它的对手。"
 have_buff_against_wrls_000_tt:0 "§G对抗中国军阀时获得60%的攻击和防御加成。§! 此不包括@PRC§Y[PRC.GetName]§!和@EHB@MAN@ECA§Y日本傀儡政府§!在内。"
