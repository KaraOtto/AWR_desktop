 have_buff_against_wrls_2_tt:0 "§G对抗中国军阀时获得5%的攻击和防御加成。§! 此不包括@PRC§Y[PRC.GetName]§!和@EHB@MAN@ECA§Y日本傀儡政府§!在内。"
 CHI_prince_de_defect:0 "德王的背叛？"
 CHI_prince_de_defect_desc:0 "百灵庙蒙政会领导人德穆楚克栋鲁普亲王已经显露出叛变的迹象。也许我们应该做点什麽。\n§W--------------§!\n及时完成§Y拆分百灵庙蒙政会§!国策可能会阻止内蒙古的彻底背叛。"
 CHI_fractured_administration:0 "破碎的政府"
 CHI_fractured_administration_desc:0 "由于民国年幼，大多数行政政府机构还不够成熟，无法有效运作，而且由于国内问题和军阀割据的悬而未决，整体上处于分裂状态。 需要进行行政改革才能摆脱这种困境。"
 CHI_appeasement_policy:0 "绥靖政策"
 CHI_appeasement_policy_desc:0 "由于目前国内冲突不断，政府在处理日本问题时选择了不抵抗的绥靖政策。然而，中国国内很多团体已经表达了反对这一政策的声音，并呼吁停止内战。"
 CHI_chiang:0 "蒋氏独裁"
 CHI_chiang_desc:0 "尽管民国的开国元勛孙中山先生有民主的意愿，但由于国内仍在持续的内乱，蒋介石及其亲密盟友仍以强大的独裁统治中国。"
 CHI_chiang_better:0 "蒋氏独裁"
 CHI_chiang_better_desc:0 "尽管民国的开国元勋孙中山先生有民主的意愿，但蒋介石及其亲密盟友以强大的独裁统治中国。不过，这位领导人还是设法让人民相信他的权威。"
 CHI_nanking_decade_idea:0 "黄金十年"
 CHI_nanking_decade_idea_desc:0 "自北伐战争以来，中国一直在稳步发展。当中国受到攻击时，它将被中断。"
 CHI_nanfang:0 "南方八省游击队的影响"
 CHI_nanfang_desc:0 "§L共匪离开南方后,陈毅、项英、张鼎丞等人留在江西、福建、浙江、安徽、河南、湖北、湖南、广东八省一直坚持游击。后来逐步发展到赣粤边、闽赣边、闽西、闽粤边、皖浙赣边、浙南、闽北、闽东、闽中、鄂豫皖边、鄂豫边、湘鄂赣边、湘赣边、湘南、琼崖等15个地区都有他们的踪迹。我们现在的任务就是彻底剿灭他们，使政府可以彻底控制南方地区!§!"
 CHI_december_ninth_movement:0 "一二·九运动余波"
 CHI_december_ninth_movement_desc:0 "§L1935年12月9日，北平大中学生数千人举行了抗日救国示威游行，反对华北自治，反抗日本帝国主义，要求保全中国领土的完整，掀起全国抗日救国新高潮。§!"
 CHI_the_blueshirts:0 "[Root.GetBSorTPPYC]"
 CHI_the_blueshirts_desc:0 "[Root.GetBSorTPPYC]作为党内组织的意识形态团体起家，初期主要成员来自黄埔军校。 到 1930 年代，它的影响力扩展到军事和政治领域。\n\n但因为它的一些边缘成员表现，现今被担心在党内传递一些不健康的法西斯思想。"
 CHI_the_blueshirts_stronger:0 "[Root.GetBSorTPPYC]"
 CHI_the_blueshirts_stronger_desc:0 "[Root.GetBSorTPPYC]作为党内组织的意识形态团体起家，初期主要成员来自黄埔军校。 到 1930 年代，它的影响力扩展到军事和政治领域。\n\n但因为它的一些边缘成员表现，现今被担心在党内传递一些不健康的法西斯思想。\n\n尽管如此，由于中央领导人最近改变了党内政策，该政治团体的成员人数又出现了新一波暴增。"
 BSS_tt:0 "蓝衣社"
 TPPYC_tt:0 "三民主义青年团"
 Three_Principle_Youth_Corps_established:0 "§C蓝衣社§!被§Y三民主义青年团§!取代。"
 CHI_central_club:0 "中央俱乐部"
 CHI_central_club_desc:0 "中央俱乐部，又称CC系，是国民党内部管理党际事务的主要政治集团。\n\n陈立夫和他的兄弟陈果夫是其主要领导人，在国共两党分裂不久后成立，包括两人在内的许多成员在 1928 年帮助组建了国民党中央执行委员会。"
 CHI_central_club_stronger:0 "中央俱乐部"
 CHI_central_club_stronger_desc:0 "中央俱乐部，又称CC系，是国民党内部管理党际事务的主要政治集团。\n\n陈立夫和他的兄弟陈果夫是其主要领导人，在国共两党分裂不久后成立，包括两人在内的许多成员在 1928 年帮助组建了国民党中央执行委员会。"
 CHI_shanghai_ceasefire_agreement:0 "《淞沪停战协定》"
 CHI_shanghai_ceasefire_agreement_desc:0 "民国21年一·二八淞沪抗战结束后，中日双方在英、美、法、意等国调停下签订的停战协定，规定两军退回战前防区，双方交战区域上海至苏州、昆山一带为非武装地区。"
 CHI_he_umezu_agreement:0 "《何梅协定》"
 CHI_he_umezu_agreement_desc:0 "在日本对中国华北地区逐步蚕食的过程中，日本华北驻屯军司令官梅津美治郎与军事委员会北平分会代理委员长何应钦于民国24年达成协定，规定国民党机关与中央军撤出河北省并禁止一切反日活动。"
 CHI_huangpu:0 "黄埔系"
 CHI_huangpu_desc:0 "§L该派系影响力及效果。§!"
 CHI_tumu:0 "土木系"
 CHI_tumu_desc:0 "§L该派系影响力及效果。§!"
 CHI_zhengxue:0 "新政学系"
