 CHI_ccxi:0 "二陈系"
 CHI_ccxi_desc:0 "§L该派系影响力及效果。§!"
 CHI_zhongyang:0 "太子系"
 CHI_zhongyang_desc:0 "§L该派系影响力及效果。§!"
 CHI_german_advisorszz:0 "德国军事顾问团"
 CHI_german_advisorszz_desc:0 "由亚历山大·冯·法肯豪森率领的德国军事顾问团目前正被派驻中国以帮助国民革命军进行现代化军事改革。"
 CHI_shadow_of_tanggu:0 "塘沽之影"
 CHI_shadow_of_tanggu_desc:0 "1933年，东北进一步遭到日本侵略，我们又被迫签订了一个屈辱的不平等条约。虽然这可能给了政府带来了巩固力量的时间，但民众对此很不满意，并因此变得不信任我们。"

 #法案
 unstable_economy:0 "银本位经济"
 unstable_economy_desc:0 "白银一直是中国的主要货币形式，然而1934年美国的《白银购买法》却对中国银币造成了难以忍受的需求，中国的银本位经济因此受到了巨大打击。"
 has_taken_monetary_reform_decision_tt:0 "已执行 £decision_icon_small §H决议§!：§H币制改革§!。\n"