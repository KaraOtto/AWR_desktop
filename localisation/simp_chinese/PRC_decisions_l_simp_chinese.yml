 PRC_asian_liberation_category: "亚洲民族解放运动"
 PRC_asian_liberation_category_desc: "亚洲仍有许多民族处于殖民统治或外国支配之下。我们将通过宣传、资金、秘密联络以及有限的物资援助，帮助当地人民建立自己的民族解放力量。"

 PRC_support_asian_liberation: "支持[FROM.GetAdjective]民族解放运动"
 PRC_support_asian_liberation_desc: "我们将秘密扩大对[FROM.GetAdjective]民族运动的支援，通过宣传、资金、地下联络以及有限的物资援助帮助他们争取民族独立。然而，中国军队不会直接介入他们的独立战争。"

 PRC_middle_east_liberation_category: "中东民族解放运动"
 PRC_middle_east_liberation_category_desc: "殖民主义强权长期干涉中东事务。我们将帮助当地民族建立自主的政治与革命组织，使他们能够依靠自己的力量争取国家独立。"

 PRC_support_middle_east_liberation: "支持[FROM.GetAdjective]民族解放运动"
 PRC_support_middle_east_liberation_desc: "我们将扩大与[FROM.GetAdjective]民族运动之间的秘密联系，并向他们提供政治、经济与有限的物质援助。"

 PRC_african_liberation_category: "非洲民族解放运动"
 PRC_african_liberation_category_desc: "帝国主义列强仍然控制着非洲大片土地。通过帮助当地民族主义和革命组织建立地下网络，我们能够推动非洲殖民体系逐渐走向瓦解。"

 PRC_support_african_liberation: "支持[FROM.GetAdjective]民族解放运动"
 PRC_support_african_liberation_desc: "我们将通过秘密渠道支持[FROM.GetAdjective]人民反抗殖民统治，为当地民族组织提供宣传、资金和有限的物资援助。"

 PRC_latin_american_liberation_category: "拉丁美洲及加勒比民族解放运动"
 PRC_latin_american_liberation_category_desc: "在拉丁美洲与加勒比地区，殖民统治和外国支配仍未完全消失。中国愿意支持所有真正寻求民族独立的人民。"

 PRC_support_latin_american_liberation: "支持[FROM.GetAdjective]民族解放运动"
 PRC_support_latin_american_liberation_desc: "我们将秘密支持[FROM.GetAdjective]民族解放力量，帮助当地人民争取真正的政治独立。"

 PRC_oceanian_liberation_category: "大洋洲民族解放运动"
 PRC_oceanian_liberation_category_desc: "太平洋上的许多民族仍处于殖民帝国的统治之下。我们可以帮助当地人民建立民族政治组织和反殖民力量。"

 PRC_support_oceanian_liberation: "支持[FROM.GetAdjective]民族解放运动"
 PRC_support_oceanian_liberation_desc: "我们将向[FROM.GetAdjective]民族解放力量提供秘密政治、经济与物质援助。"

