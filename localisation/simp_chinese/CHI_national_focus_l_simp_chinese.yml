 CHI_chinese_general_staff: "国民政府参谋本部"
 CHI_chinese_general_staff_desc: "仿效德意志帝国建立总参谋部有助于帮助我们掌控军队，提高作战效率。"
 CHI_german_training_method: "德式训练法"
 CHI_german_training_method_desc: "德国军队看起来前途无量，我们应该跟随他们的脚步，在即将到来的冲突中变得同样强大。"
 CHI_axis_help_diplo_focus: "加强中德合作"
 CHI_axis_help_diplo_focus_desc: "随着法西斯运动在日本的兴起，我们必须加强与德国的联系，以免他们开始与我们敌人结盟。我们将派出孔祥熙代表我们国家与希特勒进行谈判。"
 CHI_befriend_with_soviet: "与苏联交好"
 CHI_befriend_with_soviet_desc: ""
 CHI_mission_to_the_soviet_union: "共产国际的支持"
 CHI_mission_to_the_soviet_union_desc: "我们必须向莫斯科派出一个值得信赖的共产主义小代表团，以进一步加强中苏关系，就像北伐战争时期一样。"
 CHI_sov_pact_focus: "中苏互不侵犯条约"
 CHI_sov_pact_focus_desc: "苏联正受到法西斯势力的威胁，我们也一样。为了打败法西斯杂种，我们一起共同合作似乎是顺理成章的。"
 CHI_purchase_tanks: "订购坦克"
 CHI_purchase_tanks_desc: "坦克作为现代战争的主角必须被引进。我们考虑引进一整条t26生产线来加强我们的国防实力。"
 CHI_the_soviet_volunteer_group: "苏联航空志愿队"
 CHI_the_soviet_volunteer_group_desc: "在抗日战争期间，苏联志愿航空队有200多名国际主义战士在中国大地上英勇牺牲，名字镌刻在南京抗日航空烈士纪念馆英烈碑上的共有236位。苏联志愿航空队有500多架飞机，800多名空地勤人员，在南京、上海、武汉、归德、广州、南海等地上空与日军进行多次空战，击毁日机数百架，击沉击伤日舰近百艘，并远征台湾，给日军以有力打击。此外，该航空队还为中国培养训练了一批飞行员。"
