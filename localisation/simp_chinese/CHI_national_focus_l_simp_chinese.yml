 CHI_Tibet_Ultimatum: "给西藏下最后通牒"
 CHI_Tibet_Ultimatum_desc: "西藏是个叛乱省份，而他们将“自愿”或以武力回到于我们的治理下。"
 CHI_renounce_the_mcmahon_line: "不承认麦克马洪线"
 CHI_renounce_the_mcmahon_line_desc: "是1914年西姆拉会议由英方代表威廉·亨利·麦克马洪（Henry McMahon）命名的，其依据英国探险家为英属印度测量时划的一条位于英属印度和中国的边界，表示单方面的侵占企图。中国政府从未承认过这样的线，并且严厉谴责这一卑鄙的小偷行为。"
 CHI_Demand_Outer_Mongolia: "声索外蒙古"
 CHI_Demand_Outer_Mongolia_desc: "《蒙苏议定书》是对中国领土完整的公然侵犯。在拒绝中国宗主权的情况下，我们宣布苏联和蒙古人违反了《恰克图条约》。因此，我们要求回到1911年以前的边界！"

