 # 内政与反腐
 CHI_solve_our_internal_problem: "解决我们的内部问题"
 CHI_solve_our_internal_problem_desc: "内部积弊需要长期改革。六种反腐方案互斥，选定一种后，将通过国策、审计和案件处置积累廉政制度化程度。"
 CHI_law_of_the_state_civil_servants: "国家公务员法"
 CHI_law_of_the_state_civil_servants_desc: "以职业规范和择优任用建立公务员制度，为民主监督奠定基础。廉政制度化程度+10。"
 CHI_establish_an_independent_supervisory_organ: "设立独立监察机关"
 CHI_establish_an_independent_supervisory_organ_desc: "建立独立监察机关。军队、官僚资本、技术官僚每120天各接受一次专项监察，案件依次处理。廉政制度化程度+20。"
 CHI_officials_property_and_interests_declaration: "官员财产与利益申报法"
 CHI_officials_property_and_interests_declaration_desc: "要求官员申报财产与利益关系，查明公职背后的私人利益。廉政制度化程度+15。"
 CHI_the_fourth_right: "保护举报人与新闻调查"
 CHI_the_fourth_right_desc: "保护举报人和新闻调查，将三集团专项监察周期缩短为90天。旧的120天监察任务取消，重新开始90天周期。廉政制度化程度+15。"
 CHI_the_republic_under_the_sun: "阳光下的共和国"
 CHI_the_republic_under_the_sun_desc: "当廉政制度化程度达到80、三集团腐败均低于25%后，让常设监督取代临时整肃。"
 CHI_separate_from_party_government_and_property: "党政财产分离"
 CHI_separate_from_party_government_and_property_desc: "划清党务、政府预算与公共财产的界限，建设社会主义反腐体系。廉政制度化程度+20。"
 CHI_public_procurement_transparency_act: "公共采购透明法"
 CHI_public_procurement_transparency_act_desc: "公开采购流程，让公共资金的用途接受社会监督。廉政制度化程度+15。"
 CHI_independent_auditing_of_state_owned_enterprises: "国营事业独立审计"
 CHI_independent_auditing_of_state_owned_enterprises_desc: "建立独立审计，防止国营事业成为少数人攫取利益的工具。廉政制度化程度+15。"
 CHI_anti_monopoly_law: "反垄断法"
 CHI_anti_monopoly_law_desc: "官僚资本影响力低于5%时，将其替换为民族资产阶级，并清零和关闭官僚资本腐败；稳定度-10%、政治点-150。廉政制度化程度+15。"
 CHI_interest_groups_are_publicly_registered: "利益集团公开登记"
 CHI_interest_groups_are_publicly_registered_desc: "公开登记利益集团，技术官僚影响力-5个百分点、民族资产阶级影响力+5个百分点；军队与技术官僚每90天各接受一次专项监察。廉政制度化程度+15。"
 CHI_clean_society: "廉洁社会"
 CHI_clean_society_desc: "廉政制度化程度达到80、三集团腐败均低于25%后，结束腐败机制。"
 CHI_crack_down_hard_on_corruption: "重拳惩治腐败"
 CHI_crack_down_hard_on_corruption_desc: "以严厉整肃形成震慑。启动300天专项行动，每50天依次查办三集团重度案件，共六案。认真处理专项案件，廉政制度化程度每案提高5点。廉政制度化程度+20。"
 CHI_comprehensive_coverage_of_supervision: "监察全面覆盖"
 CHI_comprehensive_coverage_of_supervision_desc: "将监察覆盖到各级公职人员，建立不能腐的制度约束。专项行动继续进行。廉政制度化程度+20。"
 CHI_promote_rectification_through_cases: "以案促改"
 CHI_promote_rectification_through_cases_desc: "复盘典型案件，修补制度漏洞。三集团腐败存量各降低30个百分点，并获得180天以案促改效果。廉政制度化程度+15。"
 CHI_integrity_education: "廉政教育"
 CHI_integrity_education_desc: "建立廉政教育制度，解锁军队与行政人员再教育。每次花费30政治点，教育至多三名不同人员，并提高5点廉政制度化程度。廉政制度化程度+15。"
 CHI_clear_officials_and_polotics: "干部清正，政治清明"
 CHI_clear_officials_and_polotics_desc: "廉政制度化程度达到90、三集团腐败均低于25%后，结束机制并清除在职人员的腐败与畏惧特质。"
 CHI_establish_central_onvestigation: "成立中央廉政调查局"
 CHI_establish_central_onvestigation_desc: "元首影响力高于30%时，成立直属中央的廉政机构。启动360天专项行动，原则上每22天查办一宗重度案件，共16案。廉政制度化程度+15。"
 CHI_comprehensive_inventory_of_official_assets: "官员财产全面清查"
 CHI_comprehensive_inventory_of_official_assets_desc: "在元首影响力超过各集团的条件下全面清查。三集团腐败存量各降低20个百分点。廉政制度化程度+15。"
 CHI_selective_anti_corruption: "选择性反腐"
 CHI_selective_anti_corruption_desc: "庇护与元首背景相同的集团，其余两集团腐败各降低25个百分点。受庇护集团的案件不能选择撤职清洗，仍可再教育或暂缓处理。廉政制度化程度+10。"
 CHI_rectify_government_procurement: "整顿政府采购"
 CHI_rectify_government_procurement_desc: "整顿采购并提高制度化程度，保留360天政府采购整顿措施。廉政制度化程度+25。"
 CHI_the_system_is_above_the_faction: "制度高于派系"
 CHI_the_system_is_above_the_faction_desc: "坚持全面清查的路线。需要廉政制度化程度达到80，三集团腐败存量各降低15个百分点。廉政制度化程度+15。"
 CHI_the_faction_is_above_the_system: "派系高于制度"
 CHI_the_faction_is_above_the_system_desc: "接受选择性反腐的政治交易。需要廉政制度化程度达到60，保留派系庇护下的剩余弊端。廉政制度化程度+10。"
 CHI_stop_anti_corruption: "结束特殊时期"
 CHI_stop_anti_corruption_desc: "结束特殊时期。全面清查路线需要制度化程度80及三集团腐败均低于25%；选择性反腐路线需要制度化程度60，保留对应的低危害性投机。"
 CHI_rectify_the_army: "整肃军队"
 CHI_rectify_the_army_desc: "清退具有腐败特质的军官，以稳定度、战争支持度和短期军事效率为代价整肃军队。廉政制度化程度+20。"
 CHI_take_over_the_control_institution: "接管监察院"
 CHI_take_over_the_control_institution_desc: "在军队清洗冲击结束后接管监察机构，以180天稳定措施恢复秩序。廉政制度化程度+20。"
 CHI_secret_investigation: "秘密调查"
 CHI_secret_investigation_desc: "局面稳定后解锁秘密调查官僚资本与技术官僚决议。每次30政治点，共享30天冷却；优先调查腐败顾问并排除白名单。报告确认后标记目标、制度化程度+5，两类各完成两次才能开始下一阶段。廉政制度化程度+20。"
 CHI_second_four_one_two: "第二次清党运动"
 CHI_second_four_one_two_desc: "两类秘密调查各完成两次后，清退具有腐败或已被军队盯上特质的行政顾问，以剧烈政治震动换取行政系统重组。廉政制度化程度+20。"
 CHI_restore_government_order: "恢复政府秩序"
 CHI_restore_government_order_desc: "待行政清洗与畏惧效应结束后，恢复政府正常运转。廉政制度化程度+20。"
 CHI_institutionalization_of_military_subsidies: "军队补贴制度化"
 CHI_institutionalization_of_military_subsidies_desc: "制度化程度达到80后结束随机腐败机制，保留军队补贴制度及其长期消费品成本。"
 CHI_leadership_integrity_order: "领袖廉政令"
 CHI_leadership_integrity_order_desc: "以领袖命令启动反腐，并以政治点与元首影响力承担初期代价。廉政制度化程度+20。"
 CHI_special_inspection_department: "特别监察总署"
 CHI_special_inspection_department_desc: "建立特别监察体系，随机追加一宗轻、中或重度案件。案件会等待当前案件办结后再触发。廉政制度化程度+20。"
 CHI_confiscate_the_assets_of_corrupt_officials: "没收贪官财产"
 CHI_confiscate_the_assets_of_corrupt_officials_desc: "没收贪官财产，用180天临时措施缓解财政和腐败压力。廉政制度化程度+20。"
 CHI_loyalty_means_intergrity: "忠诚即廉洁"
 CHI_loyalty_means_intergrity_desc: "从现役军官与行政顾问中，至多清退五名腐败者，并将至多五名清白者列入白名单。廉政制度化程度+20。"
 CHI_nation_above_all: "国家至上"
 CHI_nation_above_all_desc: "制度化程度达到80、三集团腐败均低于30%且完成规定等待期后，结束随机腐败机制。"

 # 训政与党务
 CHI_one_party_tutelage: "继续训政"
 CHI_one_party_tutelage_desc: "按照孙中山的原话，重建国家有三个阶段：第一阶段是军政，在北伐战争后结束；第二阶段是训政，只有在中国政治稳定之后才会结束；然后是最后一个阶段：宪政。中国目前的政治形势还远未稳定下来，应该继续实行训政。"
 CHI_fifth_plenary_session_of_the_second_KMT_central_committee: "国民党五届二中全会"
 CHI_fifth_plenary_session_of_the_second_KMT_central_committee_desc: ""
 CHI_reinforce_new_life_movement: "加强新生活运动"
 CHI_reinforce_new_life_movement_desc: "新生活运动是政府主导的促进文化改革和新儒家社会道德的公民运动。发起于1934年2月19日，作为反共运动的一部分。我们需要加强这场运动，以确保颠复组织不会将他们的错误信息传播给民众。"
 strengthen_cc: "加强中央俱乐部"
 strengthen_cc_desc: "中央俱乐部支持国民党的统治和训政。赋予他们管理国家的权力和影响力，反过来也将有利于我们的权威。"
 found_cbis: "成立中统局"
 found_cbis_desc: "党需要一个秘密情报机构来阻止针对国民党的颠复活动。通过重组中央俱乐部的影响力，创立一个官方组织，可以显着扩大国民党的势力范围。"
 strengthen_the_kmt: "强化国民党"
 strengthen_the_kmt_desc: "二陈兄弟领导下的中央执行委员会调查统计局(中统)运转顺畅，与此同时中央党务却变得不堪重负。 通过合并国民党中央执行委员会的一些部门，特别是交通部门和统计部门，扩大中统将是解决这个问题的一个很好的办法。"
 political_indoctrination: "政治教化"
 political_indoctrination_desc: "在这样的动荡时期，情报能力，尤其是反情报能力，变得尤为重要。 为实现这一目标，在党内建立情报网路以及在党的各个机构内建立坚实的电信和调查部门基础将是一个理想的解决方案。"
 CHI_establish_Youth_League_of_the_Three_Principles_of_the_People: "成立三民主义青年团"
 CHI_establish_Youth_League_of_the_Three_Principles_of_the_People_desc: ""
 CHI_unity_of_the_party_and_youth_league: "党团统一"
 CHI_unity_of_the_party_and_youth_league_desc: ""
 CHI_yi_dang_zhi_guo_focus: "以党治国"
 CHI_yi_dang_zhi_guo_focus_desc: "以党治国或简称党国，字面意思是利用政党来管理国家，孙中山先生明确指出，党国应成为中华民国在训政阶段的官方国策。"
 strengthen_bs: "强化复兴社"
 strengthen_bs_desc: "由于复兴社拥护民族主义和中国传统，同时也支持蒋介石的权威，它应该在很大程度被赋予权力和影响力来协助治理这个国家。"
 found_mbis: "成立军统局"
 found_mbis_desc: "随着外国势力的威胁日益迫近，重组[Root.GetBSorTPPYC]的影响力和和原秘密机构，组建一个新的特工部，将是间谍战的理想选择。"
 CHI_commando_unit_organization: "别动队编组"
 CHI_commando_unit_organization_desc: ""
 espionage_network: "间谍网"
 espionage_network_desc: "我们必须开始监视我们的人民，使我们政府能继续执政，我们还必须监视计划把我们赶下台的外国政府。"
 CHI_expand_the_influence_of_Blue_Shirt_Party: "扩大蓝衣社影响"
 CHI_expand_the_influence_of_Blue_Shirt_Party_desc: ""
 CHI_promote_leadership_reasons: "推行领袖原则"
 CHI_promote_leadership_reasons_desc: ""
 CHI_establish_paramilitary_youth_organizations: "建立准军事青年组织"
 CHI_establish_paramilitary_youth_organizations_desc: ""
 CHI_axis_help_party_focus: "蓝衣社发动政变"
 CHI_axis_help_party_focus_desc: "现在蓝衣社的声望比以往任何时候都大，蓝衣社应该发动政变，让我们的国家回到军政。 这很重要，因为明显的军阀割据和国内动荡仍在中国发生，这意味着中国还没有准备好接受训政。 蒋介石将被誉为中华民国的最高领袖，带领我们走向辉煌。"
 centralizing_power: "临时全国代表大会"
 centralizing_power_desc: "我们必须避免失去权力，并强迫人民效忠于我们，因为我们是中国唯一真正的政府。为了实现这一目标，我们必须召开一次特别的全国代表大会，以应对中国目前面临的危机。"
 CHI_constit_draft_focus: "宪法起草委员会"
 CHI_constit_draft_focus_desc: "我中华民国距离民主还有一段路要走，话虽如此，我们还是能向各党各派的政治家与知识分子乃至老百姓传达我们的愿景，让他们知道中国国民党不是一个独裁的政党，我们会先让党内志士依照孙总理的构想，来提出一个宪法的蓝图。可想而知，这部宪法草案不能让所有人满意，但我们有很多时间来讨论宪法的具体内容，毕竟民主应该严肃且谨慎地处理。"
 CHI_national_political_council_focus: "国民参政会"
 CHI_national_political_council_focus_desc: "日本的野心只增不减，我们必须预想一个可能与日本开战的未来，到时候乃我们中华民国与中华民族的存亡之秋，但就是这样的时刻提供给了我们一个团结一致对外的机会。我们会把握时机开设一个名为国民参政会的政治咨询机关，让支持我们的与反对我们的人都能一起把话讲开，同时接纳各方对当前宪法草案的意见，真正地让三民主义与五权宪法能够实现。"
 CHI_political_consultative_assembly_focus: "政治协商会议"
 CHI_political_consultative_assembly_focus_desc: ""
 CHI_constitution_focus: "制宪会议"
 CHI_constitution_focus_desc: ""
 CHI_prepare_for_constitionalization_focus: "为宪政做准备"
 CHI_prepare_for_constitionalization_focus_desc: ""

 # 三民主义与国家建设
 CHI_the_real_sanminism: "真正落实三民主义"
 CHI_the_real_sanminism_desc: ""
