 CHI_national_army_reorganization: "全国性陆军重组"
 CHI_national_army_reorganization_desc: "想要解决国军内部派系林立的问题，就得进行一场全国性的陆军重组。军队重组期间国军战斗力和国家稳定将大打折扣，期间务必保证局势稳定。"
