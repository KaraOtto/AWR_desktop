 # 党国核心集团
 CHI_PEO: "党国核心集团"
 CHI_PEO_desc: "核心集团是一个国家的政治中心，负责领导和管理整个国家的运作。核心集团包括国家元首、政府、立法机构以及司法机构等核心部门。这些机构共同协作，行使国家的立法、行政和司法权力。"
 CHI_chen_cheng1: "全国领导陈诚"
 CHI_chen_cheng1_desc: "‌陈诚的土木系在中央军中号称不吃空缺和适度接受下属意见，我们应该支持他们的发展。"
 CHI_chen_cheng2: "改良火炮"
 CHI_chen_cheng2_desc: "‌陈诚是炮兵出身，对火炮十分了解，他将进行对旧式火炮的改进。"
 CHI_chen_cheng3: "建立德式新军"
 CHI_chen_cheng3_desc: "‌德国军队的训练方式值得我们学习，陈诚将推进德式新军的建立。"
 CHI_jiang_jingguo1: "全国领导蒋经国"
 CHI_jiang_jingguo1_desc: "‌蒋委员长之子蒋经国从苏联留学归来，似乎其父有意培养他，使他逐渐进入权力中心。"
 CHI_jiang_jingguo2: "减租减息"
 CHI_jiang_jingguo2_desc: "‌蒋经国提出要实行减租减息以减轻农民的负担，当然党内很多反对这一激进的改革。"
 CHI_jiang_jingguo3: "实行新政"
 CHI_jiang_jingguo3_desc: "‌蒋经国主政赣南，他在此地大刀阔斧查禁烟赌娼，修明吏治，发展经济，兴办教育。"
 CHI_chen_guofu1: "全国领导陈果夫"
 CHI_chen_guofu1_desc: "陈果夫为蒋委员长所倚重，负责国民党内组织及党务，有“二陈”、“CC系”之称。"
 CHI_chen_guofu2: "委员长至上"
 CHI_chen_guofu2_desc: "‌‌陈果夫对蒋委员长无比忠诚，对他的一切命令都解决执行。"
 CHI_chen_guofu3: "忠于领袖"
 CHI_chen_guofu3_desc: "‌‌陈果夫提出在国民党内必须忠于领袖。"
 CHI_dai_li1: "全国领导戴笠"
 CHI_dai_li1_desc: "‌‌戴笠因得到蒋委员长的信任，长期从事特工与间谍工作。"
 CHI_dai_li2: "隐蔽战线"
 CHI_dai_li2_desc: "‌戴笠的军统是国民党的一条隐蔽战线，在战争中将会发挥巨大作用。"
 CHI_dai_li3: "捍卫党国"
 CHI_dai_li3_desc: "‌戴笠将会消灭一切危害党国安全的敌人。"
 CHI_he_yingqin1: "全国领导何应钦"
 CHI_he_yingqin1_desc: "何应钦在蒋委员长的领导下，从一名留日学生逐步成长为国军总司令，并在国民党内部具有极高的地位和影响力‌。"
 CHI_he_yingqin2: "国民革命军司令"
 CHI_he_yingqin2_desc: "‌我们将任命何应钦为国民革命军总司令，这将加强他在军队中的影响力。"
 CHI_he_yingqin3: "党国之军"
 CHI_he_yingqin3_desc: "‌一支坚决服从蒋委员长命令党国之军将在何应钦的领导下壮大起来。"
 CHI_song_ziwen1: "全国领导宋子文"
 CHI_song_ziwen1_desc: "宋子文，国民政府财政部长，蒋委员长的大舅哥‌，为其筹集经费，因此进入核心集团。"
 CHI_song_ziwen2: "扩大外交部"
 CHI_song_ziwen2_desc: "宋子文将同时担任我们在国际上的外交代表。"
 CHI_song_ziwen3: "现代化外交"
 CHI_song_ziwen3_desc: "宋子文将代表国民政府实现中国的现代化外交。"
 CHI_kong_xiangxi1: "全国领导孔祥熙"
 CHI_kong_xiangxi1_desc: "‌孔祥熙，国民政府行政院长兼财政部长，孔子的第七十五世孙，蒋委员长的姐夫‌，并深受其信任。"
 CHI_kong_xiangxi2: "经济改革"
 CHI_kong_xiangxi2_desc: "我们的经济体制已经落后于时代，现在是进行经济改革的时候了。"
 CHI_kong_xiangxi3: "促进市场"
 CHI_kong_xiangxi3_desc: "促进市场这种经济上的事交给孔祥熙去办，蒋委员长需要把精力放在军事上面。"
 CHI_PEO2: "亲爱精诚"
 CHI_PEO2_desc: "孙总理核定“亲爱精诚”为黄埔军校校训，这是团结国民内共同革命的写照。蒋委员长曾对黄埔军校学生训话中阐述：“亲爱”是要所有的革命同志能“相亲相爱”，本校的宗旨“精”是“精益求精”，“诚”是“诚心诚意”。"

 # 科研与教育
 CHI_academia_sinica: "中央研究院"
 CHI_academia_sinica_desc: "中央研究院是中国的国家研究机构，成立于1928年。它的主要任务是促进科学研究和技术发展，为国家的经济和社会发展提供支持。"
 CHI_public_school_program: "公立学校计划"
 CHI_public_school_program_desc: "教育我们的学生是当务之急。由于识字率如此之低，我们必须让这个国家的儿童拥有更美好的未来。"
 CHI_higher_education_reorganization: "高等教育整顿"
 CHI_higher_education_reorganization_desc: "我们必须对我们的大学进行整顿，以确保它们能够为国家培养出最优秀的人才。"
 CHI_academy_rf: "改革中央研究院"
 CHI_academy_rf_desc: "与其他西方国家相比，我们的国家研究中心——中央研究院的效率仍然相当低。迫切需要进行大刀阔斧的改革。"
 CHI_wartime_scientific_mobilization: "战时科研动员"
 CHI_wartime_scientific_mobilization_desc: "为了应对即将到来的战争，我们必须动员我们的科学家和研究人员，集中他们的智慧和资源，以加快军事技术的发展。"
 CHI_joint_military_industrial_research_institute: "联合军工研究所"
 CHI_joint_military_industrial_research_institute_desc: "为了提高我们的军事技术，我们将建立一个联合军工研究所，汇集国内外的顶尖科学家和工程师，共同研发先进的武器和装备。"
 CHI_wartime_radio_research: "战时无线电研究"
 CHI_wartime_radio_research_desc: "无线电技术在现代战争中扮演着至关重要的角色。我们将专注于战时无线电研究，以确保我们的通信系统在战场上具有优势。"
 CHI_chemical_warfare_defense_research: "化学战防御研究"
 CHI_chemical_warfare_defense_research_desc: "化学武器的威胁日益增加，我们必须开展化学战防御研究，以保护我们的军队和民众免受化学攻击的伤害。"
 CHI_academy_ex: "扩大中央研究院"
 CHI_academy_ex_desc: "尽管进行了改革，我们实验室的规模仍然有限。扩大实验室可以提高我们的研究能力。"
 CHI_postwar_research_planning: "战后科研规划"
 CHI_postwar_research_planning_desc: "为了确保我们在战后的科技优势，我们必须制定长期的科研规划，确保我们的研究成果能够持续推动国家的发展。"

 # 经济与工业
 CHI_the_end_of_the_golden_decade: "黄金十年的尾声"
 CHI_the_end_of_the_golden_decade_desc: "黄金十年即将结束，我们必须为未来的挑战做好准备。"
 CHI_government_bailout_focus: "政府救助"
 CHI_government_bailout_focus_desc: "[Root.GetName]的经济不稳定是一个系统性问题，如果我们卷入战争，它将受到更大的打击。我们将让专家们解决这些问题。"
 CHI_monetary_reform: "放弃银本位制"
 CHI_monetary_reform_desc: "由于1934年美国《白银收购法》的颁布，银本位制经济逐渐成为中国经济的负担。1935年底通过了一项币制改革，现在是实施改革的时候了。"
 CHI_local_tax_system_reorganization: "税制改革"
 CHI_local_tax_system_reorganization_desc: "为了确保我们在战争中具备足够的财政能力，我们必须对地方税制进行改革，优化税收结构，提高税收效率。"
 CHI_industrial_department: "实业部"
 CHI_industrial_department_desc: ""
 CHI_national_economi_construction_movement: "国民经济建设运动"
 CHI_national_economi_construction_movement_desc: "为了应对即将到来的战争，我们必须加强国家的经济建设，确保我们的工业和基础设施能够支持战争需求。"
 CHI_mineral_resource_control: "矿产资源统制"
 CHI_mineral_resource_control_desc: "为了确保我们在战争中拥有足够的资源，我们必须对矿产资源进行统制和管理，以防止资源浪费和流失。"
 CHI_industrial_concentration: "工业集中化"
 CHI_industrial_concentration_desc: "我们必须集中资源和力量，以提高工业生产效率，确保我们在战争中具备足够的工业能力。"
 CHI_central_geological_survey: "中央地质调查所"
 CHI_central_geological_survey_desc: "为了确保我们在战争中拥有足够的资源，我们必须建立中央地质调查所，负责勘探和评估全国的矿产资源储备。"
 CHI_professional_mining_administration: "矿政专业化"
 CHI_professional_mining_administration_desc: "为了确保我们在战争中拥有足够的资源，我们必须专业化矿政管理，建立专业的矿政机构，负责矿产资源的开发、管理和保护。"
 CHI_highway_administration: "公路总局"
 CHI_highway_administration_desc: "为了确保我们在战争中具备足够的运输能力，我们必须建立高效的公路管理系统，保障物资和人员的快速调动。"
 CHI_transport_control: "运输统制"
 CHI_transport_control_desc: "为了确保我们在战争中具备足够的运输能力，我们必须对运输资源进行统制和管理，确保物资和人员能够及时到达前线。"
 CHI_revitalization_of_light_industry: "振兴轻工业"
 CHI_revitalization_of_light_industry_desc: "为了确保我们在战争中具备足够的工业能力，我们必须振兴轻工业，发展纺织、食品加工等关键行业，以满足军民需求。"
 CHI_unified_purchase_and_sale: "统购统销"
 CHI_unified_purchase_and_sale_desc: "为了确保我们在战争中具备足够的工业能力，我们必须建立统一的采购和销售系统，优化资源分配，提高生产效率。"
 CHI_national_resources_commission: "国家资源委员会"
 CHI_national_resources_commission_desc: "迫在眉睫的战争意味着和平发展时代的即将终结。现在，时间就是一切。如果没有适当的准备，我们无法应对这场战争，我们将建立资源委员会来管理我们的工业发展。"
 CHI_heavy_industry_construction_plan: "重工业建设计划"
 CHI_heavy_industry_construction_plan_desc: "为了确保我们在战争中具备足够的工业能力，我们将制定并实施重工业建设计划，重点发展钢铁、机械、化工等关键行业。"
 CHI_ordnance_department: "军政部兵工署"
 CHI_ordnance_department_desc: "军政部兵工署负责管理中国的军事工业，包括武器和装备的生产。"
 CHI_ordnance_preparedness_layout: "兵工战备布局"
 CHI_ordnance_preparedness_layout_desc: "为了确保我们在战争中具备足够的军事工业能力，我们将制定兵工署的战备布局，优化生产线和资源分配。"
 CHI_production_control: "生产统制"
 CHI_production_control_desc: "为了确保我们在战争中具备足够的工业能力，我们必须对生产资源进行统制和管理，确保关键物资的优先生产和供应。"
 CHI_national_reconstruction_commission: "技官建委"
 CHI_national_reconstruction_commission_desc: "为了确保我们在战争中具备足够的工业能力，我们必须建立技官建委，负责管理国家的建设工作。"
 CHI_urban_planning: "城市规划"
 CHI_urban_planning_desc: "为了确保我们在战争中具备足够的工业能力，我们必须进行城市规划，优化城市布局，提高基础设施建设水平。"
 CHI_central_steel_works: "中央钢铁厂"
 CHI_central_steel_works_desc: "为了确保我们在战争中具备足够的工业能力，我们将建立中央钢铁厂，集中生产钢铁资源，满足军民需求。"
 CHI_machine_tool_self_sufficiency: "机床自给"
 CHI_machine_tool_self_sufficiency_desc: "为了确保我们在战争中具备足够的工业能力，我们必须实现机床自给，减少对外国技术和设备的依赖。"
 CHI_supply_chain_improvement: "完善供应链"
 CHI_supply_chain_improvement_desc: "为了确保我们在战争中具备足够的工业能力，我们必须完善供应链管理，优化原材料采购、生产和物流环节，提高整体效率。"
 CHI_arsenal_expansion: "兵工厂扩建"
 CHI_arsenal_expansion_desc: "为了确保我们在战争中具备足够的工业能力，我们将扩建兵工厂，提高武器和装备的生产能力。"
 CHI_completion_of_major_industrial_equipment: "重器初成"
 CHI_completion_of_major_industrial_equipment_desc: ""
 CHI_reconstruction_and_development: "重建与发展"
 CHI_reconstruction_and_development_desc: ""
 CHI_the_second_golden_decade: "再续黄金十年"
 CHI_the_second_golden_decade_desc: "我们必须抓住机会，迎接第二个黄金十年的到来，为国家的繁荣和发展奠定坚实的基础。"

 # 军事建设
 CHI_reorganize_nra: "改组国民革命军"
 CHI_reorganize_nra_desc: "国民革命军曾经是中国军事实力的标竿，现在却既无能又可笑。我们必须努力使它恢复昔日的辉煌！"
