 CHI_lend_lease_act: "租借法案"
 CHI_lend_lease_act_desc: ""
 CHI_allies_help_diplo_focus: "新平等条约"
 CHI_allies_help_diplo_focus_desc: "在经历了近一个世纪的不平等条约之后，美国和大英帝国现在终于可以重新谈判我们的贸易协定了。一旦条约签署，我们最终可以发展成一个健康的经济体。"
 CHI_invite_the_flying_tigers: "飞虎队"
 CHI_invite_the_flying_tigers_desc: "1940年8月，中国航空委员会顾问陈纳德受重庆国民政府委派，通过《租借法案》在美采购100架P-40战斗机并招募110名飞行员。1941年8月1日正式成立于昆明巫家坝机场，陈纳德任准将大队长，下辖3个战斗中队。1941年12月20日，该队在昆明首次迎击日军空袭，击落敌机9架；云南省政府主席龙云在庆功会上称其为“空中飞虎”，经媒体广泛报道后得名“飞虎队”。1942年7月后由美国驻中国航空特遣队，负责为“驼峰航线”护航并打击日军运输线。1943年3月扩编为美国陆军第14航空队，参与空袭日军基地及配合轰炸日本本土等任务。"
