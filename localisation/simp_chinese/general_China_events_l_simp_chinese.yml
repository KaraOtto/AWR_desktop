l_simp_chinese:
 AWR_general_China.1.t:0 "[From.GetName]要求归还领土"
 AWR_general_China.1.d:0 "新的中国政府要求我们立刻归还香港，否则“我们可以现在就用别的方式决定这块区域的归属权。”政府的有关部门正在召开紧急会议，而中国军队现在也在该地区进行部署。"
 AWR_general_China.1.a:0 "我们的终究是我们的！"
 AWR_general_China.1.b:0 "如他们所愿。"

 AWR_general_China.2.t:0 "[From.GetName]拒绝"
 AWR_general_China.2.d:0 "愚蠢的[From.GetName]拒绝了我们的要求，短时间内我们无法再与对方就相关问题进行协商。但是现在就宣战必然也会与对方的盟友交上火。我们应该如何响应？"
 AWR_general_China.2.a:0 "做好进攻准备！"
 AWR_general_China.2.b:0 "放弃吧……"

 AWR_general_China.3.t:0 "[From.GetName]同意"
 AWR_general_China.3.d:0 "[From.GetName]在几天前同意了我们的要求，他们的军队开始撤军，而我们的军队很快就会进驻。"
 AWR_general_China.3.a:0 "好极了！"