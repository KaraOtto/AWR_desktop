l_simp_chinese:
 AWR_general_China.1.t:0 "[From.GetName]要求归还领土"
 AWR_general_China.1.desc:0 "新的中国政府要求我们立刻归还香港，否则“我们可以现在就用别的方式决定这块区域的归属权。”政府的有关部门正在召开紧急会议，而中国军队现在也在该地区进行部署。"
 AWR_general_China.1.a:0 "我们的终究是我们的！"
 AWR_general_China.1.b:0 "如他们所愿。"

 AWR_general_China.2.t:0 "[From.GetName]拒绝"
 AWR_general_China.2.desc:0 "愚蠢的[From.GetName]拒绝了我们的要求，短时间内我们无法再与对方就相关问题进行协商。但是现在就宣战必然也会与对方的盟友交上火。我们应该如何响应？"
 AWR_general_China.2.a:0 "做好进攻准备！"
 AWR_general_China.2.b:0 "放弃吧……"

 AWR_general_China.3.t:0 "[From.GetName]同意"
 AWR_general_China.3.desc:0 "[From.GetName]在几天前同意了我们的要求，他们的军队开始撤军，而我们的军队很快就会进驻。"
 AWR_general_China.3.a:0 "好极了！"
 
 AWR_general_China.4.t:0 "中国政府否认麦克马洪线"
 AWR_general_China.4.desc:0 "中国政府在国际上给我国施加了巨大的政治压力，他们否认麦克马洪线，并且要求我们归还"非法"侵占的领土。"
 AWR_general_China.4.a:0 "守不住的土地不如交出去。"
 AWR_general_China.4.b:0 "这里是印度的领土！"

 AWR_general_China.5.t:0 "中国政府否认麦克马洪线"
 AWR_general_China.5_d:0 "中国政府在国际上给我国施加了巨大的政治压力，他们否认麦克马洪线，并且要求我们归还"非法"侵占的领土。"
 AWR_general_China.5.a:0 "中国的军事实力不容小觑，我们不得不做出让步归还领土。"
 AWR_general_China.5.b:0 "他们以为我们会就此屈服吗？放马过来吧！"

 AWR_general_China.6.t:0 "[FROM.GetAdjective]同意归还藏南地区"
 AWR_general_China.6.desc:0 "鉴于[FROM.GetAdjective]本身孤立无援的国际环境，他们已经同意了我国否认麦克马洪线的要求。"
 AWR_general_China.6.a:0 "算他们有自知之明"

 AWR_general_China.7.t:0 "[FROM.GetAdjective]拒绝归还藏南地区"
 AWR_general_China.7.desc:0 "谈判过程中，[FROM.GetAdjective]代表团的谈判人员对我们否认麦克马洪线的要求不屑一顾，声称这绝无继续谈判的可能。"
 AWR_general_China.7.a:0 "君子报仇，十年不晚......"
 AWR_general_China.7.b:0 "他们难道还以为中国是那个“东亚病夫”吗？"

 AWR_general_China.8.t:0 "[From.GetName]索要蒙古"
 AWR_general_China.8.desc:0 "[From.GetName]称自古以来蒙古就是[From.GetName]的固有领土，他们要去我们应当立即归还他们的土地。他们的军队已经部署在了边境在线，如果我们拒绝他们的要求，那么他们肯定会发起进攻。"
 AWR_general_China.8.a:0 "这里也是自古以来便是我们的土地！"
 AWR_general_China.8.b:0 "如他们所愿。"

 AWR_general_China.9.t:0 "[From.GetName]拒绝"
 AWR_general_China.9.desc:0 "愚蠢的[From.GetName]拒绝了我们的要求，短时间内我们无法再与对方就相关问题进行协商。前线的部队已经准备好了，而我们应该如何响应？"
 AWR_general_China.9.a:0 "进攻！"
 AWR_general_China.9.b:0 "让我们先撤回来……"

 AWR_general_China.10.t:0 "[From.GetName]接受了"
 AWR_general_China.10.desc:0 "[From.GetName]在几天前同意了我们的要求，他们的政府很快就会解散，我们很快就会入驻。"
 AWR_general_China.10.a:0 "很好！"