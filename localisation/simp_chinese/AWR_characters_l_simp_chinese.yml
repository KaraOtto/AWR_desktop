 CHI_character:0 "中华民国顾问"
 CHI_chiang_kai_shek:0 "蒋中正"
 POLITICS_CHIANG_KAISHEK_DESC:0 "蒋中正委员长无疑是一位掌控国民党和中华民国的有实力的政治家。自参加辛亥革命后，他在中国共和运动中迅速崛起，并成为孙中山的追随者。孙中山死后，蒋中正利用廖仲恺、胡汉民、汪精卫之间的权力斗争，在广州政变（即三二〇事件，中山舰事件）中罢免了汪精卫，引发了后续两人间的竞争。夺取政权后，他领导国民党发起北伐战争。北伐途中，他对中国共产党的清洗显示了他的反共立场。在国民党统一全国之后，蒋中正带给了中国一个经济相对稳定和工业发展起步的时代。"
 CHI_chiang_kai_shek_desc:0 "§Y生卒年：§L\n生于：1887年10月31日 浙江溪口\n卒于：1975年4月5日 台湾台北\n§Y母校：§L\n通国速成学堂\n东京振武学校\n§Y军阶：§L\n1935年4月1日 特级上将\n§Y军旅生涯：§L\n1925-1927 第一军军长\n1926-1929 北伐军总司令\n1932-1946 军事委员会委员长\n1932-1935 参谋总长\n1937 第一战区司令长官\n1937~1938 第三战区司令长官\n1938 第八战区司令长官"
 CHI_wangjingwei:0 "汪精卫"
 CHI_wangjingwei_desc:0 "汪精卫（1883年5月4日-1944年11月10日），名兆铭，祖籍浙江山阴（原绍兴县），出生于广东三水，字季新。早年投身革命，曾谋刺清摄政王载沣未遂，袁世凯统治时期到法国留学。回国后于1919年在孙中山领导下，驻上海创办《建设》杂志。1921年孙中山在广州就任非常大总统，汪精卫任广东省教育会长、广东政府顾问。1924年任中央宣传部长。1926年1月在国民党“二大”上当选为中央执行委员会常务委员会委员。“中山舰事件”发生后，被迫辞职，出走法国。汪精卫于1927年2月下旬离开法国，乘火车经苏联归国。在汪精卫途径莫斯科时，斯大林专门接见了这位国民党左派领袖。4月归国，任武汉国民政府主席，一度与叛变革命的蒋介石进行争权斗争。4月5日，汪陈两人一起联名发表了一份《国共两党领袖汪兆铭、陈独秀联合宣言》，4月18日，南京的国民政府成立，蒋介石邀请国民党中的老牌反共分子胡汉民出任国民政府主席，蒋介石自己任中央军委主席和国民革命军总司令，国民党公开分裂成“汉”“宁”两个政府。7月15日在武汉实行“分共”，与蒋合流，但随后仍一直与蒋明争暗斗，蒋介石和胡汉民均已下野，汪精卫也于9月13日通电下野，12月16日发表了引退政界的声明，和陈璧君一起前往法国。1929年回国后，以“中国国民党第二届中央执监委员联席会议”的名义发布命令，对各路“护党救国军”发出委任状和番号。1931年元旦汪精卫在天津发表下野声明，在汪精卫的主持下，于5月28日成立了广州国民政府，否认南京国民政府的合法性。“九一八”事变，完全改变了中国历史的进程。蒋介石迫于形势，将软禁的胡汉民释放，并派蔡元培、张继携带他写给汪精卫的亲笔信赴广州议和。在南京召开四届一中全会，重组国民政府，广州政府随即取消。历任国民党中央特别委员会委员、国民政府委员、行政院院长兼外交部长、国防最高会议副主席、国民党副总裁等职。"
 CHI_huang_qixiang:0 "黄琪翔"
 CHI_huang_qixiang_desc:0 "黄琪翔（1898年9月2日～1970年12月10日），字御行，广东梅县人，北伐、抗日名将，国民党陆军上将，毕业于保定陆军军官学校，1924年加入中国国民党。曾任国民革命军第四军军长、第八集团军总司令、国民政府军委会政治部副部长、军训部次长，第十一集团军总司令，第六战区副司令长官、中国远征军副司令长官，国民政府驻德国军事代表团团长，中国农工民主党第二届中央委员会主席（中央临时执行委员会总书记）、中南军政委员会委员兼司法部长、国家体委副主任，全国政协常委等职。\n黄琪翔是中国民主革命家、政治家、军事家、中国农工民主党创建人和领导人之一。黄琪翔是保定军校第六期炮兵科毕业生，曾任该校分队长，培养出一批著名将领，后在东征和北伐战争中屡获功勋，与叶挺并称为“北伐双杰”。北伐期间，黄琪翔与周恩来、叶剑英、汪精卫同时被誉为“中国四大美男子”。\n北伐战争期间黄琪翔率部在平江、汀泗桥、马回岭、上蔡、临颖等战斗中屡建奇功，被称为北伐名将；在抗日战争中参与指挥过淞沪会战、枣宜会战、滇西缅北战役等战役。抗战胜利后，鉴于黄琪翔在抗战中的特殊功勋，他获得中美两国政府的最高荣誉。国民政府授予他“抗战胜利勋章”和国民政府最高荣誉“青天白日勋章”；美国政府授予他代表最高荣誉的“总统自由勋章”。\n§R黄琪翔不支持与中国共产党的内战§!"
 CHI_chen_yi:0 "陈仪"
 CHI_chen_yi_desc:0 "陈仪（1883.5.3-1950.6.18），字公侠，又字公洽，号退素，浙江绍兴人，陆军二级上将。"
 CHI_fang_xianjue:0 "方先觉"
 CHI_fang_xianjue_desc:0 "方先觉（1905-1983），字子珊，江苏省徐州府萧县人。陆军中将。"
 CHI_sun_yuanliang:0 "孙元良"
 CHI_sun_yuanliang_desc:0 "孙元良（1904.1-2007.5.25），原籍浙江绍兴，生于四川成都华阳，黄埔军校一期生。"
 CHI_ariani_li:0 "阿里亚尼·李"
 CHI_ariani_li_desc:0 "§L阿丽亚妮·李是第十三军参谋李保堂少将的女儿，也是该军唯一的女上校。她的祖父李家敖1923年担任中国驻苏联特使，其子李少将在那里结识并娶了一位俄罗斯姑娘。§!"
 CHI_xu_fulin:0 "徐傅霖"
 CHI_xu_fulin_desc: "徐傅霖，字梦岩，广东和平人。他早年留学日本早稻田大学，获法学博士学位，并于1905年加入同盟会，是辛亥革命和民国肇建的参与者，曾任第一届国会众议员、护法军政府司法部部长等职。"
 CHI_lin_sen:0 "林森"
 CHI_lin_sen_desc:0 "林森，1868年生，反清革命家、国民党海外组织者、议员。 孙中山逝世后的一段时间里，他是右倾反对蒋介石的。 1932年起获颁中华民国大总统荣誉称号。\n\n曾被时代杂誌称为「中国傀儡总统」，许多人认为他只是政府内部的「傀儡」。 尽管如此，他仍然被尊为国家元老。"
 CHI_sun_fo:0 "孙科"
 CHI_sun_fo_desc:0 "国父之子孙科为上海交通大学校长，创办理学院。 他被认为是一位在国内推动行政和教育改革的绅士。"
 CHI_ju_zheng:0 "居正"
 CHI_ju_zheng_desc:0 "1876年11月8日出生于湖北黄州，字觉生。\n\n1907年，居正在日本日本大学攻读法律期间，加入了孙中山创立中国革命同盟会。\n\n他是 1925 年孙中山去世后成立的西山会议派的创始成员之一。该集团反对共产主义在国民党的影响力。\n\n1948年4月20日总统选举中，居正被劝说作为一位反对蒋介石的人物参选，并在国民大会中获得10%的选票，而蒋介石以压倒性优势当选。"
 CHI_dai_jitao:0 "戴季陶"
 CHI_dai_jitao_desc:0 "1891年1月6日出生于四川广汉，又名戴传贤。\n\n戴季陶曾是孙中山的翻译，后来又成为他的机要秘书。 1925 年孙中山去世后，戴季陶出版了一本具争议的书，重新诠释了孙中山的遗产。 他声称孙中山的思想主要来自儒家思想，而不是西方哲学，且孙中山是一个传统主义者。 此举受到国民党右翼的赞扬，但遭到左翼和共产党的谴责。 右翼胜利后，戴季陶的诠释成为国民党内部的主导意向。\n\n1928年至1948年任考试院院长。"
 CHI_yu_youren:0 "于右任"
 CHI_yu_youren_desc:0 "1879年4月11日出生于陝西三原，中国教育家、学者、书法家、政治家。\n\n1906年，于右任逃往日本，在日本见到了孙中山，并正式加入同盟会。1918年，馀回到家乡陝西，任西北革命部队司令。  1925年，于右任奉命与吴稚晖、汪精卫等人组织政务委员会，处理党务。 1927年任国民政府委员会常务委员。 次年，他又被任命为审计总监。\n\n1930年至1948年任监察院院长。"
 CHI_zhang_qun:0 "张群"
 CHI_zhang_qun_desc:0 "作为国民党事业的坚定支持者，张群参加了辛亥革命、第二次革命和护宪运动。 1935年12月任国民政府外交部长。"
 CHI_yang_yongtai:0 "杨永泰"
 CHI_yang_yongtai_desc:0 "杨永泰（1880年—1936年10月25日），字畅卿，国民党高级官员，蒋介石的亲信智囊，政学系的巨人，被蒋称为“当代卧龙”。广东茂名高州大井镇大坡山村人，北京政法专业学校毕业。杨永泰曾任广州《广南报》编辑、广东咨议局议员。1912年任中华民国临时众议院议员并加入国民党。次年任国会参、众两院宪法起草委员会，与沈钧儒等组织民宪党。1914年在上海创办《正谊》杂志，并与黄兴等组织欧事研究会。1917年至1920年先后任护法军政府财政部长、广东省财政厅长、广东省长。1922年任北京国会参议院议员、善后会议财政善后委员会副委员长，为政学系首领之一。1928年任南京国民政府军事委员会参议。1931年任军委会秘书长。1933年接任军委会委员长属下的南昌行营秘书长。1934年任国民党豫、鄂、皖三省“剿匪”司令部秘书长。嗣任军委会武昌行营秘书长、四川行营秘书长、国民党候补中央执委。1936年，杨永泰在赴汉口日本领事馆宴会返回时，在江汉关轮渡码头被人开枪狙击身亡。译著有《外交政策》《现代民主政治》等。"
 CHI_chenbijun:0 "陈壁君"
 CHI_chenbijun_desc:0 "陈璧君（1891年11月5日—1959年6月17日），女，字冰如，原籍广东省江门新会，汪精卫之妻。出生于马来西亚槟榔屿乔治市，为南洋巨富陈耕基之女。抗战期间随汪精卫叛国投敌，沦为汉奸。抗战胜利后被国民政府以汉奸罪逮捕。1959年6月17日，病死于上海提篮桥监狱医院，时年67岁。"
 CHI_jiang_jingguo:0 "蒋经国"
 CHI_jiang_jingguo_desc:0 "蒋经国（1910年4月27日—1988年1月13日），字建丰，谱名经国，又名尼古拉，浙江省宁波市奉化区人，蒋介石之长子。1916年入奉化武山小学，1922年入上海万竹高等小学，1924年就读于上海浦东中学。1988年1月13日在台北病故，享年78岁。曾历任国民党台湾省党部主任委员、国民党“国防部”总政治部主任、“国防部”副部长、部长、“行政院”副院长、院长等职。蒋介石病逝以后，1978年5月20日，蒋经国就任“总统”。1988年1月13日，在台北病逝。"
 CHI_jiang_weiguo:0 "蒋纬国"
 CHI_jiang_weiguo_desc:0 "蒋纬国（1916年10月6日—1997年9月23日），男，汉族，幼名建镐，号念堂，蒋介石次子，蒋经国之弟，毕业于东吴大学。历任国民党装甲兵部队处长、战车团团长、装甲兵司令部参谋长、副司令、司令，陆军指挥参谋大学副校长，“国家安全会议秘书长”；对于军事战略研究颇有成果，被台湾军方奉为“军事战略学家”。"
 CHI_du_yuesheng:0 "杜月笙"
 CHI_du_yuesheng_desc:0 "杜月笙（1888年8月22日—1951年8月16日），原名杜月生，后因章太炎建议而改名镛，号月笙，江苏省川沙厅高桥镇人。中国近代上海青帮头目。杜月笙十四岁初到上海当水果行学徒。民国七年（1918年），进入青帮上海头目黄金荣家里做杂务，讨得黄金荣老婆林桂生的赏识，此后黄金荣开始将部分生意交给其经营。民国十四年（1925年）7月，与黄金荣、张啸林创办了专营鸦片的“三鑫公司”，杜月笙任总经理。同年，自立门户。并出任法租界商会总联合会主席，兼纳税华人会监察。民国十六年（1927年）4月，与黄金荣、张啸林组织中华共进会，为蒋介石镇压革命运动充当打手。民国二十一年（1932年），组织恒社。民国二十六年（1937年）7月22日，参与组织成立上海各界抗敌后援会。民国三十四年（1945年）8月，积极协助蒋介石抢夺抗日战争胜利果实。民国三十七年（1948年）春，参加国民政府召开的行宪国大，力捧蒋介石当选总统。1949年5月1日，前往香港定居。1951年8月16日下午4时50分，杜月笙于香港病逝，终年63岁。"
 CHI_hu_shi:0 "胡适"
 CHI_hu_shi_desc:0 "胡适,曾用名嗣穈，学名洪骍，后改名适，字适之。籍贯安徽省绩溪县，生于江苏省松江府川沙县。中国现代思想家、文学家、哲学家。1910年，赴美国康奈尔大学留学学习农科，后转入哥伦比亚大学哲学系，师从哲学家约翰·杜威。1917年，回国受聘北京大学教授。1918年，加入《新青年》编辑部。1919年，出版论著《中国哲学史大纲》。1920年2月，出版白话诗集《尝试集》。1922年，任《国学季刊》杂志编辑，创办《努力周报》杂志。1928年，出版论著《白话文学史》。1932年，被聘为全国财政委员会委员，创办《独立评论》杂志。1933年，被聘为农村复兴委员会委员。1938年，当选为“国民参政会”参政员。1938—1942年，出任驻美大使。1945年4月25日，出席旧金山会议。1946—1948年，任北京大学校长。1949年，前往美国。1952年，担任联合国教科文组织世界人类科学文化史编辑委员会委员；同年，应邀返台讲学。1957年，始任“中研院”院长。1962年2月24日，在台北病逝。"
 CHI_lei_zhen:0 "雷震"
 CHI_lei_zhen_desc:0 "雷震（1897年6月25日—1979年3月7日），字儆寰，浙江长兴人。1917年在日本留学期间加入中华革命党。中华民国政治家、政论家和出版家。《自由中国》杂志社社长1926年，北伐战争爆发。雷震留学归国，曾任中学校长。后进入国民政府，担任法制局编审、编译局编撰。1932年，雷震担任国民党南京党代表大会主席团主席。1934年，雷震担任国民政府教育部总务司司长。1938年，第一届国民参政会第一次会议在武汉召开，雷震为议事组主任。1940年，国民参政会成立宪政期成会，雷震出任秘书长。1946年，雷震出任政治协商会议秘书长。1946年，制宪国民大会开幕前后，雷震负责协调青年党与民主同盟中的民社党参与制宪国民大会，任制宪国大代表兼副秘书长。1947年，雷震当选国大代表。同年4月出任行政院政务委员，1948年离职。1949年，胡适、雷震、王世杰、杭立武、傅斯年等人在上海聚会，商议办刊物，宣传自由与民主。刊物名《自由中国》系胡适所取。但因为解放军渡过长江威逼上海而未成。1949年，自大陆抵达台湾第2天，雷震便投入创刊工作，并再次与杭立武讨论办刊事务。杭立武当时是“教育部”部长，由杭立武出面资助《自由中国》的成立。1949年，《自由中国》创刊号在台北正式出版。雷震为社长。1950年，雷震被蒋介石聘为“国策顾问”。1951年，《自由中国》刊登社论，评论当局采行金融投机做法可能导致执行人员借机敲诈。10月发表社论认为言论自由是天赋人权；继而又对“党化教育”、“青年救国团”等问题提出批评，导致“政治部”下令禁止阅读此刊物。雷震与蒋介石关系也渐行渐远。1953年，雷震的“国策顾问”等职遭免除。1954年，《自由中国》刊发读者来信，对“党化教育”严重干扰校内正常教育提出质疑，并指出“青年救国团”系非法组织。蒋介石震怒，下令注销雷震党籍。《自由中国》的言论逐渐转变为“民主反共”立论，以宪政民主、自由人权检视“政府”施政，对蒋介石的威权统治有所批评，与蒋介石的关系日益紧张。遭全面打压后，雷震与国民党彻底决裂，提出希望促进在野党之间的团结，并在此基础上组建一个反对党。1960年，雷震与台港在野人士联署反对蒋介石违背“宪法”三连任“总统”，雷震等人密拟《中国民主党创立宣言草案》，宣布将在9月底成立新党。几日后，国民党先发制人，将雷震等人抓捕，震惊海内外的“雷震案”。蒋以“知匪不报、为匪宣传”2项罪名，判处雷震有期徒刑10年。1970年，雷震刑满出狱，身体大不如前，无法再参与政治活动。1971年，雷震撰写《救亡图存献议》，提出政治十大建议，希望当局速谋政治、军事改革，以民主化方式应付危局，并要求将“国号”改为“中华台湾民主国”。1972年1月10日，雷震呈送《救亡图存献议》至领导人幕僚机构、台湾行政部门，未获回音。1979年，雷震病故。"
 CHI_wu_zhihui:0 "吴稚晖"
 CHI_wu_zhihui_desc:0 "吴稚晖（1865年3月23日—1953年10月30日）名吴眺，后改名吴敬恒。原籍江苏省常州府武进县，出生于江苏武进和无锡交界处的雪堰桥。与蔡元培、张静江、李石曾并称为“国民党四大元老”。早年曾在南菁书院黄以周门下学习过。1891年中试举人。接触西方文化后，追求无政府主义，后来参与孙中山主导的国民革命，孙中山信仰太平天国老兵故事即是出自吴敬恒所述。曾在苏报案中被认为是可能的告密者，在苏报案入狱的章太炎出狱后即批评吴稚晖曾密会清廷官员俞明震；也是早期国民党右派西山会议派成员之一。国民党内著名的右派人物，是蒋介石的主要支持者之一，四一二反革命政变吴稚晖起了特殊作用，他为共产党罗织罪名，为国民党右派提供清党证据。抗日战争爆发后基本上脱离了政治活动的前台。1949年1月赴台湾，1953年10月30日因病死于台北，终年88岁。"
 CHI_chen_bulei:0 "陈布雷"
 CHI_chen_bulei_desc:0 "陈布雷（1890年11月15日—1948年11月13日），名训恩，字彦及，笔名布雷、畏垒。浙江慈溪人。早年就读于慈溪县中学堂，后转入宁波府中学堂，1911年毕业于浙江高等学堂（浙江大学前身），同年在上海《天铎报》作记者。以“布雷”笔名写作评论。同年10月武昌起义后，他写的《谈鄂》十论，按日刊布，响应革命。1912年3月加入同盟会，1920年赴上海，先在商务印书馆编译《韦氏大学字典》，后任《商报》主编。后为《国闻周刊》主要撰稿人。1927年加入国民党。历任浙江省政府秘书长、国民党中央党部秘书长、《时事新报》主编。国民党中央宣传部副部长等职。兼任复旦大学中国国文科新闻组（新闻系前身）教授，主讲《社论作法》。1935年后历任蒋介石侍从室第二处主任、最高国防委员会副秘书长等职，长期为蒋介石草拟文件。支持亲属奔赴抗日前线，设法掩护民主人士。抗日战争胜利后，任总统府国策顾问、《申报》顾问兼常务董事。1948年11月13日在南京自杀身亡，终年58岁。著有《畏垒评论集》、《陈布雷回忆录》、《陈布雷文集》。"
 CHI_zhang_jingjiang:0 "张静江"
 CHI_zhang_jingjiang_desc:0 "张静江（1877年9月19日—1950年9月3日），谱名增澄，又名人杰，字静江，别署饮光，晚年又号卧禅，浙江乌程（今浙江南浔）人，中国近代政治家，与蔡元培、吴稚晖、李石曾并称为“国民党四大元老”。张静江出身江南丝商巨贾之家，早年因病成跛足，人称“张跷脚”。曾任国民党中央执行委员会常务委员会主席。在结识孙中山先生后便开始对孙中山先生给予经济上的支持，孙中山先生称他为“革命圣人”。后蒋介石建立南京国民政府，其主持建设委员会工作，蒋介石称他为“革命导师”。在召开国民党第一次全国代表大会时，张静江为主席团成员，并当选中央执行委员。在孙中山逝世后召开国民党第二次全国代表大会上，又当选为中央监察委员。蒋介石在国民党二届二中全会上推举张静江为国民党中央执行委员会常务委员会主席。晚年逐渐淡出政治，转而信佛，故又名卧禅。1950年9月3日病逝于纽约。"
 CHI_cai_yuanpei:0 "蔡元培"
 CHI_cai_yuanpei_desc:0 "蔡元培（1868年1月11日－1940年3月5日），字鹤卿，又字仲申、民友、孑民，乳名阿培，曾化名蔡振、周子余。汉族，素食主义者，浙江绍兴府山阴县（今浙江省绍兴市）人，祖籍浙江省诸暨市。教育家、革命家、政治家，民主进步人士，国民党中央执委、中华民国国民政府委员兼监察院院长、中华民国首任教育总长，景星学社名誉主席，国民党四大元老之一，与中国近现代文教界代表人物厉麟似等并称“影响中国历史的十位教育大家”。清光绪进士。1916年12月至1927年任北京大学校长，革新北大，开“学术”与“自由”之风；1920年至1930年，蔡元培同时兼任中法大学校长。他早年参加反清朝帝制的斗争，民国初年主持制定了中国近代高等教育的第一个法令《大学令》。1927年3月28日，蔡元培任国民党中央监察委员会会议主席，对吴稚晖提出的弹劾共产党表示附议，主张“取消共产党人在国民党之党籍”。4月2日，蔡元培再次担任主席，蔡元培再次附和吴稚晖关于弹劾共产党的文告，并拿出了《共产党祸党证据及共产党在浙祸党之报告》。国民党南京政府成立后最初两年内，蔡元培在政治上仍然站在蒋介石一边，支持“清共”。北伐时期，国民政府奠都南京后，他主持教育行政委员会、筹设中华民国大学院及中央研究院，主导教育及学术体制改革。1928年至1940年专任中央研究院院长，贯彻对学术研究的主张。蔡元培数度赴德国和法国留学、考察，研究哲学、文学、美学、心理学和文化史，为他致力于改革封建教育奠定思想理论基础。1933年，蔡元培倡议创建南京博物院，并亲自兼任第一届理事会理事长。抗战爆发初期，蔡元培与上海文化界知名人士联合组织成立了上海文化界救亡协会，积极组织发动文化界人士及民众投入抗日救亡运动。1940年3月5日在香港病逝，葬香港仔华人永远坟场。"
 CHI_kung_hsiang_hsi:0 "孔祥熙"
 CHI_kung_hsiang_hsi_desc:0 "中国银行家和政治领袖，曾就读于欧柏林和耶鲁大学。 他认为自己是第75代孔子的直系后裔。\n\n在他的整个职业生涯中，他都支持孙中山和蒋介石，他的第一个重要职位是工商部长（1928-31 年）。 1931年后，他加入国民党中央执行委员会。\n\n孔祥熙的金融专长曾多次帮助国民政府，但其方法与行事颇具争议。"
 CHI_t_v_soong:0 "宋子文"
 CHI_t_v_soong_desc:0 "宋子文（1894 年 12 月 4 日 - 1971 年 4 月 25 日）是 20世纪初中华民国的杰出商人和政治家。\n\n他的父亲是宋查理(Charlie)，其宋氏姐妹亦在党内颇具名气。 他在英文中通常被称为 T. V. Soong。 作为宋氏三姐妹的兄弟，宋氏的妹夫分别是孙中山、蒋介石委员长和金融家孔祥熙。\n\n他被蒋信任为一位「金融专家」。"
 CHI_soong_mei_ling:0 "宋美龄"
 CHI_soong_mei_ling_desc:0 "宋美龄生于中国，在美国接受教育，1927 年嫁给蒋介石，后来成为她丈夫的中国国民党政府的知名支持者。\n\n她英语流利，学习中国文化，是 1930 年代中蒋委员长的亲善大使和广受欢迎的伴侣。"
 CHI_he_yingqin:0 "何应钦"
 CHI_he_yingqin_desc:0 "§Y生卒年：§L\n生于：1890年4月2日 贵州兴义\n卒于：1987年10月21日 台湾台北\n§Y母校：§L\n东京振武学校\n日本陆军士官学校\n§Y军阶：§L\n1935年4月2日 一级上将\n§Y军旅生涯：§L\n1926-1927 第一军军长\n1928-1930 参谋本部训练总监部总监\n1930-1944 军政部长\n1937-1945 军事委员会参谋长\n1937-1945 参谋总长\n1938 第四战区司令长官\n1944-1945 中国战区陆军总司令\n1948-1949 国防部长"
 CHI_chen_guofu:0 "陈果夫"
 CHI_chen_guofu_desc:0 "1892年10月5日出生于浙江吴兴，为国民党CC系领导人。\n\n1911年加入同盟会，参加反清革命和反袁的「二次革命」。\n\n1924年，他重新开始政治生涯，被任命为国民党中央审计委员、组织部部长、中央财政委员会主席。 他与弟弟陈立夫共同组织了国民党CC系(中央俱乐部)。\n\n在1933~1937年间任江苏省政府主席。"
 CHI_chen_lifu:0 "陈立夫"
 CHI_chen_lifu_desc:0 "陈立夫出生于浙江，早年曾是一名矿工和採矿工程师，但在他的家庭在 1917 年遭到袁世凯搜查后过的十分艰难。1925 年，陈立夫在蒋介石的命令下正式加入国民党，当时陈立夫以优异成绩毕业于匹兹堡大学，并获得採矿工程硕士学位，准备去美国做採矿工程师。\n\n他在29岁时成为国民党中央委员会首要人物，这使他成为有史以来担任该职位中最年轻的一位。\n\n1931年任国民党组织部部长。 他还与其兄陈果夫一起被统称为政治组织「中央俱乐部」的领导人。\n\n除了政治，他还与胡汉民等一些学者一起在 30 年代帮助保存中医以对抗汪精卫的镇压。"
 CHI_weng_wenhao:0 "翁文灏"
 CHI_weng_wenhao_desc:0 "翁文灏对中国地质学研究做出了巨大贡献。 他发现并开发了中国第一个油田——玉门油田，并创立了中国地质学会。"
 CHI_wellington_koo:0 "顾维钧"
 CHI_wellington_koo_desc:0 "顾维钧，1887 年出生于上海，是一位娴熟的外交官。顾曾在哥伦比亚大学接受教育（1908 年学士；1909 年硕士；1912 年博士），在那里他专攻国际法。\n\n1912年，顾惠灵顿担任中国国家主席袁世凯的秘书。他曾担任巴黎和会代表（1919年），然后是同盟理事会的代表国家。在不同时期，他担任外交部长。"
 CHI_dai_li:0 "戴笠"
 CHI_dai_li_desc:0 "在加入黄埔军校之前就与蒋相识，戴笠是蒋介石的亲密盟友，并帮助组织了中国最早的情报机构之一。\n\n1932 年，他参与创建三民主义力行社，也称为蓝衣社，但他不是其创始人，只是作为与大众信仰相反的情报部门负责人。\n\n在思想上，他强烈反对共产主义，为中国的情报能力做出了巨大贡献。"
 CHI_he_zhonghan:0 "贺衷寒"
 CHI_he_zhonghan_desc: "湖南岳阳人，1900年生，黄埔一期，与蒋先云、陈赓并称“黄埔三杰”。\n\n早年曾为青年团员，1921年赴苏俄考察后与共产党彻底决裂。在黄埔发起“孙文主义学会”对抗共产党，后长期主掌军队政工系统，任军事委员会政训处处长。\n\n1932年参与组建复兴社，为“四大台柱”之首，极力鼓吹“一个主义、一个政党、一个领袖”，是国民党内法西斯主义的主要理论家。"
 CHI_yu_dawei:0 "俞大维"
 CHI_yu_dawei_desc:0 "俞大维曾任兵工署署长。 他也是第一个在德国数学杂誌《数学现况》上发表专题文章的中国人，也是弹道学专家。"
 CHI_chen_yibai:0 "陈一白"
 CHI_chen_yibai_desc: "江苏常熟人，1905年生，上海交通大学电机工程学院电信专业毕业，中国空军无线电通讯先驱。\n\n早年任交通部上海国际无线电台工程师，1931年任南京中央防空学校教官，并加入军统。1935年，任国民政府航空委员会防空情报台通讯员、无线电训练班教官。"
 CHI_carsun_chang:0 "张君劢"
 CHI_carsun_chang_desc:0 "中国国家社会党是倡导民族社会主义和进步社会主义的政党，其创始人张君劢为中华民国宪法的起草做出了巨大贡献。 他曾在闵变期间参加中华共和国政府。\n\n尽管他所创立的政党名称如此，但其思想立场和政治势力范围与德国纳粹主义毫无关係。"
 CHI_zhang_bojun:0 "章伯钧"
 CHI_zhang_bojun_desc:0 "一位参与1933年福建事变并创立第三党的张姓人士，原为中国共产党党员，但因在中国革命问题上持有不同见解而受到批评，最终退党。"
 CHI_zhang_dongsun:0 "张东荪"
 CHI_zhang_dongsun_desc:0 "张东荪，康德主义的支持者也对中国的自由化做出很大的贡献。同时也是中国民主社会党（支持制宪）的成员"
 CHI_shen_junru:0 "沉钧儒"
 CHI_shen_junru_desc:0 "“七君子” 之一"
 CHI_zhang_naiqi:0 "章乃器"
 CHI_zhang_naiqi_desc:0 "“七君子”之一，中国第一家徵信机构创始人。"
 CHI_zou_taofen:0 "邹韬奋"
