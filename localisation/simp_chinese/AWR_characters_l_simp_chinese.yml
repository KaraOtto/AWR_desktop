 CHI_petr_anisimov:0 "彼得·阿尼希莫夫"
 CHI_zhao_hongwenguo:0 "赵洪文国"
 CHI_chen_jieru:0 "陈洁如"
 CHI_chen_jieru_desc:0 "陈洁如，绰号“珍妮”。是蒋介石的第二任妻子，但蒋介石为了获得上海宋家财团以及美国的支持，来稳固其在国民党内的地位并继续北伐，要求她暂时离开中国五年，并承诺他娶宋美龄是出于政治上的考虑，并说：“我发誓，自今日起五年之内，必定恢复与洁如的婚姻关系。如果违反誓言，没有将她接回，祈求我佛将我殛毙，将我的南京政府打成粉碎。如果十年二十年之内，我不对她履行我的责任，祈求我佛推翻我的政府，将我放逐于中国之外，永不许回来。”，之后她去美国进行了为期五年的“学习之旅”，但蒋介石并没有履行誓言。 \n\n陈洁如的愿望最终未能实现。不过，随着蒋介石与宋美龄离婚，陈洁如似乎又有机会成为中华民国的第一夫人。"
 CHI_pavel_rychagov:0 "帕维尔·雷恰戈夫"
 CHI_yasuji_okamura:0 "冈村宁次"
 CHI_lisiguang:0 "李四光"
 CHI_lisiguang_desc:0 "李四光（1889年10月26日—1971年4月29日），字仲拱，原名李仲揆，湖北黄冈人。蒙古族，地质学家、教育家、音乐家、社会活动家，中国地质力学的创立者、中国现代地球科学和地质工作的主要领导人和奠基人之一，新中国成立后第一批杰出的科学家和为新中国发展做出卓越贡献的元勋。\n李四光1910年7月毕业于日本大阪高等工业学校；1911年，出任湖北军政府实业部长；1928年1月，任中央研究院地质研究所所长；1948年，当选为中央研究院院士；1950年5月，任中国科学院副院长；1951年4月，当选为世界科学工作者协会执行委员会副主席；1952年9月，任中华人民共和国地质部部长；1955年，被选聘为中国科学院学部委员（院士）；1958年9月，任中国科协主席；1969年4月，被选为中国共产党第九届中央委员会委员；1970年8月，任国务院科教组组长。\n李四光创立了地质力学，并为中国石油工业的发展作出了重要贡献；早年对蜓科化石及其地层分层意义有精湛的研究，提出了中国东部第四纪冰川的存在，建立了新的边缘学科“地质力学”和“构造体系”概念，创建了地质力学学派；提出新华夏构造体系三个沉降带有广阔找油远景的认识，开创了活动构造研究与地应力观测相结合的预报地震途径。"
