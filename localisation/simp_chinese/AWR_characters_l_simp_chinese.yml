 CHI_li_siguang_desc:0 "李四光（1889年10月26日—1971年4月29日），字仲拱，原名李仲揆，湖北黄冈人。蒙古族，地质学家、教育家、音乐家、社会活动家，中国地质力学的创立者、中国现代地球科学和地质工作的主要领导人和奠基人之一，新中国成立后第一批杰出的科学家和为新中国发展做出卓越贡献的元勋。\n李四光1910年7月毕业于日本大阪高等工业学校；1911年，出任湖北军政府实业部长；1928年1月，任中央研究院地质研究所所长；1948年，当选为中央研究院院士；1950年5月，任中国科学院副院长；1951年4月，当选为世界科学工作者协会执行委员会副主席；1952年9月，任中华人民共和国地质部部长；1955年，被选聘为中国科学院学部委员（院士）；1958年9月，任中国科协主席；1969年4月，被选为中国共产党第九届中央委员会委员；1970年8月，任国务院科教组组长。\n李四光创立了地质力学，并为中国石油工业的发展作出了重要贡献；早年对蜓科化石及其地层分层意义有精湛的研究，提出了中国东部第四纪冰川的存在，建立了新的边缘学科“地质力学”和“构造体系”概念，创建了地质力学学派；提出新华夏构造体系三个沉降带有广阔找油远景的认识，开创了活动构造研究与地应力观测相结合的预报地震途径。"
 

