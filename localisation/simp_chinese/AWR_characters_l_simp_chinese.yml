 NEA_character:0 "东北军顾问"
 NEA_zhang_xueliang:0 "张学良"
 NEA_zhang_xueliang_desc:0 "奉系领袖张作霖之子，世称“少帅”。1928年接掌东北军并宣布东北易帜，使国民政府在名义上完成统一。九一八事变后率部退入关内，既承受失地之责，也日益主张停止内战、共同抗日。1936年，他与杨虎城发动西安事变，扣留蒋介石并促其转变政策；事变和平解决后，张学良亲送蒋返南京，旋即遭到长期幽禁。"
 NEA_yang_hucheng:0 "杨虎城"
 NEA_yang_hucheng_desc:0 "出身陕西地方武装的西北军将领，长期经营第十七路军，在关中拥有深厚影响。面对日本步步进逼与持续内战，他与张学良于1936年共同发动西安事变，要求停止“剿共”、一致抗日。事变后被迫离开军职，1937年回国后遭秘密囚禁，最终于1949年在重庆被杀。"
 NEA_yu_xuezhong:0 "于学忠"
 NEA_yu_xuezhong_desc:0 "山东蓬莱人，早年辗转北洋军系，后受张学良倚重，成为东北军主要将领之一。曾任甘肃省政府主席、第五十一军军长，并在西安事变后的危局中参与维持东北军。全面抗战爆发后，他率部在淮河、山东等地对日作战，继而主持苏鲁战区，在敌后坚持多年。"
 NEA_wang_yizhe:0 "王以哲"
 NEA_wang_yizhe_desc:0 "保定陆军军官学校第八期毕业，是张学良亲信与东北军第六十七军军长。长城抗战期间曾率部迎击日军；进驻西北后，他参与同红军接触与停战谈判，支持联合抗日。西安事变后，王以哲主张以和平方式营救张学良，却在东北军内部矛盾激化的“二二事件”中被少壮派军官杀害。"
 NEA_sun_weiru:0 "孙蔚如"
 NEA_sun_weiru_desc:0 "陕西长安人，早年投身民主革命，后成为杨虎城麾下的重要将领，以持重善守著称。全面抗战爆发后，他率陕西部队参加华北作战，继任第四集团军总司令，长期坚守晋南中条山一线，屏障潼关与关中。其部在艰苦环境中多次阻击日军，孙蔚如也因此被誉为中条山的“铁柱子”。"
 NEA_feng_qinzai:0 "冯钦哉"
 NEA_feng_qinzai_desc:0 "山西万泉人，早年加入同盟会并参加辛亥革命，后投身杨虎城部，历任旅长、师长及军长。1933年曾率部参加长城抗战；西安事变后与杨虎城分道扬镳，所部改编为第二十七路军。全面抗战期间，他又率军在河北、晋东南等地同日军作战。"
 NEA_zhou_fucheng:0 "周福成"
 NEA_zhou_fucheng_desc:0 "东北军将领，抗战初期任第一一六师师长，先后在平汉线和太行山区对日作战。此后接掌第五十三军，在复杂的派系与整编压力下维系这支东北军旧部，并率军参加滇西反攻。1948年辽沈战役期间，他在沈阳被人民解放军俘虏，第五十三军的历史也随之落幕。"
 NEA_zhu_hongxun:0 "朱鸿勋"
 NEA_zhu_hongxun_desc:0 "吉林农安人，曾就读南开中学，后毕业于东北讲武堂第六期步兵科。历任第一三〇师师长、第五十三军副军长，参加长城抗战与武汉会战，在鄂东南率部阻击日军。1940年10月，他在湖北华容一带作战时中弹殉国，后被追授陆军中将。"
 NEA_deng_baoshan:0 "邓宝珊"
 NEA_deng_baoshan_desc:0 "甘肃天水人，原名邓瑜，少年从军并参加伊犁辛亥革命，后来成为西北军中富有声望的“儒将”。他曾任新编第一军军长，长期周旋于南京中央、西北地方势力与陕甘宁边区之间。抗战时期主持晋陕绥边区军务，在榆林一带维持河防，也以务实态度保持同中共方面的联系。"
 NEA_lu_dachang:0 "鲁大昌"
 NEA_lu_dachang_desc:0 "甘肃临夏人，由旧军队基层逐步崛起，最终成为盘踞洮岷地区的地方实力派，所部编为新编第十四师。1935年他凭借腊子口天险阻击长征中的红一方面军，却被红军突破防线。此后虽获授新编第二军军长等职，但其地方军权在中央整编下逐渐被削弱。"
 NEA_bai_fengxiang:0 "白凤翔"
 NEA_bai_fengxiang_desc:0 "河北沧州人，行伍出身的东北军骑兵骁将，善骑射，后任骑兵第六师师长。1936年西安事变中，他参与指挥临潼方面的捉蒋行动。全面抗战爆发后，白凤翔组织热河抗日先遣军，在长城内外开展游击作战，1940年在抗日活动中遇害。"
 NEA_tan_zixin:0 "檀自新"
 NEA_tan_zixin_desc:0 "东北军骑兵将领，九一八事变后曾在日军、义勇军及各路地方武装之间反复转投，后所部被编为骑兵第十师。西安事变发生后，他率部脱离东北军并转向南京中央，旋升任骑兵第四军军长。1937年所部在河南战败溃散，檀自新因抗命另谋出路而被捕，次年遭军法处决。"
 NEA_guo_xipeng:0 "郭希鹏"
 NEA_guo_xipeng_desc:0 "辽宁盖平人，东北讲武堂出身，并曾赴日本学习骑兵战术。回国后长期统率东北军骑兵，历任骑兵旅长、师长及骑兵第二军副军长，参加长城抗战与绥远一带的对日作战。抗战胜利后，他因不愿参与内战而未赴新职，留在北平迎接时局更替。"
 NEA_huang_yongan:0 "黄永安"
 NEA_huang_yongan_desc:0 "东北军炮兵将领，曾任炮兵第六旅旅长，是张学良部下的专业兵种军官之一。西安事变和平解决、张学良被扣之后，东北军迅速陷入分裂与整编；黄永安率部脱离原有系统，转受南京中央节制。其选择正是东北军失去统一领导后，各部各寻出路的缩影。"
