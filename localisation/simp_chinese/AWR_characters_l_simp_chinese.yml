 CHI_feng_yuxiang: "冯玉祥"
 CHI_feng_yuxiang_desc: "§Y生卒年：§L\n生于：1882年11月6日 安徽巢县\n卒于：1948年9月1日 黑海\n§Y军阶：§L\n1935年4月2日 一级上将\n§Y军旅生涯：§L\n1924-1925 国民军总司令\n1926-1927 国民联军总司令\n1926-1928 第二集团军总司令\n1928-1929 军政部长\n1929 第二集团军总司令\n1930 第二集团军总司令\n1937 第三战区司令长官\n1937 第六战区司令长官"
 CHI_zhu_peide: "朱培德"
 CHI_zhu_peide_desc: "§Y生卒年：§L\n生于：1889年10月31日 云南禄丰\n卒于：1937年2月7日 南京市\n§Y母校：§L\n云南陆军讲武堂\n§Y军阶：§L\n1935年4月2日 一级上将\n§Y军旅生涯：§L\n1925-1927 第三军司令\n1927-1925 第五路军司令\n1929 第一路军司令\n1929 副参谋总长\n1929-1932 军委会参谋总长\n1932-1933 军委会训练总监\n1934-1935 副参谋总长"
 CHI_tang_shengzhi: "唐生智"
 CHI_tang_shengzhi_desc: "§Y生卒年：§L\n生于：1889年10月12日 湖南东安\n卒于：1970年4月6日 湖南长沙\n§Y母校：§L\n保定陆军军官学校\n§Y军阶：§L\n1935年4月2日 一级上将\n§Y军旅生涯：§L\n1926-1927 第八军军长\n1927 第四集团军总司令\n1930 第六方面军总司令\n1934-1938 训练总监\n1937 南京卫戍司令长官\n1937-1938 军法执行总监"
 CHI_zhu_shaoliang: "朱绍良"
 CHI_zhu_shaoliang_desc: "§Y生卒年：§L\n生于：1891年10月28日 福建福州\n卒于：1963年12日25日 台湾台北\n§Y母校：§L\n东京振武学校\n日本陆军士官学校\n§Y军阶：§L\n1935年4月3日 二级上将\n§Y军旅生涯：§L\n1928-1930 第八师师长\n1929-1930 第二军军长\n1937-1939 第九集团军总司令官\n1939-1946 第八战区司令长官"
 CHI_liu_zhi: "刘峙"
 CHI_liu_zhi_desc: "§Y生卒年：§L\n生于：1892年6月30日 江西吉安\n卒于：1971年1月15日 台湾台北\n§Y母校：§L\n保定陆军军官学校\n§Y军阶：§L\n1935年4月3日 二级上将\n§Y军旅生涯：§L\n1926 第二师师长\n1927-1928 第一军军长\n1929 第一军军长\n1937-1938 第二集团军总司令\n1938-1945 重庆卫戍司令长官\n1943-1945 第五战区司令长官\n1948 徐州剿总总司令"
 CHI_gu_zhutong:0 "顾祝同"
 CHI_gu_zhutong_desc: "§Y生卒年：§L\n生于：1893年1月9日 江西吉安\n卒于：1987年1月17日 台湾台北\n§Y母校：§L\n保定陆军军官学校\n§Y军阶：§L\n1935年4月3日 二级上将\n§Y军旅生涯：§L\n1926-1927 第三师师长\n1927-1929 第九军军长\n1929-1930 第二师师长\n1929-1931 第一军军长\n1930-1931 第十六路军总指挥\n1937-1945 第三战区司令长官\n1938 第二十四集团军总司令\n1946-1948 陆军总司令\n1948-1950 参谋总长\n1949 陆军总司令\n1949-1950 陆军总司令"
 CHI_shang_zhen: "商震"
 CHI_shang_zhen_desc: "§Y生卒年：§L\n生于：1888年9月21日 河北保定\n卒于：1978年5月15日 日本东京\n§Y母校：§L\n北洋陆军速成学堂\n§Y军阶：§L\n1935年4月3日 二级上将\n§Y军旅生涯：§L\n1931-1935 第三十二军军长\n1937-1938 第三十二军军长\n1937-1941 第二十集团军总司令\n1940 第六战区司令长官"
 CHI_xu_yongchang: "徐永昌"
 CHI_xu_yongchang_desc: "§Y生卒年：§L\n生于：1887年12月15日 山西崞县\n卒于：1959年7月12日 台湾台北\n§Y母校：§L\n陆军大学\n§Y军阶：§L\n1935年4月3日 二级上将\n§Y军旅生涯：§L\n1938-1946 军令部长\n1948-1949 国防部长"
 CHI_jiang_dingwen: "蒋鼎文"
 CHI_jiang_dingwen_desc: "§Y生卒年：§L\n生于：1893年10月18日 浙江诸暨\n卒于：1974年1月2日 台湾台北\n§Y母校：§L\n绍兴军事学堂\n§Y军阶：§L\n1935年4月3日 二级上将\n§Y军旅生涯：§L\n1927-1928 第一师师长\n1928-1929 第九师师长\n1929-1931 第二军军长\n1931-1932 第四军团总指挥\n1937 第四集团军总司令\n1938-1939 第三十四集团军总司令\n1939-1941 第十战区司令长官\n1942-1944 第一战区司令长官\n1945 退役"
 CHI_cheng_qian: "程潜"
 CHI_cheng_qian_desc: "§Y生卒年：§L\n生于：1882年3月31日 湖南醴陵\n卒于：1968年4月5日 北京市\n§Y母校：§L\n日本陆军士官学校\n§Y军阶：§L\n1936年1月11日 二级上将\n1939年5月13日 一级上将\n§Y军旅生涯：§L\n1925-1927 第六军军长\n1935-1937 参谋总长\n1937-1938 第一战区司令长官\n1944-1945 军委会副总参谋长"
 CHI_chen_cheng: "陈诚"
 CHI_chen_cheng_desc: "浙江青田人，1898年生，字辞修，保定军校八期炮科毕业，黄埔军校特别官佐出身，蒋介石“五虎上将”之一。\n\n以治军严整、善练部队著称，亲手缔造国民党军内部最大军事集团“土木系”（“土”为十一师，“木”为十八军）。1935年4月授陆军中将，时任军事委员会委员长武昌行营陆军整理处处长，主持全国陆军整训。"
 CHI_wei_lihuang:0 "卫立煌"
 CHI_wei_lihuang_desc: "安徽合肥人，1897年生，字俊如，行伍出身，早年曾任孙中山广州大本营警卫团排长。\n\n北伐时期历任国民革命军团长、旅长、师长。土地革命战争期间，任第十四军军长，参与对鄂豫皖苏区的“围剿”和对长征红军的“追剿”。\n\n1935年11月当选国民党第五届中央执行委员。"
 CHI_zhang_zhizhong:0 "张治中" 
 CHI_zhang_zhizhong_desc:0 "张治中，字文白，安徽巢县人，陆军二级上将。1912年，编入武昌陆军军官第二预备学校。1916年，在保定陆军军官学校毕业后被分配至安徽“安武军”中见习。1917年，参加孙中山发起的护法运动。1918年，在川军第五师任少校参谋。1920年，任川军第三独立旅参谋长。1923年，任靖国桂军总司令部参谋，后在桂军军官学校任大队长。1925年，任黄埔军校第三期入伍生总队代理总队长。1926年，任国民革命军总司令部副官处处长，后参加北伐战争。1929年，任南京中央陆军军官学校教育长。"
 CHI_zhang_fakui:0 "张发奎"
 CHI_zhang_fakui_desc: "广东始兴人，1896年生，字向华，客家人，保定军校肄业，同盟会出身。北伐时期任第四军军长，所部在汀泗桥、武昌城等战役中屡建战功，被誉为“铁军”，他本人亦有“铁军英雄”之称。\n\n1932年参加“一·二八”淞沪抗日作战后，赴欧美及东南亚考察军事。1935年春回国，在上海向报界发表谈话表示决心抗日，并面见蒋介石请求率部抗战，称“今后中国的出路，惟有抗战之一途”。"
 CHI_xue_yue:0 "薛岳"
 CHI_xue_yue_desc: "广东乐昌人，1896年生，字伯陵，保定军校六期肄业，粤军出身，绰号“老虎仔”。\n\n早年追随孙中山，后因与中共关系密切在清党时被撤职，改投张发奎部。1933年重新起用，任第五军军长参加“剿共”，长征后率部尾随追击，于湘江战役中重创红军。1935年任贵州绥靖公署主任。"
 CHI_liu_jianxu:0 "刘建绪"
 CHI_liu_jianxu_desc: "湖南醴陵人，1892年生，字恢先，保定军校第三期炮科毕业，湘军何键派系主要将领。\n\n早年投身湘军，北伐时任第三十五军副军长兼第二师师长，后随何键投靠蒋介石，长期参与对红军“围剿”与追堵。1935年4月授陆军中将，9月任第四路军总指挥，11月当选国民党第五届中央候补执行委员。"
 CHI_sun_lianzhong:0 "孙连仲"
 CHI_sun_lianzhong_desc: "河北雄县人，1894年生，字仿鲁，行伍出身，冯玉祥西北军“十三太保”之一，由士兵递升至军长。1930年中原大战后，率西北军残部投效蒋介石，所部改编为第二十六路军，任总指挥。1935年4月叙阶陆军中将，同年当选国民党第五届中央监察委员。"
 CHI_pang_bingxun:0 "庞炳勋"
 CHI_pang_bingxun_desc: "河北新河人，1879年生，字更陈，因腿伤微残，人称“庞瘸子”。\n\n行伍出身，早年入北洋军，后加入同盟会。辗转于国民军、直系、西北军之间，1930年中原大战后投靠蒋介石，所部改编为第四十军，任军长。1933年参加长城抗战，同年奉命参与围攻抗日同盟军。"
 CHI_luo_zhuoying:0 "罗卓英"
 CHI_luo_zhuoying_desc: "广东大埔人，1896年生，字尤青，保定军校第八期炮科毕业，陈诚“土木系”核心成员与最重要的谋士，号称“二当家”。\n\n早年追随陈诚，历任第十一师师长、第十八军军长，1935年4月5日铨叙陆军中将，9月兼任第十八军军长及闽浙皖赣四省边区总指挥部副总指挥。"
 CHI_shangguan_yunxiang:0 "上官云相"
 CHI_shangguan_yunxiang_desc: "山东商河人，1895年生，字纪青，保定军校第六期步兵科毕业。\n\n早年投效孙传芳部，北伐后转投蒋介石，历任第九军军长、第四十七师师长等职，长期参与对红军的“围剿”。1935年4月叙阶陆军中将。"
 CHI_liu_maoen:0 "刘茂恩"
 CHI_liu_maoen_desc: "河南巩县人，1898年生，字书霖，保定军校第六期辎重科毕业，镇嵩军首领刘镇华之弟。\n\n早年随兄加入镇嵩军，1930年中原大战时率部投靠蒋介石，所部改编为第十五军，任军长。1935年4月晋升陆军中将。"
 CHI_wu_qiwei:0 "吴奇伟"
 CHI_wu_qiwei_desc: "广东大埔人，1891年生，字晴云，号梧生，保定军校第六期毕业，粤军第四军出身，北伐名将。\n\n早年家境贫寒，曾当学徒，后考入黄埔陆军小学，与邓演达等同学。北伐时期在第四军屡立战功，汀泗桥、贺胜桥战役后升任第十二师师长，因与士兵同甘共苦，军中绰号“阿婆”1935年4月铨叙陆军中将。"
 CHI_li_jue:0 "李觉"
 CHI_li_jue_desc: "湖南长沙人，1900年生于云南景谷，字云波，保定军校第九期肄业，湘军何键集团核心将领，何键长婿，号称何键军事集团的“四号人物”及少壮派军人首领。\n\n早年追随唐生智，后转投何键，历任第十九师师长，长期参与对红军的“围剿”与追堵。"
 CHI_huang_zhenqiu:0 "黄镇球"
 CHI_huang_zhenqiu_desc: "广东梅县人，1898年生，字剑霆，保定军校第六期步科及德国陆军防空学院毕业，粤军出身，绰号“老虎仔”。\n\n早年加入粤军，1925年任国民革命军第四军第三十三团团长，1927年任第二十六师师长。1934年7月，出任中央防空学校校长，转向防空事业。"
 CHI_zeng_wanzhong:0 "曾万钟"
 CHI_zeng_wanzhong_desc: "云南大关人，1894年生，字鼎铭，云南陆军讲武堂第三期毕业，朱培德派滇军将领。\n\n早年参加重九起义、护国战争，后随朱培德部滇军赴粤，参加东征、北伐。1933年任第3军第7师师长，1935年4月铨叙陆军中将。1936年11月，第3军军长王均在甘肃天水遇空难身亡，曾万钟升任第3军代军长兼第7师师长，率部驻甘肃天水一带。"
 CHI_tang_enbo:0 "汤恩伯"
 CHI_tang_enbo_desc: "浙江武义人，1900年生，原名克勤，字恩伯，以字行。日本陆军士官学校第18期步兵科毕业，非黄埔出身，但被视为黄埔系骨干将领。\n\n早年得浙军师长陈仪保荐留学日本，为感其恩改名“恩伯”。回国后经张治中提拔，在中央陆军军官学校迅速升迁，1931年即任第2师师长。1935年任陆军第13军军长兼第4师师长，4月8日晋升陆军中将。"
 CHI_hu_zongnan:0 "胡宗南"
 CHI_hu_zongnan_desc: "浙江镇海人，1896年生，字寿山，黄埔军校第一期毕业，蒋介石最宠信的嫡系将领之一，号称“天子门生第一人”。1930年即任第一师中将师长，是黄埔生中最早晋升中将者。1932年后长期率部在鄂豫皖及川陕甘一带“围剿”红军。"
 CHI_li_moan:0 "李默庵"
 CHI_li_moan_desc: "湖南长沙人，1904年生，字霖生，黄埔军校第一期毕业，与贺衷寒、胡宗南并称“黄埔三杰”（“文有贺衷寒，武有胡宗南，又文又武李默庵”）。\n\n早年曾加入中国共产党，是黄埔生中第一个退党者。1935年4月铨叙陆军中将，任驻闽第二绥靖区司令官兼第十师师长。"
 CHI_li_yannian:0 "李延年"
 CHI_li_yannian_desc: "山东广饶人，1904年生，字吉甫，黄埔一期，与李仙洲、李玉堂并称“山东三李”。1924年考入黄埔军校第一期，毕业后从排长逐级递升，参与东征、北伐。1928年任第九师第二十六旅旅长，1932年升任第九师师长兼徐州警备司令。1934年任“剿匪”东路军第二路军第四纵队指挥官，参与对中央苏区的“围剿”。1935年春，改任驻闽绥靖第三区司令官兼第九师师长，驻军泉州。1935年4月，与胡宗南、李默庵同批铨叙陆军中将，是黄埔一期生中最早获正式中将衔的三人之一。"
 CHI_yu_jishi:0 "俞济时"
 CHI_yu_jishi_desc: "浙江奉化人，1904年生，字良桢，黄埔一期毕业，蒋介石奉化同乡，族叔为黄埔军需处长俞飞鹏，长期被视为蒋的贴身亲信。\n\n早年任蒋介石侍卫，后历任警卫第一师师长、第八十八师师长。1932年“一·二八”淞沪抗战中，率八十八师参战，腹部受重伤。1933年任浙江省保安处处长，1934年率部“追剿”方志敏北上抗日先遣队，在谭家桥、怀玉山一带参与俘获方志敏等人。1935年任第五十八师师长，驻湖北宜昌整训。"
 CHI_li_yutang:0 "李玉堂"
 CHI_li_yutang_desc: "山东广饶人，1899年生，字瑶阶，黄埔一期，与李延年、李仙洲并称“山东三李”。毕业后从排连长逐级递升，1932年即任第3师中将师长。1935年4月叙任陆军少将。"
 CHI_guan_linzheng:0 "关麟征"
 CHI_guan_linzheng_desc: "陕西鄠县人，1905年生，原名志道，字雨东，黄埔一期毕业，经于右任举荐入学。1933年率第二十五师参加长城抗战，在古北口与日军血战，负伤后获青天白日勋章，军中号称“关猛”。1935年4月晋升陆军少将。"
 CHI_song_xilian:0 "宋希濂"
 CHI_song_xilian_desc: "湖南湘乡人，1907年生，字荫国，黄埔军校第一期毕业，与陈赓为同学。早年曾加入中国共产党，“中山舰事件”后脱党，自此追随蒋介石。1933年任第36师师长，该师为国民政府警卫军改编的嫡系劲旅，是首批“德械师”之一。1935年，他率部驻福建长汀，奉蒋介石密令枪决了被俘的中共领袖瞿秋白。同年4月授陆军少将。"
 CHI_huang_jie:0 "黄杰"
 CHI_huang_jie_desc: "湖南长沙人，1902年生，字达云，黄埔一期，何应钦系骨干。1935年4月叙任陆军少将。"
 CHI_wang_jingjiu:0 "王敬久"
 CHI_wang_jingjiu_desc: "江苏丰县人，1902年生，字又平，黄埔军校第一期毕业，与王仲廉、王家修并称“徐州三王”。他长期在顾祝同的第2师系统任职，1932年即升任第87师师长，是顾祝同系的核心骨干。"
 CHI_liu_kan:0 "刘戡"
 CHI_liu_kan_desc: "湖南桃源人，1906年生，字麟书，号三寿，黄埔军校第一期毕业，与徐向前同学。因在“围剿”作战中右眼负伤摘除，配装假眼，军中号称“独眼龙将军”。他长期在卫立煌麾下，1931年底升任第83师师长，1933年率部参加长城抗战，后调赴江西参与对中央苏区的“围剿”。1935年4月叙任陆军少将。"
 CHI_wu_shi:0 "吴石"
 CHI_wu_shi_desc:0 "吴石（1894年9月14日-1950年6月10日），原名萃文，字虞薰，号湛然，福建省闽侯县螺洲乡人，先后毕业于保定军校第三期炮兵科、日本东京炮兵专科学校、日本陆军大学，1936年陆军少将，1944年晋升陆军中将。"
 CHI_huo_kuizhang:0 "霍揆彰"
 CHI_huo_kuizhang_desc: "湖南酃县（今炎陵）人，1901年生，字嵩山，黄埔军校第一期毕业，陈诚“土木系”核心骨干。\n\n他长期追随陈诚，早在1926年即任陈诚团少校团附，此后在第十八军系统内逐级升迁。1933年9月升任第十四师师长，1935年4月叙任陆军少将，率部参与对中央苏区的第五次“围剿”。"
 CHI_huang_wei:0 "黄维"
 CHI_huang_wei_desc: "江西贵溪人，1904年生，号悟我，黄埔军校第一期毕业，陈诚“土木系”核心骨干。1934年任第十一师师长，1935年授陆军少将，率部参加对红军的第四、第五次“围剿”。"
 CHI_xia_chuzhong:0 "夏楚中"
 CHI_xia_chuzhong_desc: "湖南益阳人，1904年生，又名楚钟，别号贯难，黄埔军校第一期毕业，陈诚“土木系”骨干将领。\n\n早年曾入湖北甲等工业学校，毕业后任汉阳兵工厂技术员，1924年投考黄埔一期。参加过两次东征和北伐，历任排长、连长、营长、团长。1930年任中央教导第三师第九团上校团长，后升第十四师四十旅少将旅长。1935年4月授陆军少将。"
 CHI_wang_zhonglian:0 "王仲廉"
 CHI_wang_zhonglian_desc: "江苏萧县人，1903年生，字介人，黄埔一期，与王敬久、王家修并称“徐州三王”，是汤恩伯系的核心骨干。1933年升任第十三军第八十九师师长，此后率部参加对鄂豫皖及中央苏区的“围剿”。"
 CHI_li_xianzhou:0 "李仙洲"
 CHI_li_xianzhou_desc: "山东长清人，1894年生，原名李守瀛，字仙洲，黄埔军校第一期毕业，与李延年、李玉堂并称“山东三李”。\n\n早年任小学教员，1924年入黄埔一期，毕业后从排长逐级递升，1934年升任第二十一师师长。"
 CHI_du_yuming:0 "杜聿明"
 CHI_du_yuming_desc: "陕西米脂人，1904年生，字光亭，黄埔军校第一期毕业。\n\n早年参加北伐、长城抗战，1933年古北口战役中代理第二十五师师长，与日军血战。后因与师长关麟征矛盾颇深，1936年经徐庭瑶保荐，调任南京陆军交辎学校学员队少将队长，协助筹建机械化部队。"
 CHI_zheng_dongguo:0 "郑洞国"
 CHI_zheng_dongguo_desc: "湖南石门人，1903年生，字桂庭，黄埔军校第一期毕业。\n\n早年参加东征、北伐。1933年率部参加长城古北口抗战，是中央军最早参与抗日的将领之一。此后率部参加对中央苏区的“围剿”。"
 CHI_fan_hanjie:0 "范汉杰"
 CHI_fan_hanjie_desc: "广东大埔人，1896年生，名其迭，字汉杰，黄埔军校第一期毕业。他是黄埔一期中唯一以少将衔入学的学员，早年曾任粤军第六路少将司令兼三水县长。1932年任第十九路军总部参谋处长、副参谋长。"
 CHI_wang_yaowu:0 "王耀武"
 CHI_wang_yaowu_desc: "山东泰安人，1904年生，字佐民，黄埔军校第三期毕业。\n\n早年曾在天津、上海当店员谋生，1924年考入黄埔三期。毕业后从排长逐级递升，1930年升任团长。1934年冬率部参与围追方志敏部北上抗日先遣队，在皖南谭家桥战斗中，红十九师师长寻淮洲牺牲、红二十一师师长胡天桃被俘，王耀武战后升任第五十一师师长。"
 CHI_ma_fawu:0 "马法五"
 CHI_ma_fawu_desc: "河北高阳人，1894年生，字赓虞，保定陆军军官学校第八期炮兵科毕业。他早年曾就读于北京协和医学堂预科，后投笔从戎，是杂牌军中少有的知识分子将领。\n\n马法五长期追随庞炳勋，是其第40军系统的核心副手。1931年第40军正式组建时，庞炳勋任军长，马法五即任副军长，第39师师长由庞炳勋兼任。此后他长期担任第40军中将副军长兼第39师副师长，是庞炳勋最倚重的助手。1935年4月10日，马法五叙任陆军中将。"
 CHI_han_deqin:0 "韩德勤"
 CHI_han_deqin_desc: "江苏泗阳人，1892年生，字楚箴，保定军校第六期毕业，与顾祝同为同乡、结义兄弟及保定同学，是顾祝同派系的头号亲信，长期随顾的升迁而晋升。"
 CHI_dai_anlan:0 "戴安澜"
 CHI_dai_anlan_desc: "安徽无为人，1904年生，原名衍功，号海鸥，黄埔军校第三期毕业。\n\n早年参加北伐，1933年任第17军第25师第145团团长，率部参加长城古北口抗战，因作战勇敢获五等云麾勋章。此后率部驻防北平一带，隶属关麟征第25师系统，是中央军嫡系中的骨干团长。"
 CHI_qiu_qingquan:0 "邱清泉"
 CHI_qiu_qingquan_desc: "浙江永嘉人，1902年生，原名青钱，字雨庵。黄埔军校第二期工兵科毕业，后赴德国柏林陆军大学深造，主攻机械化兵战术，是国军中少有的精通英、德文的“儒将”。1934年赴德留学前，他已历任第十师上校团长、中央军校政训处少将处长等职，在军事教育领域崭露头角。"
 CHI_liao_yaoxiang:0 "廖耀湘"
 CHI_liao_yaoxiang_desc: "湖南邵阳人，1906年生，字建楚，黄埔军校第六期骑兵科毕业。1930年以上士军衔公费赴法留学，先后在法国陆军骑兵学校、圣西尔军校学习机械化骑兵。1936年以第一名的成绩毕业于圣西尔军校，回国后应桂永清之邀，出任中央军校教导总队骑兵队第二连少校连长，不久调任军士营学兵连连长。"
 CHI_zhang_lingfu:0 "张灵甫"
 CHI_zhang_lingfu_desc: "陕西长安人，1903年生，原名钟麟，字灵甫，黄埔军校第四期步科毕业，胡宗南第一军嫡系骨干。\n\n早年就读于北京大学历史系，后投笔从戎。毕业后在第一师中历任排长、连长、营长，1933年年仅30岁即升任第一师独立旅第1团上校团长，以骁勇善战在胡宗南部中闻名。"
 CHI_sun_liren:0 "孙立人"
 CHI_sun_liren_desc: "安徽庐江人，1900年生，字抚民。清华学校毕业后赴美，先获普渡大学土木工程学士，后转入弗吉尼亚军事学院，1927年毕业。他是国军高级将领中学历最完整、最“洋派” 的人物之一。1932年，经宋子文延揽，出任财政部税警总团第二支队上校司令兼第四团团长，驻防苏北。税警总团装备精良、训练严格，是宋子文一手建立的“私家武装”，孙立人则是其中最核心的留美少壮派团长。"
 CHI_tao_zhiyue:0 "陶峙岳"
 CHI_tao_zhiyue_desc: "湖南宁乡人，1892年生，字岷毓，保定军校第二期毕业，湘军出身。1932年任第8师师长，1935年4月授陆军中将。1936年，所部第8师扩编为第八军，陶峙岳出任军长，率部驻防甘肃。"
 CHI_liu_yuzhang:0 "刘玉章"
 CHI_liu_yuzhang_desc: "陕西兴平人，1903年生，字麟生，黄埔军校第四期毕业，绰号“刘光头”。\n\n早年参加北伐，由排长累升至营长。1933年率部参加长城古北口抗战，在南天门战斗中右臂中弹负伤。1934年入南京高等教育班第四期受训。"
 CHI_chen_mingren:0 "陈明仁"
 CHI_chen_mingren_desc: "湖南醴陵人，1903年生，字子良，黄埔军校第一期毕业。\n\n早年参加两次东征，1927年即任黄埔军校学生队上校队长。1932年任第八十师副师长，次年升任第八十师师长，率部参加对鄂豫皖苏区及中央苏区的“围剿”。1934年因“大量吃缺、不服调遣”被免职，此后曾任驻赣第四绥靖区参议、第二师参谋长等职。1935年春，入陆军大学第十三期学习，同年9月任军事参议院少将参议。"
 CHI_li_mi:0 "李弥"
 CHI_li_mi_desc: "云南盈江人，1902年生，字炳仁，号文卿，黄埔军校第四期毕业。\n\n早年入云南驻粤滇军第七师当勤务兵，经师长李根云提拔为副官，后被保送黄埔四期。毕业后在朱培德第三军教导团任中尉排长，该团团长为朱德。1927年南昌起义时，李弥拒绝参加，离队赴上海、南京，此后投靠蒋介石系统。1930年随部赴鄂西、江西参与“剿共”，与贺龙部作战时脸部负伤。1932年归入周浑元第五师麾下，升任团长。"
 CHI_chen_shaokuan:0 "陈绍宽"
 CHI_chen_shaokuan_desc: "福建闽侯人，1889年生，字厚甫，江南水师学堂毕业，“闽系”海军领袖，国民政府中央海军的实际掌舵人。\n\n他早年赴英考察海军，亲历一战，历任舰长、舰队司令。1928年后出任海军署长、海军部政务次长，1932年1月正式接任海军部部长，主掌全国海军建设。任内致力于海军体制正规化，并多次提出包含建造航空母舰在内的宏大造舰计划，但因财政拮据与工业基础薄弱，多停留于纸面。1935年，陈绍宽晋升海军一级上将，成为民国海军中唯一获此最高军衔者。"
 CHI_gui_yongqing:0 "桂永清"
 CHI_gui_yongqing_desc:0 "桂永清是黄埔军校最早的毕业生之一，1935年晋升为中将。"
 CHI_shen_honglie:0 "沉鸿烈"
 CHI_shen_honglie_desc:0 "沉鸿烈在1929年的中苏冲突中击败了苏联海军，被认为是民国为数不多的有能海军军官之一。 他的态度也与他的前上司张学良截然不同，他认为消灭[global.GetCPC]是头等大事，即使这可能让自己败于日本人手中。"
 CHI_chen_xunyong:0 "陈训泳"
 CHI_chen_xunyong_desc: "福建闽侯人，1886年生，字道培，福建船政后学堂第十六届驾驶班毕业，是“闽系”海军中仅次于陈绍宽的二号人物。\n\n他早年历任“普安”运输舰、“楚同”舰、“海筹”舰舰长。1927年加入国民革命军，任海军练习舰队司令，后长期兼任军事委员会委员、马尾要塞司令等职。1934年2月出任海军部常务次长，成为部长陈绍宽的主要副手。1935年9月6日，与陈季良同批授予海军中将，在闽系海军中的地位仅次于陈绍宽。"
 CHI_chen_jiliang:0 "陈季良"
 CHI_chen_jiliang_desc: "福建福州人，1883年生，原名陈世英，字季良，以字行。江南水师学堂第四届驾驶班毕业，“闽系”海军核心将领，长期统率海军第一舰队。\n\n早年因在“庙街事件”中资助苏联红军对日作战，遭北洋政府革职，后改名继续在海军任职。1926年加入国民革命军，1929年出任海军部常务次长，1932年1月6日改任海军部政务次长，仍兼第一舰队司令。1935年9月6日，晋升海军中将。"
 CHI_chan_chak:0 "陈策"
 CHI_chan_chak_desc: "广东文昌（今属海南）人，1893年生，字筹硕，广东海军学校第十五期肄业，广东舰队出身的海军名将，有“独脚将军”之称。\n\n他早年追随孙中山，1922年陈炯明叛变时，迎护孙中山登永丰舰，并指挥江防舰队反击叛军。此后长期作为广东地方海军实力派活动，1931年任广州政府海军总司令，1932年与陈济棠冲突失败后下野出国考察。回国后获南京任命为海军部次长，并当选国民党中央执委，开始参与制定海军抗日方略。"
 CHI_liang_xuzhao:0 "梁序昭"
 CHI_liang_xuzhao_desc: "福建闽侯人，1903年生，号翊周，烟台海军学校航海班毕业，闽系海军成员。1917年入马尾海军制造学校研习德文，后转入烟台海军学校，1925年毕业并加入国民党。1927年出任海军鱼雷游击舰队司令部副官，负责训练与操练。1931年调任“通济”练习舰枪炮正。"
 CHI_zhou_zhirou:0 "周至柔"
 CHI_zhou_zhirou_desc: "浙江临海人，1899年生，原名周百福，字至柔，以字行。保定军校第八期步兵科毕业，与陈诚为同期同学，是“土木系”核心成员。\n\n早年任黄埔军校教官，参加东征、北伐及中原大战，1932年任第十八军第十四师中将师长，1933年升第十八军副军长。同年经陈诚举荐，蒋介石特选其赴欧美考察空军，由此从陆军将领转向空军建设。1934年回国后出任中央航空学校校长，着手培育中国空军人才。"
 CHI_wang_shuming:0 "王叔铭"
 CHI_wang_shuming_desc: "山东诸城人，1905年生，原名王勋，号叔铭，黄埔军校第一期毕业，中国空军早期核心将领之一。1924年入黄埔一期，同年转入广东军事航空学校学习飞行，是国民政府培养的第一批飞行员。1925年赴苏联第二军事航空学校深造，后转入高级战斗轰炸学校及飞行侦察学校，系统掌握了战斗、轰炸、侦察等飞行技能。留苏期间曾加入中国共产党，1931年回国后因此被扣押，经毛邦初力保获释，转入杭州笕桥中央航空学校高级班学习，毕业后留校任教。1935年8月，王叔铭赴意大利考察空军及航空业。1936年4月回国后，出任中央航空学校洛阳分校主任，兼任空军轰炸机第二队队长，负责飞行人才培养与轰炸机部队指挥，成为空军中层骨干中兼具留学背景与实战经验的少壮派人物。"
 CHI_chen_qingyun:0 "陈庆云"
 CHI_chen_qingyun_desc: "广东香山（今珠海）人，1897年生，字天游，中国航空事业的先驱之一，广东革命空军出身，与陈策、张惠长为结义兄弟。\n\n他早年随父母侨居日本，结识孙中山后于1914年加入中华革命党，先后赴英国、日本及美国寇提斯飞行学校学习飞行，1917年毕业回国，任孙中山侍从武官，协助创办空军。此后历任援闽粤军飞行队长、北伐军飞机队副队长，1924年出任广东军事飞行学校总教官，1927年任广东航空学校教育长。1928年，他与黄光锐等人驾“珠江号”完成全国十大城市长途飞行，轰动一时。1929年后历任虎门要塞司令兼广东海军副司令、广东省政府委员等职。1934年，陈庆云出任军事委员会航空委员会主任，成为全国航空事务的实际负责人。1935年9月叙任空军上校。"
 CHI_huang_bingheng:0 "黄秉衡"
 CHI_huang_bingheng_desc: "浙江余姚人，1900年生，原名钧，字秉衡。\n\n早年就读于杭州师范附小、慈北锦堂小学，后入烟台海军小学堂，再赴日本陆军士官学校第十期步兵科留学，毕业后转赴美国航空学校学习飞行。1920年加入中国国民党，1922年返国后任孙中山广州大元帅府侍从，受孙中山委派创设广东航空学校，亲自任教并一度代理航空局长。北伐期间任国民革命军总司令部航空处处长。1929年出任军政部航空署署长，主持中央军校航空班（空军官校前身），因此被视为空军军官学校第二任校长。\n\n此后历任军事委员会空军事务处处长、国民政府参军处参军、全国航空建设委员会委员、中央航空学校教育长等职。1934年航空委员会成立后，黄秉衡即为委员之一，与周至柔、陈庆云、毛邦初、曹保清共同构成航空委员会的核心决策层，宋美龄任秘书长。1935年出任航空委员会副主任。1935年9月4日叙任空军上校。"
 CHI_mao_bangchu:0 "毛邦初"
 CHI_mao_bangchu_desc: "浙江奉化人，1904年生，别号信诚，蒋介石原配毛福梅的同宗侄子，黄埔军校第三期步兵科毕业，后赴苏联莫斯科中山大学学习。1929年起投身军事航空，1930年奉命筹建杭州笕桥航空学校，任第一任校长，1933年任中央航空学校副校长，1934年率学员赴意大利深造。1935年9月7日叙任空军上校。1936年12月，出任国民政府航空委员会委员，进入空军最高决策层。"
 CHI_gao_zihang:0 "高志航"
 CHI_gao_zihang_desc: "辽宁通化（今属吉林）人，1908年生，原名高铭久，字子恒。他是中国空军早期最杰出的飞行员之一，被誉为“东北飞鹰”“空军军魂”。1924年，高志航从奉天中法中学毕业后，考入东北陆军军官教育班。同年东北军扩建空军，招考飞行员赴法国学习，他将名字“铭久”改为“志航”，表明志在航空的决心，最终如愿赴法学习军事飞行。1929年学成回国，任东北航空处飞鹰支队少尉飞行员，飞行技术在同僚中极为突出。"
 CHI_chiang_paili:0 "蒋百里"
 CHI_chiang_paili_desc: "浙江海宁人，1882年生，名方震，字百里，以字行，号澹宁。民国时期最负盛名的军事理论家与军事教育家，有“兵学泰斗”之誉。1901年留学日本，入日本陆军士官学校第三期步兵科，与蔡锷为同窗挚友，并由此结识梁启超，拜其为师。毕业后赴德国实习陆军，回国后于1912年出任保定陆军军官学校校长。1913年，因北洋政府拒拨办学经费，他在全校师生面前拔枪自杀，以死明志，幸而未死。他的学生中包括陈铭枢、唐生智、张治中、陈诚等日后国共双方的著名将帅。此后他长期以“无党无派”的超然身份，先后辅佐过蔡锷、黎元洪、吴佩孚、孙传芳等人。1933年赴日考察后，即判定中日战争不可避免，并着手拟定国防计划。1935年出任国民政府军事委员会高等顾问。"
 CHI_yang_jie:0 "杨杰"
 CHI_yang_jie_desc: "云南大理人，1889年生，字耿光，白族，日本陆军士官学校及日本陆军大学毕业，是民国时期与蒋百里齐名的军事理论家，被誉为“军学泰斗”。1933年至1935年，杨杰率欧洲军事考察团遍访14国，归国后向蒋介石提交近十万字的《欧洲各国军事考察报告》，力主加强重工业与国防建设，并一度兼任防空委员会主任，推动全国防空体系建立。1935年1月起，他以参谋本部参谋次长身份兼任陆军大学教育长，实际主持这所最高军事学府的日常工作，蒋介石虽兼校长但并不过问校务。"
 CHI_xiong_shihui:0 "熊式辉"
 CHI_xiong_shihui_desc: "江西安义人，1893年生，字天翼，保定军校第二期、日本陆军大学毕业，国民党“新政学系”核心人物。1931年12月起出任江西省政府主席，并兼南昌行营办公厅主任，是蒋介石在江西“剿共”期间最重要的地方军政助手。"
 CHI_wu_dayou:0 "吴大猷"
 CHI_wu_dayou_desc: "广东番禺人，1907年生，中国近代物理学奠基人之一，被誉为“中国物理学之父”。1929年毕业于南开大学物理系，1931年赴美国密歇根大学留学，1933年获博士学位，是中国最早获得美国理论物理博士学位的三人之一。1934年秋，应恩师饶毓泰邀请回国，出任北京大学物理系教授，时年27岁。1934年起，他在北大物理系实验室开始了中国最早的拉曼光谱学研究。"
 CHI_alexander_von_falkenhausen:0 "亚历山大·冯·法肯豪森"
 CHI_alexander_von_falkenhausen_desc:0 "由亚历山大·冯·法肯豪森领导的德国军事代表团目前正在中国，其顾问正在帮助我们军队达到西方标准。"
 CHI_claire_chennault:0 "克莱尔·李·陈纳德"
 CHI_joseph_stilwell:0 "约瑟夫·史迪威"
 CHI_albert_coady_wedemeyer:0 "阿尔伯特·科蒂·魏德迈"
 CHI_albert_coady_wedemeyer_desc:0 "阿尔伯特·科蒂·魏德迈（Albert Coady Wedemeyer，1896年7月9日－1989年12月17日）是美国陆军指挥官，1943年10月至战争结束期间在第二世界大战期间在亚洲服役。 此前，他是战争计划委员会的重要成员，负责制定入侵诺曼第的计划。 1942 年春，他与马歇尔将军和一小群美国军人一起前往伦敦，与英国人协商，试图说服英国人支持跨海峡入侵，当时他是乔治·C·马歇尔将军的首席顾问。 魏德迈是一位坚定的反共主义者。 1944年至1945年间，他在中国担任蒋介石的参谋长，并指挥所有驻华美军。"
 CHI_pavel_zhigarev:0 "帕维尔·日加列夫"
 CHI_cuikefu:0 "瓦西里·崔可夫" 
 CHI_cuikefu_desc:0 "1927年，崔可夫来到中国，在国民革命军中担任军事顾问，帮助国民政府完成了全国统一。目前崔可夫担任驻华使馆武官兼国民政府军事总顾问，支援中国抗战。"
 CHI_gregory_thor:0 "格雷戈里·托尔"
 CHI_petr_anisimov:0 "彼得·阿尼希莫夫"
 CHI_zhao_hongwenguo:0 "赵洪文国"
 CHI_zhao_hongwenguo_desc: "辽宁岫岩人，1881年生，满族，人称“赵老太太”。她是抗日英雄赵侗之母，民间传说中的“双枪老太婆”原型之一。1931年“九一八”事变后，其三子赵侗回东北组织抗日义勇军，赵洪文国变卖家产充作经费，将家中作为抗日军的指挥所和交通站，并恢复赵家堡子小学，抵制日本奴化教育。1934年2月，日军烧毁赵家16间房屋；同年8月，赵洪文国一家六口被捕，株连乡亲300余人，她面对威逼利诱坚贞不屈，后获救出狱，随即带领儿媳、女儿潜往北平，继续从事抗日救亡活动。"
 CHI_chen_jieru:0 "陈洁如"
 CHI_chen_jieru_desc:0 "陈洁如，绰号“珍妮”。是蒋介石的第二任妻子，但蒋介石为了获得上海宋家财团以及美国的支持，来稳固其在国民党内的地位并继续北伐，要求她暂时离开中国五年，并承诺他娶宋美龄是出于政治上的考虑，并说：“我发誓，自今日起五年之内，必定恢复与洁如的婚姻关系。如果违反誓言，没有将她接回，祈求我佛将我殛毙，将我的南京政府打成粉碎。如果十年二十年之内，我不对她履行我的责任，祈求我佛推翻我的政府，将我放逐于中国之外，永不许回来。”，之后她去美国进行了为期五年的“学习之旅”，但蒋介石并没有履行誓言。 \n\n陈洁如的愿望最终未能实现。不过，随着蒋介石与宋美龄离婚，陈洁如似乎又有机会成为中华民国的第一夫人。"
 CHI_pavel_rychagov:0 "帕维尔·雷恰戈夫"
 CHI_yasuji_okamura:0 "冈村宁次"
 CHI_lisiguang:0 "李四光"
 CHI_lisiguang_desc:0 "李四光（1889年10月26日—1971年4月29日），字仲拱，原名李仲揆，湖北黄冈人。蒙古族，地质学家、教育家、音乐家、社会活动家，中国地质力学的创立者、中国现代地球科学和地质工作的主要领导人和奠基人之一，新中国成立后第一批杰出的科学家和为新中国发展做出卓越贡献的元勋。\n李四光1910年7月毕业于日本大阪高等工业学校；1911年，出任湖北军政府实业部长；1928年1月，任中央研究院地质研究所所长；1948年，当选为中央研究院院士；1950年5月，任中国科学院副院长；1951年4月，当选为世界科学工作者协会执行委员会副主席；1952年9月，任中华人民共和国地质部部长；1955年，被选聘为中国科学院学部委员（院士）；1958年9月，任中国科协主席；1969年4月，被选为中国共产党第九届中央委员会委员；1970年8月，任国务院科教组组长。\n李四光创立了地质力学，并为中国石油工业的发展作出了重要贡献；早年对蜓科化石及其地层分层意义有精湛的研究，提出了中国东部第四纪冰川的存在，建立了新的边缘学科“地质力学”和“构造体系”概念，创建了地质力学学派；提出新华夏构造体系三个沉降带有广阔找油远景的认识，开创了活动构造研究与地应力观测相结合的预报地震途径。"
 CHI_huang_baitao:0 "黄百韬"
 CHI_huang_baitao_desc: "原籍广东梅县，生于天津，1900年生，原名黄新，字焕然，号寒玉。他出身贫寒，早年就读于直隶省立工业专门学校，后投北洋江苏督军李纯部当兵，由传令兵逐级递升。黄百韬的军旅生涯几经辗转：先在北洋部队，后被奉系张宗昌俘虏而投奉，升任旅长；1928年张宗昌势力被消灭后，随徐源泉部加入国民革命军，任第八师参谋长。此后在第四十一师系统中逐步升迁，1931年任第一二三旅少将旅长，1935年6月升任第四十一师师长。"
 CHI_hu_lian:0 "胡琏"
 CHI_hu_lian_desc: "陕西华县人，1907年生，原名胡从禄，字伯玉，黄埔军校第四期步科毕业，陈诚“土木系”骨干将领。\n\n胡琏早年家境贫寒，1925年考入黄埔四期，毕业后参加北伐。1930年中原大战中，他率连队在商丘坚守阵地，获陈诚赏识，战后升任营长。此后追随陈诚参加对红军的第三、四、五次“围剿”，1932年任第十八军特务营营长，1933年升任第十一师第六十六团上校团长，率部在浙西南继续进攻红军。1935年5月17日叙任陆军步兵中校，仍任上校团长。"
 CHI_guo_rugui:0 "郭汝瑰"
 CHI_guo_rugui_desc: "四川铜梁人，1907年生，黄埔五期、日本士官学校肄业、陆军大学第十期毕业，是国军中学历最完整的“学院派”将领之一。1936年是其从军事教育转向野战部队的关键节点。3月25日叙任陆军步兵少校，4月11日调任陆军大学上校兵学教官，师从教育长杨杰，12月12日晋任陆军步兵中校。"
 CHI_wu_dingchang:0 "吴鼎昌"
 CHI_wu_dingchang_desc:0 "四川华阳（今属成都）人，原籍浙江吴兴，1884年生，字达诠，笔名前溪。清末秀才，日本东京高等商业学校毕业，商科进士，政学系核心人物。他是民国金融界与报界的双重巨头。1926年出资接办天津《大公报》，自任社长，与胡政之、张季鸾共同开创了《大公报》的鼎盛时代。1935年12月，他出任南京政府实业部部长，为此辞去《大公报》社长职务，由政入仕。"
 CHI_wang_shijie: "王世杰"
 CHI_wang_shijie_desc: "王世杰，字雪艇，湖北崇阳人。早年先后留学英国、法国，获巴黎大学法学博士学位，专攻宪法与比较法。1929年至1933年出任国立武汉大学首任校长，主持珞珈山新校舍建设，奠定武大早期基础。1933年起任国民政府教育部部长，推动教育法令整理与高等教育调整。"
 CHI_zhu_jiahua: "朱家骅"
 CHI_zhu_jiahua_desc: "浙江吴兴人，1893年生，字骝先，柏林大学地质学博士，中国近代地质学奠基人之一，国民党内“新CC系”首领。\n\n早年留学德国，回国后任北京大学地质系教授。1926年赴广东，历任中山大学教授、广东省民政厅长等职。1929年当选国民党中央执行委员，1930年任中央大学校长，1931年底出任教育部长，次年调任交通部长。1935年12月改任中央政治委员会代理秘书长，1936年春应蔡元培之聘兼任中央研究院总干事。"
 CHI_hang_liwu: "杭立武"
 CHI_hang_liwu_desc: "安徽滁县（今滁州）人，1904年生，祖籍浙江杭州，政治学家、教育家。金陵大学政治系毕业后赴英国伦敦大学政治经济学院留学，获博士学位，并在美国威斯康辛大学从事名誉研究。1930年回国后，受聘为中央大学政治系教授兼系主任。1931年转任管理中英庚款董事会总干事，主持这一中英联合管理机构的文化教育事业补助与留学生选派工作。1932年，他与高一涵、王世杰、罗隆基、萧公权等四十五位学者共同发起成立中国政治学会，并当选第一届干事会总干事（即首任理事长）。"
 CHI_he_jian:0 "何键"
 CHI_he_jian_desc: "§Y生卒年：§L\n生于：1887年4月10日 湖南醴陵\n卒于：1956年4月25日 台湾台北\n§Y母校：§L\n保定军官学校\n§Y军阶：§L\n1935年4月3日 二级上将\n§Y军旅生涯：§L\n1928-1937 第四路军总指挥"
 

 SHX_character:0 "晋系顾问"
 SHX_chen_changjie:0 "陈长捷"
 SHX_chen_changjie_desc: "陈长捷（1897—1968），字介山，福建闽侯人，晋绥军将领。\n\n早年就读于福州师范学堂，后考入保定军校第七期，与傅作义、李生达等为同学。1919年毕业后，经傅作义引荐进入阎锡山晋军，此后一直在晋军中服务，历任参谋、营长、团长等职，并参与中原大战。\n\n1935年4月，陈长捷叙任陆军少将。1936年7月，因第七十二师师长李生达遇刺身亡，陈长捷升任第七十二师中将师长。"
 SHX_chu_xichun:0 "楚溪春"
 SHX_chu_xichun_desc: "楚溪春（1896—1966），原名河，字晴波，直隶蠡县（今河北蠡县）人，保定军校第五期步兵科毕业，阎锡山晋军“十三太保”之一。1918年毕业后加入晋军，历任山西第七师参谋长、北平宪兵司令等职。1934年入南京陆军大学学习，后留校任教官。1936年8月授陆军少将，仍任陆军大学教官。"
 SHX_fan_xiangli:0 "樊象离"
 SHX_fan_xiangli_desc: "樊象离，字虚心，山西解县（今运城）人。早年投身阎锡山幕府，是阎锡山主政山西时期的重要辅弼人才之一。他历任多项要职：1927年任《民话》日报董事长，1928年4月出任国民政府内政部警政司司长，1929年1月升任内政部政务次长，1931年4月转任国民政府文官处参事。1935年2月，他出任山西省政府委员，1936年3月7日兼任山西省政府建设厅厅长，成为阎锡山政权中主管全省经济建设的关键人物。"
 SHX_ji_gongquan:0 "冀贡泉"
 SHX_ji_gongquan_desc: "冀贡泉（1882—1967），字育堂，号醴亭，山西汾阳人，法学家、教育家。清末秀才，1905年官费留学日本明治大学攻读法律，1912年回国后曾在教育部与鲁迅共事，旋返晋投身法学教育，长期执掌山西法政专门学校及山西大学法科。1928年出任山西省司法厅长、高等法院院长，后自请裁撤司法厅，引退至山西大学法学院任教。1932年4月，冀贡泉被任命为山西省政府委员兼教育厅长。"
 SHX_jia_jingde:0 "贾景德"
 SHX_jia_jingde_desc: "贾景德（1880—1960），字煜如，号韬园，山西沁水人，晚清进士。1904年中甲辰恩科进士，分发山东任知县。1912年应阎锡山邀请回晋，任山西都督府秘书监，从此成为阎锡山幕僚。此后历任山西政务厅厅长、警务处处长、国民革命军第三集团军秘书长、平津卫戍总司令部秘书长等职，长期辅佐阎锡山，有“阎锡山永远的秘书长”之称。"
 SHX_li_fuying:0 "李服膺"
 SHX_li_fuying_desc: "李服膺（1890—1937），字慕颜，又名兴菴，山西崞县（今原平）兰村人，保定军校步兵科第五期毕业。\n\n早年投身阎锡山晋军，由基层逐级擢升。1930年任阎锡山部第5军军长。1931年改任国民革命军第68师师长。1933年长城抗战期间，晋绥军编为华北军第七军团参战，第68师编成第六十一军，李服膺出任军长，率部在察哈尔方向布防。1935年晋升陆军中将。"
 SHX_liang_huazhi:0 "梁化之"
 SHX_liang_huazhi_desc: "梁化之（1906—1949），名敦厚，字化之，山西定襄人。其父是阎锡山的姨表兄，他自幼即与阎家关系密切，在山西大学读书时便住在阎锡山公馆。1932年阎锡山复出后，大学刚毕业的梁化之即进入太原绥靖公署，出任阎锡山的机要秘书，掌管阎的私人印信与特费开支，成为阎锡山身边最亲近的幕僚之一。\n\n1936年春，山西自强救国同志会成立，阎锡山自任会长，梁化之以绥署秘书兼任总干事，实际主持会务。同年9月，山西牺牲救国同盟会（牺盟会）宣告成立，梁化之再任总干事，成为代表阎锡山与中共方面联络的主要人物，牺盟会的钱款与武器均经他手向阎锡山争取，因此被人戏称为“运输大队长”。"
 SHX_qiu_yangjun:0 "邱仰浚"
 SHX_qiu_yangjun_desc: "邱仰濬（1896—1949），字沦川，山西沁县人，阎锡山政权中的核心文职官员。\n\n他早年入山西省法政专门学校，毕业后留学日本明治大学，先习法律后转学政治。回国后曾执教于山西省立法政专门学校及山西大学。1925年，被阎锡山派任五台县县长，由此进入阎锡山的行政体系。\n\n1928年阎锡山出任平津卫戍司令后，邱仰濬被任为平津卫戍司令部总务处处长，同年11月7日升任山西省政府委员兼民政厅厅长，首次执掌一省民政。1931年1月去职。1936年6月26日，他再度出任山西省政府委员兼民政厅厅长，重返阎锡山政权的核心行政岗位。"
 SHX_sun_chu:0 "孙楚"
 SHX_sun_chu_desc: "孙楚（1890—1962），字萃崖，山西解县（今运城）人，保定军校第一期步兵科毕业。1914年入晋军第十二混成旅任见习排长，此后长期在阎锡山麾下逐级擢升。1927年任第三集团军第二军第六师中将师长，1928年兼任军事委员会委员。中原大战后，晋绥军被张学良整编，孙楚改任正太护路军司令，驻榆次整训部队。1931年阎锡山重返山西后，组织晋绥军事整理委员会，孙楚任副主任委员，协助杨爱源重掌晋绥军实权。1935年4月，叙任陆军中将。同年7月，阎锡山任命孙楚为“陕北剿匪前敌总指挥”，率晋军十二个团渡河入陕，进驻吴堡、绥德一线，对陕北红军采取碉堡封锁战术。"
 SHX_wang_huaiming:0 "王怀明"
 SHX_wang_huaiming_desc: "王怀明（1891—1982），字念文，山西新绛人。早年毕业于山西法政专门学校，后赴美国芝加哥西北大学法学院留学，1922年获硕士学位。回国后任山西大学法学院教授、山西高等法院第二分院院长。"
 SHX_wang_jingguo:0 "王靖国"
 SHX_wang_jingguo_desc: "王靖国（1893—1952），字治安，山西五台人，保定军校第五期步兵科毕业，阎锡山“十三太保”之一。1918年自保定军校毕业后回晋军任职，因治军严整获阎锡山赏识。1926年升任旅长，1927年升第五师师长，1928年升第六军军长。中原大战后晋绥军缩编，王靖国改任第70师师长，驻防绥远包头。1932年阎锡山设立“绥西屯垦督办公署”后，王靖国以第70师师长兼会办身份坐镇包头，实际主持绥西屯垦，势力扩展至五原、临河、固阳及伊盟东胜一带，人称 “绥西王” 。1934年升第十九军军长。1935年4月授陆军中将。"
 SHX_wang_qian:0 "王谦"
 SHX_wang_qian_desc: "王谦（1917—2007），山西平定人。1935年从平定中学毕业后，受“一二·九”运动及华北危局影响，投身抗日宣传活动，于1936年11月加入中国共产党，并加入牺盟会，任平定县牺盟会常委。"
 SHX_yan_xishan:0 "阎锡山"
 SHX_yan_xishan_desc:0 "阎锡山（1883—1960），字百川、伯川，号龙池，山西五台（今属定襄）人，日本陆军士官学校第六期毕业，晋系军阀首领，陆军一级上将。1911年辛亥太原起义后被举为山西都督，1917年兼任山西省长，从此长期掌控山西军政，推行“六政三事”，兴办山西省银行、太原兵工厂及西北实业公司，使山西获得“模范省”之誉。1930年中原大战反蒋失败后避居大连，1932年出任太原绥靖公署主任，重新掌握山西大权。"
 SHX_yang_aiyuan:0 "杨爱源"
 SHX_yang_aiyuan_desc:0 "杨爱源（1887—1959），字星如，别号革非，山西五台人，保定军校第一期毕业，晋绥军核心将领，阎锡山最倚重的五台籍嫡系之一。1914年毕业后应阎锡山之邀回晋，由排长逐级升至军长，长期主持晋绥军训练与整军事务。1932年兼任晋绥军事整理委员会主任委员，成为阎锡山重整晋绥军的实际操盘手。1935年11月当选国民党第五届中央执行委员，同年12月授陆军二级上将，仍任第三十四军军长。"
 SHX_zhao_chengshou:0 "赵承绶"
 SHX_zhao_chengshou_desc: "赵承绶（1891—1966），字印甫，山西五台槐荫村人，晋绥军骑兵将领，阎锡山五台籍嫡系之一。1908年考入太原陆军小学堂，后升入清河陆军中学堂。辛亥革命山西新军起义后，回省参加忻代宁公团，任教练官，率左翼游击队为前锋参与攻取大同。1915年入保定军校第五期骑科，1918年毕业后入晋军，由基层逐级擢升。1927年阎锡山易帜参加北伐，赵承绶任第二师师长。1928年出任晋绥军骑兵司令，驻防大同，此后长期执掌晋绥骑兵。1930年中原大战后，赵承绶兼任平绥护路司令、大同警备司令等职，坐镇晋北重镇。"
 SHX_zhao_daiwen:0 "赵戴文"
 SHX_zhao_daiwen_desc: "赵戴文（1867—1943），字次陇，号清凉山人，山西五台人，阎锡山最为倚重的核心幕僚，有“阎锡山的军师、宰相”之称。\n\n早年肄业于晋阳书院、令德堂，1905年留学日本弘文学院，次年加入同盟会，与阎锡山结识并共同策动山西革命。辛亥太原起义后，历任山西都督府秘书长、督军公署参谋长、察哈尔都统等职，长期参与阎锡山军政机密。北伐后曾任国民政府内政部长、监察院院长，1932年起任太原绥靖公署总参议，为阎锡山在南京中枢的代表。"
 SHX_zhong_jihan:0 "仲跻翰"
 SHX_zhong_jihan_desc: "仲跻翰（1885—1974），字墨园，山东黄县人，晋绥军航空先驱。\n\n早年弃商从戎，先后就读于黑龙江陆军小学、北京清河陆军预备学校及保定军校，因基础稍差由步科五期转入七期毕业。1923年经同学介绍投奔晋军，历任连长、营长、上校团长。1926年秋，已年过四十的他入山西航空预备学校学习飞行，成为中国航空教育史上年龄最大的学员。\n\n此后他长期在晋绥军航空系统任职：1928年任第三集团军总司令部航空处处长，1929年任山西航空学校校长，1930年任山西陆军航空大队大队长，1932年3月起任晋绥军航空队队长。1934年夏参加庐山军官训练团，1935年赴日本考察军事航空，归国后著《日本考察记》。"
 SHX_zhou_dai:0 "周玳"
 SHX_zhou_dai_desc: "周玳（1887—1972），字子梁，山西代县人，晋绥军炮兵司令。\n\n早年入山西陆军小学，加入同盟会，参加1911年太原起义。后毕业于保定军校第一期炮兵科，回晋军长期执掌炮兵，由连长逐级升至炮兵司令。1928年任晋绥军总参议兼兵站总监，成为阎锡山核心嫡系之一。1930年中原大战中，他集中9个炮兵团300多门大炮猛轰中央军，晋绥军炮兵声威大震。1936年1月24日叙任陆军中将，仍任山西炮兵司令。"
 SHX_zhu_shouguang:0 "朱绶光"
 SHX_zhu_shouguang_desc: "朱绶光（1886—1948），字兰荪，湖北襄阳人，晋绥军核心幕僚。\n\n早年留学日本陆军士官学校第六期炮兵科，与阎锡山为同窗，并加入同盟会。1926年应阎锡山邀请赴山西，出任晋军参谋长，成为阎锡山的主要幕僚长。1928年北伐时率部进入北京，代阎锡山坐镇平津，并奉命查办孙殿英东陵盗宝案。中原大战后一度寓居北平，1932年阎锡山复出后，朱绶光任太原绥靖公署参谋长，兼晋绥军事整理委员会委员。1936年1月，叙任陆军中将，仍任太原绥靖公署参谋长。"
 SHX_Peng_Yubin:0 "彭毓斌"
 SHX_Peng_Yubin_desc: "彭毓斌（1900—1945），字绍周，号沧江钓徒，湖北黄陂人，晋绥军骑兵将领，保定军官学校第六期骑兵科毕业。\n\n彭毓斌早年投身军旅，后在晋军中服役，长期追随骑兵司令赵承绶。1927年任山西督军署主任参谋，此后在赵承绶骑兵军中历任团长、旅长、副师长等职。1930年中原大战时，他任反蒋联军第三方面军骑兵第三师师长，战后晋绥军整编，改任山西警备骑兵第三旅旅长，后任晋绥骑兵第一师骑兵第二旅旅长。1935年4月，彭毓斌叙任陆军少将。"
 SHX_bo_yibo:0 "薄一波"
 SHX_bo_yibo_desc: "薄一波（1908.2～2007.1），原名薄书存。山西省定襄县人。民国14年（1925年）加入中国共产党。民国16年（1927年）在太原参与领导工人和学生运动。民国17年（1928年）底到天津顺直省委军事委员会工作。任中共天津市委士兵工作委员会书记，党中央北方局军委秘书长，组织领导山西平定起义和冀东唐山、平汉路元氏两次兵暴，并指导平汉路兵运工作，曾先后4次被国民党当局逮捕，在狱中坚持斗争。民国25年（1936年）秋，任中共山西省委公开工作委员会书记。民国26年（1937年），“七·七”事变后，组建和领导山西青年抗敌决死队（又称山西新军），任第1总队政治委员。12月，任山西决死第1纵队政治委员兼纵队长。民国27年（1938年）2月，任决死第1纵队政治委员、山西第3行政区公署主任。民国29年（1940年），任决死第1纵队司令员兼政治委员。民国30年（1941年）1月任决死第1纵队兼太岳军区司令员兼政治委员，8月，任太岳纵队兼太岳军区政治委员。民国31年（1942年）任晋冀鲁豫边区行政委员会副主席，太岳区党委书记，中共太行分局委员。民国32年（1943年），赴延安参加整风学习。民国34年（1945年）6月，被选为中共第七届党中央委员。抗日战争胜利后，任中共晋冀鲁豫党中央局副书记、晋冀鲁豫军区第一副政治委员。民国37年（1948年）5月后任中共中央华北局第二书记、第一书记、华北军区政治委员兼华北人民政府副主席。参加平津战役、太原战役的组织工作。曾任平津卫戍区政治委员。民国38年（1949年），兼任绥远军区政治委员。中华人民共和国成立后，历任党中央人民政府委员、政务院政务委员、全国编制委员会主任、财政经济委员会副主任、财政部部长、国家建设委员会主任、国家经济委员会主任。"

 SHD_character:0 "山东顾问"
 SHD_han_fuju:0 "韩复榘"
 SHD_han_fuju_desc:0 "韩复榘（1890—1938），字向方，河北霸州人，冯玉祥“十三太保”之一。\n\n早年投奔冯玉祥，以作战勇猛且兼通文墨逐级擢升。1927年后历任第二集团军第三方面军总指挥、河南省政府主席等职。1930年中原大战中倒冯投蒋，被任命为山东省政府主席，此后长期主政山东，人称“山东王”。1935年授二级上将衔，同年华北事变后曾取缔抗日宣传以讨好日本。"
 SHD_sun_tongxuan:0 "孙桐萱"
 SHD_sun_tongxuan_desc: "孙桐萱（1895—1978），字荫亭，河北交河（今泊头）人，西北军将领。\n\n早年入冯玉祥第十六混成旅当兵，1925年升任团长，后历任国民军第十五师、第二十师师长。1929年随韩复榘脱离冯玉祥投靠蒋介石，1930年随韩进入山东，任第二十师师长兼济南警备司令，1935年晋升中将。"
 SHD_gu_liangmin:0 "谷良民"
 SHD_gu_liangmin_desc: "谷良民（1889—1975） ，字敬轩，山东巨野人，西北军出身。因排行第五，被冯玉祥呼为“小五儿”。1907年经其三哥谷良友引荐，入奉天新民府冯玉祥营当兵，因身手矫健被调为冯玉祥卫士，先后参加滦州起义、讨袁护国、讨伐张勋、倒曹反直及北伐诸役，从士兵升至师长。1929年随韩复榘脱离冯玉祥，加入韩部第三路军，任第一混成旅旅长，1930年升任第二十二师师长。1936年1月25日晋升陆军中将，仍任第二十二师师长，驻防山东。"
 SHD_cao_fulin:0 "曹福林"
 SHD_cao_fulin_desc: "曹福林（1891—1964），字乐山，河北景县人，行伍出身。1912年入陆建章部当兵，后转入冯玉祥麾下，由士兵逐级升至团长。1924年后长期追随韩复榘，北伐期间任第二集团军第十四师师长，隶属韩复榘部，进入河南、山东作战。北伐结束后军队缩编，改任第二十九师师长，随韩复榘投靠蒋介石。1935年4月晋升陆军中将，1936年仍任第二十九师师长，驻防山东，是韩复榘第三路军中与孙桐萱、谷良民并列的核心将领，也是韩复榘最为倚重的部下之一。"
 SHD_wu_huawen:0 "吴化文"
 SHD_wu_huawen_desc: "吴化文（1904—1962），字绍周，山东掖县人，幼年随父迁居安徽蒙城。1920年入冯玉祥西北军当兵，由士兵逐级升迁，1927年毕业于陆军大学正则班第七期，回冯部任洛阳初级军校教育长兼特务团团长。1930年中原大战后随韩复榘投蒋，任国民革命军第三路军手枪旅第二团团长，中原大战期间升任手枪旅旅长兼济南警备司令。1936年2月1日授陆军少将，仍任手枪旅旅长兼济南警备司令，驻防济南。"
 SHD_liu_zhongying: "刘仲莹"
 SHD_liu_zhongying_desc: "刘仲莹（1911—1938），原名刘盛玉，化名范明生、李济安，山东莱芜鹁鸽楼村人。1929年考入济南省立高中，师从左翼作家胡也频。1930年经胡也频介绍加入中国共产党。1931年回莱芜建立中共莱芜特别支部并任书记，一年内发展党员近百名。1932年成立中共莱芜县委，任书记。1933年山东省委遭破坏后，变卖家产赴上海寻找上级党组织，未果。1935年冬，与赵健民等人在其家中成立中共山东省工作委员会，被推选为书记，代行省委职责。"
 SHD_he_siyuan: "何思源"
 SHD_he_siyuan_desc: "何思源（1896—1982），字仙槎，山东菏泽人。\n\n早年就读于北京大学，投身五四运动。后留学美国芝加哥大学获哲学硕士，并赴德国柏林大学、法国巴黎大学深造。1926年归国，任教于中山大学。1928年经戴季陶引荐，被蒋介石任命为山东省教育厅厅长，开始长达十四年的教育主政生涯。\n\n在任期间提出“求生教育”思想，主张教育须与生产实践结合、以爱国主义为核心，摒弃传统“读书做官”观念。他主持制定《山东省教育行政纲要》，推动成立国立青岛大学（今山东大学），极大推动了山东教育事业的发展。1928年5月，他随北伐军入鲁，亲历“五三惨案”，此后积极推动省内各公学建立惨案纪念碑，以志国耻。"

 HBC_character:0 "河北顾问"
 HBC_song_zheyuan:0 "宋哲元"
 HBC_song_zheyuan_desc:0 "宋哲元（1885—1940），字明轩，山东乐陵人，冯玉祥西北军“五虎将”之一。\n\n早年入北洋陆军随营武备学堂，后长期追随冯玉祥，由哨长逐级升至师长、热河都统、陕西省政府主席。1930年中原大战冯玉祥战败后，西北军余部被张学良整编为第二十九军，宋哲元出任军长。1933年长城抗战爆发，他率第二十九军在喜峰口、罗文峪一带与日军血战，因武器装备简陋，特令为士兵打造大刀，以夜战、近战、肉搏战重创日军，取得“喜峰口大捷”，二十九军大刀队由此名震中外，成为九一八事变后中国军队的首场重要胜利。\n\n1935年《何梅协定》后，华北局势剧变。宋哲元于同年11月出任冀察绥靖主任，12月出任冀察政务委员会委员长兼河北省政府主席，同时仍兼第二十九军军长，成为河北、察哈尔两省及平津两市的实际掌控者。"
 HBC_zhang_zizhong:0 "张自忠"
 HBC_zhang_zizhong_desc: "张自忠（1891—1940），字荩忱，山东临清人。\n\n早年就读于天津法政学堂，1911年加入同盟会，后投笔从戎，入冯玉祥西北军，由排长逐级升至师长。1930年中原大战后，西北军余部被改编为第二十九军，张自忠任第三十八师师长。1933年率部参加长城抗战，在喜峰口一带与日军血战，二十九军大刀队由此名震全国。\n\n1935年冀察政务委员会成立后，张自忠出任察哈尔省政府主席。1936年6月，因日方施压导致原天津市市长萧振瀛去职，宋哲元向南京国民政府举荐张自忠接任，6月18日获任命为天津市市长，同时率第三十八师驻防天津。在任期间整顿吏治，发展民族工商业与社会福利，并部署大沽口防务以应对日军威胁。"
 HBC_feng_zhian:0 "冯治安"
 HBC_feng_zhian_desc: "冯治安（1896—1954），原名治台，字仰之，直隶故城（今属河北）人。\n\n早年因家贫投奔冯玉祥部，从伙夫干起，逐级升至师长。中原大战后，冯玉祥余部被改编为第二十九军，冯治安出任第三十七师师长。1933年率部参加长城抗战，在喜峰口与日军血战。1935年授陆军中将，1936年11月接替宋哲元出任河北省政府主席兼保安司令，同时兼任北平警备司令，率第三十七师驻防北平南苑至保定一线。"
 HBC_liu_ruming:0 "刘汝明"
 HBC_liu_ruming_desc: "刘汝明（1895—1975），字子亮，河北献县人，西北军“十三太保”之一。\n\n早年入冯玉祥部，由士兵逐级升至师长。1930年中原大战后，西北军余部改编为第二十九军，刘汝明任副军长。1933年长城抗战中，率部在喜峰口重创日伪军。1936年6月，接替张自忠出任察哈尔省政府主席，仍兼第二十九军副军长，率部驻防察省，屏障华北西北门户。"
 HBC_zhao_dengyu:0 "赵登禹"
 HBC_zhao_dengyu_desc: "赵登禹（1898—1937），字舜臣，山东菏泽人。1914年投冯玉祥部，由士兵逐级升至师长，因曾徒手打虎，人称“打虎将军”。\n\n1933年长城抗战中，任第29军第37师109旅旅长，率部夜袭喜峰口，以大刀队重创日军，战后升任第132师师长。1936年，赵登禹晋升陆军中将，率第132师移驻北平周边，并兼任河北省政府委员，成为宋哲元二十九军体系中驻守平津门户的核心将领之一。"
 HBC_shi_yousan:0 "石友三"
 HBC_shi_yousan_desc: "石友三（1891—1940），字汉章，吉林长春人，西北军将领，冯玉祥“十三太保”之一，以反复无常闻名，人称“倒戈将军”。\n\n1912年投入冯玉祥部，由马夫、护兵逐级擢升，1924年已任第八混成旅旅长兼包头镇守使，与韩复榘、刘汝明等人并称“十三太保”。此后他三次叛冯：1926年南口大战期间投靠阎锡山，同年冯玉祥回国后又跪求归附；1929年与韩复榘一同叛冯投蒋，被任命为安徽省主席，旋即又通电反蒋，率部炮轰南京；1930年中原大战中再度投冯反蒋，任第四方面军总司令，冯阎失败后又接受张学良改编。\n\n1931年7月，石友三在冯玉祥策动下举兵反张（学良）倒蒋，沿平汉线北进，遭东北军与刘峙部南北夹击，兵败后退入山东，残部四千人被韩复榘收编。此后他蛰居山东，1932年秋化装潜入天津日租界，与日本特务土肥原贤二建立联系，在冀东一带组织武装骚扰华北。\n\n1936年10月，冀察政务委员会在冀北边区设立保安司令部，石友三被任命为司令，驻防河北南部大名一带，统率所部五六千人。"
 HBC_sun_dianying:0 "孙殿英"
 HBC_sun_dianying_desc: "孙殿英（1889—1947），名魁元，字殿英，河南永城人，乳名金贵，因出天花人称“孙大麻子”。\n\n早年混迹赌场、贩运鸦片，后投豫西镇守使丁香玲部，由副官升至机枪连长，趁机收容土匪、会道门徒，拉起一支亦兵亦匪的武装。1924年趁第二次直奉战争之机哗变东窜，队伍扩至数千人，后投奔山东张宗昌。\n\n1928年，孙殿英率部驻防蓟县马伸桥，以“军事演习”为名封锁清东陵，指挥工兵炸开慈禧太后与乾隆帝陵墓，盗走大量稀世珍宝，举国震惊，被称为“东陵大盗”。事后以重金行贿各方，此案不了了之。\n\n1930年中原大战中投靠阎、冯反蒋，失败后退入山西，经张学良收编任第四十师师长。“九一八”后升第四十一军军长。1933年率部参加热河抗战，在赤峰一带与日军血战，后因兵力悬殊退往察哈尔。1934年，蒋介石任命其为青海屯垦督办，实则密令马鸿逵等中途截击，孙部西进受阻，与马家军交战失利，残部被阎锡山收编，本人被明令撤职。\n\n1936年6月，冀察政务委员会委员长宋哲元任命孙殿英为察北保安司令，驻防察哈尔北部。"
 HBC_gao_shuxun:0 "高树勋"
 HBC_gao_shuxun_desc: "高树勋（1898—1972），字建侯，河北盐山人。\n\n1915年入冯玉祥部当兵，由士兵逐级升至师长，参加五原誓师、北伐等役。1930年中原大战后，西北军余部被改编为第二十六路军，高树勋任第二十七师师长。1931年因不愿打内战，脱离部队赴天津。1933年赴张家口，协助冯玉祥组建察哈尔民众抗日同盟军，任骑兵第二挺进军司令，参加收复多伦的战斗。"
 HBC_wan_fulin:0 "万福麟"
 HBC_wan_fulin_desc: "万福麟（1880—1951），字寿山，吉林农安（今长岭）人，祖籍直隶宁河。\n\n幼年家贫，曾为地主扛活、放猪。1900年入靖威军当兵，后转入吴俊升部，由士兵逐级升至旅长、师长。1926年任东北陆军第八军军长，授陆军中将。1928年随张学良东北易帜，任东北边防军副总司令，1929年出任黑龙江省政府主席。九一八事变时，他远在北平未能返省，黑龙江省军政先后由马占山代理。1933年任第五十三军军长，率部参加长城抗战。1935年4月晋升陆军二级上将，同年12月出任冀察政务委员会委员，仍兼第五十三军军长，驻防保定地区。"
 HBC_gao_wenhua: "高文华"
 HBC_gao_wenhua_desc: "高文华（1904—1994），原名廖剑凡，湖南益阳人。1925年转入中国共产党。\n\n他早年投身工农运动，大革命失败后辗转于长江中下游各省，长期从事党的地下工作。1934年秋，高文华奉命前往天津，进入河北省委工作。1935年2月，他接替朱理治担任中共河北省委书记；同年5月，又兼任中共中央北方局书记，成为华北地区中共地下党组织的核心领导人。\n\n在华北局势危殆、组织屡遭破坏的艰难环境下，高文华领导重建了北方局与河北省委，并参与发动和组织了“一二·九”抗日救亡运动，为华北抗日救亡运动作出了重要贡献。"
 HBC_sun_xizhen: "孙席珍"
 HBC_sun_xizhen_desc: "孙席珍（1906—1984），原名彭，学名志新，笔名丁非、丁飞等，浙江绍兴人。\n\n1922年入北京大学，任《晨报副刊》校对，参与组织绿波社，编辑《京报·文学周刊》。16岁起发表新诗，被鲁迅、刘半农等称为“诗孩”，小说《槐花》使其有“京华才子”之誉。1925年投身革命，1926年转为中共党员，参加北伐，任连、营政治指导员，后主编南昌版《革命军日报》，并参加八一南昌起义。起义失败后流亡日本，1930年回国，参与发起北方左联，任常委兼书记，先后任教于北平师大、中国大学、东北大学等校。1934年被捕，次年出狱。\n\n1936年，孙席珍与曹靖华、李何林等发起成立北平作家协会，任常委兼书记；同年秋，受中共北方局指示，赴泰山做冯玉祥的抗日统战工作。"
 HBC_zhang_xiuzhong: "张秀中"
 HBC_zhang_xiuzhong_desc: "张秀中（1905—1944），原名张毓坤，笔名草川未雨、荒村寒烟，河北定兴人，中共党员，作家。\n\n1921年入保定育德中学，1923年开始新诗创作，1925年赴北京大学旁听，曾得鲁迅指教。1930年加入中国共产党，任北平东城区委宣传部长，同年加入北方左联。1931年任河北省委交通秘书、副秘书长，参与编辑省委机关刊物《北方红旗》，并两度担任北方左联党团书记。1933年任北平市委宣传部长，主编左联刊物《理论与创作》。\n\n1934年5月，张秀中在北平西单传递情报时被捕，机警吞下密件，仍被以“左联执委政治犯”罪名押解至南京陆军监狱。"

 SUY_character:0 "绥军顾问"
 SUY_fu_zuoyi:0 "傅作义"
 SUY_fu_zuoyi_desc:0 "傅作义（1895—1974），字宜生，山西荣河（今临猗）人，保定军校第五期步兵科毕业，晋绥军将领。\n\n早年入太原陆军小学，参加辛亥革命。1918年保定军校毕业后回晋军，由排长逐级升至师长。1927年北伐中率部坚守涿州三个月，以善守闻名。1930年中原大战后，晋绥军缩编，傅作义率部移驻绥远。1931年任第三十五军军长兼绥远省政府主席，开始主政绥远。"
 SUY_Dong_Qiwu:0 "董其武"
 SUY_Dong_Qiwu_desc: "董其武（1899—1989），山西河津人。1919年入太原阎锡山学兵团，1924年参加国民军第二军，1928年起在傅作义部历任参谋、团长、旅长，同年加入国民党。"
 SUY_Sun_Lanfeng:0 "孙兰峰"
 SUY_Sun_Lanfeng_desc: "孙兰峰（1895—1987），字畹九，山东滕县（今滕州）人，傅作义部核心将领，与董其武并称傅作义的“两只虎”。\n\n他出身贫寒，1912年17岁时在太原报名从军，后入阎锡山部，由士兵逐级擢升，因作战勇猛，人称“孙兰峰，急火星”。后追随傅作义，历任连长、营长、团长等职。1933年长城抗战中，他率部在古北口一带与日军血战，因战功卓著崭露头角。"
 SUY_an_chunshan:0 "安春山"
 SUY_an_chunshan_desc: "安春山（1907—1979），号尔仁，山西闻喜（一说夏县）人，太原北方军官学校第二期步科毕业，傅作义部将领。1927年毕业后加入傅作义部，由基层逐级擢升。1934年任第73师218旅436团上尉连长，随傅作义参加长城抗战，在怀柔一带重创日军。"
 SUY_guo_jingyun:0 "郭景云"
 SUY_guo_jingyun_desc: "郭景云（1904—1948），字秀山，陕西富平人，傅作义部将领。\n\n早年入北洋陆军第十五混成旅，后随国民三军转投晋绥军，历任班长、排长、连长、营长等职。1935年5月升任第一〇一师第三旅第三团上校团长。1936年11月，第三旅改称独立第七旅，郭景云改任第六二〇团上校团长。"
 SUY_ma_zhanshan:0 "马占山"
 SUY_ma_zhanshan_desc: "马占山（1885—1950），字秀芳，祖籍河北丰润，生于吉林怀德（今公主岭），行伍出身，精于骑射。\n\n早年因丢失马匹遭官府逼赔，愤而上山落草，1905年被清军收编。此后在奉军中逐级擢升，历任连长、营长、团长、旅长、师长，官至东北军骑兵第二军军长。1929年被张学良任命为黑龙江省骑兵总指挥兼黑河警备司令。九一八事变后，马占山临危受命代理黑龙江省主席兼军事总指挥，1931年11月率部在江桥奋起抗击日军，打响了中国武装抗日的第一枪，一时名震全国。此后他一度诈降伪满，旋于1932年4月通电反正，组织抗日义勇军继续作战，终因力尽援绝退入苏联。1933年绕道欧洲返沪，被任命为军事委员会委员，闲居天津。"
 SUY_yuan_qingrong:0 "袁庆荣"
 SUY_yuan_qingrong_desc: "袁庆荣（1908—1989），号欣然，河北河间人，傅作义部将领，与兄长袁庆曾、弟弟袁庆和并称傅作义麾下“袁氏三雄”。\n\n他早年毕业于太原北方军官学校第一期，后入陆军大学正则班第九期深造，长期在晋绥军任职。1928年即任国民革命军第三集团军第四师团长。1936年，袁庆荣任傅作义第35军独立第211旅参谋长，成为该旅的核心幕僚。"
 SUY_yuan_qingzeng:0 "袁庆曾"
 SUY_yuan_qingzeng_desc: "袁庆曾（1893—1975），又名庆增，号祝三，河北河间人，傅作义军事集团核心成员，与弟袁庆荣、袁庆和并称“袁氏三雄”。\n\n他毕业于保定军校第五期，与傅作义为同学，在傅系中资格极老。1927年涿州之战中，他作为先遣团团长参与攻城，被围后出任城防司令，为傅作义“守涿州”扬名立下大功。\n\n北伐后傅作义坐镇天津，袁庆曾以清廉自守深受信任，傅作义由此发现他不仅善于治军、亦能胜任地方官，遂有意培养其由军入政。"
 SUY_feng_xi:0 "冯曦"
 SUY_feng_xi_desc: "冯曦（1881—1961），字紫禾，山西代县人，绥远省政府核心文职官员。\n\n他出身于代州书香门第，清末以优贡授陕西候补知县。辛亥革命后致力新学，入山西太原优级师范学习，毕业后留校任教，后任山西省议会秘书长及六政考核处股长、副处长、处长等职。此后转赴绥远，历任绥远实业厅厅长兼垦务局总办。1928年10月，国民政府任命徐永昌等七人为绥远省政府委员，冯曦为其中之一。1931年，他出任绥远省建设厅厅长，1932年12月曾代理绥远省政府主席，1933年兼任绥远省文官普通考试筹备委员会主任。"
 SUY_zeng_houzai:0 "曾厚载"
 SUY_zeng_houzai_desc: "曾厚载（1895—1980），原名曾右青，浙江绍兴人，生于其父任职地。1917年毕业于山西法政专门学校，后投笔从戎加入晋军，在阎锡山部任副官。1927年离开山西后，转赴绥远，进入傅作义的行政体系。1936年，曾厚载以绥远省政府秘书长身份，成为傅作义绥远政权中文职幕僚的核心人物。同年，他还被任命为绥远省政府委员。省政府秘书长一职使他实际执掌省府机要与对外交涉事务，在傅作义外出期间，他与建设厅长冯曦共同承担与日方周旋的重任。"
 SUY_shakeduerzhabu:0 "沙克都尔扎布"
 SUY_shakeduerzhabu_desc: "沙克都尔扎布（1873—1945），汉名魁占，蒙古族，伊克昭盟札萨克旗（今内蒙古伊金霍洛旗）人，人称“沙王”，成吉思汗第30代孙。1897年承袭札萨克旗一等台吉札萨克之位，1903年升任伊克昭盟副盟长，1924年起任伊克昭盟盟长兼吉农（成吉思汗陵奉祀官），并长期兼任绥远省政府委员、伊克昭盟保安长官等职，是鄂尔多斯地区最有影响力的蒙古王公。"
 SUY_li_juyi:0 "李居义"
 SUY_li_juyi_desc: "李居义，山西人，民国时期绥远省财政官员。他早年曾游历各地，与徐永昌等晋绥军将领有旧交，并留下关于徐永昌在国民三军中情况的回忆文字。1936年前后，李居义出任绥远省财政厅厅长，成为傅作义主政绥远时期主管全省财政的核心官员。"
 SUY_yan_wei:0 "阎伟"
 SUY_yan_wei_desc: "阎伟（1896—1985），字致远，内蒙古托克托县河口镇人，绥远省教育界核心人物。\n\n他早年留学法国，获纺织工程师学位。1928年归国后曾在南京国民政府工商部任职。1934年初，应绥远省主席傅作义之邀返绥，出任绥远省政府委员兼教育厅厅长。\n\n上任后，他迅速平息学潮，并开创性地在女中附设幼儿园，开绥远幼儿教育之先河；1935年又主持兴建图书馆、体育馆及国术民众教育馆，推动全省教育面貌一新。"
 SUY_e_yousan:0 "鄂友三"
 SUY_e_yousan_desc: "鄂友三（1910—1958），乳名在贫，原名鄂在平，绥远萨拉齐（今内蒙古包头）人，因幼时被瑞典传教士鄂必格收养而改姓鄂，浑名“恶毛驴”。\n\n他早年就读于教会育英小学，1928年入归绥中学。1931年5月，鄂友三考入中央陆军军官学校第九期骑兵科，骑术精湛，曾在军校十周年纪念大会上表演骑马横渡长江。1934年5月毕业后因成绩优异留校，任第十期学生总队骑兵队少尉助教。1935年9月16日，叙任陆军骑兵少尉。"
 SUY_chi_shentian:0 "郗莘田"
 SUY_chi_shentian_desc: "郗莘田（1890—1978），别号尹耕，河北满城人，保定陆军军官学校第二期步兵科毕业。1916年保定军校毕业后分发直隶陆军服务，后随部转入晋军。1936年10月，出任陆军第三十五军（军长傅作义）司令部副参谋长，兼任参谋处处长。"
 SUY_xu_zizhen:0 "徐子珍"
 SUY_xu_zizhen_desc: "徐子珍（1893—1951），字席儒，山西五台人，徐向前的族叔。\nn\早年就读于太原陆军小学、北京清河陆军中学，1918年毕业于保定军校第五期步兵科，1931年再毕业于陆军大学特别班第一期。此后在晋绥军中长期任职，1931年任第70师第204旅第408团团长，驻防绥远河套地区屯垦，1934年12月升任第204旅旅长。"
 SUY_yang_zhilin: "杨植霖"
 SUY_yang_zhilin_desc: "杨植霖（1911—1992），曾用名王士敏、雨三、天虹、长河，内蒙古土默特旗毕克齐镇什报气村人，蒙古族，贫苦农民家庭出身。1925年考入绥远五族学院，同年底加入中国共产主义青年团，1926年任归绥县农民协会秘书，参与农民运动。1929年考入北平新农农业学校，1930年10月加入中国共产党。1931年以毕克齐高小教师身份为掩护开展地下工作，被绥远国民党当局逮捕，在狱中参加王若飞领导的对敌斗争，1933年10月出狱后回乡继续革命活动。"

 SHC_character:0 "榆林集团顾问"
 SHC_jing_yuexiu:0 "井岳秀"
 SHC_jing_yuexiu_desc: "井岳秀（1879—1936），字崧生，陕西蒲城人，同盟会会员，其弟为陕西革命领袖井勿幕。他早年投身辛亥革命，自1916年起以陕北镇守使身份坐镇榆林，统治陕北近二十年，人称“榆林王”。1930年，其部队被蒋介石改编为中央军第八十六师，他出任师长，并就此被绑上反共战车。1932年起，井岳秀与刘志丹、谢子长等领导的陕北红军长期作战，并多次参与“围剿”，但均以失败告终。1936年2月，井岳秀在榆林因手枪意外走火身亡，终年57岁。"
 SHC_gao_shuangcheng:0 "高双城"
 SHC_gao_shuangcheng_desc: "高双成（1882/1888—1945），字立卿，陕西渭南人，陕北地方实力派将领，长期驻守榆林。\n\n他早年经井岳秀介绍加入同盟会，辛亥革命时随军与清军作战。此后三十余年间在井岳秀麾下逐级擢升，历任连长、卫队营营长、骑兵团长、旅长等职。1932年，其部被改编为第八十六师第二五六旅，高双成任旅长。1934年，他率部追剿由绥远窜入陕北的惯匪杨猴小，将其击毙，消除了为害数省的一大匪患。"
 SHC_gao_guizhi:0 "高桂滋"
 SHC_gao_guizhi_desc: "高桂滋（1891—1959），字培五，陕西定边人，国民党陆军中将。\n\n他出身贫寒，早年入陕西讲武堂，后加入同盟会。在军阀混战中辗转发展，北伐时升任独立第8师师长，中原大战后部众被改编为陆军第84师，高桂滋任师长。“九一八”事变后，他率部参加1933年长城抗战，在冷口一带与日军血战，由此获得抗日声誉。1934年11月，第84师奉调回陕北“剿共”，但屡遭重创。"
 SHC_zuo_xiezhong:0 "左协中"
 SHC_zuo_xiezhong_desc: "左协中（1889—1960），字世允，陕西长安人，保定军校第一期毕业，陕北地方实力派将领。\n\n他早年加入同盟会，参加1911年西安起义。此后长期在井岳秀部任职，历任排长、连长、营长、团长，1927年升任旅长，1928年部队缩编后改任团长。1932年部队改编为陆军第八十六师，左协中任第二五六旅五一一团团长，驻防洛川。驻防期间，他对红军采取消极防守态度，严令部下不得主动出击，因此与红军从未发生大的冲突。"
 SHC_xu_zhijia:0 "徐之佳"
 SHC_xu_zhijia_desc: "徐之佳（1902—1992），又名自嘉，浙江江山人，日本陆军士官学校炮兵科毕业。他早年任南京中央军校炮科教官，后投入汤恩伯麾下，历任第4师参谋长、第13军参谋处处长。"
 SHC_zhang_xiushan: "张秀山"
 SHC_zhang_xiushan_desc: "张秀山（1911—1996），原名张鸿毓，陕西神木人，西北红军和陕甘边根据地的创建人之一。1929年入党，早年从事兵运，1932年领导甘肃靖远兵变，后任红26军42师政委、中共陕甘边特委书记等职。1935年受“左”倾错误波及，与刘志丹一同被拘，中央红军到陕北后获释。1936年3月，张秀山返回家乡，任中共神府特委组织部部长，同年7月神府红军合编为独立第二师，他出任政委，与师长王兆相率部在神木、府谷一带坚持斗争。"

 EGM_character:0 "陇东马顾问"
 EGM_ma_hongbin:0 "马鸿宾"
 EGM_ma_hongbin_desc:0 "马鸿宾（1884—1960），字子寅，甘肃临夏人，回族，西北马家军“西北四马”之一。\n\n早年随叔父马福祥在清军任职，1915年任甘肃新军司令，1921年任宁夏镇守使。1927年后投入冯玉祥国民联军，历任第二十二师师长、第二十四军军长。1930年中原大战后投靠蒋介石，任暂编第七师师长，后改任第三十五师师长，1931年一度出任甘肃省主席。"
 EGM_ma_duijing:0 "马惇靖"
 EGM_ma_duijing_desc: "马惇靖（1906—1972），字立青，回族，甘肃河州临夏县（今属临夏回族自治州）韩集阳洼山村人，马鸿宾三子。\n\n他幼读诗书及阿拉伯文，稍长即随父入军营生活。1934年，马惇靖任国民革命军陆军第35师103旅205团团长，后升任第103旅旅长。1936年，他在西北率部参加围剿中国工农红军，是其早年军事生涯中参与的主要作战行动。"

 NXM_character:0 "宁夏马顾问"
 NXM_ma_hongkui:0 "马鸿逵"
 NXM_ma_hongkui_desc:0 "马鸿逵（1892—1970），字少云，乳名三元，回族，甘肃河州（今临夏）人，西北马家军“西北四马”之一，陆军中将加上将衔。\n\n他出身河州马氏家族，其父马福祥为清末民初西北回族军政要人。1910年毕业于兰州陆军学校，后在其父部下任营长，继升宁夏新军统领。1914年至1917年在北京先后为袁世凯、黎元洪当侍从武官。1925年投靠冯玉祥，任第七师师长，参加北伐。1929年脱离冯玉祥投靠蒋介石，1930年中原大战中其部被扩编为讨逆军第十五路军，马鸿逵任总指挥。1932年出任宁夏省政府主席，此后长期主政宁夏，集军政大权于一身，人称宁夏的“土皇帝”。"
 NXM_lu_zhongliang:0 "卢忠良"
 NXM_lu_zhongliang_desc: "卢忠良（1903—1988），原名卢永安，甘肃河州（今临夏）人，马鸿逵部嫡系将领。\n\n他少时读私塾，后当店员，17岁入马鸿逵部当兵，由排长、连长、营长逐级擢升，历任团附、旅参谋主任、副旅长等职，并曾入中央军校洛阳分校高等教育班深造。"
 NXM_ma_guangzong:0 "马光宗"
 NXM_ma_guangzong_desc: "马光宗（1902—1987），字耀武，回族，甘肃广河人，马鸿逵部“宁马”系将领。\n\n他早年投身青海巡防营，后随部被马鸿逵收编，长期在马鸿逵第十五路军中任职。1936年，马光宗任第十五路军骑兵第二团团长。"
 NXM_ma_dunhou:0 "马敦厚"
 NXM_ma_dunhou_desc: "马敦厚，甘肃河州（今临夏）人，回族，马鸿逵长子。青海军官教导团毕业，早年即在其父部下从军。1936年，马敦厚任马鸿逵部特务团团长。同年，马鸿逵将新编第七师改编为陆军第一六八师，并增编独立旅，以其次子马敦静等分任旅长，马敦厚则被任命为特务团团长。"
 NXM_ma_tengjiao:0 "马腾蛟"
 NXM_ma_tengjiao_desc: "马腾蛟（1886—1946），字子云，回族，甘肃河州东乡锁南坝（今东乡族自治县）人，马鸿逵部“宁马”系将领。\n\n他早年入马福祥部当兵，由哨官、管带逐级升任团长，后长期在马鸿逵麾下效力，历任第六十四师副师长兼新编骑兵第二旅旅长，并升任第六十四师师长，先后参加过西安解围、北伐战争及中原大战等役。\n\n1936年，马腾蛟出任宁夏第二警备区司令，驻防吴忠堡。在任期间推行反共措施，以巩固马鸿逵在宁夏的统治。"

 GSM_character:0 "甘肃马顾问"
 GSM_ma_buqing:0 "马步青"
 GSM_ma_buqing_desc:0 "马步青（1898—1977），字子云，甘肃临夏人，回族，马麒长子、马步芳之兄，“西北四马”之一，青马集团核心人物。\n\n早年入宁海军，1924年起历任骑兵团长、旅长，1928年任国民革命军第二集团军暂编第二十六师第七十七旅旅长。中原大战期间任洛阳警备司令，1933年升任第二十六师师长。1936年1月授陆军中将，改任骑兵第五师师长，同年9月兼任青海省政府委员。"
 GSM_ma_chengxiang:0 "马呈祥"
 GSM_ma_chengxiang_desc:0 "马呈祥（1913—1991），字云章，甘肃河州（今临夏）人，回族。他是“青马”首领马步芳的外甥，同时又是马步青的女婿，凭借这双重姻亲关系，成为马家军“青马”系统中崛起极快的少壮派将领。\n\n早年就读于青海昆仑中学，后进入青海军官教导团学习军事，毕业后加入马步芳部，历任排长、连长、营长。在舅舅马步芳的提携下，他二十出头便当上营长，并获得了中央军校第十一期的学籍。"

 XSM_character:0 "青海马顾问"
 XSM_ma_lin:0 "马麟"
 XSM_ma_lin_desc: "马麟（1876—1945），字勋臣，小名尕老，甘肃河州（今临夏）人，回族，西北马家军元老，马麒之弟、马步芳之叔。\n\n早年随兄从军，历任清军哨官、管带。1912年任宁海军左路军统领，1915年任甘边宁海镇守使署参谋长。1921年率部征果洛，劫掠藏族首领及部众千余人，为马家在青南的统治奠定基础。1928年青海建省后，任省政府委员兼建设厅厅长。1931年马麒病故，马麟被蒋介石任命为代理青海省政府主席，1933年3月正式出任青海省政府主席兼民政厅厅长。"
 XSM_ma_biao:0 "马彪"
 XSM_ma_biao_desc: "马彪（1885—1948），字炳臣，回族，甘肃临夏人，马步芳的堂叔，青海“马家军”将领。他早年从军，曾参加抗击八国联军的“庚子之役”，后长期在青海马麒、马步芳叔侄麾下任职。1932年，马彪出任青海南部边区警备司令部第一旅（骑兵）旅长，驻防玉树一带。"
 XSM_ma_bufang:0 "马步芳"
 XSM_ma_bufang_desc: "马步芳（1903—1975），字子香，回族，甘肃临夏人，马麒次子，“青马”军阀集团的核心人物，陆军中将加上将衔。\n\n早年入宁海军官训练团，毕业后在宁海巡防营任职。1924年投靠冯玉祥国民军，历任营长、团长、旅长。1930年中原大战后投靠蒋介石，任新编第九师师长。1934年任新编第二军军长，旋改任陆军第100师师长。"
 XSM_ma_bukang:0 "马步康"
 XSM_ma_bukang_desc: "马步康，回族，甘肃河州（今临夏）人，马家军“青马”集团成员，马步芳的堂弟，绰号“小大马”。"
 XSM_ma_jiyuan:0 "马继援"
 XSM_ma_jiyuan_desc: "马继援（1921—2012），字少香，回族，甘肃河州（今临夏）人，马步芳独子。"
 XSM_ma_yuanhai:0 "马元海"
 XSM_ma_yuanhai_desc: "马元海（1888—1951），字子涵，回族，甘肃河州（今临夏）人，马家军“青马”集团核心将领。他是马麒的外甥、马步芳的表兄，凭借这层血缘关系成为马氏家族中资历极深的骨干。\n\n早年随舅父马麒入青，1918年任宁海军步前营帮办驻防贵德，此后长期在青海马家军中任职。1933年曾参加马步芳与马鸿逵合阻孙殿英西进的宁夏之战。"

 SIC_character:0 "川军顾问"
 SIC_Liu_Xiang:0 "刘湘"
 SIC_liu_xiang_desc:0 "刘湘（1890—1938），字甫澄，四川大邑人，民国时期四川军阀首领，人称“四川王”。他毕业于四川陆军速成学堂，在川军内战中先后击败杨森、刘文辉等对手，逐步统一四川。1935年2月，刘湘出任四川省政府主席，川政名义上归于统一。但南京中央势力也借“剿共”之机大举入川，重庆行营参谋团对川军有督察、考核之权，蒋介石与刘湘之间“中央”与“地方”的暗中角力由此展开。"
 SIC_Deng_Xihou:0 "邓锡侯"
 SIC_Deng_Xihou_desc: "邓锡侯（1889—1964），字晋康，四川营山人，保定军校肄业，川军“保定系”首领之一。早年投刘存厚部参加护国战争，1920年任第三师师长，1924年一度出任四川省长。1926年易帜，所部改编为国民革命军第二十八军，邓锡侯任军长。1935年5月，第二十八军改番号为第四十五军，邓锡侯仍任军长。"
 SIC_Yang_Sen:0 "杨森"
 SIC_Yang_Sen_desc: "杨森（1884—1977），原名淑泽，又名伯坚，字子惠，四川广安人，川军高级将领，四川陆军速成学堂毕业。\n\n他早年加入同盟会，历经二次革命、护国战争，在川滇军阀混战中逐步崛起。1926年任国民革命军第二十军军长兼川鄂边防司令，此后长期以第二十军为基本部队，是川军中资格最老、兵力较厚的军阀之一。"
 SIC_wang_mingzhang:0 "王铭章" 
 SIC_wang_mingzhang_desc:0 "王铭章，1893年7月4日生于四川省新都县泰兴乡，国民革命军陆军第41军第122师师长，1938年3月17日在山东藤县与日军交战中牺牲。"
 SIC_Sun_Zhen:0 "孙震"
 SIC_Sun_Zhen_desc: "孙震（1892—1985），原名定懋，字德操，四川绵竹人，川军将领。\n\n他早年加入同盟会，参加辛亥革命，后毕业于保定军校第一期。长期在川军田颂尧部任职，1935年田颂尧因“剿共”失利被撤职后，孙震继任第二十九军军长，该军旋改编为第四十一军，孙震续任军长兼第124师师长。1936年2月25日，叙任陆军中将。"
 SIC_Tang_Shizun:0 "唐式遵"
 SIC_Tang_Shizun_desc: "唐式遵（1883—1950），字子晋，四川仁寿人，川军“速成系”骨干，刘湘的长期亲信。\n\n他早年入四川陆军速成学堂，与刘湘、杨森、潘文华等为同学，毕业后长期追随刘湘，在川军内战中由排长逐级升至师长，为刘湘统一四川效力。1926年刘湘所部改编为国民革命军第二十一军后，唐式遵任第一师师长。"
 SIC_Pan_Wenhua:0 "潘文华"
 SIC_Pan_Wenhua_desc: "潘文华（1886—1950），字仲三，四川仁寿人，川军“速成系”核心将领，刘湘集团中地位仅次于刘湘本人的二号人物。\n\n他出身贫寒，早年入四川陆军速成学堂，与刘湘、杨森为同学。1920年川滇黔军大战中，潘文华以巨款接济窘迫中的刘湘，自此深得信任，此后十余年随刘湘转战四川各地，成为刘湘最倚重的嫡系骨干。"
 SIC_Wang_Zuanxu:0 "王缵绪"
 SIC_Wang_Zuanxu_desc: "王缵绪（1886—1960），字治易，四川西充人，川军将领。1908年入四川陆军速成学堂，与刘湘、杨森同窗，毕业后长期在川军任职。1932年任刘湘部北路总指挥，为刘湘统一四川出力。"
 SIC_Wang_Lingji:0 "王陵基"
 SIC_Wang_Lingji_desc: "王陵基（1883或1886—1967），字方舟，绰号“王灵官”，四川乐山人，川军中资格最老的将领之一。\n\n他早年留学日本，回国后任四川陆军速成学堂教官，刘湘、杨森、唐式遵等人均是其学生，在川军中辈分极高。1921年转投刘湘后，长期为刘湘所倚重，是刘湘集团“四大将领”之一。1931年代理长江上游“剿匪”总指挥，1933年任四川“剿匪”第五路总指挥，负责阻截长征红军，因兵败被撤职，闲居上海。"
 SIC_Li_Jiayu:0 "李家钰"
 SIC_Li_Jiayu_desc: "李家钰（1892—1944），字其相，四川蒲江人，川军“军官系”首领，以“遂宁王”闻名。\n\n他早年入四川陆军军官学堂，参加辛亥革命及护国战争，长期在川军邓锡侯部任职，由排连长逐级升至师长、四川边防军总司令。在军阀混战中，他拥兵自重，所部曾发展至6个混成旅、18个步兵团，占据遂宁、安岳、乐至、潼南等县，集军政大权于一身，自委官吏、筑路兴教，治理遂宁长达11年。1933年，他任四川“剿匪”第三路总指挥，率部“围剿”川北红军，但于1935年因“围剿”不力受到蒋介石严斥，随后在川军缩编中被委为陆军整编第104师师长兼四川第一绥靖区司令官，率部远戍西昌。"
 SIC_Ji_Zuyou:0 "嵇祖佑"
 SIC_Ji_Zuyou_desc: "嵇祖佑（1880—1961），四川阆中人，四川官班警务学校毕业，是川康地区资历很深的行政与警务官员。他早年长期在四川警务系统任职，历任四川省城警察厅厅长、四川全省警务处处长、四川政务厅厅长等职。"
 SIC_Hu_Ciwei:0 "胡次威"
 SIC_Hu_Ciwei_desc: "胡次威（1900—1988），又名胡长清，四川万县（今重庆万州）武陵镇人，中国近现代法学家，国民政府官员。\n\n他早年毕业于北京朝阳大学法律科，后公费留学日本明治大学，专攻刑法。回国后长期在朝阳大学、中央政治学校等校任教，讲授民法、刑法，并曾主编《法律评论》。1928年起，他先后任南京国民政府法制局二科科长、立法院民法起草委员会编纂，参与起草了《工厂法》《国民政府组织法》等多部法律。\n\n1933年9月，胡次威被蒋介石亲自点名，出任浙江省兰溪自治实验县县长，成为当时全国四大实验县之一的行政主官。在兰溪，他带领中央政治学校师生推行县政改革，整顿田赋、建设农村、改善交通与教育，并禁绝毒品，颇有作为。"
 SIC_liu_hangchen:0 "刘航琛"
 SIC_liu_hangchen_desc: "刘航琛（1896—1975），本名宾远，字航琛，四川泸县人。早年毕业于北京大学经济系，1927年经王陵基推荐进入刘湘的第二十一军，逐步成为刘湘集团的核心财政幕僚，被誉为刘湘的“财神爷”。"
 SIC_Gan_Jiyong:0 "甘绩镛"
 SIC_Gan_Jiyong_desc: "甘绩镛（1888—1962），号典夔，四川荣昌（今重庆荣昌）人，刘湘“甫系”集团的核心财政与政务幕僚。\n\n他毕业于四川中等工业学堂，1912年入川军，因办事干练深得刘湘器重，此后二十余年间长期担任刘湘僚属。在军政方面，他历任二十一军财政处处长、川东税捐总局局长、川东道尹、二十一军政务处处长等职；1934年出任四川省政府委员兼民政厅厅长，推行民政与财政改革。在文教方面，他1928年任川东师范学校校长，参与筹建重庆大学并任副校长，1933年又创办四川乡村建设学院。"
 SIC_Shi_Tiyuan:0 "石体元"
 SIC_Shi_Tiyuan_desc: "石体元（1890—1968），原名万全，又名焜玉，四川宣汉华景乡人，前清秀才，是刘湘“甫系”集团中兼具行政与实业经验的文职官员。\n\n他早年毕业于四川高等巡警学堂，辛亥革命时曾与王维舟等回宣汉组织反清起义，光复东乡。1928年起，他担任国民革命军第21军第6师师长潘文华的秘书。因潘文华兼任重庆市市长却常因军务离任，石体元遂以重庆市政府秘书长兼教育局局长的身份，长期代行市长职务，实际主持重庆市政。1931年，他作为筹备委员参与筹建重庆电力厂，1933年出任新组建的重庆市商品检验所正所长，并兼任重庆电力公司总务主任，深度参与了重庆早期的城市基础设施建设。"
 SIC_Jiang_Zhicheng:0 "蒋志澄"
 SIC_Jiang_Zhicheng_desc: "蒋志澄（1897—1949），原名绳祖，字养春，浙江诸暨人，毕业于北京大学。截至1936年，他是刚由赣入川、出任四川省教育厅厅长的国民政府文教官员。北大毕业后，他在北京浙江专门中学任教。1927年秋起，历任浙江杭县、海宁等县县长，后由浙江省政府派赴欧洲考察教育及地方行政，并入柏林大学研究。1933年回国后，任国民政府军事委员会委员长南昌行营设计委员会专门委员，1934年夏改任江西省庐山管理局局长。"
 SIC_Lu_Zuofu:0 "卢作孚"
 SIC_Lu_Zuofu_desc: "卢作孚（1893—1952），原名魁先，四川合川人，近代爱国实业家、乡村建设先驱，被誉为“中国船王”。他毕生致力于“实业救国”，1925年创办民生实业股份有限公司，从一艘70吨小火轮起步，至1936年已拥有轮船47艘、20404吨，股本达167.4万元，航线从川江扩展至长江下游及沿海，基本统一了长江上游航运。"
 SIC_He_Beiheng:0 "何北衡"
 SIC_He_Beiheng_desc: "何北衡（1896—1972），本名恩枢，四川罗江人。早年就读于绵阳中学堂，1917年考入北京大学法律系，在读期间结识刘湘驻京代表，1920年未毕业即入刘湘戎幕，此后长期在四川政商两界活动。"
 SIC_Hu_Ziang:0 "胡子昂"
 SIC_Hu_Ziang_desc: "胡子昂（1897—1991），原名胡鹤如，字子昂，四川巴县（今重庆南岸）人，著名实业家、爱国民主人士。\n\n早年就读于北京农业大学农业经济系，1923年毕业后回渝从事教育，1926年任重庆市教育局局长。1928年出任川康边防总指挥部边务处处长，在川康边区主持开矿、垦殖等建设事务达六年，因深感“以农立国”之路走不通，遂于1935年初辞官返渝，决心投身实业救国。"
 SIC_Li_Zhaofu:0 "李肇甫"
 SIC_Li_Zhaofu_desc: "李肇甫（1887—1951），字伯申，四川巴县人。他早年留学日本明治大学法科，1905年加入同盟会，辛亥革命后曾任南京临时大总统府秘书、临时参议院全院委员会委员长，是民国初年政坛上活跃的川籍人物。"
 SIC_Guan_Jiyu:0 "关吉玉"
 SIC_Guan_Jiyu_desc: "关吉玉（1899—1975），字佩恒，奉天辽阳（今辽宁辽阳）人，满族，民国财政官僚、经济学者。\n\n他早年入北京朝阳大学经济系，后留学德国柏林大学。1932年归国后进入财政部，历任天津统税查验所查验员、主任、所长，并升任冀察晋绥区统税局副局长。1934年出任庐山军官训练团教官。"
 SIC_Zhong_Tiqian:0 "钟体乾"
 SIC_Zhong_Tiqian_desc: "钟体乾（1879—1962），字均猷（一作君猷），号筠友，四川成都人，川军早期将领，陆军中将。\n\n他早年毕业于四川武备学堂，后赴日本陆军士官学校第五期步兵科深造，回国后长期在川军中任职，历任四川陆军军官学堂教官、陆军测量局局长、西北边防军参谋长等职，1924年授陆军少将衔。刘存厚兵败后，他于1921年转入刘湘部，1926年任第21军参谋长兼机要室主任，1928年出任成都市市长。"
 SIC_guo_xunqi:0 "郭勋祺"
 SIC_guo_xunqi_desc: "郭勋祺（1895—1959），原名郭勋，字翼之，四川华阳（今属成都双流）人，川军中以骁勇闻名的将领，绰号“郭莽子”或“熊猫”。\n\n他出身农家，1912年入藏从军，后长期在潘文华、刘湘麾下效力，由士兵逐级升至师长。1935年，他率部在贵州土城战役中与中央红军激战，因所部“训练有素，纪律严明”给红军留下深刻印象。此后他升任模范师师长，同年冬又在百丈关战役中阻击红四方面军南下。"

 XIK_character:0 "西康顾问"
 XIK_liu_wenhui:0 "刘文辉"
 XIK_liu_wenhui_desc: "刘文辉（1895—1976），字自乾，四川大邑人，刘湘的堂叔，川军“保定系”将领。早年毕业于保定军校第二期，在川军内战中崛起，1928年出任四川省主席，1932至1933年与刘湘争夺四川霸权，兵败后退守西康。1934年12月，刘文辉被任命为西康建省委员会委员长，仍兼第24军军长。"
 XIK_tang_ying:0 "唐英"
 XIK_tang_ying_desc: "唐英（1895—1960），字永晖，四川仁寿汪洋镇人，保定军校毕业，川军将领，长期在刘文辉麾下任职。1936年，唐英任第24军（军长刘文辉）第136师师长，驻防康定、西昌一带。"
 XIK_zeng_yanshu:0 "曾言枢"
 XIK_zeng_yanshu_desc: "曾言枢（1894—1976），四川璧山（今属重庆）人，川军将领，长期在刘文辉的第24军系统任职。早年他曾任连长，因在宜宾珙县为刘文辉武装征收鸦片过境税“有功”，逐步获得擢升。"
 XIK_yu_zhongying:0 "余中英"
 XIK_yu_zhongying_desc: "余中英（1899—1983），原名余世泽，号兴公，四川郫县人。他早年投身川军，官至第24军第3师副师长兼第8混成旅旅长，是刘文辉部中兼具战功与文名的“儒将”。1933年，他辞去军职，正式拜入齐白石门下，学习书画篆刻。"
 XIK_wu_peiying:0 "伍倍英"
 XIK_wu_peiying_desc: "伍倍英（1908—1968），字毓铨，四川大邑人。他早年投身川军，1924年考入川军第二十三军混成旅军事讲习所，毕业后历任排长、代理连长等职。1927年入二十四军军事政治学校，1929年入二十四军参谋班，1931年升任少校参谋。"

 YUN_character:0 "云南顾问"
 YUN_an_enpu:0 "安恩溥"
 YUN_an_enpu_desc: "安恩溥（1894—1965），字恩溥，彝族，云南镇雄人。早年投身护国军，后入云南陆军讲武堂第十四期，长期在滇军任职。"
 YUN_ding_zhaoguan:0 "丁兆冠"
 YUN_ding_zhaoguan_desc: "丁兆冠（1881—1955），字又秋（一作幼秋），云南石屏人，清末举人，留日法政专家，龙云主政时期云南的核心民政官员。他于1903年中癸卯科举人，后赴日本东京早稻田大学政治经济科留学。毕业回国后授法政科举人，分发四川任职。辛亥革命后，丁兆冠出任四川省财政司长，不久辞职回滇，任云南法政专科学校校长，此后历任云南高等审判厅厅长、政务厅厅长等职，长期执掌云南司法与民政事务。龙云上台后，丁兆冠出任云南省政府委员兼民政厅厅长，负责全省县级官员任免、地方行政、户籍及边疆县政建设，是云南民政最高长官。"
 YUN_gao_yinhuai:0 "高荫槐"
 YUN_gao_yinhuai_desc: "高荫槐（1889—1976），号蕴华，云南昆明人，滇军将领，龙云手下的重要人物。早年毕业于云南武备学堂及保定陆军速成学堂，后长期在滇军任职，1925年出任滇中镇守使（龙云）署参谋长，自此成为龙云亲信。"
 YUN_gong_zizhi:0 "龚自知"
 YUN_gong_zizhi_desc: "龚自知（1894—1967），原名兆麟，字仲钧，云南大关人，民国时期云南著名的教育家、报人，龙云主政云南时期的核心文职幕僚。\n\n他早年就读于北京大学预科，1917年毕业后回滇，历任云南高等师范学校、东陆大学教员。1922年任昆明市政公所教育课课长，推行义务教育卓有成效。1929年8月起，龚自知出任云南省政府委员兼教育厅厅长，此后长期执掌云南教育行政，是民国时期担任该职时间最长的人。"
 YUN_hu_ying:0 "胡瑛"
 YUN_hu_ying_desc: "胡瑛（1889—1961），字蕴山，云南云县（今属临沧）人，滇军将领。\n\n他早年毕业于云南优级师范学堂，后投笔从戎，入云南陆军讲武堂特别班，其间加入同盟会。1911年参加昆明“重九起义”，此后随唐继尧入黔，在黔军中逐级升迁，护国战争后任黔军混成旅旅长、重庆卫戍司令等职。1922年回滇，一度引退，后出任唐继尧部佽飞军第四军军长兼云南宪兵司令。1927年“二六政变”后，胡瑛在龙云被扣期间曾出面斡旋，其后应卢汉之邀出任国民革命军第三十八军军长，成为龙云掌控滇政的重要支持者。"
 YUN_li_peitian:0 "李培天"
 YUN_li_peitian_desc: "李培天（1895—1975） ，字子厚，云南宾川人，龙云主政云南时期的核心文职官员，龙云的外戚。\n\n他早年毕业于云南省立第一中学，后东渡日本，入早稻田大学政治经济系，回国后曾在北京法政大学任教。1921年回昆明，任市政督办公署教育科长，兼任省立一中及成德中学教师。1928年任澄江县长。1929年龙云出任云南省政府主席后，李培天以外戚关系调任云南省政府驻南京办事处处长，兼任蒙藏委员会委员，长期在南京代表龙云与中央方面联络。1931年，他在上海集资创办“私立文化学院”并自任院长，后因经费困难被教育部令撤销。\n\n李培天之妹李培莲嫁与龙云为妻，这层姻亲关系是他仕途升迁的重要凭借，也是他在龙云政权中被视为“外戚”核心人物的根本原因。"
 YUN_liu_peiquan:0 "刘沛泉"
 YUN_liu_peiquan_desc: "刘沛泉（1893—1940），字毅夫，广东南海人，民国早期航空先驱。\n\n他早年留学日本，1922年应唐继尧之邀入滇，任云南航空处处长兼云南航空学校校长，是中国早期航空教育的奠基人之一。1926年北伐时出任东路军航空司令部司令，1928年任国民革命军总司令部北伐东路航空司令。1930年任湘桂铁路局局长，后转任中国航空公司筹备处经理。1933年被聘为全国航空建设委员会委员，同年在广州筹办滇粤桂联合创办的西南民用航空公司，任常务委员、临时主席。"
 YUN_long_yun:0 "龙云"
 YUN_long_yun_desc:0 "龙云（1884—1962），原名登云，字志舟，彝族，彝名纳吉岬岬，云南昭通人，滇系军阀首领，人称“云南王”。他自1927年起主政云南，至1945年去职，统治云南长达18年。\n\n龙云出生于四川金阳一个彝族奴隶主世家，幼年丧父，随母在昭通长大，自幼喜好骑马射箭、弄刀弄枪。1911年加入滇军，次年进入云南陆军讲武堂第四期骑兵科学习，其间因击败在昆明摆擂台的法国拳师而声名鹊起，引起云南都督唐继尧的注意。毕业后，他初任唐继尧的警卫军佽飞军大队长，后逐步升任代理第一军军长、云南省警察厅长、第五军军长兼滇中镇守使，开始掌握滇军实权。\n\n1927年2月，龙云与胡若愚等人发动“二六政变”，迫使唐继尧下台。此后他击败对手，于1928年正式出任云南省政府主席兼第十三路军总指挥，开启了“云南王”时代。对外扩张受挫后，龙云转而致力于云南本地的治理与建设。从1929年至1937年，他推行了一系列改革，使云南政治、经济、文化均有明显进步。"
 YUN_lu_chongren:0 "陆崇仁"
 YUN_lu_chongren_desc: "陆崇仁（1887—1951），字子安，彝族，云南巧家荞麦地（今药山镇）人，龙云主政云南时期的核心财政官员。\n\n他民国初年考入云南法政学堂，毕业后历任镇雄县承审员、巧家县省参议会议员。1922年经同乡引荐结识龙云，受委为第五军军法官，后任寻甸县知事，因政绩突出获当地士绅立碑纪念，再调昆明任第五军军法处长。1930年，原兼财政厅长的卢汉率部出兵广西，陆崇仁接任云南省财政厅厅长，此后连续任职长达14年。"
 YUN_lu_daoyuan:0 "鲁道源"
 YUN_lu_daoyuan_desc: "鲁道源（1900—1985），字子泉，云南昌宁人，滇军将领。1916年考入云南讲武堂第十三期步兵科，毕业后在滇军中由排长逐级升至旅长。1928年即任少将旅长，为滇军中最年轻的少将。1934年红军长征过贵州时，奉令率部尾随堵击。"
 YUN_lu_han:0 "卢汉"
 YUN_lu_han_desc: "卢汉（1895—1974），原名邦汉，字永衡，彝族，云南昭通人，滇军高级将领，龙云的表弟。\n\n他早年与龙云一同入云南陆军讲武堂第四期，毕业后在滇军中由排长逐级升至旅长、师长，长期作为龙云最亲密的军事助手，共同掌控云南军政。"
 YUN_ma_ying:0 "马锳"
 YUN_ma_ying_desc: "马锳（1893—1975），字幼坡，白族，云南洱源人，滇军将领，与兄马鉁、弟马崟并称“一门三将”。他于1917年投身滇军，后毕业于云南陆军讲武堂，长期在龙云、卢汉的滇军系统中任职。1932年起，马锳出任滇越铁路军警总局少将局长，任职五年有余。"
 YUN_miao_yuntai:0 "缪云台"
 YUN_miao_yuntai_desc: "缪云台（1894—1988），名嘉铭，字云台，云南昆明人。他是云南省第一批公费留美学生，毕业于明尼苏达大学矿冶系，回国后成为云南经济近代化的核心人物，素有“实业巨子”之称。"
 YUN_sun_du:0 "孙渡"
 YUN_sun_du_desc: "孙渡（1898—1967），字志舟，云南陆良人，滇军将领，素有“小诸葛”之称。1936年，孙渡以滇军“追剿”军第3纵队司令身份，率部全程追击长征入滇的红二、六军团，参与了六甲之战、虎头山之战等激战。因其“追剿”作战表现突出，于同年4月晋升陆军中将。"
 YUN_yang_ruxuan:0 "杨如轩"
 YUN_yang_ruxuan_desc: "杨如轩（1895—1979），字夷斋，云南宾川人，滇军将领，与朱德是云南陆军讲武堂的同班同学。\n\n他早年参加辛亥“重九起义”和护国战争，在棉花坡之战中因战功升任营长、团长。此后历任驻粤滇军旅长、师长等职，1926年北伐时出任国民革命军第九军第二十七师师长。1928年，他率部进剿井冈山遭到惨败，此后军权被架空，转任军事参议院参议。1930年，杨如轩应龙云之邀回云南，出任云南宪兵司令，并创办宪兵学校整饬军纪。1936年1月31日，杨如轩叙任陆军少将，仍任云南宪兵司令。"
 YUN_yuan_piyou:0 "袁丕佑"
 YUN_yuan_piyou_desc: "袁丕佑（1897—1956），字蔼耕，云南石屏人，清代云南唯一经济特科状元袁嘉谷次子，民国时期云南知名学者、政界人士，云南首批公派留美学生之一。\n\n他早年就读于北京大学文学系，1922年考取云南省公费赴美留学，入宾夕法尼亚大学教育系，1925年获教育学硕士学位后返回云南，任教于东陆大学（云南大学前身），1926至1930年任云南大学图书部主任。"
 YUN_zhang_banghan:0 "张邦翰"
 YUN_zhang_banghan_desc: "张邦翰（1885—1958），字西林，云南镇雄人，同盟会元老、工程师，龙云主政云南时期的核心建设官员。\n\n他早年留学比利时，获电化工程师学位，1920年回滇后曾任耀龙电灯公司工程师、无线电报局长，并主持设计了云南大学标志性建筑会泽院。1928年起任云南省政府委员，后长期兼任建设厅厅长等职。"
 YUN_zhang_chong:0 "张冲"
 YUN_zhang_chong_desc: "张冲（1900—1980），原名绍禹，字云鹏，彝族，云南泸西（今属弥勒）人，滇军将领，因倾慕《水浒传》中林冲的刚正不阿而改名张冲，有“黑虎将军”之称。\n\n他早年因遭豪绅诬告而被迫投身绿林，率部活动于滇东南一带，提出“打倒土豪劣绅，保护工农商，救济贫穷人”的口号。1924年，其部被滇军第二军收编，从此进入滇军系统，后因截击胡若愚部有功，深得龙云赏识，被委任为滇军第五师师长。1933年，张冲因参与“四师长倒龙”事件而受到龙云猜忌，被解除兵权，改任云南省盐运监督使（盐运使）。"
 YUN_zhao_jinwen:0 "赵锦雯"
 YUN_zhao_jinwen_desc: "赵锦雯（1894—1965），又名锦文，号雨金，云南昆明人，保定陆军军官学校第六期工兵科毕业，滇军及黄埔系将领。\n\n他早年入粤军，1924年任黄埔军校中校工兵教官，后历任国民革命军第一军第二团参谋长、黄埔军校上校管理处长、第二十二师副师长等职。1931年任第十九路军第六十一师参谋长，参加“一·二八”淞沪抗战；1933年参加福建事变，任福建人民革命军第二军参谋长。"

 GXC_character:0 "广西顾问"
 GXC_bai_chongxi:0 "白崇禧"
 GXC_bai_chongxi_desc:0 "白崇禧（1893—1966），字健生，回族，广西桂林人，新桂系核心，陆军一级上将，人称“小诸葛”。\n\n早年读桂林陆军小学、保定军校，参加辛亥革命和护法战争；1924年前后与李宗仁、黄绍竑联手，任定桂讨贼联军总参谋长，击败旧桂系，统一广西。1926年北伐时任国民革命军总司令部参谋长、东路军前敌总指挥，率部北上，声望达到高峰。1929年蒋桂战争、1930年中原大战反蒋失败后退回广西，与李宗仁经营广西，推行“三自政策”。"
 GXC_chen_xiong:0 "陈雄"
 GXC_chen_xiong_desc: "陈雄（1893—1974），原名陈德广，号杰夫，广西容县人，新桂系重要成员，国民党军中将。\n\n他早年就读桂林陆军小学、湖北陆军中学及保定军校第六期，曾参加辛亥革命武昌起义。1923年任广西讨贼军总指挥部参谋处处长（参谋长白崇禧）期间，受黄绍竑、白崇禧委派赴广州联络广东革命政府，在石龙车站晋谒孙中山，获得财政援助及军队番号，此后先后五次会见孙中山，为新桂系与广东革命政府之间的联络做了大量工作。\n\n北伐后他留守广西负责财政军需，1929年宁桂分裂后一度寓居香港。1931年返桂弃军从政，历任柳州禁烟局局长、广西省饷捐局局长、广西全省禁烟总局局长等职，对整顿广西税收、开辟财源卓有成效。"
 GXC_cheng_siyuan:0 "程思远"
 GXC_cheng_siyuan_desc: "程思远（1908—2005），广西宾阳人，无党派爱国民主人士。早年就读于宾阳黄安学堂，1926年考取国民革命军第七军应试文书第一名，随军北伐。1930年任第四集团军总司令李宗仁秘书，1934年赴意大利罗马大学政治系留学，获政治学博士学位。"
 GXC_huang_xuchu:0 "黄旭初"
 GXC_huang_xuchu_desc: "黄旭初（1892—1975），广西容县人，新桂系核心人物之一。\n\n他早年就读于广西陆军速成学校，与李宗仁有同学之谊，后赴中国陆军大学深造，毕业后在桂军中历任参谋、连长等职，并参加了护法战争。1922年，他得李宗仁营救获释后出任其参谋长，此后与李宗仁、黄绍竑共同致力于统一广西，在定桂讨贼联军中担任副参谋长。\n\n北伐时期，黄旭初留守广西，任第七军参谋长兼南宁警备司令，负责后方事务。1931年，随着黄绍竑离桂，黄旭初接任广西省政府主席，与李宗仁、白崇禧形成了新桂系新的“三巨头”核心组合，并在此职位上主政广西近二十年。\n\n主政期间，黄旭初主持制定了《广西建设纲领》，推行“自卫、自治、自给”的“三自”政策，大力进行政治、军事、经济、文化建设，使广西在三十年代获得“模范省”的称誉。"
 GXC_huang_zhongyue:0 "黄钟岳"
 GXC_huang_zhongyue_desc: "黄钟岳（1883—1952），族名开镛，字子敬，广西桂林临桂人，前清秀才，新桂系重要人物，长期掌管财政金融，被称为广西的“财阀”。\n\n他早年曾在旧桂系陆荣廷、谭浩明主政广西时担任县长及民政厅、财政厅科长，对广西地方政务与财政运作已有经验。李宗仁以定桂军总指挥执掌广西军政大权后，黄钟岳出任定桂军秘书长，成为李宗仁身边的政务与文书核心人物。此后他长期主管广西财政，历任广西省政府财政厅厅长、广西银行总行行长、香港广西银行董事长等要职，是新桂系财政金融体系的主要操盘者。"
 GXC_lei_peihong:0 "雷沛鸿"
 GXC_lei_peihong_desc: "雷沛鸿（1888—1967），字宾南，广西南宁津头村人，中国现代教育史上杰出的教育改革家和教育思想家，中国致公党党员。早年加入同盟会，参加广州黄花岗起义，起义时在仙湖街始平书院负责保管军械炸药。后赴英美留学，获哈佛大学文科硕士学位。回国后长期投身教育，先后任教于暨南大学、中央大学、浙江大学、江苏教育学院、中山大学等院校，并五度执掌广西教育行政。"
 GXC_lei_yin:0 "雷殷"
 GXC_lei_yin_desc: "雷殷（1886—1972），原名雷恺泽，字渭南，广西邕宁人，新桂系领导集团重要人物，法学家。\n\n他早年由黄兴介绍加入同盟会，辛亥革命后任广西临时参议会副议长，主张将省会迁至南宁。1914年因讨袁被通缉，改名雷殷，赴日本东京法政大学求学。回国后曾任广东军署总参议、广西田南道与桂林道道尹、北京民国大学校长、哈尔滨法政大学校长等职。“九一八”事变后回广西，1932年至1939年长期担任广西省政府委员兼民政厅厅长，是新桂系推行广西自治的核心执行者，在健全基层组织、民团建设、户籍兵役、礼俗宗教、治安卫生等方面着力甚多。"
 GXC_li_pinxian:0 "李品仙"
 GXC_li_pinxian_desc: "李品仙（1890—1987），字鹤龄，广西苍梧人，新桂系重要将领，陆军二级上将。他在国民党新桂系中，是仅次于李宗仁、白崇禧、黄绍竑的核心人物。\n\n早年就读广西陆军小学、湖北第三陆军中学，参加辛亥革命武昌起义，后入保定军校步科。毕业后入湘军唐生智部，从排长逐级升至第八军军长，历经护国、护法、湘直等战争。1928年唐生智兵败瓦解后，李品仙等旧部迫于桂系包围，通电接受南京政府改编，投靠桂系。1929年蒋桂战争中，他又一度随唐生智脱离桂系，后于1930年中原大战时应李宗仁、白崇禧之邀回桂，任第四集团军总部参谋长，但实权有限。"
 GXC_li_zongren:0 "李宗仁"
 GXC_li_zongren_desc:0 "李宗仁（1891—1969），字德邻，广西临桂人，新桂系首领，陆军一级上将，军事家、爱国将领。\n\n他早年毕业于广西陆军小学堂及陆军速成学堂，加入同盟会，参加护国、护法战争，在桂军中逐级升至广西自治军第二路总司令。1923年起与黄绍竑、白崇禧联合，至1925年统一广西，成为新桂系领袖。北伐时率第七军北上，战功卓著，后任第四集团军总司令，势力达于顶峰。蒋桂战争、中原大战中反蒋失败后退回广西经营，使广西保持半独立状态。"
 GXC_liao_lei:0 "廖磊"
 GXC_liao_lei_desc: "廖磊（1890—1939），字燕农，广西陆川人，新桂系重要将领，陆军二级上将（追赠），曾任安徽省主席。\n\n早年入广西陆军小学堂、湖北陆军第三中学，参加辛亥革命学生军，后入保定军校第二期，1916年毕业分发湘军唐生智部，从连附逐级升至团长。1926年唐生智部改编为国民革命军第八军，廖磊任第四师副师长，参加北伐，后升第三十六军第一师师长。唐生智兵败后，廖磊因与白崇禧的广西同乡及保定同学关系，转投新桂系，任第三十六军军长，参加二次北伐进攻北京。1929年蒋桂战争桂系兵败，廖磊一度辞职赴港，同年冬返回广西，任护党救国军前敌总指挥部参谋长，参加中原大战。1931年起任第七军军长，驻军柳州六年，其间曾率部堵截长征过桂的红军。"
 GXC_lin_weicheng:0 "林伟成"
 GXC_lin_weicheng_desc: "林伟成（1902—1947），广东博罗人，空军少将，是桂系空军的重要奠基人。\n\n他早年在美国学医，1920年底弃医从航，随杨仙逸在檀香山学习飞行。回国后于1923年任大元帅府中山航空队第二飞机队长，并参加平定陈炯明叛乱的战斗。1924年任航空学校校长，同年赴苏联考察航空。1931年初，林伟成应李宗仁、白崇禧、黄绍竑之邀赴广西创办航空，任广西民航局长。同年10月民航局改为第四集团军总司令部航空处，他改任处长。1934年广西航空学校成立，他先后兼任副校长、校长，为桂系培养了一批航空人才。"
 GXC_liu_fei:0 "刘斐"
 GXC_liu_fei_desc: "刘斐（1898—1983），字为章，湖南醴陵人。\n\n他早年投笔从戎，先后就读于广西南宁讲武堂和广东西江讲武堂，受孙中山革命思想影响投身国民革命。北伐战争期间，他经白崇禧举荐，出任国民革命军总司令部上校作战主任参谋，协助代总参谋长白崇禧指挥作战，因才华出众深得信任，由此与桂系结下深厚渊源，后来成为桂系重要的智囊人物。\n\n大革命失败后，刘斐赴日本留学，先后毕业于日本陆军步兵专门学校和日本陆军大学，1934年回国后任第四集团军高级参谋兼广西民团干部学校教育长，并曾应程潜之约与桂系斡旋，为和平解决“两广事变”、实现共同抗日出力。"
 GXC_liu_shiyi:0 "刘士毅"
 GXC_liu_shiyi_desc:0 "刘士毅（1886—1982），字任夫，江西都昌人，陆军二级上将，是新桂系中重要的外省籍将领。\n\n他早年入保定陆军速成学堂，辛亥革命时参加九江光复，后追随李烈钧参与湖口起义，失败后流亡日本。回国后辗转于赣军任职，1926年北伐时随赖世璜部改编为国民革命军第十四军，任参谋长，赖世璜被处决后一度继任军长。1928年任独立第七师师长，驻防赣南，后因策划反蒋失败再度流亡日本。\n\n1931年九一八事变后，他应白崇禧之邀回国，出任中央军校第一分校（南宁）教育长、副校长，协助桂系重建部队，此后与桂系关系日益紧密。"
 GXC_qiu_changwei:0 "邱昌渭"
 GXC_qiu_changwei_desc: "邱昌渭（1898—1956），字毅吾，湖南芷江人，政治学博士，新桂系重要幕僚，被称为桂系的“智囊和文胆”之一。他早年留学美国，获波莫纳学院学士、哥伦比亚大学政治学博士学位，1928年归国后先后任教于东北大学、北京大学、中山大学。"
 GXC_su_xixun:0 "苏希洵"
 GXC_su_xixun_desc: "苏希洵（1890—1970），字子美，壮族，广西武鸣人，法学家。他早年因聪慧得到旧桂系首领陆荣廷赏识，成为其养女婿，并由此获得资助求学。他毕业于广西法政学堂，后赴法国巴黎大学法学院深造七年，获法学博士学位，是武鸣县历史上第一位博士，期间曾将《法兰西第五共和国宪法》译成中文。"
 GXC_wei_yunshong:0 "韦云淞"
 GXC_wei_yunshong_desc: "韦云淞（1889—1953），原名来松，字世栋，广西容县人，新桂系将领，陆军上将。\n\n他出身贫寒，17岁步行八百里到桂林投军，入蔡锷创办的步兵营工兵队当学员兵。辛亥革命时随广西援鄂部队北上，后返桂入广西陆军讲武堂工兵科。1922年加入李宗仁的自治军，从营长做起，参加了讨伐陆荣廷、沈鸿英等统一广西的战役，逐步成为桂系骨干。\n\n北伐时他任第七军第六旅旅长，留守广西，后升任第十三军军长，率部参加滦河会战。1930年蒋桂战争后桂系反蒋，滇军围攻南宁，韦云淞以三千人枪坚守南宁数月，直到援军赶到解围，这是他早期军事生涯中较为出彩的一笔。此后他历任广西全边对汛督办、省政府委员等职，1936年授陆军中将。"
 GXC_xia_wei:0 "夏威"
 GXC_xia_wei_desc: "夏威（1893—1975），原名钧善，字煦苍，广西容县人，新桂系核心人物之一，陆军上将。\n\n他出身乡绅家庭，早年入广西陆军小学，与白崇禧、黄绍竑是同学，辛亥革命时参加学生军。后入保定军校第三期，1916年毕业后回广西从基层军官做起，逐步升至团长。1924年新桂系占领南宁后，他改隶李宗仁部，任广西陆军第二军第三纵队司令，在统一广西的战役中出力甚多。\n\n新桂系改编为国民革命军第七军后，夏威任第六旅旅长参加北伐，在汀泗桥、贺胜桥等战役中作战，后升任第七军军长，并兼任国民政府军事委员会委员。宁汉分裂后，他率部迎击进攻南京的唐生智，一路反击夺回武汉、长沙等地。1929年蒋桂战争爆发，蒋介石买通其部下发动兵变，夏威被迫逃往香港。1931年他返回广西，先后任南宁中央军校第一分校校长、第十五军军长等职，抗战前晋升陆军上将。"
 GXC_zhang_gan:0 "张淦"
 GXC_zhang_gan_desc: "张淦（1897—1959），字洁斋，号济公，回族，广西桂林人，新桂系高级将领，陆军中将，因迷信风水、随身携带罗盘而被称为“罗盘将军”。他毕业于广西陆军速成学校，早年曾在旧桂系陆荣廷部任副官，陆荣廷失败后被李宗仁收编，从此成为新桂系的一员。北伐时期，他历任第七军副官、副官长及第八军参谋长。"
 GXC_zhou_zuhuang:0 "周祖晃"
 GXC_zhou_zuhuang_desc: "周祖晃（1891—1959），号敬生，广西临桂人，新桂系重要将领，陆军中将，素有“桂系宿将”之称。\n\n他早年就读桂林陆军小学、武昌陆军中学，后考入保定军校第一期骑兵科，与唐生智同学。毕业后先在湘军唐生智部任职，1924年转投李宗仁的“定桂讨贼联军”，正式加入桂系，此后历任第七军团长、副师长、参谋长等职，参加北伐及后来的蒋桂战争。"
 GXC_jiang_guangnai:0 "蒋光鼐"
 GXC_jiang_guangnai_desc: "蒋光鼐（1888—1967），字憬然，广东东莞人，杰出的爱国将领，以指挥一·二八淞沪抗战而闻名于世。\n\n他早年考入广东陆军小学，加入同盟会，辛亥革命时作为学生军敢死队员参加汉口作战。后入保定军校，参加“二次革命”湖口起义，失败后赴日追随孙中山，此后在东征、北伐中屡立战功，所部后改编为第十九路军，他出任全军总指挥。\n\n1932年日军进犯上海，时任十九路军总指挥的蒋光鼐抱病奔赴前线，通电全国“尺地寸草，不能放弃”。他拒绝执行南京政府停止抵抗的命令，下令“用大炮回答”日军的最后通牒，率部苦战月余，粉碎了日军“四小时占领上海”的狂言。"
 GXC_cai_tingkai:0 "蔡廷锴"
 GXC_cai_tingkai_desc: "蔡廷锴（1892—1968），字贤初，广东罗定人，因家境贫困自幼失学，少年从军，后投身孙中山的革命活动，毕业于保定陆军军官学校，早年加入同盟会。北伐战争期间，他先后担任第四军第十师第二十八团团长、第十一军第二十四师副师长，1930年被任命为第十九路军军长。\n\n1932年“一·二八”事变爆发，蔡廷锴与蒋光鼐、戴戟联名向全国发出抗日通电，表示“尺地寸草，不能放弃”，率第十九路军奋起抵抗，经过近四十日浴血奋战，粉碎了日军“四小时占领上海”的狂言，迫使日军多次更换主帅。1933年，他因反对南京政府的不抵抗政策，不愿继续与红军作战，与陈铭枢、蒋光鼐等发动福建事变，成立中华共和国人民革命政府，任人民革命军第一方面军总司令，并与红军签订抗日反蒋初步协定。"
 GXC_chen_mingshu:0 "陈铭枢"
 GXC_chen_mingshu_desc: "陈铭枢（1889—1965），字真如，广东合浦（今属广西）人，保定军校第三期毕业，同盟会会员。他是中国现代史上著名的民主革命家、爱国将领，也是民革创始人之一，被誉为“铁军名将、抗日名将和中国共产党的诤友”。\n\n早年他追随孙中山参加反清革命，投身辛亥革命，在武昌保卫战中浴血作战。北伐时期，他任国民革命军第四军第十师师长、第十一军军长，率部驰骋战场，赢得“铁军名将”之称。1929年任广东省政府主席，后调停宁粤纷争入主中枢，曾任京沪卫戍司令长官、行政院副院长兼交通部长，并一度代理行政院长。\n\n1932年“一·二八”事变爆发，陈铭枢与蒋光鼐、蔡廷锴等指挥十九路军奋起抵抗，进行了著名的淞沪抗战。1933年11月，他联合李济深、蒋光鼐、蔡廷锴等在福州发动福建事变，成立“中华共和国人民革命政府”，公开反蒋抗日，事败后流亡香港，继续从事抗日反蒋活动。"
 GXC_Li_Jishen:0 "李济深"
 GXC_Li_Jishen_desc: "李济深（1885—1959），字任潮，广西苍梧人，原籍江苏，中国国民党革命委员会（民革）主要创始人和首任主席。\n\n他早年就读于保定军官学校（后为北京陆军大学），并曾留学日本，此后追随孙中山，任粤军第一师参谋长、师长，黄埔军校副校长，国民革命军第四军军长等职。北伐时期任国民革命军总司令部参谋长，留守广州，一度集广东党政军大权于一身。1927年曾参与蒋介石的清党活动，后因调解蒋桂矛盾被蒋扣留于汤山，从此走上反蒋道路。\n\n1933年，李济深联合第十九路军将领陈铭枢、蒋光鼐、蔡廷锴等发动福建事变，成立“中华共和国人民革命政府”，被推为主席，公开反蒋抗日，并与红军签订反日反蒋初步协定，事败后流亡香港。"
 GXC_qu_shounian:0 "区寿年"
 GXC_qu_shounian_desc: "区寿年（1902—1957），字介眉，广东罗定人，蔡廷锴的外甥，国民党军高级将领。\n\n他早年投身粤军，后入阳江军事教习所，毕业后在粤军中历任司务长、排长、连长。1926年任国民革命军第四军第十师连长，参加北伐，因功升任营长、团长。1927年8月，他作为第二十四师第七十团团长参加南昌起义，随后脱离起义部队，随蔡廷锴投靠陈铭枢。1931年任第十九路军第七十八师师长，次年率部参加一·二八淞沪抗战，奋起抵抗日军，获颁青天白日勋章。1933年参与福建事变，任“福建人民政府”第二军军长，事变失败后赴德国学习军事。"

 GDC_character:0 "广东顾问"
 GDC_chen_jitang:0 "陈济棠"
 GDC_chen_jitang_desc:0 "陈济棠（1890—1954），字伯南，广东防城（今属广西防城港）人，粤系军阀首领，陆军一级上将，因长期主政广东并与南京中央分庭抗礼，被称为“南天王”。\n\n他早年就读于广东陆军小学堂、广东陆军速成学校，并加入同盟会。毕业后在粤军中从排长逐级升至旅长、师长，1925年任国民革命军第四军第十一师师长，参加过东征、南征等战役。1929年蒋桂战争后，他借机扩张势力，逐步掌控广东军政大权。1931年起，陈济棠主政广东，与南京政府保持半独立状态。他提出“改革陋习，刷新政治，造成模范新广东”，主导制定了《广东三年施政计划》。"
 GDC_yu_hanmou:0 "余汉谋"
 GDC_yu_hanmou_desc: "余汉谋（1896—1981），字幄奇，广东高要（今肇庆）人，国民党军高级将领，陆军一级上将。他的一生与粤系军队的兴衰紧密相连，也是广东抗战前后关键的军政人物。余汉谋毕业于黄埔陆军小学、保定军校第六期，1916年加入中华革命党，后投身粤军。他从基层军官做起，长期追随陈济棠，在粤军第一师中逐级升迁，成为陈济棠麾下的得力干将。1930年，他任第一集团军第一军军长，成为粤军中的重要实力派。"
 GDC_li_hanhun:0 "李汉魂"
 GDC_li_hanhun_desc: "李汉魂（1894—1987），字伯豪，号南华，广东吴川人，是民国时期粤系军政要人，也是一位以抗日战功和主政广东而闻名的儒将。他早年加入同盟会，毕业于保定军校第六期。1926年随国民革命军第四军参加北伐，任第十二师参谋处长，亲历了汀泗桥、贺胜桥等著名战役，后升任第二十五师师长。"
 GDC_deng_longguang:0 "邓龙光"
 GDC_deng_longguang_desc: "邓龙光（1896—1979），字剑泉，号德梧，广东茂名人，粤军将领，陆军中将。他早年毕业于广东陆军小学、保定军校第六期步兵科，后投身粤军，参加过东征、北伐及对中央苏区的“围剿”。1936年1月授陆军中将。"
 GDC_huang_guangrui:0 "黄光锐"
 GDC_huang_guangrui_desc: "黄光锐（1898—1986），广东台山人，中国空军先驱，空军中将。他幼年随父赴美，1916年进入美洲飞行学校学习，取得美国飞行执照，并加入同盟会，任采购军火委员会技师。\n\n1922年底，黄光锐随杨仙逸携带飞机器材回国，任大元帅府航空局第一飞机队队长，参与对陈炯明叛军的作战。1923年，他亲自驾驶试飞中国自行设计制造的第一架军用飞机“乐士文号”，宋庆龄随机升空，成为轰动一时的新闻。此后他历任广东航空学校校长、航空局局长、广东空军总司令等职，1928年还参与驾驶“珠江号”水上飞机环飞全国。"

 XIC_character:0 "东北军顾问"
 XIC_zhang_xueliang:0 "张学良"
 XIC_zhang_xueliang_desc:0 "奉系领袖张作霖之子，世称“少帅”。1928年接掌东北军并宣布东北易帜，使国民政府在名义上完成统一。九一八事变后率部退入关内，既承受失地之责，也日益主张停止内战、共同抗日。1936年，他与杨虎城发动西安事变，扣留蒋介石并促其转变政策；事变和平解决后，张学良亲送蒋返南京，旋即遭到长期幽禁。"
 XIC_yang_hucheng:0 "杨虎城"
 XIC_yang_hucheng_desc:0 "出身陕西地方武装的西北军将领，长期经营第十七路军，在关中拥有深厚影响。面对日本步步进逼与持续内战，他与张学良于1936年共同发动西安事变，要求停止“剿共”、一致抗日。事变后被迫离开军职，1937年回国后遭秘密囚禁，最终于1949年在重庆被杀。"
 XIC_yu_xuezhong:0 "于学忠"
 XIC_yu_xuezhong_desc:0 "山东蓬莱人，早年辗转北洋军系，后受张学良倚重，成为东北军主要将领之一。曾任甘肃省政府主席、第五十一军军长，并在西安事变后的危局中参与维持东北军。全面抗战爆发后，他率部在淮河、山东等地对日作战，继而主持苏鲁战区，在敌后坚持多年。"
 XIC_wang_yizhe:0 "王以哲"
 XIC_wang_yizhe_desc:0 "保定陆军军官学校第八期毕业，是张学良亲信与东北军第六十七军军长。长城抗战期间曾率部迎击日军；进驻西北后，他参与同红军接触与停战谈判，支持联合抗日。西安事变后，王以哲主张以和平方式营救张学良，却在东北军内部矛盾激化的“二二事件”中被少壮派军官杀害。"
 XIC_sun_weiru:0 "孙蔚如"
 XIC_sun_weiru_desc:0 "陕西长安人，早年投身民主革命，后成为杨虎城麾下的重要将领，以持重善守著称。全面抗战爆发后，他率陕西部队参加华北作战，继任第四集团军总司令，长期坚守晋南中条山一线，屏障潼关与关中。其部在艰苦环境中多次阻击日军，孙蔚如也因此被誉为中条山的“铁柱子”。"
 XIC_feng_qinzai:0 "冯钦哉"
 XIC_feng_qinzai_desc:0 "山西万泉人，早年加入同盟会并参加辛亥革命，后投身杨虎城部，历任旅长、师长及军长。1933年曾率部参加长城抗战；西安事变后与杨虎城分道扬镳，所部改编为第二十七路军。全面抗战期间，他又率军在河北、晋东南等地同日军作战。"
 XIC_zhou_fucheng:0 "周福成"
 XIC_zhou_fucheng_desc:0 "东北军将领，抗战初期任第一一六师师长，先后在平汉线和太行山区对日作战。此后接掌第五十三军，在复杂的派系与整编压力下维系这支东北军旧部，并率军参加滇西反攻。1948年辽沈战役期间，他在沈阳被人民解放军俘虏，第五十三军的历史也随之落幕。"
 XIC_zhu_hongxun:0 "朱鸿勋"
 XIC_zhu_hongxun_desc:0 "吉林农安人，曾就读南开中学，后毕业于东北讲武堂第六期步兵科。历任第一三〇师师长、第五十三军副军长，参加长城抗战与武汉会战，在鄂东南率部阻击日军。1940年10月，他在湖北华容一带作战时中弹殉国，后被追授陆军中将。"
 XIC_deng_baoshan:0 "邓宝珊"
 XIC_deng_baoshan_desc:0 "甘肃天水人，原名邓瑜，少年从军并参加伊犁辛亥革命，后来成为西北军中富有声望的“儒将”。他曾任新编第一军军长，长期周旋于南京中央、西北地方势力与陕甘宁边区之间。抗战时期主持晋陕绥边区军务，在榆林一带维持河防，也以务实态度保持同中共方面的联系。"
 XIC_lu_dachang:0 "鲁大昌"
 XIC_lu_dachang_desc:0 "甘肃临夏人，由旧军队基层逐步崛起，最终成为盘踞洮岷地区的地方实力派，所部编为新编第十四师。1935年他凭借腊子口天险阻击长征中的红一方面军，却被红军突破防线。此后虽获授新编第二军军长等职，但其地方军权在中央整编下逐渐被削弱。"
 XIC_bai_fengxiang:0 "白凤翔"
 XIC_bai_fengxiang_desc:0 "河北沧州人，行伍出身的东北军骑兵骁将，善骑射，后任骑兵第六师师长。1936年西安事变中，他参与指挥临潼方面的捉蒋行动。全面抗战爆发后，白凤翔组织热河抗日先遣军，在长城内外开展游击作战，1940年在抗日活动中遇害。"
 XIC_tan_zixin:0 "檀自新"
 XIC_tan_zixin_desc:0 "东北军骑兵将领，九一八事变后曾在日军、义勇军及各路地方武装之间反复转投，后所部被编为骑兵第十师。西安事变发生后，他率部脱离东北军并转向南京中央，旋升任骑兵第四军军长。1937年所部在河南战败溃散，檀自新因抗命另谋出路而被捕，次年遭军法处决。"
 XIC_guo_xipeng:0 "郭希鹏"
 XIC_guo_xipeng_desc:0 "辽宁盖平人，东北讲武堂出身，并曾赴日本学习骑兵战术。回国后长期统率东北军骑兵，历任骑兵旅长、师长及骑兵第二军副军长，参加长城抗战与绥远一带的对日作战。抗战胜利后，他因不愿参与内战而未赴新职，留在北平迎接时局更替。"
 XIC_huang_yongan:0 "黄永安"
 XIC_huang_yongan_desc:0 "东北军炮兵将领，曾任炮兵第六旅旅长，是张学良部下的专业兵种军官之一。西安事变和平解决、张学良被扣之后，东北军迅速陷入分裂与整编；黄永安率部脱离原有系统，转受南京中央节制。其选择正是东北军失去统一领导后，各部各寻出路的缩影。"
 XIC_lv_zhengcao:0 "吕正操"
 XIC_lv_zhengcao_desc: "吕正操（1904—2009），辽宁海城人，原名吕正超，字必之。1922年加入东北军，后入东北讲武堂第五期，曾任张学良副官、秘书。九一八事变后随东北军入关，1932年任第116师647团团长，参加热河抗战；驻防北平时支持“一二·九”运动，所部有“红色团”之称。1936年组织“东北武装同志抗日救亡先锋队”并任总队长，同年调西安任张学良内勤，参与西安事变。"
 XIC_xie_hua: "谢华"
 XIC_xie_hua_desc: "谢华（1895—1987），原名谢滋山，湖南衡南人。1926年加入中共，长期从事兵运。1935年化名谢华赴西安，1936年任中共西北特别支部书记，以杨虎城部宪兵营教官身份为掩护，领导西北各界救国联合会，推动西安抗日救亡运动，并参与西安事变和平解决。"
 XIC_yang_mingxuan: "杨明轩"
 XIC_yang_mingxuan_desc: "杨明轩（1891—1967），原名荃骏，字明轩，陕西户县人。1926年加入中国共产党。早年投身五四运动，后长期在陕西从事教育工作，是西北知识界的领袖人物。"

