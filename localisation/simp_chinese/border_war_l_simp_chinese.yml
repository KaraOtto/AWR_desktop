l_simp_chinese:
 border_threat:0 "边界调整"
 RCM_buildings_damaged:0 "已完成在该地区的破坏\n"
 defensive_border_conflict_won:0 "防御方取胜！"
 border_incident_active:0 "该地区没有正在进行的边境冲突"
 RCM_border_conflict_won_defender.1.t:0 "在[their_state.GetName]获胜"
 RCM_border_conflict_won_defender.1.desc:0 "在[our_state.GetName]与[their_state.GetName]边境上发生的冲突以我们完胜[their_country.GetLeader]的军队的结局告终。[their_country.GetAdjective]的军队被击退，而我们则占领了争议地区。"
 RCM_border_conflict_won_defender.1.a:0 "我们他们展示了自己的实力！"
 RCM_border_conflict_lost_attacker.1.t:0 "在[our_state.GetName]失利"
 RCM_border_conflict_lost_attacker.1.desc:0 "[their_country.GetLeader]麾下的军队已经成功地将我们赶出了[our_state.GetName]与[their_state.GetName]之间的争议地区。我们部队已经井然有序地撤退了，并在进行重整以备未来的战斗。"
 RCM_border_conflict_lost_attacker.1.a:0 "我们必须尽快反击！"
 RCM_border_conflict_lost_defender.1.t:0 "在[our_state.GetName]失利"
 RCM_border_conflict_lost_defender.1.desc:0 "[their_country.GetLeader]麾下的军队已经成功地将我们赶出了[our_state.GetName]与[their_state.GetName]之间的争议地区。我们部队已经井然有序地撤退了，并在进行重整以备未来的战斗。"
 RCM_border_conflict_lost_defender.1.a:0 "我们必须尽快反击！"
 RCM_border_conflict_canceled_defender.1.t:0 "在[their_state.GetName]陷入僵局"
 RCM_border_conflict_canceled_defender.1.desc:0 "由于双方都无法击退对方，[our_state.GetName]和[their_state.GetName]地区的战斗陷入了僵持。双方都未能取得任何较大的进展。情报人员汇报，[their_country.GetAdjective]的士兵在对方阵地挖掘工事，看起来相比于进攻，他们更想守住现有的防线。"
 RCM_border_conflict_canceled_defender.1.a:0 "我们会回来的。"
 RCM_border_incident_defender_warning.1.t:0 "[From.GetNameDefCap]威胁着我们的边境"
 RCM_border_incident_defender_warning.1.desc:0 "昨日早晨，[their_country.GetAdjective]的士兵被发现越过[attacker_state.GetName]边境侵入[defender_state.GetName]。而在晚上，更多的[their_country.GetAdjective]军队开进了这个地区并且在我们的固有领土内设置防线。\n\n随后，[their_country.GetLeader]麾下的军队与我们在整条边境线上发生了一系列的冲突和交火。\n\n至此，情势已经十分明显，[their_country.GetAdjective]的军队将会在此固守。我们必须尽快组织军队以阻止他们的侵略。"
 RCM_border_incident_defender_warning.1.a:0 "动员所有可用的军队！"
