 start_events.12.t: "主要国家数值决定"
 start_events.12.desc: "可以决定所有主要国家（英法美苏德意日国共）的国策和民族精神的数值情况（其实是保留了原来的高数值选项）"
 start_events.12.a: "好！我喜欢天堂之战！"
 start_events.12.b: "我希望数值保守些。"