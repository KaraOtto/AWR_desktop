  #####start_events
 start_events.1.t: "欢迎游玩《全面抗战》！"
 start_events.1.desc: "如各位希望的那样，《八年抗战优化补充整合版》回来了！除了清掉了前Mod中的大量bug，我们对所有主要国家的数值做出了新的调整，除去了逆天buff等情况带来的影响，同时对近些年来的DLC做了更好的适配，在非mod国家中也可以正常游玩DLC内容！\n\n除此之外，下面的建议或许能够帮助您更享受这款MOD：\n      1.关注一开始所拥有的民族精神！关注一开始所拥有的民族精神！这可以帮助您了解这个国家的现状，并帮助您了解该如何才能避免一些不好的事情发生，亦或者获得DEBUFF。\n      2.时常确认决议的状况：有时候一些重要的事情会在决议当中说明，经常检查决议的状况以确保你不会错过。\n      3.阅读提示：在此MOD中，特别是一些信息将会被高亮显示，这些通常都是有用的讯息。"
 start_events.1.a: "谢谢！我现在明白了。"

 start_events.2.t: "国家数值限制"
 start_events.2.desc: "整合版对于中国共产党进行了一系列的加强，提升了它的产能，获取工厂的数量及一系列buff，但这些需要时间来发育，所以不要急于战斗，以下是其他的注意事项：\n    1.日本在中国战场上获取一定成果后，地图上会出现“未经计划的攻势”，保证中央政府不会突然暴毙，但也要抓紧时间，因为ai可以用决议消除；\n    2.“联系张学良”：“联系张学良”国策能让你与东北军达成默契的休战（在游戏中会以非军事区表示），确保国民党不会直接攻击你。少帅只有看到你抗日的决心才会同意停战，所以要考虑好开局扩张的方向；\n    3.PRC在国共内战未开始前，主要的扩张方式为游击队的武装起义，注意敌后抗战相关国策。"
 start_events.2.a: "无限制。"
 start_events.2.b: "900军队   20000架战机"
 start_events.2.c: "600军队   10000架战机"
 start_events.2.d: "300军队   5000架战机"

 start_events.3.t: "中国共产党的注意事项"
 start_events.3.desc: "整合版对于中国共产党进行了一系列的加强，提升了它的产能，获取工厂的数量及一系列buff，但这些需要时间来发育，所以不要急于战斗，以下是其他的注意事项：\n    1.当中华民国的投降倾向达到%时，中国地区会出现未经计划的攻势，但如果日本AI难度为加强和超级加强时，未经计划的攻势将不会出现；\n    2.“肤施会谈”：“肤施会谈”国策能让你与东北军达成默契的休战（在游戏中会以非军事区表示），确保国民党不会直接攻击你。少帅只有看到你进行过东征，但现出抗日的决心才会同意停战，所以要考虑好开局扩张的方向；\n    3.PRC在国共内战未开始前，主要的扩张方式为游击队的武装起义，注意敌后抗战相关国策。\n    4.日本“中国一击论”的民族精神与他们在中国的战略目标密切相关，提前挫败日本的战略目标会让他们迅速失去“中国一击论”，所以抗日战争爆发时最好有选择性地参与前线的战斗。\n    5.如果国民政府不幸投降，如果你不甘失败，就请继续打下去吧，剩余的军阀会选择和你站在一起的；6.如果蒋介石死亡，就会导致国民政府的分裂，此时东北军会选择投靠你，国民政府内的民主同盟和社会主义者们也会和你展开合作，你可以选择西进消灭马家军，也可以直接参与中原大战。不过请尽快结束第三次中原大战，否则日本可能会趁机占领中原地区。"
 start_events.3.a: "谢谢！我现在明白了。"

 start_events.4.t: "中华民国的注意事项"
 start_events.4.desc: "国民政府在名义上统一了中国，但内部问题非常严重，在全面抗战中对国民政府进行了大幅度的重置，减少了军队严重的debuff，但独立出来了很多新的机制，以下是其他的注意事项：\n    1.国民政府新增权力平衡机制，不同势力给予的加成不同，如果某一影响力大于75%时，也不会增加额外buff；\n    2.新版的腐败机制中，最不会有常驻debuff，但会不断爆腐败事件，所以尽快完成腐败值相关的国策；\n    3.走蒋介石统治的路线只能走长期训政线、训政转宪政和黑线军国线，如果想转其他的线就只能借西安事变引爆第三次中原内战。\n    4.如果选择与中共合作组建联合政府，可以选择新的路线。"
 start_events.4.a: "谢谢！我现在明白了。"

 start_events.5.t: "日本及其盟友的注意事项"
 start_events.5.desc: "日本是一个工业强国，但中国是一个患病的巨人，想征服他，你只能尝试以最快的速度将其灭掉，不要尝试多线作战。这很容易让本就不稳定的经济崩溃。\n    1.日本开局有“中国一击论”，但如果想维持这个民族精神，就必须在任务到期之前完成战略目标，否则会失去这个民族精神；\n    2.当中华民国投降倾向达到50%时，会出现未经计划的攻势，定期可以消除未经计划的攻势；\n    3.中国军队数量很多，想速胜中国是不可能的，尽可能在作战期间进行包围和歼灭，消灭有生力量比一城的得失重要得多；\n    4.请管理好士兵的军纪，不要让他们在中国的土地上胡作非为，否则会引发游击队的激烈反抗，最后导致镇压的成本大大增加。"
 start_events.5.a: "谢谢！我现在明白了。"

