 CHI_power_blocs_test_raise_army_desc: "提高军队影响力并重新计算权力集团。"
 CHI_power_blocs_test_raise_capital: "[测试] 提高[GetCHIPowerBlocCapitalName]影响力"
 CHI_power_blocs_test_raise_capital_desc: "提高[GetCHIPowerBlocCapitalName]影响力并重新计算权力集团。"
 CHI_power_blocs_test_raise_technocrat: "[测试] 提高技术官僚影响力"
 CHI_power_blocs_test_raise_technocrat_desc: "提高技术官僚影响力并重新计算权力集团。"
