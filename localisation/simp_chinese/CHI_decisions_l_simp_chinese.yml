 CHI_power_bloc_leader_tt: "§Y国家元首§!（[?CHI.CHI_power_bloc_leader_influence|%0]）\n以25%为基准，影响：\n  政治点数获取\n  稳定度\n  战争支持度"
 CHI_power_bloc_army_tt: "§Y军队§!（[?CHI.CHI_power_bloc_army_influence|%0]）\n以25%为基准，影响：\n  陆军攻击、防御、突破与组织度：差额的20%\n  补给消耗：差额的-40%\n  海军协同与空军任务效率：差额的100%"
 CHI_power_bloc_capital_tt: "§Y[GetCHIPowerBlocCapitalName]§!（[?CHI.CHI_power_bloc_capital_influence|%0]）\n[GetCHIPowerBlocCapitalEffects]"
 CHI_power_bloc_technocrat_tt: "§Y技术官僚§!（[?CHI.CHI_power_bloc_technocrat_influence|%0]）\n以25%为基准，影响：\n  研究速度与特别项目速度：差额的80%\n  生活消费品系数：差额的-80%\n  政治顾问、经济法案与工业企业花费：差额的-100%"
 CHI_power_bloc_capital_effects_bureaucratic: "以25%为基准，影响：\n  基础设施、民用工厂、军用工厂与船坞建造速度：差额的50%\n  工厂与船坞产出：差额的40%"
 CHI_power_bloc_capital_effects_bourgeoisie: "以25%为基准，影响：\n  基础设施与民用工厂建造速度：差额的100%\n  生产效率增长：差额的100%\n  每月经济发展：差额的10%"

