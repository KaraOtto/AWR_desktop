l_simp_chinese:
 CHI_power_blocs_category: "权力集团"
 CHI_power_blocs_category_desc: "国民政府不是一块铁板。国家元首、军队、资本集团与技术官僚围绕政府资源持续角力；四方影响力之和始终为§Y100%§!。每一集团以§Y25%§!为效果基准，§Y75%§!以上的影响力不再继续增强其效果。"

 CHI_power_blocs_title: "权力集团"
 CHI_power_blocs_subtitle: "§Y[ROOT.GetNameDef]§!的国家权力结构"
