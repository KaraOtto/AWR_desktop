 CHI_power_bloc_government_name_national: "中华民国国民政府"
 CHI_power_bloc_government_name_republic: "中华民国政府"
 CHI_power_blocs_national_government: "[GetCHIPowerBlocGovernmentName]"
 CHI_power_blocs_national_government_desc: "国民政府的实际施政效果由四个权力集团的相对影响力决定。"
 CHI_power_blocs_reformed_government: "[GetCHIPowerBlocGovernmentName]"
 CHI_power_blocs_reformed_government_desc: "经过政治与经济重组后的共和国政府，其实际施政效果仍取决于各权力集团的力量对比。"

 CHI_corruption_category: "国民政府反腐行动"
 CHI_corruption_category_desc: "军队腐败：[?CHI_army_corruption|%0]（每月+[?CHI_army_corruption_coefficient|%0]）\n官僚资本腐败：[?CHI_capital_corruption|%0]（每月+[?CHI_capital_corruption_coefficient|%0]）\n技术官僚腐败：[?CHI_technocrat_corruption|%0]（每月+[?CHI_technocrat_corruption_coefficient|%0]）\n\n每月按腐败值检定案件；腐败越严重，出现中度、重度案件的概率越高。强硬清洗能迅速压低腐败，却会损害稳定度、权力集团影响力与行政或军事效能。"
 CHI_corruption_investigate_army: "整顿军队账目"
 CHI_corruption_investigate_army_desc: "清查军械、军饷与各级军官账目。"
 CHI_corruption_audit_capital: "审计官僚资本"
 CHI_corruption_audit_capital_desc: "由监察与审计机关调查国营事业和金融系统。"
 CHI_corruption_reorganize_bureaucracy: "整顿行政机关"
 CHI_corruption_reorganize_bureaucracy_desc: "轮调官员、复核预算并重建行政监督。"
 CHI_corruption_finish_campaign: "完成制度化反腐"
 CHI_corruption_finish_campaign_desc: "当三类腐败均降至10%以下后，将临时清洗转化为常设监督制度，并永久关闭随机腐败机制。"
