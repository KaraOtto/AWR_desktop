l_simp_chinese:
 AWR_XIC:0 "东北军事件"
 AWR_XIC.1.t:0 "共产党人希望安排默许停战以避免伤亡"
 AWR_XIC.1.d:0 "共产党人今天秘密緻函我们，希望我们与他们达成默契，以免造成不必要的牺牲。我们大多数人都同情共产党，也对南京对日本侵略的不作为而感到愤怒。然而，安排这样的事情是非常棘手的。我们该如何回应？"
 AWR_XIC.1.a:0 "中国人不打中国人。我们会安排默许停战。"
 AWR_XIC.1.b:0 "我们理解他们的事业，但他们的影响太大了，我们现在不能这样做。"
 AWR_XIC.2.t:0 "[CHI.GetLeader]抵达西安"
 AWR_XIC.2.d:0 "中央政府声称，我们和共产党军队之间有一个所谓的默许的停战协议，原因他们尚未证实。[CHI.GetLeader]已经决定访问西安并与我们会面，以澄清事情的结果。"
 AWR_XIC.2.a:0 "嗯，也许我们可以做点什么......"
 AWR_XIC.3.t:0 "突然的袭击"
 AWR_XIC.3.d:0 "中央军和马家军联合发起突袭，中共军队被击退。现在我们只能一同奔赴前线，避免事态朝坏的方向发展。"
 AWR_XIC.3.a:0 "中国的未来将何去何从。"  
 AWR_XIC.4.t:0 "共产党人提出大西北联盟"
 AWR_XIC.4.d:0 "随著共产党成功建立了从苏联的补给路线，他们向[Root.GetLeader]提议组建大西北联盟。 这将使我们有机会站出来反对国民党政府，甚至日本。"
 AWR_XIC.4.a:0 "我们将接受该提议。"
 AWR_XIC.4.b:0 "这风险太大了！"


 AWR_NXM:0 "宁夏马事件"
 AWR_NXM.1.t:0 "击退共产党民兵"
 AWR_NXM.1.d:0 "我们和中央军、东北军联合发起突袭给共匪带来了更大的打击。现在他们都逃走了，我们在该地区的主导地位已得到恢复，今天对马家军来说是个好日子。"
 AWR_NXM.1.a:0 "太好了！" 
 AWR_NXM.2.t:0 "击退共产党民兵"
 AWR_NXM.2.d:0 "我军队遭到共产党军队的袭击。但是，我们给他们带来了更大的打击。现在他们都逃走了。我们在该地区的主导地位已得到恢复。今天对我军来说是个好日子。"
 AWR_NXM.2.a:0 "太好了！"
 AWR_NXM.3.t:0 "共产党民兵撤退了"
 AWR_NXM.3.d:0 "我军遭到共军的袭击。 然而，最近他们决定撤退到他们的基地，原因尚未明确。 然而，我们在该地区的影响力并没有受到这次平安无事的袭击的太大影响。"
 AWR_NXM.3.a:0 "好吧。"
 AWR_NXM.4.t:0 "马鸿宾的抉择"
 AWR_NXM.4.d:0 "共产党人已经打到了宁夏边境，他们似乎势不可挡。而现在，身为本地领导人之一的马鸿宾已经开始考虑“起义”了，虽然这可能能保住他在宁夏的地位，但真正的问题是，这值得吗？"
 AWR_NXM.4.a:0 "大势所趋。"
 AWR_NXM.4.b:0 "我们决不投降！"
 AWR_NXM.5.t:0 "马鸿宾投敌"
 AWR_NXM.5.d:0 "马鸿宾，这位宁夏的军事领导者已经宣布投降，尽管另一位军事领导者，马鸿逵仍在试图抵抗，但他的所有部队都已站在我方这边了。"
 AWR_NXM.5.a:0 "一位聪明人。"
 AWR_NXM.6.t:0 "[From.GetLeader] 拒绝我们的合作提议"
 AWR_NXM.6.d:0 "马鸿宾决定拒绝我们的合作，并誓言与我们决一死战。 好吧，如果这就是他们的抉择，那他们就会为此付出代价。"
 AWR_NXM.6.a:0 "打倒他们！"


 AWR_GSM:0 "甘肃马事件"
 AWR_GSM.1.t:0 "共产党民兵被击退"
 AWR_GSM.1.d:0 "我军遭到共产党军队的袭击。 然而，我们给了他们更大的打击。 现在他们都逃走了。 我们在该地区的主导地位已经恢复。 今天对我军来说是个好日子。"
 AWR_GSM.1.a:0 "很好！"
 AWR_GSM.2.t:0 "共产党民兵撤退了"
 AWR_GSM.2.d:0 "我军遭到共军的袭击。 然而，最近他们决定撤退到他们的基地，原因尚未明确。 然而，我们在该地区的影响力并没有受到这次平安无事的袭击的太大影响。"
 AWR_GSM.2.a:0 "好吧。"


 AWR_XIK:0 "西康事件"
 AWR_XIK.1.t:0 "彭县「起义」"
 AWR_XIK.1.d:0 "看到国民党在军事上遭受惨败后，[Root.GetLeader]和一些川系将领认为加入[WTT_communist_china.GetName]可能是最好的选择。"
 AWR_XIK.1.a:0 "团结就是力量！"
 AWR_XIK.2.t:0 "[From.GetName]加入解放军"
 AWR_XIK.2.d:0 "[From.GetName]已选择加入我们的队伍来对抗国军。让我们团结起来，解放工人和农民。"
 AWR_XIK.2.a:0 "团结就是力量！"
 AWR_XIK.3.t:0 "[From.GetLeader] 拒绝我们的合作提议"
 AWR_XIK.3.d:0 "[From.GetLeader] 和他的 [From.GetNameDef] 暴徒决定拒绝我们的合作提议，并发誓与我方战斗到底。 好吧，如果这就是他们的抉择，那他们就会为此付出代价。"
 AWR_XIK.3.a:0 "打倒他们！"


 AWR_SIC.1.t:0 "邓锡侯掌权"
 AWR_SIC.1.d:0 "四川军事领导人邓锡侯被任命为四川省长，这应该有助于改善四川与中央政府的关系。"
 AWR_SIC.1.a:0 "四川当由川人管。"
 AWR_SIC.2.t:0 "[From.GetName]反对张群"
 AWR_SIC.2.d:0 "意外的是，任命张群为省主席一事遭到了多数川军将领的反对，解散川康绥靖公署的计划亦不得人心，我们必须安抚川军将领，否则他们可能会和其他西南军阀一起对我们发动叛乱。"
 AWR_SIC.2.a:0 "我们能解决这个问题。"
 AWR_SIC.3.t:0 "王缵绪被任命为四川省主席"
 AWR_SIC.3.d:0 "中央决定由四川将领王钻绪接替张群，由于王钻绪也是亲中央的，不久的将来很可能会遭到其他四川将领的反对。 军事方面，川西绥靖指挥部保留，邓锡侯将接替刘湘出任长官，负责指挥川康卫戍部队。"
 AWR_SIC.3.a:0 "至少他比张群能接受。"
 AWR_SIC.4.t:0 "川军起事"
 AWR_SIC.4.d:0 "四川将领厌倦了中央政府的代表-张群，为此对张群发起刺杀行动，将中央军逐出驻地，同时联络西南其他军队领导人，共同对抗张群与其背后的中央政府。"
 AWR_SIC.4.a:0 "赶走外省人！"
 AWR_SIC.5.t:0 "[From.GetName]邀请我们反对 [WTT_current_china_leader.GetLeader]"
 AWR_SIC.5.d:0 "为了维护[From.GetName]的自治权，[From.GetName]正与中央政府进行斗争，他们邀请我们加入此一运动，毕竟同样的事情也可能发生在我们身上。"
 AWR_SIC.5.a:0 "为了我们的自主！"
 AWR_SIC.5.b:0 "这不可能。"
 AWR_SIC.6.t:0 "[From.GetName]叛乱"
 AWR_SIC.6.d:0 "由于一些川系将军暗杀了我们指派的军官，还驱逐了中央军人员，并联系了其他西南军事领导人来对抗我们，也许我们应该立即采取军事镇压。"
 AWR_SIC.6.a:0 "做出让步。"
 AWR_SIC.6.b:0 "我们很快就能打败他们。"
 AWR_SIC.7.t:0 "多名川系将军投向[WTT_current_china_leader.GetLeader]"
 AWR_SIC.7.d:0 "透过一些肮脏的伎俩，[WTT_current_china_leader.GetLeader]成功招募了一些川系将军，他们将离开我们的组织并转而为中央政府服务。"
 AWR_SIC.7.a:0 "他们只是[WTT_current_china_leader.GetLeader]的走狗。"
 AWR_SIC.8.t:0 "多名川系将军投向我方"
 AWR_SIC.8.d:0 "透过提拔和贿赂，我们成功地招募了一批川系将领，他们现在将为我们服务，并在对抗侵略者的战争中尽自己的一份力量。"
 AWR_SIC.8.a:0 "欢迎加入中央军！"
 AWR_SIC.9.t:0 "[From.GetName]加入我方阵营"
 AWR_SIC.9.d:0 "[From.GetName]同意加入我们的联盟，争取自主，并在中央政府攻击我们时并肩作战。"
 AWR_SIC.9.a:0 "欢迎！"
 AWR_SIC.10.t:0 "川系将领反对王缵绪"
 AWR_SIC.10.d:0 "不幸的是，许多将领对王缵绪的再次统治并不满意，也许我们应该再次更换省主席。"
 AWR_SIC.10.a:0 "请求[WTT_current_china_leader.GetLeader]帮助。"
 AWR_SIC.11.t:0 "川系将领反对王缵绪"
 AWR_SIC.11.d:0 "许多四川将领对王缵绪的统治并不满意，我们应该派出一位“更有代表性”的官员担任省主席…"
 AWR_SIC.11.a:0 "那就由[Root.GetLeader]自己控制四川吧。"
 AWR_SIC.12.t:0 "[From.GetLeader]就任四川省主席"
 AWR_SIC.12.d:0 "由于王缵绪能力不足，[From.GetLeader]决定由他亲自出任省主席，以震慑川军将领。"
 AWR_SIC.12.a:0 "当然，老头。"
 AWR_SIC.13.t:0 "[From.GetName]拒绝"
 AWR_SIC.13.d:0 "[From.GetName]拒绝我方要求。"
 AWR_SIC.13.a:0 "明白了。"
 AWR_SIC.14.t:0 "中央要求我们臣服"
 AWR_SIC.14.desc:0 "国民政府最近军事动作很大，现在他们要求我们交权，服从中央安排，如果我们拒绝，他会可能会考虑运用武力……"
 AWR_SIC.14.a:0 "我们别无选择"
 AWR_SIC.14.b:0 "让他们放马过来吧！"
 AWR_SIC.15.t:0 "[FROM.GetName]拒绝我们的要求"
 AWR_SIC.15.desc:0 "[FROM.GetName]拒绝了我们的要求，并表示将不惧我们的任何威胁……"
 AWR_SIC.15.a:0 "他们会后悔的！"


 AWR_YUN:0 "云南事件"
 AWR_YUN.1.t:0 "[Root.GetNameDef]「起义」"
 AWR_YUN.1.d:0 "看到国民党在军事上遭受惨败后，[Root.GetLeader]考虑到[Root.GetNameDef] 的未来。 毕竟共产党对[Root.GetNameDef]发起攻势已不再是妄言，[Root.GetLeader]认为加入[WTT_communist_china.GetName]或许是最好的选择。"
 AWR_YUN.1.a:0 "团结就是力量！"
 AWR_YUN.2.t:0 "[From.GetName]加入解放军"
 AWR_YUN.2.d:0 "[From.GetName]已选择加入我们的队伍来对抗国军。让我们团结起来，解放工人和农民。"
 AWR_YUN.2.a:0 "团结就是力量！"


 AWR_SIK:0 "新疆事件"
 AWR_SIK.1.t:0 "[From.GetName] 请求配合挑战中央权威"
 AWR_SIK.1.desc:0 "[From.GetLeader]请求我们合作挑战[WTT_current_china_leader.GetLeader]的腐败和反动政权，以完成革命和解放中国人民。"
 AWR_SIK.1.a:0 "当然，我们会积极参与。"
 AWR_SIK.1.b:0 "不，但我们会表现出政治上的支持。"
 AWR_SIK.2.t:0 "[From.GetName]想要整合我们"
 AWR_SIK.2.desc:0 "[From.GetName]向我们发出请求，让我们融入进他们。我们应该怎样去响应他们？"
 AWR_SIK.2.a:0 "好极了！"
 AWR_SIK.2.b:0 "我们至少要留有一些自治权"
 AWR_SIK.3.t:0 "[From.GetName]决定让我们保留最低限度的自治权"
 AWR_SIK.3.desc:0 "[From.GetName]决定帮助我们在建立一个自治政府以更好的维护[Root.GetAdjective]的统治，以保持领土的完整性。"
 AWR_SIK.3.a:0 "明白了。"
 AWR_SIK.4.t:0 "[PRC.GetNameDef]希望与我们达成和平解放协议"
 AWR_SIK.4.descesc:0 "中国共产党在内战中已经取得了绝对优势，他们希望能通过和平的方式统一新疆地区，如果谈判破裂，他们会运用武力，对此，我们应该怎么做？"
 AWR_SIK.4.a:0 "识时务者为俊杰"
 AWR_SIK.4.b:0 "让他们放马过来吧！"
 AWR_SIK.5.t:0 "和共党合作？"
 AWR_SIK.5.desc:0 "大量共产党部队正在接近，但他们表示愿意合作。 我们应该忠于国民党并战斗到底，还是应该更多倾向于与和平解决？"
 AWR_SIK.5.a:0 "我们应该和他们合作。"
 AWR_SIK.5.b:0 "我们会战斗到底。"
 AWR_SIK.6.t:0 "新疆解放"
 AWR_SIK.6.desc:0 "新疆领导和人民决定与我们合作，确保新疆的和平解放。 现在他们将成为我们的革命同志，加入我们的阵营！ 我们的运动正在兴起！"
 AWR_SIK.6.a:0 "欢迎！"
 AWR_SIK.7.t:0 "[From.GetLeader]拒绝我们的合作提议"
 AWR_SIK.7.desc:0 "[From.GetLeader] 和他的 [From.GetNameDef] 暴徒决定拒绝我们的合作提议，并发誓与我方战斗到底。 好吧，如果这就是他们的抉择，那他们就会为此付出代价。"
 AWR_SIK.7.desc_2:0 "马鸿宾决定拒绝我们的合作，并誓言与我们决一死战。 好吧，如果这就是他们的抉择，那他们就会为此付出代价。"
 AWR_SIK.7.a:0 "打倒他们！"


 AWR_TIB:0 "西藏事件"
 AWR_TIB.1.t:0 "祖国让我们“回家”"
 AWR_TIB.1.d:0 "新的中国政府要求我们承认他们的领土主张，他们将派遣军队驻守在那里。有关部门正在召开紧急会议，我们应该如何应对？"
 AWR_TIB.1.a:0 "西藏将保持独立"
 AWR_TIB.1.b:0 "独立不过是叛者的狂语！我们回家！"