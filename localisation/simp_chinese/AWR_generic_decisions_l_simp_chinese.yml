 AWR_cfs_steel_category: "民用工业炼钢"
 AWR_cfs_steel_category_desc: "利用民用工厂进行钢铁生产，产出的钢铁直接提供给国家，不占用地图上的资源地区。\n\n当前炼钢民工：§Y[?cfs_civs|0]§! 座\n当前炼钢产量：§G[?cfs_output|0]§! 单位\n\n基础机床每座民工生产5单位钢铁，后续机床科技最高可提升至15单位。"

